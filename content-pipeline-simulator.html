<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>From Draft to Published · Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --rail:#0A0A0B;--page:#F6F7F9;--card:#FFFFFF;--line:#E6E8EE;--line-soft:#EEF0F4;
  --ink:#0E1116;--sub:#4A5163;--muted:#8A91A2;--chip:#F2F4F8;
  --blue:#29ABE2;--blue-bg:#E6F5FC;--blue-ink:#0B7DB0;
  --mag:#FF2D8F;--mag-bg:#FFE9F3;--mag-ink:#C8136A;
  --green:#16A34A;--green-bg:#E7F6EF;--red:#E4483F;--red-bg:#FBE7E5;
  --yellow:#CA9A04;--yellow-bg:#FCF5D7;
  --violet:#7C3AED;--violet-bg:#EFE9FD;--teal:#0D9488;--teal-bg:#E0F2F1;--sky:#0284C7;--sky-bg:#E0F2FE;
  --rainbow:linear-gradient(90deg,#29ABE2,#22C55E,#EAB308,#FF2D8F);
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --body:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --disp:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);font-size:14px}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:default}
.num{font-variant-numeric:tabular-nums}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.7)}70%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,45,143,.45)}50%{box-shadow:0 0 0 8px rgba(255,45,143,0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}

/* ---------- frame ---------- */
.top{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--rail);color:#fff}
.top .wm{font:800 11px/1.2 var(--disp);letter-spacing:.2em}
.top .rule{width:90px;height:2px;background:var(--rainbow)}
.top .t{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#9AA0AD}
.top .sp{flex:1}
.top button{background:#16171A;color:#C9CDD6;border:1px solid #26282E;border-radius:6px;padding:7px 12px;font-size:12px;font-weight:600}
.top .fake{font:600 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--mag);padding:4px 8px;border-radius:4px}
html,body{height:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.top{flex:none}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:0;flex:1;min-height:0}
.panel{min-width:0;min-height:0;display:flex;flex-direction:column}
.screen{min-height:0}
.plabel{display:flex;align-items:center;gap:10px;padding:8px 18px;background:var(--card);border-bottom:1px solid var(--line);font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--sub)}
.plabel i{width:8px;height:8px;border-radius:50%;background:var(--blue)}
.plabel.client i{background:var(--mag)}
.plabel .r{margin-left:auto;font-weight:500;letter-spacing:.08em;color:var(--muted);text-transform:none}
.asana{background:#FAFAFB;border-left:1px solid var(--line)}
.screen{flex:1;position:relative;overflow:auto}

/* ---------- coach ---------- */
.coach{position:sticky;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:14px 20px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;box-shadow:0 -6px 24px rgba(17,20,28,.06)}
.coach .n{width:40px;height:40px;border-radius:8px;background:var(--mag);color:#fff;display:grid;place-items:center;font:800 15px var(--disp)}
.coach h4{margin:0 0 3px;font-size:14px}
.coach p{margin:0;color:var(--sub);line-height:1.5;font-size:13px}
.coach .pr{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.coach .act{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:8px 14px;font-weight:600;font-size:13px;transition:transform .1s,background .2s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--mag);border-color:var(--mag);color:#fff}
.btn.primary:hover{background:#E81F7E}
.btn.dark{background:#111317;border-color:#111317;color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4}
.btn.hint{animation:pulse 2s infinite}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111317;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none;max-width:520px;text-align:center}
.toast.on{opacity:1}

/* ---------- fake OQ chrome ---------- */
.oq{padding:0 0 20px}
.crumb{display:flex;gap:8px;align-items:center;padding:12px 18px 0;font-size:12px;color:var(--muted)}
.crumb b{color:var(--ink);font-family:var(--mono);font-weight:700}
.tabs{display:flex;gap:22px;padding:10px 18px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--sub)}
.tabs span{padding:8px 0}
.tabs span.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--ink)}
.section{padding:16px 18px}
.h1row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.h1row h2{font:700 18px var(--disp);margin:0}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-weight:600;font-size:12px;color:var(--sub)}
.seg button.on{background:#111317;color:#fff}
.tag{display:inline-block;font:600 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:4px;background:var(--chip);color:var(--sub)}
.tag.blue{background:var(--blue-bg);color:var(--blue-ink)}.tag.mag{background:var(--mag-bg);color:var(--mag-ink)}.tag.green{background:var(--green-bg);color:var(--green)}.tag.red{background:var(--red-bg);color:var(--red)}.tag.violet{background:var(--violet-bg);color:var(--violet)}
.prog{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:14px 0 6px}
.prog div{text-align:center;font:600 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:8px;border-top:3px solid var(--line-soft)}
.prog div b{display:block;font:700 20px var(--disp);color:#C9CED8;margin-bottom:6px}
.prog div.on{border-color:var(--violet)}.prog div.on b{color:var(--violet)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:5px;white-space:nowrap}
.chip.queued{background:#EEF0F4;color:#57606E}.chip.generating{background:var(--sky-bg);color:var(--sky)}.chip.draft_ready{background:var(--green-bg);color:var(--green)}
.chip.specialist_review,.chip.client_review{background:var(--violet-bg);color:var(--violet)}.chip.revision_requested{background:var(--red-bg);color:var(--red)}
.chip.final{background:var(--green-bg);color:var(--green)}.chip.webflow_draft{background:var(--teal-bg);color:var(--teal)}.chip.published{background:#292524;color:#fff}
table.list{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13px}
table.list th{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--sub);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
table.list td{padding:12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list .ttl{font-weight:600;display:flex;align-items:center;gap:8px}
table.list .ttl i{width:7px;height:7px;border-radius:50%;background:var(--violet)}
table.list a{color:var(--ink);text-decoration:none;border-bottom:1px dashed #C9CED8}
.gen{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#FBFBFC;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600}
.gen svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:2}
.stream{background:#111317;color:#E8EAEE;border-radius:8px;padding:14px 16px;margin-top:14px;font:12.5px/1.6 var(--mono)}
.stream div{opacity:0;animation:rise .4s var(--ease) forwards}
.stream .ok{color:#4ADE80}.stream .run{color:var(--blue)}
.stream .run::before{content:"";display:inline-block;width:9px;height:9px;border:2px solid var(--blue);border-right-color:transparent;border-radius:50%;margin-right:8px;animation:spin .8s linear infinite;vertical-align:-1px}
.webrow{display:flex;gap:10px;align-items:center}

/* editor */
.edtop{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.edtop .t{font-weight:700;font-size:14px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edtop .dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.edtop .dot i{width:8px;height:8px;border-radius:50%;background:var(--violet)}
.edtop .meta{margin-left:auto;font-size:11.5px;color:var(--muted);display:flex;gap:12px;align-items:center}
.edtop .qa{color:var(--red);font-weight:600}
.edtop .qa.ok{color:var(--green)}
.tb{display:flex;align-items:center;gap:8px;padding:8px 18px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.tb .ic{width:30px;height:30px;border:1px solid transparent;border-radius:6px;display:grid;place-items:center;background:transparent}
.tb .ic:hover{background:var(--chip)}
.tb .ic svg{width:16px;height:16px;stroke:var(--sub);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb .ic.on{background:var(--blue-bg)}.tb .ic.on svg{stroke:var(--blue-ink)}
.tb .sp{flex:1}
.tb .lbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#FBFBFC;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600}
.tb .lbtn svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:1.8}
.main{display:inline-flex;align-items:center;gap:8px;background:#111317;color:#fff;border:0;border-radius:6px;padding:8px 14px;font-weight:600;font-size:13px}
.main span.car{border-left:1px solid #3A3D45;padding-left:8px;margin-left:2px}
.seobar{display:flex;gap:12px;align-items:center;padding:7px 18px;border-bottom:1px solid var(--line);background:var(--card);font-size:11.5px;color:var(--muted)}
.seobar b{font:600 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}
.edbody{display:grid;grid-template-columns:150px minmax(0,1fr) 290px;min-height:520px}
.edbody>*{min-width:0}
.pieces{border-right:1px solid var(--line);padding:12px 10px;background:var(--card)}
.pieces h5{margin:0 0 10px;font:600 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}
.pieces div{display:flex;gap:7px;align-items:center;font-size:12px;padding:6px 6px;border-radius:5px;color:var(--sub)}
.pieces div i{width:6px;height:6px;border-radius:50%;background:var(--violet);flex:none}
.pieces div.on{background:var(--chip);color:var(--ink);font-weight:600}
.doc{padding:14px 26px 30px;background:var(--card);position:relative}
.secnav{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px}
.secnav b{font-weight:600;color:var(--sub);margin-right:8px}
.feat{border:1px dashed var(--line);border-radius:6px;padding:8px 10px;font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:12px}
.feat.has{border-style:solid;padding:0;overflow:hidden;background:#EEF1F5}
.ph{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#DCE4EE,#C5D0DE);color:#3B4452;font-size:12px;padding:16px 14px;min-height:92px}
.ph svg{width:28px;height:28px;stroke:#3B4452;fill:none;stroke-width:1.4;flex:none}
.ph small{display:block;color:#5B6675;font-size:11px;margin-top:3px}
.tbar{display:flex;gap:4px;margin-bottom:12px}
.tbar span{font:600 11px var(--mono);color:var(--sub);padding:4px 7px;border-radius:4px;background:var(--chip)}
.rich{font-size:14.5px;line-height:1.65;max-width:680px;overflow-wrap:anywhere}
.rich h2{font:700 20px var(--disp);margin:22px 0 8px}
.rich h3{font:700 16px var(--disp);margin:18px 0 6px}
.rich p{margin:0 0 12px}
.rich ul{margin:0 0 12px;padding-left:20px}
.rich li{margin:4px 0}
.rich a{color:var(--mag-ink);text-decoration:underline}
.rich .pl{background:var(--yellow-bg);padding:0 3px;border-radius:3px}
.rich .flag{background:var(--red-bg);box-shadow:inset 0 -2px 0 var(--red);padding:0 2px;border-radius:3px;cursor:pointer}
.rich .flag:hover{background:#F8D3D0}
.rich .fixed{background:var(--green-bg);padding:0 2px;border-radius:3px}
.rich .hl{background:var(--blue-bg);box-shadow:0 0 0 3px var(--blue-bg);border-radius:3px}
.sug{text-decoration:line-through;color:#9B2C2C;background:#FCE8E8;padding:0 2px}
.ins{color:#166534;background:#DCFCE7;padding:0 2px}
.rich .img{margin:10px 0 14px}
.rich .img .ph{border-radius:6px}
.rich .img small.alt{display:block;font:500 10.5px var(--mono);color:var(--muted);margin-top:4px}
.lockov{position:absolute;inset:0;background:rgba(246,247,249,.45);cursor:not-allowed}
.locktip{position:absolute;left:50%;top:40%;transform:translateX(-50%);background:#111317;color:#fff;padding:10px 14px;border-radius:8px;font-size:12.5px;max-width:300px;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
.locktip.on{opacity:1}
.right{border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-width:0}
.rtabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--sub);overflow-x:auto}
.rtabs span{padding:6px 7px;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.rtabs span.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.rtabs span b{font:600 9.5px var(--mono);background:var(--red);color:#fff;border-radius:3px;padding:1px 4px;margin-left:4px}
.rtabs span b.ok{background:var(--green)}
.rbody{padding:12px;font-size:12.5px;overflow:auto;flex:1}
.rbody h6{margin:0 0 8px;font:600 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}
.issue{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px;background:#FBFBFC}
.issue b{display:block;font-size:12.5px;margin-bottom:3px}
.issue .k{font:600 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.issue .k.ok{color:var(--green)}
.issue p{margin:4px 0 8px;color:var(--sub);line-height:1.45}
.allok{text-align:center;padding:28px 10px;color:var(--sub)}
.allok i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--green-bg);margin:0 auto 10px}
.allok svg{width:18px;height:18px;stroke:var(--green);fill:none;stroke-width:2.5}
.note{background:var(--blue-bg);color:#0D3C52;border-radius:6px;padding:9px 11px;line-height:1.45;margin-bottom:10px}
.fb{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px;background:var(--card)}
.fb .who{display:flex;justify-content:space-between;font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-bottom:5px}
.fb .q{font-size:11.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px;margin:4px 0 6px;font-style:italic}
.fb .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.fb .acts button{border:1px solid var(--line);background:#FBFBFC;border-radius:5px;padding:5px 9px;font-size:11.5px;font-weight:600}
.fb .acts button.ok{background:var(--green-bg);border-color:#BFE6D1;color:#0E4A2A}
.fb .acts button.no{color:var(--red)}
.fb.done{opacity:.55}
.fb .reply{font-size:12px;background:var(--chip);border-radius:5px;padding:6px 8px;margin-top:6px}
.fb .pill{font:600 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:var(--chip);color:var(--sub)}
.fb .pill.open{background:var(--mag-bg);color:var(--mag-ink)}.fb .pill.res{background:var(--green-bg);color:var(--green)}
.ver{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12px}
.ver span:last-child{color:var(--muted);font-size:11px;white-space:nowrap}
.fact{display:grid;grid-template-columns:90px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:12px}
.fact b{font:600 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--sub);padding-top:2px}
.fact.hl{background:var(--blue-bg);margin:0 -6px;padding:6px}

/* modal */
.mback{position:fixed;inset:0;background:rgba(14,17,22,.45);display:grid;place-items:center;z-index:30;padding:20px}
.modal{background:var(--card);border-radius:10px;width:min(560px,100%);max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(10,10,11,.3);animation:rise .3s var(--ease)}
.modal .mh{padding:16px 20px 10px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.modal .mh h3{margin:0;font-size:15px}
.modal .steps{font-size:11.5px;color:var(--muted);display:flex;gap:10px}
.modal .steps b{color:var(--blue-ink)}
.modal .mb{padding:4px 20px 16px;font-size:13px;line-height:1.5}
.modal .mf{padding:12px 20px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line-soft)}
.recip{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0}
.recip input{margin-top:3px}
.recip b{display:block;font-size:13px}
.recip small{color:var(--muted);font-size:11.5px}
.recip .why{display:inline-block;margin-left:auto;font:600 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mag-ink);background:var(--mag-bg);padding:3px 6px;border-radius:3px;white-space:nowrap}
.inp{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--muted);background:#FBFBFC;margin:6px 0}
label.lab{display:block;font:600 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sub);margin:12px 0 4px}
.email{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:#FBFBFC;font-size:12.5px;line-height:1.5}
.email .esub{font-weight:700;margin-bottom:4px}
.cv .fixed{background:none}
.email .m{color:var(--muted);font-size:11px;margin-bottom:8px}
.email .cta{display:inline-block;background:#111317;color:#fff;border-radius:5px;padding:7px 12px;font-weight:600;margin-top:8px;font-size:12px}
.linkrow{display:grid;grid-template-columns:20px 1fr 90px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.linkrow .a{font-weight:600}
.linkrow .u{color:var(--muted);font-size:11px;font-family:var(--mono)}
.linkrow .sc{text-align:right;font:600 11px var(--mono);color:var(--blue-ink)}
.chks{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.chks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12.5px;background:#FBFBFC}
.imgpick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.imgpick .ic2{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.imgpick .ic2 .ph{min-height:74px}
.imgpick .ic2 div.m{padding:8px 10px;font-size:11.5px;line-height:1.4}
.imgpick .ic2 b{display:block;font:600 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--blue-ink);margin-bottom:3px}
.imgpick .ic2 .alt{color:var(--sub)}
.schema{font:11.5px/1.5 var(--mono);background:#111317;color:#C9CDD6;border-radius:6px;padding:12px;white-space:pre;overflow:auto;max-height:220px}
.schema .k{color:#7DD3FC}.schema .s{color:#86EFAC}

  S.sugs.forEach((s,k)=>{h+='<div class="fb '+(s.state!=='pending'?'done':'')+'"><div class="who"><span>Suggested edit · Dr. Patel</span><span class="pill '+(s.state==='pending'?'open':'res')+'">'+(s.state==='pending'?'Pending':s.state)+'</span></div><div><span class="sug">'+s.from+'</span> <span class="ins">'+s.to+'</span></div>'+(s.state==='pending'&&!locked?'<div class="acts"><button class="ok" data-acc="'+k+'">Accept</button><button class="no" data-rej="'+k+'">Dismiss</button></div>':'')+'</div>'});
  S.comments.forEach((c,k)=>{h+='<div class="fb '+(c.res?'done':'')+'"><div class="who"><span>Dr. Patel · '+c.day+'</span><span class="pill '+(c.res?'res':'open')+'">'+(c.res?'Resolved':'Open')+'</span></div>'+(c.q?'<div class="q">'+c.q+'</div>':'')+'<div>'+c.text+'</div>'+(c.reply?'<div class="reply"><b>You:</b> '+c.reply+'</div>':'')+(c.res||locked?'':'<div class="acts">'+(c.fix&&!c.fixed?'<button data-fix="'+k+'">'+c.fix+'</button>':'')+(c.fixed&&!c.reply?'<button data-reply="'+k+'">Reply</button>':'')+(c.reply?'<button class="ok" data-res="'+k+'">Resolve</button>':'')+'</div>')+'</div>'});
  return h;
}

/* ---- the fake cursor and the op runner ---- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cur=()=>document.getElementById('cur');
let cvRun=0;
/* Scroll the client screen from -> to over dur ms. Timer-driven, not requestAnimationFrame, so it still finishes when the tab is hidden or the window is covered. */
function animScroll(sc,from,to,dur,token){return new Promise(res=>{const t0=Date.now();(function f(){const p=Math.min(1,(Date.now()-t0)/dur);sc.scrollTop=from+(to-from)*(p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2);if(p<1&&token===cvRun)setTimeout(f,16);else{if(p<1)sc.scrollTop=to;res()}})()})}
/* Bring el into the client screen without scrollIntoView (which also scrolls the training page around the iframe). */
function revealInScreen(el,center){const sc=screen;if(!el||!sc)return;const sr=sc.getBoundingClientRect(),r=el.getBoundingClientRect();
  if(center){sc.scrollTop+=r.top-sr.top-(sc.clientHeight-r.height)/2;return}
  if(r.top<sr.top+8)sc.scrollTop+=r.top-sr.top-40;else if(r.bottom>sr.bottom-90)sc.scrollTop+=r.bottom-sr.bottom+110}
async function pausedWait(token){while(S.cvPaused&&token===cvRun&&!document.getElementById('modalRoot').innerHTML)await sleep(120)}
function togglePause(){S.cvPaused=!S.cvPaused;renderCoachClient()}
function placeCursor(el,ox,oy,ms){const c=cur();if(!c||!el)return;const pr=document.getElementById('leftPanel').getBoundingClientRect();const r=el.getBoundingClientRect();
  c.style.transitionDuration=(ms||600)+'ms';c.style.left=(r.left-pr.left+(ox==null?Math.min(34,r.width/2):ox))+'px';c.style.top=(r.top-pr.top+(oy==null?r.height/2:oy))+'px';c.classList.add('on')}
function popAt(el,which){const d=document.querySelector('.cvdoc');if(!d||!el)return;document.querySelectorAll('.cvdoc .pop').forEach(p=>p.remove());const dr=d.getBoundingClientRect(),r=el.getBoundingClientRect();
  const p=document.createElement('div');p.className='pop';p.id='cvpop';p.innerHTML='<span data-w="comment"'+(which==='comment'?' class="on"':'')+'>&#9679; Comment</span><span data-w="suggest"'+(which==='suggest'?' class="on"':'')+'>&#9998; Suggest Edit</span>';
  p.style.left=Math.max(8,r.left-dr.left)+'px';p.style.top=(r.top-dr.top-38)+'px';d.appendChild(p)}
async function runOp(op,token){
  const [k,a,b]=op;const q=s=>document.querySelector(s);
  if(k==='wait'){await sleep(a);return}
  if(k==='scrollto'){const el=q(a);if(!el)return;const sc=screen,from=sc.scrollTop,r=el.getBoundingClientRect(),target=Math.max(0,r.bottom-sc.getBoundingClientRect().top+from-(sc.clientHeight-130)),dur=Math.min(2600,600+Math.abs(target-from)*1.1);
    await animScroll(sc,from,target,dur,token);return}
  if(k==='top'){const sc=screen,from=sc.scrollTop;if(from<4)return;await animScroll(sc,from,0,700,token);return}
  if(k==='move'){const el=q(a);if(!el)return;if(!el.closest('.modal'))revealInScreen(el,false);placeCursor(el);await sleep(680);return}
  if(k==='click'){const c=cur();if(c){c.classList.remove('clk');void c.offsetWidth;c.classList.add('clk')}await sleep(260);if(token!==cvRun)return;if(typeof a==='function')a();await sleep(160);return}
  if(k==='type'){const el=q(a);if(!el)return;const per=Math.max(18,Math.min(55,2400/b.length));const isField=el.tagName==='TEXTAREA'||el.tagName==='INPUT';
    for(let i=1;i<=b.length;i++){if(token!==cvRun)return;await pausedWait(token);if(isField)el.value=b.slice(0,i);else el.innerHTML=b.slice(0,i)+'<span class="caret"></span>';await sleep(per)}
    if(!isField)el.innerHTML=b;if(a==='#gateInp'){const g=q('#gateGo');if(g)g.classList.add('on')}return}
  if(k==='scroll'){const sc=screen,from=sc.scrollTop;await animScroll(sc,from,from+a,b,token);return}
  if(k==='select'){const el=q(a);if(!el)return;revealInScreen(el,true);await sleep(200);const r=el.getBoundingClientRect();placeCursor(el,2,10,500);await sleep(550);placeCursor(el,r.width-2,r.height-8,900);await sleep(500);el.classList.add('hl');S.hl=b;await sleep(450);return}
  if(k==='pop'){popAt(q(a),b);await sleep(350);return}
  if(k==='clickpop'){const p=q('#cvpop [data-w="'+a+'"]');if(p){placeCursor(p,p.getBoundingClientRect().width/2,10);await sleep(650);const c=cur();c.classList.remove('clk');void c.offsetWidth;c.classList.add('clk');await sleep(300)}document.querySelectorAll('.cvdoc .pop').forEach(x=>x.remove());return}
  if(k==='sugbox'){const el=q('#recTxt');if(!el)return;const p=el.closest('p');const box=document.createElement('div');box.className='sugbox';box.innerHTML='<div class="sl">Suggest an edit &middot; replaces &ldquo;'+SUG_FROM+'&rdquo;</div><div class="sugta" id="sugInp"><span class="caret"></span></div><div class="sr"><button class="btn sm">Cancel</button><button class="btn sm dark" id="sugSave">Save suggestion</button></div>';p.after(box);await sleep(500);placeCursor(q('#sugInp'),20,16);await sleep(500);return}
  if(k==='do'){a();render();await sleep(80);return}
}
async function playStage(){
  const script=cvScript(),idx=S.cvStage,st=script[idx];
  if(!st||!st.ops||S.cvDone[idx]||S.cvPlaying)return;
  const token=++cvRun;S.cvPlaying=true;S.cvPaused=false;renderCoachClient();
  try{
    for(const op of st.ops){if(token!==cvRun)return;await pausedWait(token);if(token!==cvRun)return;
      await Promise.race([runOp(op,token).catch(e=>console.warn('[sim] op failed',op[0],e)),sleep(9000)])}
  }finally{if(token===cvRun)S.cvPlaying=false}
  if(token!==cvRun)return;
  if(st.effect)st.effect();
  S.cvDone[idx]=true;S.hl=null;
  if(idx<script.length-1){S.cvStage=idx+1}
  render();
}
function skipRound(){
  if(Date.now()-(S.navAt||0)<900)return; /* the second click of a double-click on Continue lands on Skip ahead */
  cvRun++;S.cvPlaying=false;S.cvPaused=false;S.cvAction=null;S.cvTab='comments';closeModal();const c=cur();if(c)c.classList.remove('on');const script=cvScript();
  for(let k=S.cvStage;k<script.length;k++){const st=script[k];
    if(st.mail&&!('reviewer' in S.score)){S.cvStage=k;render();return}
    if(st.effect&&!S.cvDone[k])st.effect();S.cvDone[k]=true}
  S.cvStage=script.length-1;S.hl=null;render();
}

function renderCoachClient(){
  const script=cvScript(),idx=S.cvStage,st=script[idx],last=idx===script.length-1;
  let act='';
  if(S.cvPlaying||(st.ops&&!S.cvDone[idx]))act='<span class="live'+(S.cvPaused?' paused':'')+'"><i></i>'+(S.cvPaused?'Paused':'Watching Dr. Patel\'s screen')+'</span><button class="btn '+(S.cvPaused?'primary':'')+'" id="cvPause">'+(S.cvPaused?'Resume &#9654;':'Pause &#10074;&#10074;')+'</button><button class="btn" id="cvSkip">Skip ahead</button>';
  else if(st.mail)act=('reviewer' in S.score)?'<button class="btn primary hint" id="cvNext">Continue &rarr;</button>':'<span style="font-size:12px;color:var(--muted)">Answer the email first</span><button class="btn primary" id="cvNext" disabled>Continue &rarr;</button>';
  else if(last)act='<button class="btn primary hint" id="cvNext">Back to your side &rarr;</button>';

/* The decision card at the end of the page, copied from the real ActionBar: default state, then the inline note box for revise or approve. */

/* ======================= done ======================= */
function renderDone(){
  const sc=[['Fixed the invented doctor before sending',S.qaFixed],['One reviewer: answered Dr. Nguyen correctly',S.score.reviewer===true&&!S.score.addedSecond],['Added Delta Dental as asked, and saved it as a practice fact',S.score.ins===true],['Knew why images wait for approval',S.score.img===true]];
  const n=sc.filter(x=>x[1]).length;
  screen.innerHTML=`<div class="finish"><div class="tag mag">Simulation complete</div><h2>Draft to published,<br>one service page</h2><p>You took one piece from the calendar to a live Webflow page. Here is what you clicked, and what Opened Queries did on its own.</p>
    <div class="score">${sc.map(x=>'<div class="'+(x[1]?'ok':'no')+'"><b>'+(x[1]?'&#10003;':'&#10007;')+'</b>'+x[0]+'</div>').join('')}</div>
    <p><b>${n} of 4</b> decision moments right on the first try.${S.score.lockTried?' You tested the lock, good instinct.':''}</p>
    <div class="tl">
      <div><b>You</b><span>Generate, fix QA, save, Internal Links, Send for Review, address 3 items, Send Back Revision, AI Selection, Generate Schema, Publish as Draft, Publish Live, set the status label.</span></div>
      <div><b>Opened Queries</b><span>Wrote and checked the draft, moved it to Internal Review on your first save, locked it during review, enforced the single revision, emailed the team on every comment, mirrored every stage to Asana, built the schema from practice data, filled 12 Webflow fields.</span></div>
      <div><b>Dr. Patel</b><span>Two comments, one suggested edit, one revision request, one approval. One reviewer, one voice.</span></div>
      <div><b>Our rules</b><span>One reviewer per practice. Images after approval. What the practice tells you is a fact: write it in and save it as a supplemental fact. The app does not enforce any of these.</span></div>
      <div><b>Next</b><span>The blog article "Implant or bridge for a missing back tooth?" is still in the queue. In the full training you run it next: shorter, with the differences called out (direct answer up top, links up to this service page, no FAQ).</span></div>
    </div></div>`;
}

/* ======================= render ======================= */
function render(){
  document.getElementById('plabel').className='plabel';document.getElementById('plabelTxt').textContent='Opened Queries · you are the SEO Specialist';
  const cEl=document.getElementById('cur');if(cEl&&!(S.view==='client'&&S.cv))cEl.classList.remove('on');
  if(S.view==='client'&&S.cv){renderClient();renderAsana();return}
  if(S.step===15){renderDone()}
  else if(S.view==='editor')renderEditor();else renderList();
  renderAsana();renderCoach();
}
document.getElementById('reset').onclick=()=>{streamT.forEach(clearTimeout);cvRun++;closeModal();S=fresh();render()};
S=fresh();render();
/* test hook: read-only view of state for automated checks */
window.__sim={get S(){return S},get cvRun(){return cvRun}};
})();
</script>
