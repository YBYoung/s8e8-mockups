  svg.innerHTML = Array.from({ length: DOTS }, (_, i) => `<circle r="4.2" cx="${S.lanes[i].x}" cy="${S.lanes[i].y}" fill="#E4E7EC"/>`).join('') + '<g id="lbl"></g>';
  const cs = [...svg.querySelectorAll('circle')];
  const show = f => { cur = f; S[f].forEach((d, i) => { const c = cs[i]; c.style.cx = d.x; c.style.cy = d.y; c.setAttribute('cx', d.x); c.setAttribute('cy', d.y); c.style.r = d.big ? 9 : 4.2; c.style.fill = d.hide ? 'transparent' : d.on ? '#4F46E5' : d.miss ? '#FBCFD8' : d.mute ? '#B6BCC8' : d.gap ? '#F3D5DB' : '#E4E7EC'; });
    svg.querySelector('#lbl').innerHTML = labels(f, qi).map(([x, y, t, s, w, c, anchor]) => `<text x="${x}" y="${y}" font-size="${s}" font-weight="${w}" fill="${c}" text-anchor="${anchor || 'start'}" class="fade-swap">${t}</text>`).join(''); p.querySelector('#cap').textContent = CAP[f]; };
  show('lanes');
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { p.querySelectorAll('.chap').forEach(c => c.classList.toggle('active', c === e.target)); show(e.target.dataset.f); } }), { rootMargin: '-45% 0px -45% 0px' });
  p.querySelectorAll('.chap').forEach(c => io.observe(c));
  let ci = 0;
  const drawAns = () => { qi = picks[ci]; const q = QUESTIONS[qi], named = q.byAi[0] >= 2; p.querySelector('#ansbox').innerHTML = `<div class="eyebrow">ChatGPT · ask 2 of 5 · ${named ? 'named you' : 'did not name you'}</div><div style="font:700 16px Inter;color:var(--ink);margin-top:6px">“${q.text}”</div><pre class="fade-swap">${answerFor(q, AIS[0], named)}</pre>`; p.querySelector('#anspos').textContent = `${ci + 1} of ${picks.length}`; S = shapes(qi); if (cur === 'ans') show('ans'); };
  drawAns();
  p.querySelector('#prev').onclick = () => { ci = (ci + picks.length - 1) % picks.length; drawAns(); };
  p.querySelector('#nxt').onclick = () => { ci = (ci + 1) % picks.length; drawAns(); };
  p.querySelector('#allans').onclick = e => { e.preventDefault(); go('answers'); };
  p.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { b.textContent = 'Added ✓'; b.disabled = true; toast(b.dataset.a); });
  p.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { p.querySelector('#n' + b.dataset.n).classList.add('on'); b.textContent = 'Done ✓'; b.disabled = true; toast(NEXT[+b.dataset.n].where.charAt(0).toUpperCase() + NEXT[+b.dataset.n].where.slice(1) + '.'); });
}
function answers(p) {
  let aj = 0, svc = 'All', named = 'all', sel = 0, ask = 0;
  const draw = () => {
    const rows = QUESTIONS.filter(q => (svc === 'All' || q.svc === svc) && (named === 'all' || (named === 'yes' ? q.byAi[aj] > 0 : q.byAi[aj] === 0)));
    const cur = rows[sel], hit = cur && ask < cur.byAi[aj];
    p.innerHTML = `<div class="seg">${AIS.slice(0, 5).map((a, j) => `<button data-aj="${j}" class="${j === aj ? 'on' : ''}">${a.name}</button>`).join('')}</div>
      <div class="seg" style="margin-left:8px">${['all', 'yes', 'no'].map(v => `<button data-nm="${v}" class="${v === named ? 'on' : ''}">${{ all: 'Every question', yes: 'Named you at least once', no: 'Never named you' }[v]}</button>`).join('')}</div>
      <div class="seg">${['All', ...new Set(QUESTIONS.map(q => q.svc))].map(v => `<button data-sv="${v}" class="${v === svc ? 'on' : ''}">${v}</button>`).join('')}</div>
      <div class="ans-grid"><div class="ans-list">${rows.map((q, i) => `<div class="ans-row${i === sel ? ' on' : ''}" data-i="${i}"><div style="flex:1"><b style="color:var(--ink);font-weight:600">${q.text}</b><div style="display:flex;gap:4px;margin-top:6px;align-items:center">${[0, 1, 2, 3, 4].map(r => `<span class="d${r < q.byAi[aj] ? ' hit' : ''}" style="margin:0"></span>`).join('')}<span style="color:var(--faint);font-size:12px;margin-left:6px">${q.byAi[aj]} of 5 · ${q.svc}</span></div></div></div>`).join('')}</div>
      <div>${cur ? `<div style="display:flex;gap:6px;margin-bottom:10px">${[0, 1, 2, 3, 4].map(r => `<button class="btn sm${r === ask ? ' soft' : ''}" data-ask="${r}">Ask ${r + 1}${r < cur.byAi[aj] ? ' ●' : ''}</button>`).join('')}</div>
        <div class="answer fade-swap"><div class="eyebrow">${AIS[aj].name} · ask ${ask + 1} of 5 · Oct 27, ${10 + ask}:${ask * 12 % 60 || '05'} am · ${hit ? 'named you' : 'did not name you'}</div><div class="q">“${cur.text}”</div><pre>${answerFor(cur, AIS[aj], hit)}</pre></div>
        <div style="margin-top:14px;font-size:13px;color:var(--muted)"><b style="color:var(--ink)">Sources it cited</b><br>yelp.com · healthgrades.com · reddit.com/r/bothell</div>` : '<p>No questions match.</p>'}</div></div>`;
    p.querySelectorAll('[data-aj]').forEach(b => b.onclick = () => { aj = +b.dataset.aj; sel = 0; ask = 0; draw(); });
    p.querySelectorAll('[data-nm]').forEach(b => b.onclick = () => { named = b.dataset.nm; sel = 0; ask = 0; draw(); });
    p.querySelectorAll('[data-sv]').forEach(b => b.onclick = () => { svc = b.dataset.sv; sel = 0; ask = 0; draw(); });
    p.querySelectorAll('.ans-row').forEach(r => r.onclick = () => { sel = +r.dataset.i; ask = 0; draw(); });
    p.querySelectorAll('[data-ask]').forEach(b => b.onclick = () => { ask = +b.dataset.ask; draw(); });
  };
  draw();
}

function watch(p) {
  if (!TRACKED) { p.innerHTML = `<section class="block reveal"><h2 class="sec">Track this practice over time.</h2><p class="lede">Twice a day, every AI, the same questions. You'll see what moves, and why, instead of one day's luck.</p><button class="btn go" id="tw">Start tracking, about $28 a month</button><p style="color:var(--muted);font-size:13px;margin-top:10px">Clients only. Prospects get Snapshots.</p></section>`; p.querySelector('#tw').onclick = () => { TRACKED = true; toast('Tracking starts tonight.'); results('watch'); }; return; }
  const weeks = ['Sep 8', 'Sep 15', 'Sep 22', 'Sep 29', 'Oct 6', 'Oct 13', 'Oct 20', 'Oct 27'], rates = [33, 35, 34, 36, 35, 38, 41, 44];
  p.innerHTML = `<section class="block reveal"><div class="eyebrow">ChatGPT · rolling 7 days</div><h1 class="big" style="margin-top:10px"><span data-count="44">0%</span> <span style="font-size:22px;color:var(--up)">↑ 11 pts in 8 weeks</span></h1>
    <p class="lede">Each row is one week: 378 answers, blue where you were named. A change bigger than the row-to-row wobble is a real change.</p>
    <div class="seg">${AIS.slice(0, 5).map((a, j) => `<button class="${j === 0 ? 'on' : ''}">${a.name}</button>`).join('')}</div>
    <div class="weeks">${weeks.map((w, i) => `<div class="week reveal" style="transition-delay:${i * 60}ms"><span style="color:var(--muted);font-size:13px">${w}${i === 4 ? '<br><span style="color:var(--a-ink);font-size:11px;font-weight:600">questions edited</span>' : ''}</span>${laneHtml(Math.round(rates[i] * .9), 90, 'tiny', i + 30)}<span class="mono" style="font-weight:600;text-align:right">${rates[i]}%</span></div>`).join('')}</div></section>
    <section class="block reveal"><div class="eyebrow">What moved</div><div>${CHANGES.map(c => `<div class="change"><span class="arrow ${c.up ? 'up' : 'down'}">${c.up ? '↑' : '↓'}</span><div><b style="color:var(--ink)">${c.text}</b><div style="color:var(--muted);font-size:14px">${c.detail}</div></div></div>`).join('')}</div>
    <p style="color:var(--muted);font-size:13px;margin-top:14px">$21.90 spent this month · <a href="#" style="color:var(--a-ink)">Stop tracking</a></p></section>`;
}


function go(k) { if (stopSim) { stopSim(); stopSim = null; } window.scrollTo({ top: 0 }); document.querySelectorAll('.statebar button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  if (k === 'tracked') { TRACKED = true; k = 'story'; }
  ({ setup, running, story: () => results('story'), answers: () => results('answers'), watch: () => results('watch') })[k](); }
stateBar([['setup', 'Setup'], ['running', 'Live run'], ['story', 'Story'], ['answers', 'Answers'], ['watch', 'Tracking'], ['tracked', 'Tracked client']], 'setup', go);
</script>
</body>
</html>
