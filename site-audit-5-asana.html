<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Site Audit 5: Make the Asana tasks</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>.oq-rail{position:fixed;inset:0 auto 0 0;width:56px;background:#fff;border-right:1px solid rgba(231,229,228,.6);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px;z-index:40}.oq-rail-item{width:39px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#44403c}.oq-rail-item:hover{background:#f5f5f4}.oq-rail-item.is-active{background:#1c1917;color:#fff}.oq-rail-item:first-child{color:#a8a29e;margin-bottom:8px}.oq-rail-sep{width:24px;height:1px;background:#e7e5e4;margin:6px 0}.oq-rail-foot{margin-top:auto}.oq-rail-av{position:relative;display:flex;width:28px;height:28px;border-radius:6px;background:#e7e5e4;color:#44403c;font:600 10px Inter,system-ui;align-items:center;justify-content:center}.oq-rail-av i{position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-radius:2px;background:#16a34a;border:2px solid #fff}
/* Market Trends Story mockups, round 2. Facelift shared look (AIV experience in OQ teal), trimmed. */
:root{
  --ink:#0B1020;--ink2:#0F172A;--body:#273043;--muted:#667085;--faint:#98A2B3;--line:#E7E9EE;--soft:#F6F7FA;
  --a:#0F766E;--aInk:#115E59;--aTint:#E6F4F1;--aSoft:#99D5CC;
  --up:#15803D;--down:#E11D48;--rose:#DB2777;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.55;color:var(--body);background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:var(--aInk)}

/* mockup bar: outside the design */
.mockbar{background:#ECEEF1;color:#4B5563;font-size:12px;line-height:1.45;padding:7px 18px;border-bottom:1px solid #DDE1E6}
.mockbar b{color:#111827;font-weight:700}
.mockbar .src{color:#6B7280}
.mockbar ul{margin:3px 0 0;padding:0 0 0 16px}
.mockbar li{margin:0}
.mockbar .nr{display:inline-block;margin-top:3px;color:#6B7280}

/* app chrome */
.fl-app{margin-left:56px;min-height:100vh}
.mockbar{margin-left:56px}
.fl-main{min-width:0}
.fl-wrap{max-width:1240px;margin:0 auto;padding:0 28px 120px}
.fl-top{position:sticky;top:0;z-index:30;margin:0 -28px 0;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #EEF0F4}
.fl-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;color:var(--ink)}
.fl-mark{width:26px;height:26px;border-radius:8px;background:var(--a);display:grid;place-items:center;flex:none}
.fl-mark svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8}
.fl-right{display:flex;align-items:center;gap:12px;font-size:13px;flex-wrap:wrap;justify-content:flex-end}
.fl-right .who{color:var(--ink);font-weight:700}
.fl-right .when{color:var(--muted)}
.btn{border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13.5px;transition:background .2s,box-shadow .2s}
.btn-go{background:var(--a);color:#fff;box-shadow:0 6px 18px rgba(15,118,110,.25)}
.btn-line{background:#fff;border:1px solid var(--line);color:var(--ink);padding:7px 12px;font-size:13px}
.btn-line:hover{background:var(--soft)}
.method-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;border-radius:8px;padding:6px 10px;font-weight:600;color:var(--aInk);position:relative;font-size:13.5px}
.method-btn:hover{background:var(--aTint)}
.method-btn .dot{width:14px;height:14px;border-radius:50%;background:var(--a);position:relative}
.method-btn .dot:after{content:'';position:absolute;inset:3.5px;border-radius:50%;border:1px dotted #fff}
.teaser{position:absolute;right:0;top:100%;margin-top:8px;width:300px;z-index:40;border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px 16px;font-size:13px;font-weight:400;line-height:1.5;color:var(--body);text-align:left;box-shadow:0 12px 32px rgba(11,16,32,.12)}

/* tabs */
.tabs{position:sticky;top:55px;z-index:20;display:flex;gap:26px;margin:0 -28px 6px;padding:10px 28px 0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(12px)}
.tabs button{position:relative;border:0;background:none;padding:0 0 10px;font-size:15px;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--ink)}
.tabs .ink{position:absolute;bottom:-1px;height:2px;background:var(--a);transition:left .3s var(--ease),width .3s var(--ease)}
.tabnote{padding:60px 0;color:var(--muted);font-size:14px}

/* modal (How it works) */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:5vh 16px}
.modal .bd{position:fixed;inset:0;background:rgba(11,16,32,.4)}
.modal .win{position:relative;width:100%;max-width:880px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:24px 28px;box-shadow:0 24px 60px rgba(11,16,32,.18);animation:rise .25s var(--ease)}
.modal .x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);border-radius:6px;padding:4px 8px}
.msec{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:center;border-top:1px solid var(--line);padding:20px 0}
.msec h3{margin:0 0 8px;font-size:16.5px;color:var(--ink)}
.msec p{margin:8px 0;font-size:15px;line-height:1.6}
.msec figure{margin:0}
.msec figcaption{margin-top:6px;text-align:center;font-size:12px;color:var(--muted)}
.figbox{height:200px;overflow:hidden;border-radius:8px;background:var(--soft)}
.figbox svg{display:block;width:100%;height:100%}
.figbox svg *{transition:opacity .45s, fill .45s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:300;background:var(--ink);color:#fff;border-radius:8px;padding:12px 18px;font-size:14px;box-shadow:0 12px 32px rgba(11,16,32,.25);animation:rise .25s var(--ease)}
.tipcard{position:fixed;z-index:200;width:280px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:10px 14px;font-size:13px;line-height:1.5;color:var(--body);box-shadow:0 12px 32px rgba(11,16,32,.12);pointer-events:none}
.tipcard b{display:block;color:var(--aInk);font-size:13px;margin-bottom:2px}
.tipword{border-bottom:1px dotted var(--faint);cursor:help}

/* Story */
.story{display:grid;grid-template-columns:minmax(0,1fr) 600px;gap:44px}
.chap{min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding:24px 0;opacity:.25;transition:opacity .4s}
.chap.on{opacity:1}
.chap .k{margin-bottom:12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--aInk)}
.chap .k .act{color:var(--muted)}
.chap h2{margin:0;font-size:36px;font-weight:900;line-height:1.12;letter-spacing:-.025em;color:var(--ink)}
.chap h2 .g{color:var(--a)}
.chap h2 .r{color:var(--down)}
.chap p{margin:14px 0 0;max-width:540px;font-size:17px;line-height:1.6}
.defs{margin-top:18px;max-width:540px;padding:12px 14px;background:#F8FAFB;border:1px solid var(--line);border-radius:6px}
.defs .dh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.chap .defs p{margin:0;font-size:13.5px;line-height:1.55;color:#273043}
.chap .defs p+p{margin-top:6px}
.chap .note{font-size:13.5px;color:var(--muted);margin-top:12px}
.facts{margin-top:18px;max-width:540px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.facts div{padding:9px 10px 9px 0;border-bottom:1px solid var(--line)}
.facts b{display:block;font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.facts span{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.qlist{margin-top:16px;max-width:540px;border-top:1px solid var(--line)}
.qlist div{display:grid;grid-template-columns:minmax(0,1fr) 70px 54px;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.qlist div span:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.qlist .h span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)!important}
.stick{position:sticky;top:104px;height:calc(100vh - 112px);display:flex;flex-direction:column;justify-content:center}
.ro{height:52px;padding:4px 2px 6px;border-bottom:1px solid #EEF0F3;margin-bottom:6px;overflow:hidden}
.ro .r1{display:flex;justify-content:space-between;align-items:baseline;height:20px;font-size:13px;white-space:nowrap}
.ro .r1 .m{font-weight:700;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.ro .r1 .n{color:var(--muted);font-size:12px;margin-left:12px}
.ro .r2{display:grid;height:22px;align-items:center;gap:10px;font-size:12.5px;white-space:nowrap}
.ro .r2 .s{display:flex;align-items:center;gap:6px;overflow:hidden;min-width:0}
.ro .r2 .s b{color:var(--ink2);font-variant-numeric:tabular-nums}
.ro .r2 .s span{color:var(--body);overflow:hidden;text-overflow:ellipsis}
.ro .r2 .s svg{flex:none}
.ro .r2 .txt{grid-column:1/-1;color:var(--body);overflow:hidden;text-overflow:ellipsis}
.figsvg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.figsvg text{font-family:Inter,sans-serif}
.figsvg .num{font-variant-numeric:tabular-nums}
.figcap{margin-top:6px;min-height:36px;font-size:12.5px;line-height:1.45;color:var(--muted);text-align:center}
.storyend{margin:24px 0 0;padding:28px;border:1px solid var(--line);border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;opacity:0;transform:translateY(14px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.storyend.in{opacity:1;transform:none}
.storyend h3{margin:0;font-size:24px;font-weight:900;color:var(--ink);letter-spacing:-.02em}
.storyend p{margin:4px 0 0;color:var(--muted);font-size:14px}
@media (max-width:1180px){.story{grid-template-columns:minmax(0,1fr) 520px;gap:32px}}
@media (max-width:980px){.story{grid-template-columns:1fr}.stick{position:static;height:auto}.chap{opacity:1;min-height:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

/* Site Audit mockups (#1426): additions on top of the approved facelift base. */
:root{--now:#DC2626;--nowTint:#FEF2F2;--soon:#2563EB;--soonTint:#EFF6FF;--tidy:#A3ACB9;--tidyTint:#F4F5F7}
.lv{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--ink)}
.lv i{width:9px;height:9px;border-radius:2px;display:inline-block}
.lv.now i{background:var(--now)}.lv.soon i{background:var(--soon)}.lv.tidy i{background:var(--tidy)}
.sample{display:inline-block;margin-left:6px;padding:0 5px;border:1px dashed #C3C8D2;border-radius:4px;font-size:10.5px;font-weight:600;color:#6B7280;letter-spacing:.02em;vertical-align:1px}
.card{border:1px solid var(--line);border-radius:8px;background:#fff}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px}
.url{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;color:var(--ink2)}
.kick{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--aInk)}
.h1{margin:6px 0 0;font-size:34px;font-weight:900;line-height:1.12;letter-spacing:-.025em;color:var(--ink)}
.sub{margin:8px 0 0;color:var(--muted);font-size:15px}
/* variant switcher: outside the design */
.vbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:500;display:flex;align-items:center;gap:4px;background:#111827;color:#fff;border-radius:10px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13px}
.vbar button{border:0;background:none;color:#fff;border-radius:7px;padding:6px 10px}
.vbar button:hover{background:#374151}
.vbar button.on{background:#fff;color:#111827;font-weight:700}
.vbar .lbl{padding:0 10px;color:#D1D5DB;white-space:nowrap}
.vbar a{color:#9CA3AF;text-decoration:none;padding:0 8px;font-size:12px}

/* Screen 5: Make the Asana tasks. Asana-skin preview cards (Asana's real field colours, squared chips). */
.s5-state{display:flex;align-items:center;gap:10px;margin:16px 0 4px;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
.seg button{border:0;background:none;border-radius:6px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--aTint);color:var(--aInk)}
.s5-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-top:10px}
.s5-head .h1{font-size:30px}
/* Asana skin */
.as{--asInk:#1e1f21;--asSub:#6d6e6f;--asLine:#e0e0e0;--asLink:#4573d2;font-size:13px;color:var(--asInk)}
.as-card{border:1px solid var(--asLine);border-radius:8px;background:#fff;padding:16px 18px}
.as-title{font-size:19px;font-weight:600;line-height:1.3;color:var(--asInk);margin:2px 0 12px}
.as-done{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--asLine);border-radius:6px;padding:4px 10px;font-size:12.5px;color:var(--asSub);background:#fff}
.as-fields{display:grid;grid-template-columns:120px minmax(0,1fr);row-gap:9px;column-gap:10px;align-items:center}
.as-fields .k{color:var(--asSub);font-size:12.5px}
.as-fields .v{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.av.seo{background:#4573d2}.av.ms{background:#b36bd4}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:2px 7px;font-size:12px;font-weight:500;line-height:1.5;white-space:nowrap}
.chip.proj{background:#f1f0ef;color:var(--asInk)}
.chip.proj i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chip.est{background:#e3f1ff;color:#1c4f8f}
.chip.wk{background:#f1f0ef;color:var(--asSub)}
.as-due{color:var(--asInk)}
.as-none{color:#a2a0a2}
.as-desc{margin-top:14px;border-top:1px solid var(--asLine);padding-top:12px;font-size:13px;line-height:1.55;color:var(--asInk)}
.as-desc h4{margin:10px 0 4px;font-size:12.5px;font-weight:700}
.as-desc h4:first-child{margin-top:0}
.as-desc ul{margin:0;padding-left:18px}
.as-desc li{margin:1px 0}
.as-desc .u{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px}
.as-desc a{color:var(--asLink);text-decoration:none}
.as-desc .more{color:var(--asSub);font-size:12px;margin-top:3px}
.as-comment{margin-top:12px;display:flex;gap:8px;align-items:flex-start;background:#f9f8f8;border-radius:6px;padding:9px 10px;font-size:12.5px;line-height:1.45}
.as-comment .who{font-weight:600}
.as-comment .men{color:var(--asLink)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:1px 7px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--body)}
.tag.new{border-color:#99D5CC;background:var(--aTint);color:var(--aInk)}
.tag.upd{border-color:#BFD0F0;background:#EEF3FC;color:#2F55A4}
.tag.ret{border-color:#E9C9D8;background:#FBF0F5;color:#9D174D}
.tag.same{color:var(--muted)}
.prop{border-bottom:1px dotted var(--faint);cursor:help}
/* A: dialog */
.s5a-back{position:relative;margin-top:8px;height:640px;border-radius:8px;background:#F3F4F6;overflow:hidden;border:1px solid var(--line)}
.s5a-ghost{padding:26px 30px;opacity:.5;filter:blur(1.2px)}
.s5a-ghost .g1{height:22px;width:420px;background:#D9DDE3;border-radius:4px}
.s5a-ghost .g2{height:12px;width:620px;background:#E3E6EA;border-radius:4px;margin-top:12px}
.s5a-ghost .g3{height:46px;background:#fff;border:1px solid #E3E6EA;border-radius:6px;margin-top:12px}
.s5a-dlg{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:960px;height:612px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 24px 60px rgba(11,16,32,.16);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
.s5a-top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.s5a-team{display:flex;align-items:center;gap:12px;white-space:nowrap;flex:none;font-size:12.5px;color:var(--body)}
.s5a-team>span{display:inline-flex;align-items:center;gap:6px}
.s5a-team .seg button{padding:3px 9px;font-size:12px}
.s5a-top h3{margin:0;font-size:18px;font-weight:800;color:var(--ink)}
.s5a-top p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.s5a-body{display:grid;grid-template-columns:400px minmax(0,1fr);min-height:0}
.s5a-left{border-right:1px solid var(--line);padding:10px 14px 10px 16px;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.s5a-right{padding:14px 18px;overflow:hidden;background:#FBFBFA}
.grp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;margin:2px 0 1px}
.irow{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;padding:3px 6px;border-radius:6px;cursor:pointer;font-size:13px}
.irow:hover{background:var(--soft)}
.irow.focus{background:var(--aTint)}
.irow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:500}
.irow .meta{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.cb{width:15px;height:15px;border:1.5px solid #B8BDC6;border-radius:4px;display:grid;place-items:center;background:#fff}
.cb.on{background:var(--a);border-color:var(--a)}
.cb.on:after{content:'';width:7px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.set{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;align-items:center;font-size:12.5px;border-top:1px solid var(--line);padding-top:8px;margin-top:auto}
.set .k{color:var(--muted)}
.s5a-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.s5a-foot b{color:var(--ink)}
.prog{display:flex;align-items:center;gap:8px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--aSoft);border-top-color:var(--a);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.ok{width:14px;height:14px;border-radius:50%;background:var(--a);display:grid;place-items:center;flex:none}
.ok:after{content:'';width:6px;height:3px;border:1.6px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(.5px,-.5px)}
.olink{font-size:12px;color:#4573d2;text-decoration:none;font-weight:600;white-space:nowrap}
/* B: plan on the calendar */
.s5b-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 300px;gap:14px;margin-top:18px;align-items:start}
.s5b-col{border-top:2px solid var(--ink);padding-top:10px}
.s5b-col.none{border-top-color:var(--faint)}
.s5b-col h4{margin:0;font-size:13px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline}

<script>/* Shared pieces for the round 2 Story mockups: frame, tabs, hovers, How it works window,
   and a small tween engine for ONE persistent SVG (marks keyed by id, never unmounted). */
(function () {
  const FL = (window.FL = {});
  FL.reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  FL.esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  FL.toast = (msg) => { const t = FL.h(`<div class="toast">${FL.esc(msg)}</div>`); document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };

  /* ---------- frame ---------- */
  FL.shell = function ({ mock }) {
    const page = document.getElementById('page');
    const bar = FL.h(`<div class="mockbar">${mock}</div>`);
    const app = FL.h(`<div class="fl-app">

      <main class="fl-main"><div class="fl-wrap">
        <div class="fl-top"><div class="fl-brand"><span class="fl-mark"><svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg></span>Market Trends</div>
          <div class="fl-right"><span id="method-slot"></span><span class="who">Expedition Pediatric Dentistry</span><span class="when">Check #22 · Oct 29, 2026 · read for Washington</span>
          <button class="btn btn-line" id="share">Share report</button><button class="btn btn-line" id="newc">New check</button></div></div>
      </div></main></div>`);
    page.parentNode.insertBefore(bar, page);
    page.parentNode.insertBefore(app, page);
    app.querySelector('.fl-wrap').appendChild(page);
    FL.$('#method-slot').innerHTML = '<button type="button" class="method-btn"><span class="dot"></span>How it works</button>';
    FL.$('#share').onclick = () => FL.toast('Opens the client report: link, access code, PDF and email.');
    FL.$('#newc').onclick = () => FL.toast('Starts a new check (not part of this mockup).');
  };

  FL.tabs = function (host, { tabs, value, onChange }) {
    host.classList.add('tabs');
    host.innerHTML = tabs.map((t) => `<button type="button" data-k="${t.key}">${FL.esc(t.label)}</button>`).join('') + '<span class="ink"></span>';
    const ink = host.querySelector('.ink');
    const set = (k, fire) => {
      host.querySelectorAll('button').forEach((b) => { const on = b.dataset.k === k; b.classList.toggle('on', on); if (on) { ink.style.left = `${b.offsetLeft}px`; ink.style.width = `${b.offsetWidth}px`; } });
      if (fire && onChange) onChange(k);
    };
    host.querySelectorAll('button').forEach((b) => { b.onclick = () => set(b.dataset.k, true); });
    requestAnimationFrame(() => set(value, false));
  };

  /* branded hover for words in the text (never over the chart) */
  let tipEl = null; let tipFor = null; let tipT = null;
  const hideTip = () => { clearTimeout(tipT); tipEl?.remove(); tipEl = null; tipFor = null; };
  document.addEventListener('mouseover', (e) => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (t === tipFor) return; hideTip(); if (!t) return; tipFor = t;
    tipT = setTimeout(() => {
      const r = t.getBoundingClientRect();
      tipEl = FL.h(`<div class="tipcard">${t.dataset.tipH ? `<b>${FL.esc(t.dataset.tipH)}</b>` : ''}${FL.esc(t.dataset.tip)}</div>`);
      document.body.appendChild(tipEl);
      tipEl.style.left = `${Math.max(8, Math.min(r.left, innerWidth - 288))}px`;
      if (innerHeight - r.bottom < 130) tipEl.style.bottom = `${innerHeight - r.top + 6}px`; else tipEl.style.top = `${r.bottom + 6}px`;
    }, 120);
  });
  addEventListener('scroll', hideTip, true);

  /* How it works: teaser on hover, window on click, a looping real-data picture per section */
  FL.method = function ({ teaser, title, sections }) {
    const btn = FL.$('.method-btn'); let tip = null;
    btn.addEventListener('mouseenter', () => { if (!tip) { tip = FL.h(`<span class="teaser">${FL.esc(teaser)}</span>`); btn.appendChild(tip); } });
    btn.addEventListener('mouseleave', () => { tip?.remove(); tip = null; });
    btn.addEventListener('click', () => {
      tip?.remove(); tip = null;
      const m = FL.h(`<div class="modal"><div class="bd"></div><div class="win" role="dialog" aria-modal="true">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px">
          <div><div style="font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--aInk)">Market Trends</div><h2 style="margin:2px 0 0;font-size:26px;font-weight:900;letter-spacing:-.02em;color:var(--ink)">${FL.esc(title)}</h2></div>
          <button class="x" aria-label="Close">×</button></div>
        ${sections.map((s, i) => `<section class="msec"><div><h3>${FL.esc(s.title)}</h3>${s.body.map((p) => `<p>${p}</p>`).join('')}</div>
          <figure><div class="figbox" data-fig="${i}"></div><figcaption>${FL.esc(s.caption)}</figcaption></figure></section>`).join('')}
      </div></div>`);
      document.body.appendChild(m);
      const stops = sections.map((s, i) => s.figure(m.querySelector(`[data-fig="${i}"]`)));
      const close = () => { stops.forEach((f) => f && f()); m.remove(); removeEventListener('keydown', onKey); };
      const onKey = (e) => { if (e.key === 'Escape') close(); };
      addEventListener('keydown', onKey);
      m.querySelector('.bd').onclick = close; m.querySelector('.x').onclick = close;

  };
  FL.loop = function (count, ms, fn) {
    let s = FL.reduce ? count - 1 : 0; fn(s);
    if (FL.reduce) return () => {};
    const t = setInterval(() => { s = (s + 1) % count; fn(s); }, ms);
    return () => clearInterval(t);
  };

  /* ---------- easing + tween engine ---------- */
  function bez(p1x, p1y, p2x, p2y) {
    const cx = 3 * p1x; const bx = 3 * (p2x - p1x) - cx; const ax = 1 - cx - bx;
    const cy = 3 * p1y; const by = 3 * (p2y - p1y) - cy; const ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t; const sy = (t) => ((ay * t + by) * t + cy) * t; const ds = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x; for (let i = 0; i < 8; i++) { const e = sx(t) - x; const d = ds(t); if (Math.abs(e) < 1e-5 || Math.abs(d) < 1e-6) break; t -= e / d; } return sy(t); };
  }
  FL.EASE = bez(0.2, 0.8, 0.2, 1);
  const NS = 'http://www.w3.org/2000/svg';
  FL.NS = NS;
  const NUM = ['x', 'y', 'width', 'height', 'cx', 'cy', 'r', 'x1', 'y1', 'x2', 'y2', 'tx', 'ty', 's', 'sx'];
  const STY = { o: 'opacity', stroke: 'stroke', fill: 'fill', sw: 'stroke-width', dash: 'stroke-dasharray', fo: 'fill-opacity' };
  const ptsD = (p) => p.map((q, i) => `${i ? 'L' : 'M'}${q[0].toFixed(1)},${q[1].toFixed(1)}`).join('');

  FL.Fig = class {
    constructor(svg) { this.svg = svg; this.m = new Map(); this.tw = []; this.raf = null; this.lab = null; this.labHtml = null; this.labT = null; }
    layer(name) { const g = document.createElementNS(NS, 'g'); g.setAttribute('data-layer', name); this.svg.appendChild(g); return g; }
    /* create a mark once; init = {tag, layer, attrs (static), ...targets} */
    mk(id, tag, layer, attrs = {}, init = {}) {
      if (this.m.has(id)) return this.m.get(id);
      const el = document.createElementNS(NS, tag);
      Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
      el.style.transition = 'opacity .5s, stroke .5s, fill .5s, stroke-width .5s';
      layer.appendChild(el);
      const mk = { id, el, tag, cur: {} };
      this.m.set(id, mk);
      this.apply(mk, init, true);
      return mk;
    }
    write(mk) {
      const c = mk.cur; const el = mk.el;
      if (c.pts) el.setAttribute('d', ptsD(c.pts));
      if ('tx' in c || 's' in c) el.setAttribute('transform', `translate(${(c.tx || 0).toFixed(2)},${(c.ty || 0).toFixed(2)}) scale(${(c.s ?? 1).toFixed(4)},${(c.sx ?? c.s ?? 1).toFixed(4)})`);
      NUM.forEach((k) => { if (k in c && !['tx', 'ty', 's', 'sx'].includes(k)) el.setAttribute(k, c[k].toFixed(2)); });
    }
    /* move a mark to a target. Position over dur (0.9s), style by CSS (0.5s). */
    apply(mk, t, instant = false, { dur = 900, delay = 0 } = {}) {
      const el = mk.el;
      if (t.attr) Object.entries(t.attr).forEach(([k, v]) => (v == null ? el.removeAttribute(k) : el.setAttribute(k, v)));
      Object.entries(STY).forEach(([k, css]) => {
        if (!(k in t)) return;
        el.style.transitionDelay = instant || FL.reduce ? '0s' : `${delay}ms`;
        if (instant) { const tr = el.style.transition; el.style.transition = 'none'; el.style.setProperty(css, t[k]); el.getBoundingClientRect(); el.style.transition = tr; } else el.style.setProperty(css, t[k]);
      });
      const tgt = {};
      if (t.pts) tgt.pts = t.pts.map((p) => [p[0], p[1]]);
      NUM.forEach((k) => { if (k in t) tgt[k] = t[k]; });
      if (!Object.keys(tgt).length) return;
      this.tw = this.tw.filter((w) => w.mk !== mk);
      if (instant || FL.reduce || dur === 0) { Object.assign(mk.cur, tgt); this.write(mk); return; }
      const from = {};
      Object.keys(tgt).forEach((k) => {
        if (k === 'pts') { const cp = mk.cur.pts || tgt.pts; from.pts = tgt.pts.map((_, i) => (cp[Math.min(i, cp.length - 1)] || tgt.pts[i]).slice()); } else from[k] = k in mk.cur ? mk.cur[k] : tgt[k];
      });
      this.tw.push({ mk, from, to: tgt, t0: performance.now() + delay, dur });
      if (!this.raf) this.raf = requestAnimationFrame((n) => this.tick(n));
    }
    set(id, t, o) { const mk = this.m.get(id); if (!mk) throw new Error(`no mark ${id}`); this.apply(mk, t, false, o); }
    pre(id, t) { const mk = this.m.get(id); if (!mk) throw new Error(`no mark ${id}`); this.apply(mk, t, true); }
    tick(now) {
      this.tw = this.tw.filter((w) => {
        const p = Math.min(1, Math.max(0, (now - w.t0) / w.dur)); const e = FL.EASE(p); const c = w.mk.cur;
        Object.keys(w.to).forEach((k) => {
          if (k === 'pts') c.pts = w.to.pts.map((q, i) => [w.from.pts[i][0] + (q[0] - w.from.pts[i][0]) * e, w.from.pts[i][1] + (q[1] - w.from.pts[i][1]) * e]);
          else c[k] = w.from[k] + (w.to[k] - w.from[k]) * e;
        });
        if (now >= w.t0) this.write(w.mk);
        return p < 1;
      });
      this.raf = this.tw.length ? requestAnimationFrame((n) => this.tick(n)) : null;
    }
    stop() { this.tw = []; }
    /* draw a path in from its start (a new mark arriving); keeps its points */
    drawIn(id, { dur = 900, delay = 0 } = {}) {
      const el = this.m.get(id).el; if (FL.reduce) return;
      const len = el.getTotalLength(); const keep = el.getAttribute('stroke-dasharray');
      el.style.strokeDasharray = `${len} ${len}`; el.style.strokeDashoffset = `${len}`; el.getBoundingClientRect();
      const tr = el.style.transition; el.style.transition = `${tr}, stroke-dashoffset ${dur}ms cubic-bezier(.2,.8,.2,1) ${delay}ms`;
      el.style.strokeDashoffset = '0';
      setTimeout(() => { el.style.transition = tr; el.style.strokeDasharray = keep || ''; el.style.strokeDashoffset = ''; }, dur + delay + 30);
    }
    /* label layer: old labels out (0.35s), new labels in (0.35s), then count-ups */
    labels(html, host) {
      const g = host; if (this.labHtml === html) return; this.labHtml = html;
      clearTimeout(this.labT);
      g.style.transition = 'opacity .35s'; g.style.opacity = 0;
      this.labT = setTimeout(() => {
        g.innerHTML = html; g.getBoundingClientRect(); g.style.opacity = 1;
        g.querySelectorAll('[data-count]').forEach((t) => FL.countTo(t, +t.dataset.count, { from: +(t.dataset.from || 0), ms: 900, fmt: (t.dataset.fmt === 'x' ? (v) => `${v.toFixed(1)} times` : (v) => FL.fmt(Math.round(v))) }));
      }, FL.reduce ? 0 : 350);
    }
  };
  FL.countTo = function (el, to, { from = 0, ms = 900, fmt = (v) => Math.round(v) } = {}) {
    if (FL.reduce) { el.textContent = fmt(to); return; }
    const t0 = performance.now();
    const tick = (n) => { const p = Math.min(1, (n - t0) / ms); el.textContent = fmt(from + (to - from) * FL.EASE(p)); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  };

  /* ---------- the readout bar above the figure (fixed 52px, fixed slots) ---------- */
  FL.key = (k = {}) => `<svg width="16" height="8" viewBox="0 0 16 8"><line x1="1" y1="4" x2="15" y2="4" stroke="${k.c || '#0F766E'}" stroke-width="${Math.min(2.6, k.w || 2)}" ${k.dash ? `stroke-dasharray="${k.dash}"` : ''} stroke-linecap="round"/></svg>`;
  FL.dotKey = (c, hollow) => `<svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.6" fill="${hollow ? '#fff' : c}" stroke="${c}" stroke-width="1.4"/></svg>`;
  FL.readout = function (host) {
    host.innerHTML = '<div class="r1"><span class="m"></span><span class="n"></span></div><div class="r2"></div>';
    const m = host.querySelector('.m'); const n = host.querySelector('.n'); const r2 = host.querySelector('.r2');
    return {
      set({ title = '', note = '', slots = null, text = null, cols = null }) {
        m.textContent = title; n.textContent = note;
        if (text != null) { r2.style.gridTemplateColumns = '1fr'; r2.innerHTML = `<span class="txt">${text}</span>`; return; }
        const s = slots || [];
        r2.style.gridTemplateColumns = `repeat(${cols || Math.max(1, s.length)}, minmax(0,1fr))`;
        r2.innerHTML = s.map((x) => `<span class="s">${x.key || ''}<b>${FL.esc(x.v)}</b><span>${FL.esc(x.name)}</span></span>`).join('');
      },
    };
  };
})();
</script>
<script>/* Site Audit mockups (#1426): shell (OQ rail + tool top bar) and the ?v= variant switcher. */
(function () {
  const SA = (window.SA = {});
  SA.LV = { now: { name: 'Fix now', tip: 'Loses a visitor or loses Google: a page that does not load, or a page Google is told to skip. Asana due date: 1 week.' },
    soon: { name: 'Fix soon', tip: 'Weakens a page that works: shared titles, missing descriptions or headings, thin service pages. Asana due date: 3 weeks.' },
    tidy: { name: 'Tidy up', tip: 'Worth doing when there is time: long titles, pages left out of the sitemap, missing alt text. No due date.' } };
  SA.lv = (k, label) => `<span class="lv ${k}" data-tip-h="${SA.LV[k].name}" data-tip="${SA.LV[k].tip}"><i></i>${label ?? SA.LV[k].name}</span>`;
  SA.sample = (why) => `<span class="sample" data-tip-h="Sample" data-tip="${FL.esc(why || 'Today’s crawl does not keep this, so the mockup shows a made-up example. The new shared crawl keeps it.')}">sample</span>`;
  SA.shell = function ({ mock, right }) {
    const page = document.getElementById('page');
    const bar = FL.h(`<div class="mockbar">${mock}</div>`);
    const app = FL.h(`<div class="fl-app"><main class="fl-main"><div class="fl-wrap">
      <div class="fl-top"><div class="fl-brand"><span class="fl-mark"><svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h3l2-4 2 8 2-4h1"/></svg></span>Site Audit</div>
      <div class="fl-right"><span id="method-slot"><button type="button" class="method-btn"><span class="dot"></span>How it works</button></span>${right ?? '<span class="who">Liberty Family Dentistry</span><span class="when">libertyfamilydentistry.com</span>'}</div></div>
    </div></main></div>`);
    page.parentNode.insertBefore(bar, page); page.parentNode.insertBefore(app, page);
    app.querySelector('.fl-wrap').appendChild(page);
    FL.$('.method-btn').onclick = () => FL.toast('Opens “Site Audit · How it works” (not part of this mockup).');
  };
  /* variants: { A: { name, render(host) }, B: ... } */
  SA.variants = function (V) {
    const keys = Object.keys(V); const host = document.getElementById('page');
    let cur = new URLSearchParams(location.search).get('v'); if (!keys.includes(cur)) cur = keys[0];
    const bar = FL.h(`<div class="vbar"><button data-d="-1" aria-label="Previous">←</button>${keys.map((k) => `<button data-k="${k}">${k}</button>`).join('')}<span class="lbl"></span><button data-d="1" aria-label="Next">→</button><a href="index-site-audit.html">all screens</a></div>`);
    document.body.appendChild(bar);
    const show = (k) => { cur = k; const u = new URL(location); u.searchParams.set('v', k); history.replaceState(null, '', u);
      FL.$$('button[data-k]', bar).forEach((b) => b.classList.toggle('on', b.dataset.k === k));
      bar.querySelector('.lbl').textContent = `${k}: ${V[k].name}`; host.innerHTML = ''; window.scrollTo({ top: 0 }); V[k].render(host); };
    bar.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.k) show(b.dataset.k); else show(keys[(keys.indexOf(cur) + +b.dataset.d + keys.length) % keys.length]); };
    addEventListener('keydown', (e) => { if (e.target.closest('input,textarea,[contenteditable]')) return;
      if (e.key === 'ArrowRight') show(keys[(keys.indexOf(cur) + 1) % keys.length]); if (e.key === 'ArrowLeft') show(keys[(keys.indexOf(cur) - 1 + keys.length) % keys.length]); });
    show(cur);
  };
})();
</script>
<script>/* Screen 5 (#1426): "Make the Asana tasks". Three directions: A dialog, B plan by due date, C inline on the result list.
   Every direction has two states: first run (Oct 22 crawl) and after a re-crawl (Nov 19, sample). */
(function () {
  const CLIENT = D.client;

  const DUE = { now: 'Nov 6, 2026', soon: 'Nov 20, 2026', tidy: null };
  const DUE_SHORT = { now: 'Nov 6', soon: 'Nov 20', tidy: 'No due date' };
  const TEAM = { seo: { n: 'Maya Ortiz', i: 'MO' }, ms: { n: 'Jordan Lee', i: 'JL' } };
  const PROJECT = `${CLIENT} SEO`;
  const ORDER = { now: 0, soon: 1, tidy: 2 };
  const ISS = D.issues.slice().sort((a, b) => ORDER[a.level] - ORDER[b.level]);
  const esc = FL.esc;
  const hm = (m) => (m == null ? null : m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? ` ${m % 60}m` : ''}` : `${m}m`);
  const taskName = (i) => `${i.name} - ${CLIENT}`;
  const DUE_RE = { now: 'Nov 26, 2026', soon: 'Dec 10, 2026', tidy: null };
  /* new tasks after the re-crawl count from Nov 19; an updated open task keeps its date (proposal) */
  const dueOf = (i, re) => (re && i.rc && (i.rc.kind === 'new' || i.rc.kind === 'ret') ? DUE_RE : DUE)[i.level];

  /* re-crawl state (sample): what the tool does with each issue type's task on Nov 19 */
  const RECRAWL = {
    dup_title: { kind: 'upd', label: 'Updates the open task', note: '8 fixed, 0 new', count: 18 },
    no_meta: { kind: 'upd', label: 'Updates the open task', note: '12 fixed, 2 new', count: 17 },
    broken_pages: { kind: 'ret', label: 'New task: last one was completed, the issue came back', note: '1 page again', count: 1 },
    redirect_chain: { kind: 'new', label: 'New task', note: 'first time found', count: 1 },
  };
  const recrawlIssues = () => {
    const base = ISS.filter((i) => RECRAWL[i.key]).map((i) => ({ ...i, count: RECRAWL[i.key].count, rc: RECRAWL[i.key] }));
    const same = ISS.filter((i) => !RECRAWL[i.key]).map((i) => ({ ...i, rc: { kind: 'same', label: 'Open task, no change', note: 'left as is' } }));
    return base.concat(same);
  };

  const GUIDE = {
    dup_title: ['Google cannot tell these pages apart, so it may show the wrong one or none.', 'Webflow: Page settings, SEO, Title tag (for CMS pages, set the title field on the collection template).', 'WordPress: the SEO title box (Yoast or Rank Math) on each page.', 'Trap: most of these are empty review pages. Hiding them from Google may be better than retitling them; ask before deleting anything.'],
    no_meta: ['Google writes its own snippet from random page text, which rarely sells the visit.', 'Webflow: Page settings, SEO, Meta description.', 'WordPress: the meta description box (Yoast or Rank Math).', 'Trap: do not paste one description on every page; that creates a new issue.'],
    no_h1: ['The page has no main heading, so Google and screen readers lose the page’s topic.', 'Webflow: change the first heading element to H1.', 'WordPress: set the first heading block to H1.', 'Trap: one H1 per page; the logo is not the H1.'],
  };
  const guide = (k) => GUIDE[k] || ['Why it matters and the steps for Webflow and WordPress, from the fixed guide for this issue type.', 'Copied into every task of this type.'];

  /* ---------- the Asana task preview (what gets created) ---------- */
  function asanaCard(i, { recrawl, compact } = {}) {
    const rc = recrawl && i.rc;
    const due = dueOf(i, recrawl);
    const shown = i.pages.slice(0, compact ? 3 : 4);
    const est = hm(i.minutes);
    const fields = `
      <div class="k">Assignee</div><div class="v"><span class="av seo">${TEAM.seo.i}</span>${TEAM.seo.n} ${SA.sample('Placeholder names: the real task uses the strategy’s SEO assignee and Marketing Strategist.')}</div>
      <div class="k">Due date</div><div class="v">${due ? `<span class="as-due">${due}</span>` : '<span class="as-none">No due date</span>'}${rc && rc.kind === 'upd' ? ' <span class="prop" data-tip-h="Proposal" data-tip="An updated open task keeps the due date it already had.">kept</span>' : ''}</div>
      <div class="k">Projects</div><div class="v"><span class="chip proj"><i style="background:#4573d2"></i>${esc(PROJECT)}</span><span style="color:#6d6e6f;font-size:12px">Address Audit Issues</span></div>
      <div class="k"></div><div class="v"><span class="chip proj"><i style="background:#e8384f"></i>Audit Issues</span></div>
      <div class="k">Estimated time</div><div class="v">${est ? `<span class="chip est">${est}</span> <span class="prop" data-tip-h="Proposal" data-tip="Minutes per issue type are a proposal for the owner to set. They make the task count in Weekly Workload.">proposal</span>` : '<span class="as-none">Not set</span>'}</div>
      <div class="k">Week</div><div class="v"><span class="chip wk">No week</span> <span class="prop" data-tip-h="Proposal" data-tip="Every task dialog offers No week, This week, Next week. No week puts the task on the Weekly Workload board with the Week field empty.">proposal</span></div>
      <div class="k">Collaborators</div><div class="v"><span class="av seo">${TEAM.seo.i}</span><span class="av ms">${TEAM.ms.i}</span><span style="color:#6d6e6f;font-size:12px">${TEAM.ms.n} (MS) follows</span></div>`;
    const pagesList = `<h4>${i.count} page${i.count === 1 ? '' : 's'}</h4><ul>${shown.map((p) => `<li><span class="u">${esc(p.url)}</span>: ${esc(p.problem)}</li>`).join('')}</ul>${i.count > shown.length ? `<div class="more">and ${i.count - shown.length} more, all listed in the task</div>` : ''}`;
    const g = guide(i.key);
    const body = `<div class="as-desc">${pagesList}
      ${compact ? '' : `<h4>Fix guide</h4><div>${esc(g[0])}</div><ul>${g.slice(1).map((s) => `<li>${esc(s)}</li>`).join('')}</ul>`}
      <div style="margin-top:8px"><a href="#" onclick="return false">Open this issue in Site Audit</a> <span style="color:#6d6e6f">(run of ${recrawl ? 'Nov 19' : 'Oct 22'}, 2026)</span></div></div>`;
    const comment = rc && rc.kind === 'upd' ? `<div class="as-comment"><span class="av" style="background:#0F766E">OQ</span><div><span class="who">OpenedQueries</span> · Nov 19<br><span class="men">@${TEAM.seo.n}</span> <span class="men">@${TEAM.ms.n}</span> Re-crawl: ${esc(rc.note)}. Page list above is updated.</div></div>` : '';
    const top = rc ? `<div style="margin-bottom:8px">${tagFor(rc)}</div>` : '';
    return `<div class="as as-card">${top}<span class="as-done">✓ Mark complete</span><div class="as-title">${esc(taskName(i))}</div><div class="as-fields">${fields}</div>${body}${comment}</div>`;
  }
  const tagFor = (rc) => `<span class="tag ${rc.kind}">${esc(rc.label)}${rc.kind === 'same' ? '' : `: ${esc(rc.note)}`}</span>`;

  function stateBar(host, cur, on) {
    const el = FL.h(`<div class="s5-state"><div class="seg"><button data-s="first">First run, Oct 22 crawl</button><button data-s="re">After a re-crawl, Nov 19 ${''}</button></div><span>${cur === 're' ? `Re-crawl is a sample: the tool remembers each issue type’s task and never makes a duplicate.` : 'Real counts from the Oct 22 crawl; Fix now items are samples.'}</span></div>`);
    el.querySelectorAll('button').forEach((b) => { b.classList.toggle('on', b.dataset.s === cur); b.onclick = () => on(b.dataset.s); });
    host.appendChild(el);
  }
  const head = (sub) => `<div class="s5-head"><div><div class="kick">Site Audit · ${esc(CLIENT)}</div><h1 class="h1">Make the Asana tasks</h1><p class="sub">${sub}</p></div></div>`;

  /* run progress: one task at a time; calls step(i, phase) then done() */
  function runProgress(n, step, done) {
    let k = 0;
    const tick = () => { if (k >= n) { done(); return; } step(k, 'busy'); setTimeout(() => { step(k, 'ok'); k += 1; tick(); }, FL.reduce ? 0 : 420); };
    tick();
  }

  /* ================= A: dialog ================= */
  function renderA(host, state = 'first') {
    host.innerHTML = '';
    const re = state === 're';
    const list = re ? recrawlIssues() : ISS;
    const sel = new Set(list.filter((i) => !re || i.rc.kind !== 'same').map((i) => i.key));
    let focus = list[0].key;
    stateBar(host, state, (s) => renderA(host, s));
    host.firstChild.insertAdjacentHTML('afterbegin', '<b style="color:var(--ink);font-size:14px;margin-right:6px">Opened from the result page.</b>');
    const back = FL.h(`<div class="s5a-back"><div class="s5a-ghost"><div class="g1"></div><div class="g2"></div><div class="g3"></div><div class="g3"></div><div class="g3"></div><div class="g3"></div></div>
      <div class="s5a-dlg" role="dialog"><div class="s5a-top"><div><h3>${re ? 'Update the Asana tasks' : 'Make the Asana tasks'}</h3><p>${esc(CLIENT)} · crawl of ${re ? 'Nov 19' : 'Oct 22'}, 2026 · ${re ? 'updates open tasks, never duplicates' : 'tick the issue types to send'}</p></div><div class="s5a-team"><span><span class="av seo">${TEAM.seo.i}</span> ${TEAM.seo.n.split(' ')[0]}</span><span><span class="av ms">${TEAM.ms.i}</span> ${TEAM.ms.n.split(' ')[0]} (MS)</span><span class="seg"><button class="on">No week</button><button>This week</button><button>Next week</button></span><button class="x" style="border:0;background:none;font-size:22px;color:var(--muted)">×</button></div></div>
      <div class="s5a-body"><div class="s5a-left"></div><div class="s5a-right"></div></div>
      <div class="s5a-foot"><span class="sum"></span><span class="act"></span></div></div></div>`);
    host.appendChild(back);
    const L = back.querySelector('.s5a-left'); const R = back.querySelector('.s5a-right');
    const draw = () => {
      L.innerHTML = ['now', 'soon', 'tidy'].map((lv) => {
        const its = list.filter((i) => i.level === lv); if (!its.length) return '';
        return `<div><div class="grp"><span>${SA.lv(lv)}</span><span>${lv === 'tidy' ? 'no due date' : `due ${re ? DUE_RE[lv].replace(', 2026', '') + ' if new' : DUE_SHORT[lv]}`}</span></div>${its.map((i) => `<div class="irow ${focus === i.key ? 'focus' : ''}" data-k="${i.key}"><span class="cb ${sel.has(i.key) ? 'on' : ''}" data-cb="${i.key}"></span><span class="nm">${esc(i.name)}</span><span class="meta">${re ? `<span class="tag ${i.rc.kind}" style="font-size:10.5px">${{ upd: 'update', ret: 'new', new: 'new', same: 'no change' }[i.rc.kind]}</span>` : ''}${i.count} pg${i.real ? '' : SA.sample()}</span></div>`).join('')}</div>`;
      }).join('');
      const fi = list.find((i) => i.key === focus);
      R.innerHTML = `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px">Preview: the task exactly as Asana will show it</div>${asanaCard(fi, { recrawl: re })}`;
      const chosen = list.filter((i) => sel.has(i.key));
      const mins = chosen.reduce((s, i) => s + (i.minutes || 0), 0);
      const nNew = chosen.filter((i) => !re || i.rc.kind === 'new' || i.rc.kind === 'ret').length;
      const nUpd = re ? chosen.filter((i) => i.rc.kind === 'upd').length : 0;
      back.querySelector('.sum').innerHTML = `<b>${re ? `${nUpd} updates, ${nNew} new tasks` : `${chosen.length} tasks`}</b> · <b>${hm(mins)}</b> estimated · ${re ? 'new tasks due from Nov 19' : `due ${chosen.some((i) => i.level === 'now') ? 'Nov 6 and ' : ''}Nov 20`}`;
      back.querySelector('.act').innerHTML = `<button class="btn btn-line" style="margin-right:8px">Cancel</button><button class="btn btn-go go">${re ? 'Update Asana' : `Make ${chosen.length} tasks`}</button>`;
      back.querySelector('.go').onclick = () => create(chosen);
    };
    L.onclick = (e) => { const cb = e.target.closest('[data-cb]'); const r = e.target.closest('.irow'); if (!r) return; if (cb) { sel.has(cb.dataset.cb) ? sel.delete(cb.dataset.cb) : sel.add(cb.dataset.cb); } focus = r.dataset.k; draw(); };
    const create = (chosen) => {
      L.innerHTML = `<div class="grp"><span>Sending to Asana, one at a time</span><span class="cnt">0 of ${chosen.length}</span></div>` + chosen.map((i) => `<div class="irow" data-r="${i.key}"><span class="st"><span class="cb"></span></span><span class="nm">${esc(i.name)}</span><span class="meta lk"></span></div>`).join('');
      back.querySelector('.act').innerHTML = '<span class="prog"><span class="spin"></span>Working</span>';
      runProgress(chosen.length, (k, ph) => {
        const i = chosen[k]; const row = L.querySelector(`[data-r="${i.key}"]`);
        row.querySelector('.st').innerHTML = ph === 'busy' ? '<span class="spin"></span>' : '<span class="ok"></span>';
        if (ph === 'ok') { row.querySelector('.lk').innerHTML = `<a class="olink" href="#" onclick="return false">${re && i.rc.kind === 'upd' ? 'Updated' : 'Open'} in Asana ↗</a>`; L.querySelector('.cnt').textContent = `${k + 1} of ${chosen.length}`; }
        if (ph === 'busy') { R.innerHTML = `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px">${re && i.rc.kind === 'upd' ? 'Updating' : 'Making'} now</div>${asanaCard(i, { recrawl: re })}`; }
      }, () => {
        back.querySelector('.act').innerHTML = '<button class="btn btn-go">Done</button>';
        const cap = R.querySelector('div'); if (cap) cap.textContent = 'Last one made';
        back.querySelector('.sum').innerHTML = `<b>All in Asana.</b> The result page now shows “Task made” with its link on each issue type.`;
      });
    };
    draw();
  }

  /* ================= B: the plan, by due date ================= */
  function renderB(host, state = 'first') {
    host.innerHTML = '';
    const re = state === 're';
    const list = re ? recrawlIssues() : ISS;
    const sel = new Set(list.filter((i) => !re || i.rc.kind !== 'same').map((i) => i.key));
    let focus = list.find((i) => i.level === 'soon').key;
    host.insertAdjacentHTML('beforeend', head('The tasks laid out by when they are due, so the team sees the workload before it lands. Click a task to see it as Asana will.'));
    stateBar(host, state, (s) => renderB(host, s));
    const wrap = FL.h('<div><div class="s5b-cols"></div><div class="sticky"><span class="sum"></span><span class="act"></span></div></div>');
    host.appendChild(wrap);
    const cols = wrap.querySelector('.s5b-cols');
    const COL = re ? [['now', 'Fix now', 'New tasks due Nov 26'], ['soon', 'Fix soon', 'New due Dec 10; updated keep theirs'], ['tidy', 'Tidy up', 'No due date']]
      : [['now', 'Due Nov 6', 'Fix now: one week from today'], ['soon', 'Due Nov 20', 'Fix soon: three weeks from today'], ['tidy', 'No due date', 'Tidy up: when there is time']];
    const draw = () => {
      cols.innerHTML = COL.map(([lv, h, sub]) => {
        const its = list.filter((i) => i.level === lv);
        const mins = its.filter((i) => sel.has(i.key)).reduce((s, i) => s + (i.minutes || 0), 0);
        return `<div class="s5b-col ${lv === 'tidy' ? 'none' : ''}"><h4><span>${h}</span><span class="tot">${hm(mins) || '0m'}</span></h4><div class="lvl">${SA.lv(lv, sub)}</div>
          ${its.map((i) => `<div class="tcard ${focus === i.key ? 'focus' : ''} ${sel.has(i.key) ? '' : 'off'}" data-k="${i.key}"><div class="t1"><span class="cb ${sel.has(i.key) ? 'on' : ''}" data-cb="${i.key}"></span><span class="nm">${esc(i.name)}</span></div>
            <div class="t2"><span>${i.count} page${i.count === 1 ? '' : 's'}${i.real ? '' : SA.sample()}</span><span>${re ? `<span class="tag ${i.rc.kind}">${{ upd: 'update', ret: 'new again', new: 'new', same: 'no change' }[i.rc.kind]}</span> ` : ''}${hm(i.minutes) || ''}</span></div></div>`).join('')}</div>`;
      }).join('') + `<div class="s5b-side">${asanaCard(list.find((i) => i.key === focus), { recrawl: re, compact: true })}</div>`;
      const chosen = list.filter((i) => sel.has(i.key));
      const mins = chosen.reduce((s, i) => s + (i.minutes || 0), 0);
      wrap.querySelector('.sum').innerHTML = `<b>${chosen.length} task${chosen.length === 1 ? '' : 's'}</b> · <b>${hm(mins)}</b> for ${TEAM.seo.n} ${SA.sample('Placeholder name')} · in <b>${esc(PROJECT)}</b>, Address Audit Issues, and <b>Audit Issues</b>`;
      wrap.querySelector('.act').innerHTML = `<button class="btn btn-go go">${re ? 'Update Asana' : 'Make the Asana tasks'}</button>`;
      wrap.querySelector('.go').onclick = () => {
        wrap.querySelector('.act').innerHTML = '<span class="prog"><span class="spin"></span>Sending one at a time</span>';
        runProgress(chosen.length, (k, ph) => {
          const c = cols.querySelector(`.tcard[data-k="${chosen[k].key}"] .t1 > span:first-child`);
          if (c) c.outerHTML = ph === 'busy' ? '<span class="spin"></span>' : '<span class="ok"></span>';
          if (ph === 'ok') { const t2 = cols.querySelector(`.tcard[data-k="${chosen[k].key}"] .t2 span:last-child`); if (t2) t2.innerHTML = '<a class="olink" href="#" onclick="return false">In Asana ↗</a>'; }
        }, () => { wrap.querySelector('.act').innerHTML = '<span style="color:var(--aInk);font-weight:600">All in Asana</span>'; });
      };
    };
    cols.onclick = (e) => { const cb = e.target.closest('[data-cb]'); const c = e.target.closest('.tcard'); if (!c) return; if (cb) { sel.has(cb.dataset.cb) ? sel.delete(cb.dataset.cb) : sel.add(cb.dataset.cb); } focus = c.dataset.k; draw(); };
    draw();
  }

  /* ================= C: inline on the result list ================= */
  function renderC(host, state = 'first') {
    host.innerHTML = '';
    const re = state === 're';
    const list = re ? recrawlIssues() : ISS;
    const sel = new Set(list.filter((i) => !re || i.rc.kind !== 'same').map((i) => i.key));
    let open = re ? 'dup_title' : 'dup_title';
    host.insertAdjacentHTML('beforeend', head('No separate screen: each issue type on the result shows the task it will become. Open a row to see the task.'));
    stateBar(host, state, (s) => renderC(host, s));
    const wrap = FL.h('<div><div class="s5c-list"></div><div class="sticky"><span class="sum"></span><span class="act"></span></div></div>');
    host.appendChild(wrap);
    const L = wrap.querySelector('.s5c-list');
    const fut = (i) => {
      if (!sel.has(i.key)) return '<span class="tx" style="color:var(--faint)">Left out</span>';
      if (re) return `${tagFor(i.rc)}`;
      return `<span class="tx">Will make <b>${esc(taskName(i))}</b> · ${i.level === 'tidy' ? 'no due date' : `due ${DUE_SHORT[i.level]}`}${i.minutes ? ` · ${hm(i.minutes)}` : ''}</span>`;
    };
    const draw = () => {
      L.innerHTML = ['now', 'soon', 'tidy'].map((lv) => {
        const its = list.filter((i) => i.level === lv);
        return `<div class="s5c-grp"><span>${SA.lv(lv)}</span><span>${its.length} issue types · ${lv === 'tidy' ? 'no due date' : `due ${DUE_SHORT[lv]}`}</span></div>` + its.map((i) => `<div class="s5c-row ${open === i.key ? 'open' : ''}" data-k="${i.key}"><span class="cb ${sel.has(i.key) ? 'on' : ''}" data-cb="${i.key}"></span><span class="nm">${esc(i.name)}${i.real ? '' : SA.sample()}</span><span class="pg">${i.count} pg</span><span class="fut">${fut(i)}</span><span class="chev">›</span></div>${open === i.key ? `<div class="s5c-exp"><div class="why"><h5>The task</h5>Lands in <b>${esc(PROJECT)}</b>, section Address Audit Issues, and in the global <b>Audit Issues</b> project. ${i.level === 'tidy' ? 'No due date (Tidy up).' : `Due ${dueOf(i, re)} (${SA.LV[i.level].name}).`} ${TEAM.ms.n} (MS) follows. ${re ? (i.rc.kind === 'upd' ? 'The open task gets the new page list and a comment to the team with what changed; it keeps its due date.' : i.rc.kind === 'ret' ? 'The last task for this was completed, so the tool makes a fresh one rather than reopening it.' : i.rc.kind === 'new' ? 'First time this issue type is found, so a new task.' : 'Nothing changed, so the open task is left alone.') : 'On the next crawl the tool updates this same task with the new page list and a “x fixed, y new” comment; if the task was completed and the issue comes back, it makes a new one.'}</div><div class="mini-as">${asanaCard(i, { recrawl: re, compact: true }).replace('as as-card', 'as')}</div></div>` : ''}`).join('');
      }).join('');
      const chosen = list.filter((i) => sel.has(i.key));
      const mins = chosen.reduce((s, i) => s + (i.minutes || 0), 0);
      wrap.querySelector('.sum').innerHTML = re ? `<b>${chosen.filter((i) => i.rc.kind === 'upd').length} to update, ${chosen.filter((i) => i.rc.kind !== 'upd').length} new</b> · open tasks with no change are left as they are` : `<b>${chosen.length} tasks</b> · <b>${hm(mins)}</b> estimated <span class="prop" data-tip-h="Proposal" data-tip="Estimated minutes per issue type are a proposal for the owner.">proposal</span> · made ${TODAY}`;
      wrap.querySelector('.act').innerHTML = `<button class="btn btn-go go">${re ? 'Update Asana' : `Make ${chosen.length} Asana tasks`}</button>`;
      wrap.querySelector('.go').onclick = () => {
        open = null; draw();
        wrap.querySelector('.act').innerHTML = '<span class="prog"><span class="spin"></span>Sending one at a time</span>';
        runProgress(chosen.length, (k, ph) => {
          const row = L.querySelector(`.s5c-row[data-k="${chosen[k].key}"]`);
          row.querySelector('span:first-child').outerHTML = ph === 'busy' ? '<span class="spin"></span>' : '<span class="ok"></span>';
          if (ph === 'ok') row.querySelector('.fut').innerHTML = `<span class="tx" style="color:var(--aInk);font-weight:600">Task ${re && chosen[k].rc.kind === 'upd' ? 'updated' : 'made'}</span><a class="olink" href="#" onclick="return false">Open in Asana ↗</a>`;
        }, () => { wrap.querySelector('.act').innerHTML = '<span style="color:var(--aInk);font-weight:600">All in Asana</span>'; });
      };
    };
    L.onclick = (e) => { const r = e.target.closest('.s5c-row'); if (!r) return; const cb = e.target.closest('[data-cb]'); if (cb) { sel.has(cb.dataset.cb) ? sel.delete(cb.dataset.cb) : sel.add(cb.dataset.cb); } else open = open === r.dataset.k ? null : r.dataset.k; draw(); };
    draw();
  }

  window.SCREEN = {
    title: 'Site Audit 5: Make the Asana tasks',
    mock: `<b>Site Audit · 5 Make the Asana tasks · 3 directions</b> <span class="src">· data: Liberty Family Dentistry, crawl of Oct 22, 2026 (185 pages, real on-page counts)</span>
<ul><li>A Dialog: wide two-column dialog (no scroll), issue types to tick on the left, the exact Asana task on the right; progress one task at a time, then links.</li>
<li>B Plan by due date: tasks laid out in Due Nov 6 / Due Nov 20 / No due date columns with hours per column; preview beside.</li>
<li>C Inline on the result: each issue row says the task it will become; open a row to see it. No separate screen.</li></ul>
<span class="nr">Toggle “After a re-crawl” to see the update rule (2 updated, 1 new again after completion, 1 new). Samples: names Maya Ortiz / Jordan Lee, the Fix now items, the Nov 19 re-crawl. Proposals: estimated minutes per type, Week default “No week”, which type sits at which level.</span>`,
    right: '<span class="who">Liberty Family Dentistry</span><span class="when">Crawled Oct 22, 2026 · 185 pages</span>',
    variants: {
      A: { name: 'Dialog with live task preview', render: (h) => renderA(h) },
      B: { name: 'Plan by due date', render: (h) => renderB(h) },
      C: { name: 'Inline on the result', render: (h) => renderC(h) },
    },
  };
})();
</script>
<script>SA.shell({ mock: window.SCREEN.mock, right: window.SCREEN.right }); SA.variants(window.SCREEN.variants);</script>
</body></html>
