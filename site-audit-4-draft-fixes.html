<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Site Audit 4: Draft the fixes</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>.oq-rail{position:fixed;inset:0 auto 0 0;width:56px;background:#fff;border-right:1px solid rgba(231,229,228,.6);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px;z-index:40}.oq-rail-item{width:39px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#44403c}.oq-rail-item:hover{background:#f5f5f4}.oq-rail-item.is-active{background:#1c1917;color:#fff}.oq-rail-item:first-child{color:#a8a29e;margin-bottom:8px}.oq-rail-sep{width:24px;height:1px;background:#e7e5e4;margin:6px 0}.oq-rail-foot{margin-top:auto}.oq-rail-av{position:relative;display:flex;width:28px;height:28px;border-radius:6px;background:#e7e5e4;color:#44403c;font:600 10px Inter,system-ui;align-items:center;justify-content:center}.oq-rail-av i{position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-radius:2px;background:#16a34a;border:2px solid #fff}
/* Market Trends Story mockups, round 2. Facelift shared look (AIV experience in OQ teal), trimmed. */
:root{
  --ink:#0B1020;--ink2:#0F172A;--body:#273043;--muted:#667085;--faint:#98A2B3;--line:#E7E9EE;--soft:#F6F7FA;
  --a:#0F766E;--aInk:#115E59;--aTint:#E6F4F1;--aSoft:#99D5CC;
  --up:#15803D;--down:#E11D48;--rose:#DB2777;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.55;color:var(--body);background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:var(--aInk)}

/* mockup bar: outside the design */
.mockbar{background:#ECEEF1;color:#4B5563;font-size:12px;line-height:1.45;padding:7px 18px;border-bottom:1px solid #DDE1E6}
.mockbar b{color:#111827;font-weight:700}
.mockbar .src{color:#6B7280}
.mockbar ul{margin:3px 0 0;padding:0 0 0 16px}
.mockbar li{margin:0}
.mockbar .nr{display:inline-block;margin-top:3px;color:#6B7280}

/* app chrome */
.fl-app{margin-left:56px;min-height:100vh}
.mockbar{margin-left:56px}
.fl-main{min-width:0}
.fl-wrap{max-width:1240px;margin:0 auto;padding:0 28px 120px}
.fl-top{position:sticky;top:0;z-index:30;margin:0 -28px 0;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #EEF0F4}
.fl-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;color:var(--ink)}
.fl-mark{width:26px;height:26px;border-radius:8px;background:var(--a);display:grid;place-items:center;flex:none}
.fl-mark svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8}
.fl-right{display:flex;align-items:center;gap:12px;font-size:13px;flex-wrap:wrap;justify-content:flex-end}
.fl-right .who{color:var(--ink);font-weight:700}
.fl-right .when{color:var(--muted)}
.btn{border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13.5px;transition:background .2s,box-shadow .2s}
.btn-go{background:var(--a);color:#fff;box-shadow:0 6px 18px rgba(15,118,110,.25)}
.btn-line{background:#fff;border:1px solid var(--line);color:var(--ink);padding:7px 12px;font-size:13px}
.btn-line:hover{background:var(--soft)}
.method-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;border-radius:8px;padding:6px 10px;font-weight:600;color:var(--aInk);position:relative;font-size:13.5px}
.method-btn:hover{background:var(--aTint)}
.method-btn .dot{width:14px;height:14px;border-radius:50%;background:var(--a);position:relative}
.method-btn .dot:after{content:'';position:absolute;inset:3.5px;border-radius:50%;border:1px dotted #fff}
.teaser{position:absolute;right:0;top:100%;margin-top:8px;width:300px;z-index:40;border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px 16px;font-size:13px;font-weight:400;line-height:1.5;color:var(--body);text-align:left;box-shadow:0 12px 32px rgba(11,16,32,.12)}

/* tabs */
.tabs{position:sticky;top:55px;z-index:20;display:flex;gap:26px;margin:0 -28px 6px;padding:10px 28px 0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(12px)}
.tabs button{position:relative;border:0;background:none;padding:0 0 10px;font-size:15px;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--ink)}
.tabs .ink{position:absolute;bottom:-1px;height:2px;background:var(--a);transition:left .3s var(--ease),width .3s var(--ease)}
.tabnote{padding:60px 0;color:var(--muted);font-size:14px}

/* modal (How it works) */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:5vh 16px}
.modal .bd{position:fixed;inset:0;background:rgba(11,16,32,.4)}
.modal .win{position:relative;width:100%;max-width:880px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:24px 28px;box-shadow:0 24px 60px rgba(11,16,32,.18);animation:rise .25s var(--ease)}
.modal .x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);border-radius:6px;padding:4px 8px}
.msec{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:center;border-top:1px solid var(--line);padding:20px 0}
.msec h3{margin:0 0 8px;font-size:16.5px;color:var(--ink)}
.msec p{margin:8px 0;font-size:15px;line-height:1.6}
.msec figure{margin:0}
.msec figcaption{margin-top:6px;text-align:center;font-size:12px;color:var(--muted)}
.figbox{height:200px;overflow:hidden;border-radius:8px;background:var(--soft)}
.figbox svg{display:block;width:100%;height:100%}
.figbox svg *{transition:opacity .45s, fill .45s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:300;background:var(--ink);color:#fff;border-radius:8px;padding:12px 18px;font-size:14px;box-shadow:0 12px 32px rgba(11,16,32,.25);animation:rise .25s var(--ease)}
.tipcard{position:fixed;z-index:200;width:280px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:10px 14px;font-size:13px;line-height:1.5;color:var(--body);box-shadow:0 12px 32px rgba(11,16,32,.12);pointer-events:none}
.tipcard b{display:block;color:var(--aInk);font-size:13px;margin-bottom:2px}
.tipword{border-bottom:1px dotted var(--faint);cursor:help}

/* Story */
.story{display:grid;grid-template-columns:minmax(0,1fr) 600px;gap:44px}
.chap{min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding:24px 0;opacity:.25;transition:opacity .4s}
.chap.on{opacity:1}
.chap .k{margin-bottom:12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--aInk)}
.chap .k .act{color:var(--muted)}
.chap h2{margin:0;font-size:36px;font-weight:900;line-height:1.12;letter-spacing:-.025em;color:var(--ink)}
.chap h2 .g{color:var(--a)}
.chap h2 .r{color:var(--down)}
.chap p{margin:14px 0 0;max-width:540px;font-size:17px;line-height:1.6}
.defs{margin-top:18px;max-width:540px;padding:12px 14px;background:#F8FAFB;border:1px solid var(--line);border-radius:6px}
.defs .dh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.chap .defs p{margin:0;font-size:13.5px;line-height:1.55;color:#273043}
.chap .defs p+p{margin-top:6px}
.chap .note{font-size:13.5px;color:var(--muted);margin-top:12px}
.facts{margin-top:18px;max-width:540px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.facts div{padding:9px 10px 9px 0;border-bottom:1px solid var(--line)}
.facts b{display:block;font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.facts span{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.qlist{margin-top:16px;max-width:540px;border-top:1px solid var(--line)}
.qlist div{display:grid;grid-template-columns:minmax(0,1fr) 70px 54px;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.qlist div span:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.qlist .h span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)!important}
.stick{position:sticky;top:104px;height:calc(100vh - 112px);display:flex;flex-direction:column;justify-content:center}
.ro{height:52px;padding:4px 2px 6px;border-bottom:1px solid #EEF0F3;margin-bottom:6px;overflow:hidden}
.ro .r1{display:flex;justify-content:space-between;align-items:baseline;height:20px;font-size:13px;white-space:nowrap}
.ro .r1 .m{font-weight:700;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.ro .r1 .n{color:var(--muted);font-size:12px;margin-left:12px}
.ro .r2{display:grid;height:22px;align-items:center;gap:10px;font-size:12.5px;white-space:nowrap}
.ro .r2 .s{display:flex;align-items:center;gap:6px;overflow:hidden;min-width:0}
.ro .r2 .s b{color:var(--ink2);font-variant-numeric:tabular-nums}
.ro .r2 .s span{color:var(--body);overflow:hidden;text-overflow:ellipsis}
.ro .r2 .s svg{flex:none}
.ro .r2 .txt{grid-column:1/-1;color:var(--body);overflow:hidden;text-overflow:ellipsis}
.figsvg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.figsvg text{font-family:Inter,sans-serif}
.figsvg .num{font-variant-numeric:tabular-nums}
.figcap{margin-top:6px;min-height:36px;font-size:12.5px;line-height:1.45;color:var(--muted);text-align:center}
.storyend{margin:24px 0 0;padding:28px;border:1px solid var(--line);border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;opacity:0;transform:translateY(14px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.storyend.in{opacity:1;transform:none}
.storyend h3{margin:0;font-size:24px;font-weight:900;color:var(--ink);letter-spacing:-.02em}
.storyend p{margin:4px 0 0;color:var(--muted);font-size:14px}
@media (max-width:1180px){.story{grid-template-columns:minmax(0,1fr) 520px;gap:32px}}
@media (max-width:980px){.story{grid-template-columns:1fr}.stick{position:static;height:auto}.chap{opacity:1;min-height:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

/* Site Audit mockups (#1426): additions on top of the approved facelift base. */
:root{--now:#DC2626;--nowTint:#FEF2F2;--soon:#2563EB;--soonTint:#EFF6FF;--tidy:#A3ACB9;--tidyTint:#F4F5F7}
.lv{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--ink)}
.lv i{width:9px;height:9px;border-radius:2px;display:inline-block}
.lv.now i{background:var(--now)}.lv.soon i{background:var(--soon)}.lv.tidy i{background:var(--tidy)}
.sample{display:inline-block;margin-left:6px;padding:0 5px;border:1px dashed #C3C8D2;border-radius:4px;font-size:10.5px;font-weight:600;color:#6B7280;letter-spacing:.02em;vertical-align:1px}
.card{border:1px solid var(--line);border-radius:8px;background:#fff}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px}
.url{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;color:var(--ink2)}
.kick{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--aInk)}
.h1{margin:6px 0 0;font-size:34px;font-weight:900;line-height:1.12;letter-spacing:-.025em;color:var(--ink)}
.sub{margin:8px 0 0;color:var(--muted);font-size:15px}
/* variant switcher: outside the design */
.vbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:500;display:flex;align-items:center;gap:4px;background:#111827;color:#fff;border-radius:10px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13px}
.vbar button{border:0;background:none;color:#fff;border-radius:7px;padding:6px 10px}
.vbar button:hover{background:#374151}
.vbar button.on{background:#fff;color:#111827;font-weight:700}
.vbar .lbl{padding:0 10px;color:#D1D5DB;white-space:nowrap}
.vbar a{color:#9CA3AF;text-decoration:none;padding:0 8px;font-size:12px}

/* Screen 4: Draft the fixes */
.s4-head{padding:26px 0 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.s4-head .h1{font-size:30px}
.run{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 20px;margin-bottom:18px}
.run .l{font-size:15px;color:var(--ink2);line-height:1.5}
.run .l small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.run .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.run .est{font-size:12.5px;color:var(--muted)}
.prog{height:4px;background:var(--soft);border-radius:2px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;width:0;background:var(--a);transition:width .3s var(--ease)}
.ledger{font-size:12.5px;color:var(--muted)}
.ledger b{color:var(--ink);font-variant-numeric:tabular-nums}
.writing{color:var(--faint);font-style:italic}
.writing:after{content:'';display:inline-block;width:6px;height:6px;margin-left:6px;border-radius:2px;background:var(--a);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.len{text-transform:none;letter-spacing:0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.len.bad{color:var(--now)}
.len.ok{color:var(--up)}
.acc{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--ink)}
.acc:hover{background:var(--soft)}
.acc.on{background:var(--a);border-color:var(--a);color:#fff}
.lnk{border:0;background:none;color:var(--aInk);font-size:12.5px;font-weight:600;padding:4px 6px}
[contenteditable=true]{outline:1px solid var(--a);outline-offset:2px;border-radius:3px;background:#fff}
.kind{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.dock{position:sticky;bottom:70px;margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 16px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(11,16,32,.06);font-size:14px}
.skipnote{margin-top:14px;font-size:13px;color:var(--muted)}

/* A: table */
.t4{width:100%;border-collapse:collapse;font-size:13.5px}
.t4 th{text-align:left;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.t4 td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.t4 .now{color:var(--muted);text-decoration:line-through;text-decoration-color:#C3C8D2}
.t4 .now.empty{text-decoration:none;font-style:italic}
.t4 .dr{color:var(--ink);font-weight:500}
.t4 tr.on td{background:#F4FAF8}

/* B: one at a time */
.b4{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}
.q{position:sticky;top:76px}
.q div{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:12.5px;cursor:pointer;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q div:hover{background:var(--soft)}
.q div.cur{background:var(--aTint);color:var(--ink);font-weight:600}
.q i{flex:none;width:9px;height:9px;border-radius:2px;border:1.5px solid #C3C8D2}
.q i.ready{border-color:var(--a)}
.q i.ok{background:var(--a);border-color:var(--a)}
.q i.skip{background:#C3C8D2;border-color:#C3C8D2}
.rc{padding:26px 30px}
.rc .u{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted)}
.rc .ctx{margin-top:6px;font-size:13px;color:var(--muted)}
.rc .lbl{margin-top:22px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;justify-content:space-between}
.rc .nowt{margin-top:6px;font-size:17px;color:var(--muted);line-height:1.45}
.rc .drt{margin-top:6px;font-size:24px;font-weight:700;color:var(--ink);line-height:1.3;letter-spacing:-.01em}
.rc .drt.meta{font-size:18px;font-weight:500}
.rc .acts{margin-top:26px;display:flex;gap:10px;align-items:center}
.kb{display:inline-block;min-width:20px;padding:0 5px;border:1px solid var(--line);border-radius:4px;font-size:11px;color:var(--muted);text-align:center;margin-left:6px;background:#fff}
.btn-go .kb{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.35);color:#fff}

/* C: Google previews */
.c4{display:flex;flex-direction:column;gap:14px}
.pair{padding:16px 18px}
.pair .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:12px}
.pair .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.pair .cap{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.serp{font-family:Arial,Helvetica,sans-serif;max-width:560px}
.serp .site{display:flex;align-items:center;gap:8px;font-size:13px;color:#202124}
.serp .fav{width:26px;height:26px;border-radius:50%;background:#F1F3F4;display:grid;place-items:center;font-size:11px;font-weight:700;color:#0F766E}
.serp .site small{display:block;font-size:12px;color:#4D5156}
.serp .t{margin-top:6px;font-size:19px;line-height:1.3;color:#1A0DAB}
.serp .d{margin-top:3px;font-size:13.5px;line-height:1.55;color:#4D5156}
.serp .d.none{font-style:italic;color:#80868B}
.imgalt{display:flex;gap:10px;align-items:flex-start}
.imgalt .ph{flex:none;width:64px;height:48px;border-radius:6px;background:repeating-linear-gradient(45deg,#EEF0F3 0 6px,#F6F7FA 6px 12px)}
.imgalt p{margin:0;font-size:13.5px}

/* D (round 2): view switch, where-it-goes marker, heading preview */
.vseg{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.vseg .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--soft);gap:2px}
.vseg .seg button{border:0;background:none;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
.vseg .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(11,16,32,.08)}
.where{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:help}
.where:before{content:'';width:8px;height:8px;border-radius:2px;flex:none}
.where.app{color:var(--aInk)}.where.app:before{background:var(--a)}
.where.hand{color:var(--muted)}.where.hand:before{border:1.5px solid #98A2B3;width:5px;height:5px}
.t4 .dr.h1d{font-weight:700}

<script>/* Shared pieces for the round 2 Story mockups: frame, tabs, hovers, How it works window,
   and a small tween engine for ONE persistent SVG (marks keyed by id, never unmounted). */
(function () {
  const FL = (window.FL = {});
  FL.reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  FL.esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  FL.$ = (s, r = document) => r.querySelector(s);
  FL.$$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  FL.h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  FL.fmt = (n) => Number(n).toLocaleString('en-US');
  FL.round = (n, to) => Math.round(n / to) * to;
  FL.toast = (msg) => { const t = FL.h(`<div class="toast">${FL.esc(msg)}</div>`); document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };

  /* ---------- frame ---------- */
  FL.shell = function ({ mock }) {
    const page = document.getElementById('page');
    const bar = FL.h(`<div class="mockbar">${mock}</div>`);
    const app = FL.h(`<div class="fl-app">

      <main class="fl-main"><div class="fl-wrap">
        <div class="fl-top"><div class="fl-brand"><span class="fl-mark"><svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg></span>Market Trends</div>
          <div class="fl-right"><span id="method-slot"></span><span class="who">Expedition Pediatric Dentistry</span><span class="when">Check #22 · Oct 29, 2026 · read for Washington</span>
          <button class="btn btn-line" id="share">Share report</button><button class="btn btn-line" id="newc">New check</button></div></div>
      </div></main></div>`);
    page.parentNode.insertBefore(bar, page);
    page.parentNode.insertBefore(app, page);
    app.querySelector('.fl-wrap').appendChild(page);
    FL.$('#method-slot').innerHTML = '<button type="button" class="method-btn"><span class="dot"></span>How it works</button>';
    FL.$('#share').onclick = () => FL.toast('Opens the client report: link, access code, PDF and email.');
    FL.$('#newc').onclick = () => FL.toast('Starts a new check (not part of this mockup).');
  };

  FL.tabs = function (host, { tabs, value, onChange }) {
    host.classList.add('tabs');
    host.innerHTML = tabs.map((t) => `<button type="button" data-k="${t.key}">${FL.esc(t.label)}</button>`).join('') + '<span class="ink"></span>';
    const ink = host.querySelector('.ink');
    const set = (k, fire) => {
      host.querySelectorAll('button').forEach((b) => { const on = b.dataset.k === k; b.classList.toggle('on', on); if (on) { ink.style.left = `${b.offsetLeft}px`; ink.style.width = `${b.offsetWidth}px`; } });
      if (fire && onChange) onChange(k);
    };
    host.querySelectorAll('button').forEach((b) => { b.onclick = () => set(b.dataset.k, true); });
    requestAnimationFrame(() => set(value, false));
  };

  /* branded hover for words in the text (never over the chart) */
  let tipEl = null; let tipFor = null; let tipT = null;
  const hideTip = () => { clearTimeout(tipT); tipEl?.remove(); tipEl = null; tipFor = null; };
  document.addEventListener('mouseover', (e) => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (t === tipFor) return; hideTip(); if (!t) return; tipFor = t;
    tipT = setTimeout(() => {
      const r = t.getBoundingClientRect();
      tipEl = FL.h(`<div class="tipcard">${t.dataset.tipH ? `<b>${FL.esc(t.dataset.tipH)}</b>` : ''}${FL.esc(t.dataset.tip)}</div>`);
      document.body.appendChild(tipEl);
      tipEl.style.left = `${Math.max(8, Math.min(r.left, innerWidth - 288))}px`;
      if (innerHeight - r.bottom < 130) tipEl.style.bottom = `${innerHeight - r.top + 6}px`; else tipEl.style.top = `${r.bottom + 6}px`;
    }, 120);
  });
  addEventListener('scroll', hideTip, true);

  /* How it works: teaser on hover, window on click, a looping real-data picture per section */
  FL.method = function ({ teaser, title, sections }) {
    const btn = FL.$('.method-btn'); let tip = null;
    btn.addEventListener('mouseenter', () => { if (!tip) { tip = FL.h(`<span class="teaser">${FL.esc(teaser)}</span>`); btn.appendChild(tip); } });
    btn.addEventListener('mouseleave', () => { tip?.remove(); tip = null; });
    btn.addEventListener('click', () => {
      tip?.remove(); tip = null;
      const m = FL.h(`<div class="modal"><div class="bd"></div><div class="win" role="dialog" aria-modal="true">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px">
          <div><div style="font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--aInk)">Market Trends</div><h2 style="margin:2px 0 0;font-size:26px;font-weight:900;letter-spacing:-.02em;color:var(--ink)">${FL.esc(title)}</h2></div>
          <button class="x" aria-label="Close">×</button></div>
        ${sections.map((s, i) => `<section class="msec"><div><h3>${FL.esc(s.title)}</h3>${s.body.map((p) => `<p>${p}</p>`).join('')}</div>
          <figure><div class="figbox" data-fig="${i}"></div><figcaption>${FL.esc(s.caption)}</figcaption></figure></section>`).join('')}
      </div></div>`);
      document.body.appendChild(m);
      const stops = sections.map((s, i) => s.figure(m.querySelector(`[data-fig="${i}"]`)));
      const close = () => { stops.forEach((f) => f && f()); m.remove(); removeEventListener('keydown', onKey); };
      const onKey = (e) => { if (e.key === 'Escape') close(); };
      addEventListener('keydown', onKey);
      m.querySelector('.bd').onclick = close; m.querySelector('.x').onclick = close;
    });
  };
  FL.loop = function (count, ms, fn) {
    let s = FL.reduce ? count - 1 : 0; fn(s);
    if (FL.reduce) return () => {};
    const t = setInterval(() => { s = (s + 1) % count; fn(s); }, ms);
    return () => clearInterval(t);
  };

  /* ---------- easing + tween engine ---------- */
  function bez(p1x, p1y, p2x, p2y) {
    const cx = 3 * p1x; const bx = 3 * (p2x - p1x) - cx; const ax = 1 - cx - bx;
    const cy = 3 * p1y; const by = 3 * (p2y - p1y) - cy; const ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t; const sy = (t) => ((ay * t + by) * t + cy) * t; const ds = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x; for (let i = 0; i < 8; i++) { const e = sx(t) - x; const d = ds(t); if (Math.abs(e) < 1e-5 || Math.abs(d) < 1e-6) break; t -= e / d; } return sy(t); };
  }
  FL.EASE = bez(0.2, 0.8, 0.2, 1);
  const NS = 'http://www.w3.org/2000/svg';
  FL.NS = NS;
  const NUM = ['x', 'y', 'width', 'height', 'cx', 'cy', 'r', 'x1', 'y1', 'x2', 'y2', 'tx', 'ty', 's', 'sx'];
  const STY = { o: 'opacity', stroke: 'stroke', fill: 'fill', sw: 'stroke-width', dash: 'stroke-dasharray', fo: 'fill-opacity' };
  const ptsD = (p) => p.map((q, i) => `${i ? 'L' : 'M'}${q[0].toFixed(1)},${q[1].toFixed(1)}`).join('');

  FL.Fig = class {
    constructor(svg) { this.svg = svg; this.m = new Map(); this.tw = []; this.raf = null; this.lab = null; this.labHtml = null; this.labT = null; }
    layer(name) { const g = document.createElementNS(NS, 'g'); g.setAttribute('data-layer', name); this.svg.appendChild(g); return g; }
    /* create a mark once; init = {tag, layer, attrs (static), ...targets} */
    mk(id, tag, layer, attrs = {}, init = {}) {
      if (this.m.has(id)) return this.m.get(id);
      const el = document.createElementNS(NS, tag);
      Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
      el.style.transition = 'opacity .5s, stroke .5s, fill .5s, stroke-width .5s';
      layer.appendChild(el);
      const mk = { id, el, tag, cur: {} };
      this.m.set(id, mk);
      this.apply(mk, init, true);
      return mk;
    }
    write(mk) {
      const c = mk.cur; const el = mk.el;
      if (c.pts) el.setAttribute('d', ptsD(c.pts));
      if ('tx' in c || 's' in c) el.setAttribute('transform', `translate(${(c.tx || 0).toFixed(2)},${(c.ty || 0).toFixed(2)}) scale(${(c.s ?? 1).toFixed(4)},${(c.sx ?? c.s ?? 1).toFixed(4)})`);
      NUM.forEach((k) => { if (k in c && !['tx', 'ty', 's', 'sx'].includes(k)) el.setAttribute(k, c[k].toFixed(2)); });
    }
    /* move a mark to a target. Position over dur (0.9s), style by CSS (0.5s). */
    apply(mk, t, instant = false, { dur = 900, delay = 0 } = {}) {
      const el = mk.el;
      if (t.attr) Object.entries(t.attr).forEach(([k, v]) => (v == null ? el.removeAttribute(k) : el.setAttribute(k, v)));
      Object.entries(STY).forEach(([k, css]) => {
        if (!(k in t)) return;
        el.style.transitionDelay = instant || FL.reduce ? '0s' : `${delay}ms`;
        if (instant) { const tr = el.style.transition; el.style.transition = 'none'; el.style.setProperty(css, t[k]); el.getBoundingClientRect(); el.style.transition = tr; } else el.style.setProperty(css, t[k]);
      });
      const tgt = {};
      if (t.pts) tgt.pts = t.pts.map((p) => [p[0], p[1]]);
      NUM.forEach((k) => { if (k in t) tgt[k] = t[k]; });
      if (!Object.keys(tgt).length) return;
      this.tw = this.tw.filter((w) => w.mk !== mk);
      if (instant || FL.reduce || dur === 0) { Object.assign(mk.cur, tgt); this.write(mk); return; }
      const from = {};
      Object.keys(tgt).forEach((k) => {
        if (k === 'pts') { const cp = mk.cur.pts || tgt.pts; from.pts = tgt.pts.map((_, i) => (cp[Math.min(i, cp.length - 1)] || tgt.pts[i]).slice()); } else from[k] = k in mk.cur ? mk.cur[k] : tgt[k];
      });
      this.tw.push({ mk, from, to: tgt, t0: performance.now() + delay, dur });
      if (!this.raf) this.raf = requestAnimationFrame((n) => this.tick(n));
    }
    set(id, t, o) { const mk = this.m.get(id); if (!mk) throw new Error(`no mark ${id}`); this.apply(mk, t, false, o); }
    pre(id, t) { const mk = this.m.get(id); if (!mk) throw new Error(`no mark ${id}`); this.apply(mk, t, true); }
    tick(now) {
      this.tw = this.tw.filter((w) => {
        const p = Math.min(1, Math.max(0, (now - w.t0) / w.dur)); const e = FL.EASE(p); const c = w.mk.cur;
        Object.keys(w.to).forEach((k) => {
          if (k === 'pts') c.pts = w.to.pts.map((q, i) => [w.from.pts[i][0] + (q[0] - w.from.pts[i][0]) * e, w.from.pts[i][1] + (q[1] - w.from.pts[i][1]) * e]);
          else c[k] = w.from[k] + (w.to[k] - w.from[k]) * e;
        });
        if (now >= w.t0) this.write(w.mk);
        return p < 1;
      });
      this.raf = this.tw.length ? requestAnimationFrame((n) => this.tick(n)) : null;
    }
    stop() { this.tw = []; }
    /* draw a path in from its start (a new mark arriving); keeps its points */
    drawIn(id, { dur = 900, delay = 0 } = {}) {
      const el = this.m.get(id).el; if (FL.reduce) return;
      const len = el.getTotalLength(); const keep = el.getAttribute('stroke-dasharray');
      el.style.strokeDasharray = `${len} ${len}`; el.style.strokeDashoffset = `${len}`; el.getBoundingClientRect();
      const tr = el.style.transition; el.style.transition = `${tr}, stroke-dashoffset ${dur}ms cubic-bezier(.2,.8,.2,1) ${delay}ms`;
      el.style.strokeDashoffset = '0';
      setTimeout(() => { el.style.transition = tr; el.style.strokeDasharray = keep || ''; el.style.strokeDashoffset = ''; }, dur + delay + 30);
    }
    /* label layer: old labels out (0.35s), new labels in (0.35s), then count-ups */
    labels(html, host) {
      const g = host; if (this.labHtml === html) return; this.labHtml = html;
      clearTimeout(this.labT);
      g.style.transition = 'opacity .35s'; g.style.opacity = 0;
      this.labT = setTimeout(() => {
        g.innerHTML = html; g.getBoundingClientRect(); g.style.opacity = 1;
        g.querySelectorAll('[data-count]').forEach((t) => FL.countTo(t, +t.dataset.count, { from: +(t.dataset.from || 0), ms: 900, fmt: (t.dataset.fmt === 'x' ? (v) => `${v.toFixed(1)} times` : (v) => FL.fmt(Math.round(v))) }));
      }, FL.reduce ? 0 : 350);
    }
  };
  FL.countTo = function (el, to, { from = 0, ms = 900, fmt = (v) => Math.round(v) } = {}) {
    if (FL.reduce) { el.textContent = fmt(to); return; }
    const t0 = performance.now();
    const tick = (n) => { const p = Math.min(1, (n - t0) / ms); el.textContent = fmt(from + (to - from) * FL.EASE(p)); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  };

  /* ---------- the readout bar above the figure (fixed 52px, fixed slots) ---------- */
  FL.key = (k = {}) => `<svg width="16" height="8" viewBox="0 0 16 8"><line x1="1" y1="4" x2="15" y2="4" stroke="${k.c || '#0F766E'}" stroke-width="${Math.min(2.6, k.w || 2)}" ${k.dash ? `stroke-dasharray="${k.dash}"` : ''} stroke-linecap="round"/></svg>`;
  FL.dotKey = (c, hollow) => `<svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.6" fill="${hollow ? '#fff' : c}" stroke="${c}" stroke-width="1.4"/></svg>`;
  FL.readout = function (host) {
    host.innerHTML = '<div class="r1"><span class="m"></span><span class="n"></span></div><div class="r2"></div>';
    const m = host.querySelector('.m'); const n = host.querySelector('.n'); const r2 = host.querySelector('.r2');
    return {
      set({ title = '', note = '', slots = null, text = null, cols = null }) {
        m.textContent = title; n.textContent = note;
        if (text != null) { r2.style.gridTemplateColumns = '1fr'; r2.innerHTML = `<span class="txt">${text}</span>`; return; }
        const s = slots || [];
        r2.style.gridTemplateColumns = `repeat(${cols || Math.max(1, s.length)}, minmax(0,1fr))`;
        r2.innerHTML = s.map((x) => `<span class="s">${x.key || ''}<b>${FL.esc(x.v)}</b><span>${FL.esc(x.name)}</span></span>`).join('');
      },
    };
  };
})();
</script>
<script>/* Site Audit mockups (#1426): shell (OQ rail + tool top bar) and the ?v= variant switcher. */
(function () {
  const SA = (window.SA = {});
  SA.LV = { now: { name: 'Fix now', tip: 'Loses a visitor or loses Google: a page that does not load, or a page Google is told to skip. Asana due date: 1 week.' },
    soon: { name: 'Fix soon', tip: 'Weakens a page that works: shared titles, missing descriptions or headings, thin service pages. Asana due date: 3 weeks.' },
    tidy: { name: 'Tidy up', tip: 'Worth doing when there is time: long titles, pages left out of the sitemap, missing alt text. No due date.' } };
  SA.lv = (k, label) => `<span class="lv ${k}" data-tip-h="${SA.LV[k].name}" data-tip="${SA.LV[k].tip}"><i></i>${label ?? SA.LV[k].name}</span>`;
  SA.sample = (why) => `<span class="sample" data-tip-h="Sample" data-tip="${FL.esc(why || 'Today’s crawl does not keep this, so the mockup shows a made-up example. The new shared crawl keeps it.')}">sample</span>`;
  SA.shell = function ({ mock, right }) {
    const page = document.getElementById('page');
    const bar = FL.h(`<div class="mockbar">${mock}</div>`);
    const app = FL.h(`<div class="fl-app"><main class="fl-main"><div class="fl-wrap">
      <div class="fl-top"><div class="fl-brand"><span class="fl-mark"><svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h3l2-4 2 8 2-4h1"/></svg></span>Site Audit</div>
      <div class="fl-right"><span id="method-slot"><button type="button" class="method-btn"><span class="dot"></span>How it works</button></span>${right ?? '<span class="who">Liberty Family Dentistry</span><span class="when">libertyfamilydentistry.com</span>'}</div></div>
    </div></main></div>`);
    page.parentNode.insertBefore(bar, page); page.parentNode.insertBefore(app, page);
    app.querySelector('.fl-wrap').appendChild(page);
    FL.$('.method-btn').onclick = () => FL.toast('Opens “Site Audit · How it works” (not part of this mockup).');
  };
  /* variants: { A: { name, render(host) }, B: ... } */
  SA.variants = function (V, keep) {
    if (keep && keep.length) { V = Object.fromEntries(Object.entries(V).filter(([k]) => keep.includes(k)));
      const mb = FL.$('.mockbar'); if (mb) mb.prepend(FL.h(`<div style="margin-bottom:4px;color:#0F766E;font-weight:700">Owner’s pick, Oct 30: ${keep.map((k) => `${k}, ${FL.esc(V[k].name)}`).join(' + ')}. Round 2 shows only the pick.</div>`)); }
    const keys = Object.keys(V); const host = document.getElementById('page');
    let cur = new URLSearchParams(location.search).get('v'); if (!keys.includes(cur)) cur = keys[0];
    const bar = FL.h(`<div class="vbar"><button data-d="-1" aria-label="Previous">←</button>${keys.map((k) => `<button data-k="${k}">${k}</button>`).join('')}<span class="lbl"></span><button data-d="1" aria-label="Next">→</button><a href="index-site-audit.html">all screens</a></div>`);
    document.body.appendChild(bar);
    if (keys.length === 1) { FL.$$('button', bar).forEach((b) => (b.style.display = 'none')); }
    const show = (k) => { cur = k; const u = new URL(location); u.searchParams.set('v', k); history.replaceState(null, '', u);
      FL.$$('button[data-k]', bar).forEach((b) => b.classList.toggle('on', b.dataset.k === k));
      bar.querySelector('.lbl').textContent = `${k}: ${V[k].name}`; host.innerHTML = ''; window.scrollTo({ top: 0 }); V[k].render(host); };
    bar.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.k) show(b.dataset.k); else show(keys[(keys.indexOf(cur) + +b.dataset.d + keys.length) % keys.length]); };
    addEventListener('keydown', (e) => { if (e.target.closest('input,textarea,[contenteditable]')) return;
      if (e.key === 'ArrowRight') show(keys[(keys.indexOf(cur) + 1) % keys.length]); if (e.key === 'ArrowLeft') show(keys[(keys.indexOf(cur) - 1 + keys.length) % keys.length]); });
    show(cur);
  };
})();
</script>

   Current titles/descriptions are REAL (crawl 319). Drafts are hand-written mockup text, not model output. Cost is a sample. */
(function () {

  const raw = (u) => D.issues.flatMap((i) => i.pages).find((p) => p.url === u);
  const META = { // real meta descriptions today (crawl 319)
    '/team': "Meet the Liberty Family Dentistry dentists \u2013 Bloomington's most trusted dental team.",

    '/articles/how-dentists-can-help-your-sleep-apnea': 'Sleep apnea is a debilitating disorder - fortunately, with advancements in dental technology, the experts at Liberty Family Dentistry can help.',
  };
  const T = (url, draft) => ({ url, kind: 'title', now: raw(url)?.title ?? '', draft, h1: '' });
  const ITEMS = [
    T('/team', 'Meet Our Bloomington, IN Dentists | Liberty Family Dentistry'),
    T('/first-visit', 'Your First Visit | Liberty Family Dentistry, Bloomington'),
    T('/accessibility', 'Accessibility Statement | Liberty Family Dentistry'),
    T('/articles/5-key-questions-about-your-2019-insurance-benefits', '5 Questions About Your Dental Insurance Benefits'),
    T('/articles/breaking-down-barriers-understanding-dental-phobia-and-how-to-overcome-it', 'Dental Phobia: How to Overcome It | Bloomington, IN'),
    T('/articles/how-dental-implants-can-rejuvenate-your-smile', 'How Dental Implants Can Rejuvenate Your Smile'),
    T('/articles/botox-for-tmj-an-alternative-treatment', 'Botox for TMJ: An Alternative Treatment | Bloomington, IN'),
    T('/articles/how-dentists-can-help-your-sleep-apnea', 'How a Dentist Can Help With Sleep Apnea | Bloomington, IN'),
    { url: '/video', kind: 'description', now: '', draft: 'Watch short videos from Liberty Family Dentistry: meet the Bloomington team, tour the office and see what a first visit looks like.' },
    { url: '/video', kind: 'h1', now: '', draft: 'Videos From Our Bloomington Dental Team' },
    { url: '/team', kind: 'alt', sample: true, now: '9 of 9 images have no alt text', draft: 'Liberty Family Dentistry team at the front desk of the Bloomington office (and 8 more)' },
    { url: '/', kind: 'alt', sample: true, now: '4 of 11 images have no alt text', draft: 'Patient smiling in the chair after a cleaning at Liberty Family Dentistry (and 3 more)' },
  ];
  ITEMS.forEach((it, i) => { it.i = i; it.state = 'wait'; it.acc = false; it.skip = false; });
  const LIMIT = { title: 60, description: 160 };
  const SKIPPED = 26;
  const COST = { est: '$0.04', real: '$0.03' };
  const COSTTIP = 'The estimate comes from the number of pages and fields, per the tool cost ledger. Every run is logged with its real cost. The figures here are a sample.';
  const KIND = { title: 'Title', description: 'Description', h1: 'Heading (H1)', alt: 'Alt text' };
  const counts = () => `${ITEMS.filter((x) => x.kind === 'title').length} titles, ${ITEMS.filter((x) => x.kind === 'description').length} description, alt text on ${ITEMS.filter((x) => x.kind === 'alt').length} pages`;
  const len = (it, s) => (LIMIT[it.kind] ? `<span class="len ${s.length > LIMIT[it.kind] ? 'bad' : s ? 'ok' : ''}" data-tip-h="Length" data-tip="Google shows about ${LIMIT[it.kind]} characters of a ${it.kind}; the rest is cut off.">${s.length} of ${LIMIT[it.kind]}</span>` : '');
  let GEN = 0;

  const head = () => `<div class="s4-head"><div>
      <button class="s3-back" style="font-size:13px;color:var(--muted);border:0;background:none;padding:0;margin-bottom:10px" onclick="FL.toast('Back to the result page (screen 2).')">← Back to the audit</button>
      <div class="kick">Draft the fixes</div><h1 class="h1">Titles, descriptions and alt text, written for each page</h1>
      <p class="sub">From “Titles too long for Google”, “Pages with no description” and “Images with no alt text”. The team reads every draft before it goes anywhere.</p></div></div>`;
  const runPanel = (phase, done) => `<div class="card run"><div class="l">${phase === 'idle'
      ? `<b>${ITEMS.length} fixes to draft</b> on ${new Set(ITEMS.map((x) => x.url)).size} pages: ${counts()}.<small>${SKIPPED} pages are left out: they have no words to write from (see “Pages sharing one title”).</small>`
      : phase === 'run' ? `<b>Writing ${done} of ${ITEMS.length}</b>, page by page. Drafts appear as they are written; review can start now.<div class="prog"><i style="width:${(done / ITEMS.length) * 100}%"></i></div>`
        : `<b>${ITEMS.length} drafts ready.</b> Accept, edit or skip each one.<small class="ledger">Logged to the cost ledger: <b>${COST.real}</b> on Oct 30, 2026 ${SA.sample(COSTTIP)}</small>`}</div>
    <div class="r">${phase === 'idle' ? `<button class="btn btn-go" data-run>Draft the fixes · about ${COST.est}</button><span class="est" data-tip-h="Cost" data-tip="${COSTTIP}">estimate before running ${SA.sample(COSTTIP)}</span>` : phase === 'run' ? '<span class="est">Writing…</span>' : '<button class="btn btn-line" data-again>Draft again</button>'}</div></div>`;
  const dock = () => { const n = ITEMS.filter((x) => x.acc).length; return `<div class="dock" data-dock><span><b>${n}</b> accepted. Accepted drafts go into the Asana task body, next to each page.</span><span class="btnrow"><button class="btn btn-line" data-accall>Accept all</button><button class="btn btn-go" data-task ${n ? '' : 'disabled style="opacity:.5"'}>Put ${n} in the Asana task</button></span></div>`; };
  function stream(onTick, onDone) {
    let k = 0; const g = GEN; const step = () => { if (g !== GEN) return; if (k > 0) ITEMS[k - 1].state = 'ready'; if (k < ITEMS.length) ITEMS[k].state = 'writing'; onTick(k); if (k === ITEMS.length) return onDone(); k++; setTimeout(step, FL.reduce ? 0 : 380); };
    step();
  }
  const wireDock = (host, rerender) => {
    host.querySelector('[data-accall]')?.addEventListener('click', () => { ITEMS.forEach((x) => { if (x.state === 'ready') x.acc = true; }); rerender(); });
    host.querySelector('[data-task]')?.addEventListener('click', () => FL.toast(`${ITEMS.filter((x) => x.acc).length} drafts added to the Asana task body, each under its page.`));
  };

  /* ---------- A: before and after table ---------- */
  function renderA(host, phase = 'idle', done = 0) {
    host.innerHTML = `${head()}${runPanel(phase, done)}
      <table class="t4"><thead><tr><th style="width:26%">Page</th><th style="width:28%">Now</th><th>Draft</th><th style="width:150px"></th></tr></thead><tbody>
      ${ITEMS.map((it) => `<tr class="${it.acc ? 'on' : ''}"><td><div class="url">${E(it.url)}</div><div class="kind" style="margin-top:3px">${KIND[it.kind]}${it.sample ? SA.sample('Today’s crawl does not read images, so this row is made up.') : ''}</div></td>
        <td><div class="now ${it.now && it.kind !== 'alt' ? '' : 'empty'}">${it.now ? E(it.now) : 'none'}</div>${it.now && LIMIT[it.kind] ? `<div style="margin-top:3px">${len(it, it.now)}</div>` : ''}</td>
        <td>${it.state === 'wait' ? '<span style="color:var(--faint)">Not drafted yet</span>' : it.state === 'writing' ? '<span class="writing">Writing</span>' : `<div class="dr" data-ed="${it.i}">${E(it.draft)}</div><div style="margin-top:3px">${len(it, it.draft)}</div>`}</td>
        <td style="text-align:right">${it.state === 'ready' ? `<button class="acc ${it.acc ? 'on' : ''}" data-acc="${it.i}">${it.acc ? 'Accepted' : 'Accept'}</button><button class="lnk" data-edit="${it.i}">Edit</button>` : ''}</td></tr>`).join('')}
      </tbody></table>${phase === 'done' ? dock() : ''}`;
    const re = () => renderA(host, phase, done);
    host.querySelector('[data-run]')?.addEventListener('click', () => stream((k) => renderA(host, 'run', k), () => { phase = 'done'; renderA(host, 'done', ITEMS.length); }));
    host.querySelector('[data-again]')?.addEventListener('click', () => { reset(); renderA(host); });
    host.querySelectorAll('[data-acc]').forEach((b) => (b.onclick = () => { const it = ITEMS[+b.dataset.acc]; it.acc = !it.acc; re(); }));
    host.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => { const el = host.querySelector(`[data-ed="${b.dataset.edit}"]`); el.contentEditable = 'true'; el.focus(); el.onblur = () => { ITEMS[+b.dataset.edit].draft = el.textContent; re(); }; }));
    wireDock(host, re);
  }

  /* ---------- B: one page at a time, keyboard flow ---------- */
  let cur = 0; let keyH = null;
  function renderB(host, phase = 'idle', done = 0) {
    const it = ITEMS[cur];
    const st = (x) => (x.acc ? 'ok' : x.skip ? 'skip' : x.state === 'ready' ? 'ready' : '');
    host.innerHTML = `${head()}${runPanel(phase, done)}
      <div class="b4"><div class="q card" style="padding:8px">${ITEMS.map((x) => `<div class="${x.i === cur ? 'cur' : ''}" data-go="${x.i}"><i class="${st(x)}"></i>${KIND[x.kind]} · ${E(x.url)}</div>`).join('')}</div>
      <div><div class="card rc">
        <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="u">${E(it.url)}</span><span class="len">${cur + 1} of ${ITEMS.length}</span></div>
        <div class="ctx">${KIND[it.kind]}${it.sample ? SA.sample('Today’s crawl does not read images, so this one is made up.') : ''}</div>
        <div class="lbl"><span>Now</span>${it.now && LIMIT[it.kind] ? len(it, it.now) : ''}</div><div class="nowt">${it.now ? E(it.now) : '<i>none</i>'}</div>
        <div class="lbl"><span>Draft</span>${it.state === 'ready' ? len(it, it.draft) : ''}</div>
        <div class="drt ${it.kind !== 'title' ? 'meta' : ''}" data-ed>${it.state === 'ready' ? E(it.draft) : it.state === 'writing' ? '<span class="writing">Writing</span>' : '<span style="color:var(--faint);font-weight:400;font-size:17px">Not drafted yet</span>'}</div>
        <div class="acts">${it.state === 'ready' ? `<button class="btn btn-go" data-k="a">${it.acc ? 'Accepted' : 'Accept'}<span class="kb">A</span></button><button class="btn btn-line" data-k="e">Edit<span class="kb">E</span></button><button class="btn btn-line" data-k="s">Skip<span class="kb">S</span></button>` : ''}
          <span style="margin-left:auto" class="len">Next page <span class="kb">↓</span> Previous <span class="kb">↑</span></span></div>
      </div>${phase === 'done' ? dock() : ''}</div></div>`;
    const re = () => renderB(host, phase, done);
    host.querySelector('[data-run]')?.addEventListener('click', () => { cur = 0; stream((k) => { done = k; phase = 'run'; renderB(host, 'run', k); }, () => { phase = 'done'; done = ITEMS.length; re(); }); });
    host.querySelector('[data-again]')?.addEventListener('click', () => { reset(); cur = 0; renderB(host); });
    host.querySelectorAll('[data-go]').forEach((d) => (d.onclick = () => { cur = +d.dataset.go; re(); }));
    const act = (k) => {
      const x = ITEMS[cur]; if (k === 'next') { cur = Math.min(ITEMS.length - 1, cur + 1); return re(); } if (k === 'prev') { cur = Math.max(0, cur - 1); return re(); }
      if (x.state !== 'ready') return;
      if (k === 'a') { x.acc = true; x.skip = false; cur = Math.min(ITEMS.length - 1, cur + 1); re(); }
      if (k === 's') { x.skip = true; x.acc = false; cur = Math.min(ITEMS.length - 1, cur + 1); re(); }
      if (k === 'e') { const el = host.querySelector('[data-ed]'); el.contentEditable = 'true'; el.focus(); el.onblur = () => { x.draft = el.textContent; re(); }; }
    };
    host.querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => act(b.dataset.k)));
    if (keyH) removeEventListener('keydown', keyH);
    keyH = (e) => { if (!host.querySelector('.b4') || e.target.closest('[contenteditable=true],input,textarea')) return; const m = { a: 'a', e: 'e', s: 's', ArrowDown: 'next', ArrowUp: 'prev' }[e.key]; if (m) { e.preventDefault(); act(m); } };
    addEventListener('keydown', keyH);
    wireDock(host, re);
  }

  /* ---------- C: how each page shows in Google, before and after ---------- */
  const cut = (s, n) => (s.length > n ? `${s.slice(0, n - 3).trimEnd()} ...` : s);
  const serp = (url, title, desc) => `<div class="serp"><div class="site"><span class="fav">L</span><span>Liberty Family Dentistry<small>libertyfamilydentistry.com${url === '/' ? '' : ` › ${E(url.split('/').filter(Boolean).join(' › ')).slice(0, 48)}`}</small></span></div>
      <div class="t">${E(cut(title, 60))}</div><div class="d ${desc ? '' : 'none'}">${desc ? E(cut(desc, 158)) : 'No description, so Google picks a line from the page.'}</div></div>`;
  function renderC(host, phase = 'idle', done = 0) {
    host.innerHTML = `${head()}${runPanel(phase, done)}
      <div class="c4">${ITEMS.map((it) => {
        const known = ITEMS.find((x) => x.url === it.url && x.kind === 'title');
        const title = it.kind === 'title' ? it.now : known ? known.now : it.url === '/video' ? 'Video' : 'Liberty Family Dentistry';
        const ready = it.state === 'ready';
        const after = it.kind === 'title' ? serp(it.url, it.draft, META[it.url]) : it.kind === 'description' ? serp(it.url, title, it.draft) : '';
        const right = !ready ? `<div style="padding:22px 0;color:var(--faint)">${it.state === 'writing' ? '<span class="writing">Writing</span>' : 'Not drafted yet'}</div>`
          : it.kind === 'alt' ? `<div class="imgalt"><span class="ph"></span><p>${E(it.draft)}</p></div>` : after;
        const left = it.kind === 'alt' ? `<div class="imgalt"><span class="ph"></span><p style="color:var(--muted)">${E(it.now)}</p></div>` : serp(it.url, title, it.kind === 'description' ? '' : META[it.url]);
        return `<div class="card pair"><div class="top"><span><span class="kind">${KIND[it.kind]}</span> <span class="url" style="margin-left:6px">${E(it.url)}</span>${it.sample ? SA.sample('Today’s crawl does not read images, so this one is made up.') : ''}</span>
          <span>${ready ? `${LIMIT[it.kind] ? len(it, it.draft) : ''} <button class="acc ${it.acc ? 'on' : ''}" data-acc="${it.i}" style="margin-left:8px">${it.acc ? 'Accepted' : 'Accept'}</button><button class="lnk" data-edit="${it.i}">Edit</button>` : ''}</span></div>
          <div class="cols"><div><div class="cap">${it.kind === 'alt' ? 'Today' : 'In Google today'}</div>${left}</div><div><div class="cap">${it.kind === 'alt' ? 'With the draft' : 'With the draft'}</div><div data-ed="${it.i}">${right}</div></div></div></div>`;
      }).join('')}</div>${phase === 'done' ? dock() : ''}`;
    const re = () => renderC(host, phase, done);
    host.querySelector('[data-run]')?.addEventListener('click', () => stream((k) => renderC(host, 'run', k), () => { phase = 'done'; renderC(host, 'done', ITEMS.length); }));
    host.querySelector('[data-again]')?.addEventListener('click', () => { reset(); renderC(host); });
    host.querySelectorAll('[data-acc]').forEach((b) => (b.onclick = () => { const it = ITEMS[+b.dataset.acc]; it.acc = !it.acc; re(); }));
    host.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => {
      const it = ITEMS[+b.dataset.edit]; const box = host.querySelector(`[data-ed="${it.i}"]`);
      box.innerHTML = `<div contenteditable="true" style="font-size:15px;padding:6px">${E(it.draft)}</div>`; const el = box.firstChild; el.focus(); el.onblur = () => { it.draft = el.textContent; re(); };
    }));
    wireDock(host, re);
  }

  /* ---------- D (round 2, owner pick A + C as view options) ---------- */
  // Where each draft can go, from our code (app/routers/site_content.py publish path): static pages take only
  // title + description through Webflow's Pages API; H1 and alt text on a static page have no API field.
  // CMS items take any field the collection has. Which Liberty pages are CMS is a SAMPLE guess (/articles = blog collection).
  const isCms = (u) => u.startsWith('/articles/');
  const where = (it) => {
    const cms = isCms(it.url); const meta = it.kind === 'title' || it.kind === 'description';
    if (meta && !cms) return { k: 'app', t: 'Publishes from the app', h: 'A static page’s meta title and description go to Webflow from the app, the same way Site Content publishes them today.' };
    if (cms) return { k: 'app', t: 'Publishes from the app', h: 'This page comes from a CMS collection. The app writes the draft into the matching collection field; if the collection has no field for it, the app says so and it is done by hand.' };
    return { k: 'hand', t: 'By hand in Webflow', h: `Webflow’s Pages API has no field for a static page’s ${it.kind === 'h1' ? 'main heading' : 'image alt text'}, so the app cannot publish it. The draft goes into the Asana task and is pasted in the Webflow Designer.` };
  };
  const whereHtml = (it) => { const w = where(it); return `<span class="where ${w.k}" data-tip-h="Gets to the site" data-tip="${E(w.h)} Which pages are CMS pages here is a sample.">${w.t}</span>`; };
  let VIEW = 'table';
  const viewSeg = () => `<div class="vseg"><span>View</span><div class="seg"><button data-view="table" class="${VIEW === 'table' ? 'on' : ''}">Table</button><button data-view="google" class="${VIEW === 'google' ? 'on' : ''}">As Google shows it</button></div></div>`;
  const headD = () => `<div class="s4-head"><div>
      <button class="s3-back" style="font-size:13px;color:var(--muted);border:0;background:none;padding:0;margin-bottom:10px" onclick="FL.toast('Back to the result page (screen 2).')">← Back to the audit</button>
      <div class="kick">Draft the fixes</div><h1 class="h1">Draft meta titles, descriptions, headings and alt text</h1>
      <p class="sub">Writes only these four things for each page. It never changes the page’s text, images or layout. The team reads every draft before it goes anywhere.</p></div>${viewSeg()}</div>`;
  const runPanelD = (phase, done) => runPanel(phase, done)
    .replace(`Draft the fixes · about ${COST.est}`, `Draft titles, descriptions, headings and alt text · about ${COST.est}`)
    .replace(counts(), `${ITEMS.filter((x) => x.kind === 'title').length} meta titles, ${ITEMS.filter((x) => x.kind === 'description').length} description, ${ITEMS.filter((x) => x.kind === 'h1').length} heading, alt text on ${ITEMS.filter((x) => x.kind === 'alt').length} pages`);
  const tableD = () => `<table class="t4"><thead><tr><th style="width:24%">Page</th><th style="width:25%">Now</th><th>Draft</th><th style="width:150px">Gets to the site</th><th style="width:140px"></th></tr></thead><tbody>
      ${ITEMS.map((it) => `<tr class="${it.acc ? 'on' : ''}"><td><div class="url">${E(it.url)}</div><div class="kind" style="margin-top:3px">${KIND[it.kind]}${it.sample ? SA.sample('Today’s crawl does not read images, so this row is made up.') : ''}</div></td>
        <td><div class="now ${it.now && it.kind !== 'alt' ? '' : 'empty'}">${it.now ? E(it.now) : 'none'}</div>${it.now && LIMIT[it.kind] ? `<div style="margin-top:3px">${len(it, it.now)}</div>` : ''}</td>
        <td>${it.state === 'wait' ? '<span style="color:var(--faint)">Not drafted yet</span>' : it.state === 'writing' ? '<span class="writing">Writing</span>' : `<div class="dr ${it.kind === 'h1' ? 'h1d' : ''}" data-ed="${it.i}">${E(it.draft)}</div><div style="margin-top:3px">${len(it, it.draft)}</div>`}</td>
        <td>${whereHtml(it)}</td>
        <td style="text-align:right">${it.state === 'ready' ? `<button class="acc ${it.acc ? 'on' : ''}" data-acc="${it.i}">${it.acc ? 'Accepted' : 'Accept'}</button><button class="lnk" data-edit="${it.i}">Edit</button>` : ''}</td></tr>`).join('')}
      </tbody></table>`;
  const googleD = () => `<div class="c4">${ITEMS.map((it) => {
        const known = ITEMS.find((x) => x.url === it.url && x.kind === 'title');
        const title = it.kind === 'title' ? it.now : known ? known.now : it.url === '/video' ? 'Video' : 'Liberty Family Dentistry';
        const ready = it.state === 'ready';
        const onPage = it.kind === 'alt' || it.kind === 'h1';
        const block = (txt, muted) => (it.kind === 'h1' ? `<div class="h1prev ${muted ? 'none' : ''}">${muted ? 'No main heading on the page' : E(txt)}</div>` : `<div class="imgalt"><span class="ph"></span><p ${muted ? 'style="color:var(--muted)"' : ''}>${E(txt)}</p></div>`);
        const after = it.kind === 'title' ? serp(it.url, it.draft, META[it.url]) : it.kind === 'description' ? serp(it.url, title, it.draft) : block(it.draft, false);
        const right = !ready ? `<div style="padding:22px 0;color:var(--faint)">${it.state === 'writing' ? '<span class="writing">Writing</span>' : 'Not drafted yet'}</div>` : after;
        const left = onPage ? block(it.now, true) : serp(it.url, title, it.kind === 'description' ? '' : META[it.url]);
        return `<div class="card pair"><div class="top"><span><span class="kind">${KIND[it.kind]}</span> <span class="url" style="margin-left:6px">${E(it.url)}</span>${it.sample ? SA.sample('Today’s crawl does not read images, so this one is made up.') : ''}<span style="margin-left:10px">${whereHtml(it)}</span></span>
          <span>${ready ? `${LIMIT[it.kind] ? len(it, it.draft) : ''} <button class="acc ${it.acc ? 'on' : ''}" data-acc="${it.i}" style="margin-left:8px">${it.acc ? 'Accepted' : 'Accept'}</button><button class="lnk" data-edit="${it.i}">Edit</button>` : ''}</span></div>
          <div class="cols"><div><div class="cap">${onPage ? 'On the page today' : 'In Google today'}</div>${left}</div><div><div class="cap">With the draft</div><div data-ed="${it.i}">${right}</div></div></div></div>`;
      }).join('')}</div>`;
  let PH = 'idle'; let DONE = 0;
  function renderD(host) {
    host.innerHTML = `${headD()}${runPanelD(PH, DONE)}${VIEW === 'table' ? tableD() : googleD()}${PH === 'done' ? dock() : ''}`;
    const re = () => renderD(host);
    host.querySelectorAll('[data-view]').forEach((b) => (b.onclick = () => { VIEW = b.dataset.view; re(); }));
    host.querySelector('[data-run]')?.addEventListener('click', () => stream((k) => { PH = 'run'; DONE = k; re(); }, () => { PH = 'done'; DONE = ITEMS.length; re(); }));
    host.querySelector('[data-again]')?.addEventListener('click', () => { reset(); PH = 'idle'; DONE = 0; re(); });
    host.querySelectorAll('[data-acc]').forEach((b) => (b.onclick = () => { const it = ITEMS[+b.dataset.acc]; it.acc = !it.acc; re(); }));
    host.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => {
      const it = ITEMS[+b.dataset.edit]; let el = host.querySelector(`[data-ed="${it.i}"]`);
      if (VIEW === 'google') { el.innerHTML = `<div contenteditable="true" style="font-size:15px;padding:6px">${E(it.draft)}</div>`; el = el.firstChild; } else el.contentEditable = 'true';
      el.focus(); el.onblur = () => { it.draft = el.textContent; re(); };
    }));
    wireDock(host, re);
  }

  window.SCREEN = {
    title: 'Site Audit 4: Draft the fixes',
    keep: ['D'],
    mock: `<b>Site Audit · Screen 4 · Draft meta titles, descriptions, headings and alt text · round 2</b> <span class="src">· data: Liberty Family Dentistry, crawl of Oct 22, 2026 (real titles and descriptions as they are today). Press the draft button to watch the drafts arrive page by page.</span>
<ul><li><b>Owner pick 10/30: A + C as two views</b> of one run (Table, As Google shows it); accepting or editing in one view carries to the other. Scope says it plainly in the title, the line under it and the button: meta titles, descriptions, headings (H1, added 10/30) and alt text, nothing else.</li>
<li><b>Gets to the site</b>, checked in our code (Site Content’s publish path): a static page’s meta title and description publish from the app; its H1 and alt text cannot (Webflow’s Pages API has no field for them), so those are done by hand in the Webflow Designer. CMS pages publish any field their collection has.</li></ul>
<span class="nr">Drafts are hand-written mockup text, not model output. Cost (about ${COST.est} before, ${COST.real} logged after) is a sample. Which Liberty pages are CMS pages is a sample (articles shown as CMS). Alt text rows are samples (today’s crawl does not read images). Only one real page lacks an H1 and has words (/video); the other 26 are the empty stubs, left out of drafting (proposal). Accepted drafts go into the Asana task; publishing straight to Webflow (as Site Content does today) is an open question for the owner.</span>`,
    variants: {
      A: { name: 'Before and after table', render: (h) => { reset(); renderA(h); } },
      B: { name: 'One page at a time', render: (h) => { reset(); cur = 0; renderB(h); } },
      C: { name: 'As Google shows it', render: (h) => { reset(); renderC(h); } },
      D: { name: 'Table or As Google shows it', render: (h) => { reset(); PH = 'idle'; DONE = 0; VIEW = 'table'; renderD(h); } },
    },
  };
})();
</script>
<script>const KEEP={"s1": ["C"], "s2": ["B"], "s6": ["A"], "s7": ["A"]};</script>
<script>SA.shell({ mock: window.SCREEN.mock, right: window.SCREEN.right }); SA.variants(window.SCREEN.variants, window.SCREEN.keep || KEEP['s4']);</script>
</body></html>
