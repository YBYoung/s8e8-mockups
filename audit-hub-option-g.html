<!--
  Audit Hub redesign mockup : OPTION G "Hub", extended (wayfinder #745).
  The Ledger x Navigator x Lanes mix, now at realistic program scale:
  - 40 enrolled clients (the real hub will show every enrolled client), so the
    register's scroll behavior, lane counts, and scanning hold up under load.
  - All counts (header sentence, lane badges) computed from the data array.
  - Live: lane switching, row selection, arrow keys, search, tier filter.
  - NEW: bulk data connections in the Data health lane. Multi-select clients
    with checkboxes (or "Select all with issues"), and the right pane becomes
    the bulk-connect window: per-source gap summary, per-client missing list,
    one Google connect flow for the lot. Multi-select lives ONLY in Data
    health; other lanes stay single-select triage.
  Palette: exec ink on neutral paper, color as ink only. System sans.
-->
<title>Audit Hub redesign · Option G · Hub</title>
<style>
.audit-app{
  --paper:#F5F6F8; --card:#FFFFFF; --line:#E6E8EE; --line-soft:#EEF0F4;
  --ink:#0E1116; --sub:#4A5163; --muted:#8A91A2; --faint:#D3D7DF;
  --red:#C25E55; --red-soft:#FBE7E5;
  --green:#3C8F6E; --steady:#256E9C;
  --chip:#F2F4F8;
  --shadow:0 1px 2px rgba(17,20,28,.05);
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  background:var(--paper); color:var(--ink); font-family:var(--body);
  min-height:100vh; margin:-8px; padding-bottom:60px;
}
.audit-app[data-theme="dark"]{
  --paper:#0F1115; --card:#171A20; --line:#262A33; --line-soft:#20242C;
  --ink:#EDEFF3; --sub:#AEB4C2; --muted:#767D8D; --faint:#3A4050;
  --red:#D0766B; --red-soft:#2E1917;
  --green:#4DAE87; --steady:#7CC0E8;
  --chip:#1E222A;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
@media (prefers-color-scheme:dark){
  .audit-app:not([data-theme="light"]){
    --paper:#0F1115; --card:#171A20; --line:#262A33; --line-soft:#20242C;
    --ink:#EDEFF3; --sub:#AEB4C2; --muted:#767D8D; --faint:#3A4050;
    --red:#D0766B; --red-soft:#2E1917;
    --green:#4DAE87; --steady:#7CC0E8;
    --chip:#1E222A;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
.audit-app *{box-sizing:border-box}
.audit-app .num{font-variant-numeric:tabular-nums}

/* mockup banner + option switcher (not part of the shipped page) */
.audit-app .mockstrip{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--chip);color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-size:9px;font-weight:600;text-align:center;padding:6px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.audit-app .mockstrip a{color:var(--sub);text-decoration:none;padding:1px 6px;border-radius:4px}
.audit-app .mockstrip a:hover{color:var(--ink);background:var(--card)}
.audit-app .mockstrip a.here{color:var(--ink);background:var(--card);box-shadow:var(--shadow)}

.audit-app .col{max-width:1360px;margin:0 auto;width:100%;padding:0 30px}
@media(max-width:880px){.audit-app .col{padding:0 16px}}

/* header */
.audit-app .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:26px 0 14px;border-bottom:2px solid var(--ink)}
.audit-app .hd h1{font:600 20px/1.15 var(--body);letter-spacing:-.005em;margin:0}
.audit-app .hd .meta{margin-top:6px;font-size:13px;color:var(--sub);max-width:640px;line-height:1.5}
.audit-app .hd .meta b{color:var(--ink);font-weight:600}
.audit-app .hd .meta .redink{color:var(--red);font-weight:600}
.audit-app .hd-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.audit-app .btn{font-family:var(--body);font-size:13px;font-weight:600;border-radius:5px;padding:7px 14px;cursor:pointer;border:1px solid transparent}
.audit-app .btn.ghost{background:var(--card);border-color:var(--line);color:var(--sub)}
.audit-app .btn.ghost:hover{color:var(--ink);border-color:var(--muted)}
.audit-app .btn.dark{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.audit-app .btn.dark:hover{opacity:.9}
.audit-app .btn.mini{font-size:11.5px;padding:5px 11px}
.audit-app .btn:focus-visible{outline:2px solid var(--sub);outline-offset:1px}
.audit-app .themebtn{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:5px;padding:6px 10px;cursor:pointer}
.audit-app .themebtn:hover{color:var(--ink);border-color:var(--muted)}

/* the split: 45% register, 55% pane */
.audit-app .split{display:grid;grid-template-columns:45% 1fr;gap:20px;align-items:start;padding-top:16px}
@media(max-width:980px){.audit-app .split{grid-template-columns:1fr}}

/* lanes control */
.audit-app .lanes{display:inline-flex;background:var(--chip);border-radius:6px;padding:3px;gap:2px;flex-wrap:wrap}
.audit-app .lanes button{font-family:var(--body);font-size:12.5px;font-weight:600;border:0;background:transparent;color:var(--sub);padding:6px 12px;border-radius:5px;cursor:pointer}
.audit-app .lanes button:hover:not(.on){color:var(--ink)}
.audit-app .lanes button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.audit-app .lanes .n{margin-left:5px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.audit-app .lanes button.on .n{color:var(--sub)}
.audit-app .lanes .n.redink{color:var(--red);font-weight:700}
.audit-app .lanetools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.audit-app .lanetools .search{flex:1 1 130px;min-width:110px;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--ink);padding:6px 9px;font:400 12.5px/1.2 var(--body)}
.audit-app .lanetools .search::placeholder{color:var(--muted)}
.audit-app .fsel{border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--sub);padding:6px 7px;font:600 11.5px/1.2 var(--body);max-width:150px}
.audit-app .lanehint{font-size:11.5px;color:var(--muted);margin:0 0 8px}
.audit-app .lanehint .paneax{margin-left:6px}
.audit-app .count{font-size:11.5px;color:var(--muted);margin-left:auto}

/* bulk bar (Data health multi-select) */
.audit-app .bulkbar{display:none;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);padding:8px 12px;margin:0 0 8px;font-size:12.5px;color:var(--sub);flex-wrap:wrap}
.audit-app .bulkbar.shown{display:flex}
.audit-app .bulkbar b{color:var(--ink)}
.audit-app .bulkbar .gap{color:var(--red);font-weight:600}

/* the register (left) */
.audit-app .tcard{background:var(--card);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);overflow:hidden}
.audit-app .tscroll{overflow-x:auto}
.audit-app table.ht{width:100%;border-collapse:collapse}
.audit-app .ht thead th{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 9px;border-bottom:1px solid var(--ink);white-space:nowrap;background:var(--card);position:sticky;top:0;z-index:2}
.audit-app .ht thead th:first-child{padding-left:14px}
.audit-app .ht thead th.r{text-align:right}
.audit-app .ht tbody tr{border-bottom:1px solid var(--line-soft);cursor:pointer}
.audit-app .ht tbody tr:hover{background:var(--paper)}
.audit-app .ht tbody tr.sel{background:var(--chip)}
.audit-app .ht tbody tr.sel .cname{font-weight:700}
.audit-app .ht td{padding:10px 9px;font-size:12.5px;vertical-align:middle}
.audit-app .ht td:first-child{padding-left:14px}
.audit-app .ht td.r{text-align:right;white-space:nowrap}
.audit-app .ht .ck{width:26px;padding-right:0}
.audit-app .ht .ck input{accent-color:var(--ink);cursor:pointer}
.audit-app .idx{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;width:20px}
.audit-app .cname{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.audit-app .ctier{margin-top:1px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.audit-app .st{font-size:12px;line-height:1.4;color:var(--sub)}
.audit-app .st.redink{color:var(--red)}
.audit-app .st.redink b{color:var(--red)}
.audit-app .st.blueink{color:var(--steady)}
.audit-app .st b{color:var(--ink);font-weight:600}
.audit-app td .due{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.audit-app td .due.redink{color:var(--red);font-weight:600}
.audit-app td .due.dim{color:var(--muted)}

/* connection dots: GA4 GSC GBP at a glance, every lane */
.audit-app .dots{display:inline-flex;gap:4px;align-items:center;vertical-align:middle}
.audit-app .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.audit-app .dot.off{background:transparent;border:1.5px solid var(--red);width:6px;height:6px}
.audit-app .wk{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px}
.audit-app .wk.redink{color:var(--red);font-weight:700}

/* cycle bar (Schedule lane) */
.audit-app .cyc-bar{position:relative;height:3px;border-radius:2px;background:var(--line);min-width:80px}
.audit-app .cyc-bar .done{position:absolute;left:0;top:0;bottom:0;background:var(--faint);border-radius:2px}
.audit-app .cyc-bar .today{position:absolute;top:50%;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;background:var(--ink)}
.audit-app .cyc-bar.over .done{background:var(--red);opacity:.5}
.audit-app .cyc-bar.over .today{background:var(--red)}
.audit-app .cyc-bar.none{background:transparent;border-top:2px dashed var(--faint);height:0;border-radius:0}
.audit-app .ok{color:var(--green);font-size:11.5px;white-space:nowrap}
.audit-app .nok{color:var(--red);font-size:11.5px;white-space:nowrap;font-weight:600}
.audit-app .modew{font-size:11px;color:var(--muted)}

/* linking row at the foot of Needs action */
.audit-app .linkrow td{padding:9px 14px;font-size:12px;color:var(--sub)}
.audit-app .linkrow .cnt{color:var(--red);font-weight:700;margin-right:6px}
.audit-app .foot-hint{padding:9px 14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted)}
.audit-app .foot-hint b{color:var(--sub);font-weight:600}

/* the detail pane (right), sticky */
.audit-app .pane{position:sticky;top:14px;background:var(--card);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);padding:20px 24px 22px;max-height:calc(100vh - 28px);overflow-y:auto}
@media(max-width:980px){.audit-app .pane{position:static;max-height:none}}
.audit-app .pane h2{font:600 17px/1.2 var(--body);margin:0}
.audit-app .psum{margin-top:5px;font-size:12.5px;color:var(--sub);line-height:1.5}
.audit-app .psum b{color:var(--ink);font-weight:600}
.audit-app .psum .redink{color:var(--red);font-weight:600}
.audit-app .psum .seen{color:var(--green)}
.audit-app .pbtns{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.audit-app .psec{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 8px;padding-top:14px;border-top:1px solid var(--line-soft)}
.audit-app .pstory{font-size:13px;color:var(--sub);line-height:1.6;margin:0}
.audit-app .pstory b{color:var(--ink)}
.audit-app .pstory .redink{color:var(--red);font-weight:600}
.audit-app .ptoggle{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;color:var(--sub)}
.audit-app .ptoggle b{color:var(--ink)}
.audit-app .switch{width:30px;height:17px;border-radius:17px;background:var(--faint);position:relative;transition:background .15s;flex:none;display:inline-block;cursor:pointer}
.audit-app .switch i{position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.audit-app .switch.on{background:var(--green)}
.audit-app .switch.on i{left:15px}
.audit-app .pcols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media(max-width:1120px){.audit-app .pcols{grid-template-columns:1fr}}
.audit-app .pline{display:flex;align-items:baseline;gap:10px;padding:4px 0;font-size:12.5px}
.audit-app .pline .k{color:var(--muted);width:58px;flex:none;font-size:11.5px}
.audit-app .pline .v{color:var(--sub)}
.audit-app .pline .v b{color:var(--ink);font-weight:600}
.audit-app .pline .v .seen{color:var(--green)}
.audit-app .pline .okv{margin-left:auto}
.audit-app .plinks{margin-top:14px;font-size:11.5px;color:var(--muted)}
.audit-app .plinks a{color:var(--sub);text-decoration:underline;text-underline-offset:2px}
.audit-app .plinks a:hover{color:var(--ink)}
.audit-app .paneax{color:var(--sub);text-decoration:underline;text-underline-offset:2px;font-size:11.5px;cursor:pointer}
.audit-app .paneax:hover{color:var(--ink)}
/* bulk pane rows */
.audit-app .bl{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.audit-app .bl:last-of-type{border-bottom:0}
.audit-app .bl .nm{color:var(--ink);font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.audit-app .bl .miss{color:var(--red);font-weight:600;font-size:11.5px;white-space:nowrap}
.audit-app .bl .full{color:var(--green);font-size:11.5px;white-space:nowrap}
.audit-app .bl .rm{color:var(--muted);cursor:pointer;font-size:12px}
.audit-app .bl .rm:hover{color:var(--ink)}

@media (prefers-reduced-motion:reduce){
  .audit-app .switch,.audit-app .switch i{transition:none}
}
</style>

<script>
(function () {
  var app = document.getElementById('app');
  document.getElementById('themebtn').addEventListener('click', function () {
    var cur = app.getAttribute('data-theme');
    var dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
    app.setAttribute('data-theme', dark ? 'light' : 'dark');
  });

  // ---- data: one array drives everything. 40 clients. ----
  function slug(n) { return n.toLowerCase().replace(/[^a-z0-9]+/g, ''); }
  function mkOk(name, tier, who, gen, due, pct, w, lastDate, viewed) {
    return {
      id: slug(name), name: name, tier: tier, who: who, kind: 'ok',
      line: 'Draft generates ' + gen, due: due, dueRed: '',
      cyc: {pct: pct}, last: 'Sent ' + lastDate, viewed: viewed,
      w: {ga4: w, gsc: w, gbp: w}, conn: {ga4: 1, gsc: 1, gbp: 1},
      qoq: w >= 16, yoy: w >= 52, auto: true,
      sum: tier + ' · <b>' + who + '</b> (Asana) · due <b>' + due + '</b> · last audit sent ' + lastDate +
        (viewed ? ', <span class="seen">viewed</span>' : ', not yet viewed'),
      story: 'The draft generates <b>' + gen + '</b>. Data is ' + (w >= 52 ? 'ready at ' + w + ' weeks.' :
        (w >= 16 ? 'QoQ-ready at ' + w + ' weeks; YoY comparisons need 52 or more.' : 'thin at ' + w + ' weeks.')),
      acts: [],
      hist: [['Q2 2026', 'Sent ' + lastDate, viewed ? 'viewed' : 'not yet viewed']]
    };
  }

  var C = [
    // ---- the detailed dozen ----
    {id:'allure', name:'Allure Dental', tier:'Market Leader', who:'Jessica Nguyen', kind:'blocked',
     prob:'<b>Blocked:</b> Q2 draft unsent 16 days.', line:'Q2 draft unsent 16 days', due:'Jul 12', dueRed:'16d over',
     cyc:{pct:100, over:true}, last:'Draft · Jul 12', viewed:null,
     w:{ga4:61,gsc:64,gbp:61}, conn:{ga4:1,gsc:1,gbp:1}, qoq:true, yoy:true,
     draft:{gen:'Jul 12', wait:16}, auto:true,
     sum:'Market Leader · <b>Jessica Nguyen</b> (Asana) · <span class="redink">due Jul 12, 16 days over</span> · last audit sent Apr 3, <span class="seen">viewed</span>',
     story:'The Q2 draft was generated <b>Jul 12</b>, three days before its Asana due date, and has been <span class="redink">waiting 16 days</span> for review. Sending or archiving it lets Q3 schedule normally.',
     acts:[['Review & send draft',1],['Archive draft',0]],
     hist:[['Q2 2026','<b>Draft</b> · Jul 12',''],['Q1 2026','Sent Apr 3','viewed Apr 5'],['Q4 2025','Sent Jan 6','viewed Jan 6'],['Q3 2025','Sent Oct 2','viewed Oct 4']]},
    {id:'kent', name:'Kent Station Dental', tier:'Essential', who:'Soleil Parra', kind:'blocked',
     prob:'<b>Failing:</b> generation failed 3 times, last Jul 26.', line:'Generation failing, 3 tries', due:'Jul 30', dueRed:'failing',
     cyc:{pct:97, over:true}, last:'Sent Apr 2', viewed:true,
     w:{ga4:55,gsc:55,gbp:55}, conn:{ga4:1,gsc:1,gbp:1}, qoq:true, yoy:true, auto:true,
     sum:'Essential · <b>Soleil Parra</b> (Asana) · <span class="redink">due Jul 30, failing</span> · last audit sent Apr 2, <span class="seen">viewed</span>',
     story:'Generation has <span class="redink">failed 3 times</span>, most recently Jul 26. The task is due <b>Jul 30</b>. Retrying from the error detail usually clears transient API failures.',
     acts:[['View error & retry',1],['Open in Asana',0]],

    {id:'plumb', name:'Plumb Dental', tier:'Performance', who:'Tanya Yeauger', kind:'blocked',
     prob:'<b>Gap:</b> enrolled, no open Asana task.', line:'Enrolled, no open Asana task', due:'', dueRed:'no task',

      '<div class="psec">Data</div>' + dline('ga4', 'GA4') + dline('gsc', 'GSC') + dline('gbp', 'GBP') +
      '<div class="pcols" style="margin-top:4px">' +
        '<div><div class="psec">Team</div>' +
          '<div class="pline"><span class="k">Asana</span><span class="v">' + c.who + '</span></div>' +
          '<div class="pline"><span class="k">SEO</span><span class="v">Tanya Yeauger</span></div>' +
          '<div class="pline"><span class="k">MS</span><span class="v">Soleil Parra</span></div></div>' +
        '<div><div class="psec">History</div>' +
          (c.hist.length ? c.hist.map(function (h) {
            return '<div class="pline"><span class="k">' + h[0] + '</span><span class="v">' + h[1] +
              (h[2] ? (h[2].indexOf('viewed') === 0 ? ' · <span class="seen">' + h[2] + '</span>' : ' · ' + h[2]) : '') + '</span></div>';
          }).join('') : '<div class="pline"><span class="v" style="color:var(--muted)">No audits yet</span></div>') + '</div>' +
      '</div>' +
      '<div class="plinks"><a href="#">View in Asana ↗</a> · <a href="#">Open Report Editor ↗</a></div>';
  }
  function renderPane() {
    if (lane.bulk && bulkSel.size > 0) {
      paneEl.innerHTML = paneBulk();
      var pc = document.getElementById('paneclear');
      if (pc) pc.addEventListener('click', function () {
        bulkSel.clear(); renderTable(); renderBulkbar(); renderPane();
      });
      paneEl.querySelectorAll('[data-rm]').forEach(function (x) {
        x.addEventListener('click', function () {
          bulkSel.delete(x.dataset.rm); renderTable(); renderBulkbar(); renderPane();
        });
      });
      return;
    }
    paneEl.innerHTML = paneFor(sel === '_link' ? {id:'_link'} : byId[sel]);
    paneEl.querySelectorAll('.switch').forEach(function (s) {
      s.addEventListener('click', function () { s.classList.toggle('on'); });
    });
  }
  function renderAll() { renderLanes(); renderTable(); renderBulkbar(); renderPane(); }

  lanesEl.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    lane = LANES.filter(function (l) { return l.key === b.dataset.k; })[0];
    var ids = visibleRows().map(function (c) { return c.id; });
    if (ids.indexOf(sel) === -1 && sel !== '_link' && ids.length) sel = ids[0];
    renderAll();
  });
  tbody.addEventListener('click', function (e) {
    var ck = e.target.closest('input[data-ck]');
    if (ck) {
      if (ck.checked) bulkSel.add(ck.dataset.ck); else bulkSel.delete(ck.dataset.ck);
      renderBulkbar(); renderPane();
      return;
    }
    var tr = e.target.closest('tr'); if (!tr) return;
    sel = tr.dataset.id; renderTable(); renderPane();
  });
  document.getElementById('search').addEventListener('input', function (e) {
    q = e.target.value.trim().toLowerCase(); renderTable();
  });
  document.getElementById('tiersel').addEventListener('change', function (e) {
    tier = e.target.value; renderTable();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    e.preventDefault();
    var ids = visibleRows().map(function (c) { return c.id; });
    if (lane.linkingRow && !q && !tier) ids.push('_link');
    var i = ids.indexOf(sel);
    var next = e.key === 'ArrowDown' ? Math.min(ids.length - 1, i + 1) : Math.max(0, i - 1);
    sel = ids[next]; renderTable(); renderPane();
    var row = tbody.querySelector('tr.sel'); if (row) row.scrollIntoView({block:'nearest'});
  });

  renderAll();
})();
</script>
