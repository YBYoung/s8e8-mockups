* { box-sizing: border-box; }
html, body { height: 100%; }

main { display: grid; place-items: center; padding: 24px 16px; }
.card { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 32px; text-align: center; }
h1 { margin: 0; font-size: 19px; font-weight: 700; }
p { margin: 8px 0 0; color: var(--body); font-size: 14px; }
input { margin-top: 20px; width: 100%; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); padding: 12px 8px; text-align: center; font: 600 19px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; }
input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
button { margin-top: 12px; width: 100%; border: 0; border-radius: 6px; background: var(--ink); color: var(--bg); padding: 12px; font: 600 15px inherit; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.err { color: var(--bad); font-size: 13px; min-height: 20px; margin-top: 10px; }
.fine { font-size: 12.5px; margin-top: 14px; }
