<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Visibility Tracking C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="ai-visibility-tracking-common.js"></script>
<style>
.hero { padding:56px 0 18px; }
.chartwrap { border:1px solid var(--line); border-radius:12px; padding:18px 20px 12px; margin:22px 0 8px; }
.chartbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:6px; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; padding:3px; gap:2px; }
.seg button { background:none; border:0; border-radius:6px; padding:6px 12px; font-size:13px; font-weight:600; color:var(--muted); }
.seg button.on { background:var(--a-tint); color:var(--a-ink); }
.key { display:flex; flex-wrap:wrap; gap:16px; font-size:12.5px; color:var(--muted); margin-top:4px; }
.key i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
.sec { padding:44px 0 6px; }
.card { display:grid; grid-template-columns:34px minmax(0,1fr) 300px; gap:18px; align-items:start; border-top:1px solid var(--line); padding:24px 0; }
.arrow { width:30px; height:30px; border-radius:8px; display:grid; place-items:center; font-weight:800; }
.arrow.up { background:var(--up-tint); color:var(--up); } .arrow.rival { background:var(--rose-tint); color:var(--rose); } .arrow.method { background:var(--soft); color:var(--muted); }
.card h3 { margin:2px 0 6px; font:800 20px/1.3 Inter; color:var(--ink); letter-spacing:-.01em; }
.card p { margin:0 0 8px; max-width:560px; }
.card .links { display:flex; gap:18px; font-size:14px; }
.steady { border-top:1px solid var(--line); padding:18px 0; }
.steady summary { cursor:pointer; font-weight:700; color:var(--ink); list-style:none; } .steady summary::-webkit-details-marker { display:none; }
.steady summary span { color:var(--a-ink); font-weight:600; margin-left:8px; }
.srow { display:grid; grid-template-columns:160px 1fr 120px; gap:14px; align-items:center; padding:9px 0; border-bottom:1px solid #F2F4F7; font-size:14px; }
.miss { background:var(--soft); border-radius:12px; padding:22px 24px; display:flex; justify-content:space-between; align-items:center; gap:20px; margin-top:12px; }
.foot { margin-top:40px; padding-top:16px; border-top:1px solid var(--line); display:flex; justify-content:space-between; font-size:13.5px; color:var(--muted); }
@media (max-width:900px) { .card { grid-template-columns:34px 1fr; } .card .mini { grid-column:2; } }
</style>
</head>
<body>
<div id="top"></div>
<main class="shell" id="pane"></main>
<script>
const T = window.TRK;
T.topbar(document.getElementById('top'), { mock: 'C, What changed' });
const pane = document.getElementById('pane');
const N = T.ANSWERS_PER_WEEK;
const veneers = T.SERVICES.find((s) => s.name === 'Veneers');
const smile = T.RIVALS.find((r) => r.name === 'Smile Cape Coral'), me = T.RIVALS[0];
const steady = T.SERVICES.filter((s) => !['Veneers', 'Emergency'].includes(s.name));

function full() {
  const first = T.OVERALL[0], last = T.OVERALL[T.OVERALL.length - 1], [lo, hi] = T.range(last, N);
  pane.innerHTML = `
  <section class="hero"><div class="eyebrow">Tracking · 8 weeks · updated this morning</div>
    <h1 class="big">AI names ${T.PRACTICE} more often than when tracking started: <span class="grad">about 4 in every 10 answers</span>, up from 3.</h1>
    <p class="lede">The week of Dec 20, AI named it <span class="tip">${lo} to ${hi} times in every 100<span class="tipbox">${T.rangeTip(last, N)}</span></span> answers. In the first week it was ${T.range(first, N).join(' to ')}. The two ranges don't overlap, so this is a real rise, not a lucky week.</p>
    <div class="chartwrap"><div class="chartbar"><div class="eyebrow grey">Each week, out of every 10 answers</div>
      <div class="seg"><button class="on" data-v="all">All AIs</button><button data-v="each">Each AI</button></div></div>
      <div id="main"></div>
      <div class="key" id="key"></div></div>
  </section>
  <section class="sec"><div class="eyebrow">What moved</div><h2 class="mid">Two real changes, and one that only looks like one.</h2>
    ${card('up', '↑', `Veneers: AI now names ${T.PRACTICE} in about 6 in every 10 answers, up from 2.`,
      `It started the week after the veneers page went live on Nov 27. Gemini and AI Mode moved most; both now quote the page's own wording on natural-looking results.`,
      ['See the veneers answers', 'Open the page'], 'm1')}
    ${card('rival', '↑', `Smile Cape Coral is gaining: about 6 of every 100 times AI names a dentist, up from 4.`,
      `Most of its gain is on sedation questions, where AI now lists it right next to ${T.PRACTICE}. ${T.PRACTICE} is still named most, about 10 of every 100.`,
      ['See the sedation answers', 'Compare in Insights'], 'm2')}
    ${card('method', '↓', `Perplexity dipped on Dec 7, for every practice at once.`,
      `Perplexity moved to a newer version of its search that day. Every practice's Perplexity line dropped the same week, so it is a change in how Perplexity answers, not in how it sees ${T.PRACTICE}. The grey flag marks it; weeks after the flag are compared with each other.`,
      ['What changed at Perplexity'], 'm3')}
  </section>
  <section class="sec"><div class="eyebrow grey">Held steady</div>
    <details class="steady"><summary>${steady.length} services held steady<span>Show them ↓</span></summary>
      ${steady.map((s) => `<div class="srow"><b style="color:var(--ink)">${s.name}</b><div class="sp" data-s="${s.name}"></div><span class="small" style="text-align:right">${T.inTen(s.w[7])}</span></div>`).join('')}
    </details>
    <div class="miss"><div><div class="eyebrow" style="color:var(--down)">Still missing</div><h3 style="margin:6px 0 4px;font:800 20px Inter;color:var(--ink)">Emergency questions: about 0 in every 10, all 8 weeks.</h3>
      <p class="small" style="margin:0">"I cracked a tooth, who can see me fast in Cape Coral?" AI names Coast Dental Cape Coral and Cape Dental Care instead.</p></div>
      <button class="btn go">Plan an emergency page</button></div>
  </section>
  <div class="foot"><span>Next asks this evening at 6 · 30 questions on 5 AIs</span><span>$27.80 spent this month, about $${T.PRICE} a month · <a href="#">Stop tracking</a></span></div>`;
  drawMain('all');
  pane.querySelector('.seg').onclick = (e) => { const v = e.target.dataset.v; if (!v) return; pane.querySelectorAll('.seg button').forEach((b) => b.classList.toggle('on', b.dataset.v === v)); drawMain(v); };
  T.trend(pane.querySelector('#m1'), { lines: [{ name: 'Veneers', w: veneers.w, color: '#4F46E5', lead: true }], n: 3 * 5 * 14, height: 170, mini: true, markers: T.MARKERS.filter((m) => m.kind === 'work'), max: 70 });
  T.trend(pane.querySelector('#m2'), { lines: [{ name: T.PRACTICE, w: me.w.map((v) => v / 10), color: '#4F46E5' }, { name: 'Smile Cape Coral', w: smile.w.map((v) => v / 10), color: '#DB2777', lead: true }], n: 2400, height: 170, mini: true, markers: [], max: 14,
    fmt: (v) => `about ${Math.round(v)} of every 100 dentist mentions`, axis: (v) => `${Math.round(v)} of 100`, unit: 'times AI named a dentist' });
  pane.querySelector('#m2').insertAdjacentHTML('beforeend', `<div class="key"><span><i style="background:#4F46E5;border-radius:50%"></i>${T.PRACTICE}</span><span><i style="background:#DB2777;border-radius:50%"></i>Smile Cape Coral</span></div>`);
  T.trend(pane.querySelector('#m3'), { lines: [{ name: 'Perplexity', w: T.AIS[4].w, color: '#64748B', lead: true }], n: 378, height: 170, mini: true, markers: T.MARKERS.filter((m) => m.kind === 'method'), max: 60 });
  pane.querySelectorAll('.sp').forEach((el) => { const s = T.SERVICES.find((x) => x.name === el.dataset.s); el.innerHTML = spark(s.w); });
}

function card(kind, arrow, title, text, links, id) {
  return `<div class="card"><span class="arrow ${kind}">${arrow}</span><div><h3>${title}</h3><p>${text}</p>
    <div class="links">${links.map((l) => `<a href="#">${l} →</a>`).join('')}</div></div><div class="mini" id="${id}"></div></div>`;
}
function spark(w) {
  const x = (i) => 4 + i * 30, y = (v) => 26 - (v / 80) * 22;
  return `<svg viewBox="0 0 220 30" style="width:220px;height:30px"><polyline points="${w.map((v, i) => `${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="#A5B4FC" stroke-width="2"/>${w.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="#4F46E5"/>`).join('')}</svg>`;
}
function drawMain(v) {
  const el = pane.querySelector('#main'), key = pane.querySelector('#key');
  if (v === 'all') {
    T.trend(el, { lines: [{ name: 'All five AIs', w: T.OVERALL, color: '#4F46E5', lead: true }], n: N, days: T.days(T.OVERALL, 6), max: 60 });
    key.innerHTML = `<span><i style="background:#4F46E5"></i>Each week</span><span><i style="background:#C7CBF5;border-radius:50%"></i>Each day (too few answers to read alone)</span><span><i style="background:#E0E3FF"></i>Likely range</span><span><i style="background:#4F46E5"></i>Work we did</span><span><i style="background:#98A2B3"></i>An AI changed how it answers</span>`;
  } else {
    T.trend(el, { lines: T.AIS.map((a, i) => ({ name: a.name, w: a.w, color: a.dot, lead: i === 0, band: '#F2F4F7' })), n: 378, max: 60 });
    key.innerHTML = T.AIS.map((a) => `<span><i style="background:${a.dot};border-radius:50%"></i>${a.name}: ${T.inTen(a.w[7])}</span>`).join('');
  }
}

T.stateBar([['off', 'Not tracking'], ['first', 'Day 3'], ['full', '8 weeks in']], 'full', (k) => {
  document.querySelector('[data-live]').hidden = k === 'off';
  if (k === 'off') { pane.innerHTML = T.startCard(); pane.querySelector('[data-start]').onclick = () => document.querySelector('.statebar [data-k="first"]').click(); }
  else if (k === 'first') pane.innerHTML = T.firstDays();
  else full();
});
</script>
</body>
</html>
