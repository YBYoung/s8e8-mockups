<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Crawl progress 2: checking the domain, every named cause</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>.oq-rail{position:fixed;inset:0 auto 0 0;width:56px;background:#fff;border-right:1px solid rgba(231,229,228,.6);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px;z-index:40}.oq-rail-item{width:39px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#44403c}.oq-rail-item:hover{background:#f5f5f4}.oq-rail-item.is-active{background:#1c1917;color:#fff}.oq-rail-item:first-child{color:#a8a29e;margin-bottom:8px}.oq-rail-sep{width:24px;height:1px;background:#e7e5e4;margin:6px 0}.oq-rail-foot{margin-top:auto}.oq-rail-av{position:relative;display:flex;width:28px;height:28px;border-radius:6px;background:#e7e5e4;color:#44403c;font:600 10px Inter,system-ui;align-items:center;justify-content:center}.oq-rail-av i{position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-radius:2px;background:#16a34a;border:2px solid #fff}
/* Market Trends Story mockups, round 2. Facelift shared look (AIV experience in OQ teal), trimmed. */
:root{
  --ink:#0B1020;--ink2:#0F172A;--body:#273043;--muted:#667085;--faint:#98A2B3;--line:#E7E9EE;--soft:#F6F7FA;
  --a:#0F766E;--aInk:#115E59;--aTint:#E6F4F1;--aSoft:#99D5CC;
  --up:#15803D;--down:#E11D48;--rose:#DB2777;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.55;color:var(--body);background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:var(--aInk)}

/* mockup bar: outside the design */
.mockbar{background:#ECEEF1;color:#4B5563;font-size:12px;line-height:1.45;padding:7px 18px;border-bottom:1px solid #DDE1E6}
.mockbar b{color:#111827;font-weight:700}
.mockbar .src{color:#6B7280}
.mockbar ul{margin:3px 0 0;padding:0 0 0 16px}
.mockbar li{margin:0}
.mockbar .nr{display:inline-block;margin-top:3px;color:#6B7280}

/* app chrome */
.fl-app{margin-left:56px;min-height:100vh}
.mockbar{margin-left:56px}
.fl-main{min-width:0}
.fl-wrap{max-width:1240px;margin:0 auto;padding:0 28px 120px}
.fl-top{position:sticky;top:0;z-index:30;margin:0 -28px 0;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #EEF0F4}
.fl-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;color:var(--ink)}
.fl-mark{width:26px;height:26px;border-radius:8px;background:var(--a);display:grid;place-items:center;flex:none}
.fl-mark svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8}
.fl-right{display:flex;align-items:center;gap:12px;font-size:13px;flex-wrap:wrap;justify-content:flex-end}
.fl-right .who{color:var(--ink);font-weight:700}
.fl-right .when{color:var(--muted)}
.btn{border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13.5px;transition:background .2s,box-shadow .2s}
.btn-go{background:var(--a);color:#fff;box-shadow:0 6px 18px rgba(15,118,110,.25)}
.btn-line{background:#fff;border:1px solid var(--line);color:var(--ink);padding:7px 12px;font-size:13px}
.btn-line:hover{background:var(--soft)}
.method-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;border-radius:8px;padding:6px 10px;font-weight:600;color:var(--aInk);position:relative;font-size:13.5px}
.method-btn:hover{background:var(--aTint)}
.method-btn .dot{width:14px;height:14px;border-radius:50%;background:var(--a);position:relative}
.method-btn .dot:after{content:'';position:absolute;inset:3.5px;border-radius:50%;border:1px dotted #fff}
.teaser{position:absolute;right:0;top:100%;margin-top:8px;width:300px;z-index:40;border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px 16px;font-size:13px;font-weight:400;line-height:1.5;color:var(--body);text-align:left;box-shadow:0 12px 32px rgba(11,16,32,.12)}

/* tabs */
.tabs{position:sticky;top:55px;z-index:20;display:flex;gap:26px;margin:0 -28px 6px;padding:10px 28px 0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(12px)}
.tabs button{position:relative;border:0;background:none;padding:0 0 10px;font-size:15px;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--ink)}
.tabs .ink{position:absolute;bottom:-1px;height:2px;background:var(--a);transition:left .3s var(--ease),width .3s var(--ease)}
.tabnote{padding:60px 0;color:var(--muted);font-size:14px}

/* modal (How it works) */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:5vh 16px}
.modal .bd{position:fixed;inset:0;background:rgba(11,16,32,.4)}
.modal .win{position:relative;width:100%;max-width:880px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:24px 28px;box-shadow:0 24px 60px rgba(11,16,32,.18);animation:rise .25s var(--ease)}
.modal .x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);border-radius:6px;padding:4px 8px}
.msec{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:center;border-top:1px solid var(--line);padding:20px 0}
.msec h3{margin:0 0 8px;font-size:16.5px;color:var(--ink)}
.msec p{margin:8px 0;font-size:15px;line-height:1.6}
.msec figure{margin:0}
.msec figcaption{margin-top:6px;text-align:center;font-size:12px;color:var(--muted)}
.figbox{height:200px;overflow:hidden;border-radius:8px;background:var(--soft)}
.figbox svg{display:block;width:100%;height:100%}
.figbox svg *{transition:opacity .45s, fill .45s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:300;background:var(--ink);color:#fff;border-radius:8px;padding:12px 18px;font-size:14px;box-shadow:0 12px 32px rgba(11,16,32,.25);animation:rise .25s var(--ease)}
.tipcard{position:fixed;z-index:200;width:280px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:10px 14px;font-size:13px;line-height:1.5;color:var(--body);box-shadow:0 12px 32px rgba(11,16,32,.12);pointer-events:none}
.tipcard b{display:block;color:var(--aInk);font-size:13px;margin-bottom:2px}
.tipword{border-bottom:1px dotted var(--faint);cursor:help}

/* Story */
.story{display:grid;grid-template-columns:minmax(0,1fr) 600px;gap:44px}
.chap{min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding:24px 0;opacity:.25;transition:opacity .4s}
.chap.on{opacity:1}
.chap .k{margin-bottom:12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--aInk)}
.chap .k .act{color:var(--muted)}
.chap h2{margin:0;font-size:36px;font-weight:900;line-height:1.12;letter-spacing:-.025em;color:var(--ink)}
.chap h2 .g{color:var(--a)}
.chap h2 .r{color:var(--down)}
.chap p{margin:14px 0 0;max-width:540px;font-size:17px;line-height:1.6}
.defs{margin-top:18px;max-width:540px;padding:12px 14px;background:#F8FAFB;border:1px solid var(--line);border-radius:6px}
.defs .dh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.chap .defs p{margin:0;font-size:13.5px;line-height:1.55;color:#273043}
.chap .defs p+p{margin-top:6px}
.chap .note{font-size:13.5px;color:var(--muted);margin-top:12px}
.facts{margin-top:18px;max-width:540px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.facts div{padding:9px 10px 9px 0;border-bottom:1px solid var(--line)}
.facts b{display:block;font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.facts span{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.qlist{margin-top:16px;max-width:540px;border-top:1px solid var(--line)}
.qlist div{display:grid;grid-template-columns:minmax(0,1fr) 70px 54px;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.qlist div span:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.qlist .h span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)!important}
.stick{position:sticky;top:104px;height:calc(100vh - 112px);display:flex;flex-direction:column;justify-content:center}
.ro{height:52px;padding:4px 2px 6px;border-bottom:1px solid #EEF0F3;margin-bottom:6px;overflow:hidden}
.ro .r1{display:flex;justify-content:space-between;align-items:baseline;height:20px;font-size:13px;white-space:nowrap}
.ro .r1 .m{font-weight:700;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.ro .r1 .n{color:var(--muted);font-size:12px;margin-left:12px}
.ro .r2{display:grid;height:22px;align-items:center;gap:10px;font-size:12.5px;white-space:nowrap}
.ro .r2 .s{display:flex;align-items:center;gap:6px;overflow:hidden;min-width:0}
.ro .r2 .s b{color:var(--ink2);font-variant-numeric:tabular-nums}
.ro .r2 .s span{color:var(--body);overflow:hidden;text-overflow:ellipsis}
.ro .r2 .s svg{flex:none}
.ro .r2 .txt{grid-column:1/-1;color:var(--body);overflow:hidden;text-overflow:ellipsis}
.figsvg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.figsvg text{font-family:Inter,sans-serif}
.figsvg .num{font-variant-numeric:tabular-nums}
.figcap{margin-top:6px;min-height:36px;font-size:12.5px;line-height:1.45;color:var(--muted);text-align:center}
.storyend{margin:24px 0 0;padding:28px;border:1px solid var(--line);border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;opacity:0;transform:translateY(14px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.storyend.in{opacity:1;transform:none}
.storyend h3{margin:0;font-size:24px;font-weight:900;color:var(--ink);letter-spacing:-.02em}
.storyend p{margin:4px 0 0;color:var(--muted);font-size:14px}
@media (max-width:1180px){.story{grid-template-columns:minmax(0,1fr) 520px;gap:32px}}
@media (max-width:980px){.story{grid-template-columns:1fr}.stick{position:static;height:auto}.chap{opacity:1;min-height:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

/* Site Audit mockups (#1426): additions on top of the approved facelift base. */
:root{--now:#DC2626;--nowTint:#FEF2F2;--soon:#2563EB;--soonTint:#EFF6FF;--tidy:#A3ACB9;--tidyTint:#F4F5F7}
.lv{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--ink)}
.lv i{width:9px;height:9px;border-radius:2px;display:inline-block}
.lv.now i{background:var(--now)}.lv.soon i{background:var(--soon)}.lv.tidy i{background:var(--tidy)}
.sample{display:inline-block;margin-left:6px;padding:0 5px;border:1px dashed #C3C8D2;border-radius:4px;font-size:10.5px;font-weight:600;color:#6B7280;letter-spacing:.02em;vertical-align:1px}
.card{border:1px solid var(--line);border-radius:8px;background:#fff}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px}
.url{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;color:var(--ink2)}
.kick{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--aInk)}
.h1{margin:6px 0 0;font-size:34px;font-weight:900;line-height:1.12;letter-spacing:-.025em;color:var(--ink)}
.sub{margin:8px 0 0;color:var(--muted);font-size:15px}
/* variant switcher: outside the design */
.vbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:500;display:flex;align-items:center;gap:4px;background:#111827;color:#fff;border-radius:10px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13px}
.vbar button{border:0;background:none;color:#fff;border-radius:7px;padding:6px 10px}
.vbar button:hover{background:#374151}
.vbar button.on{background:#fff;color:#111827;font-weight:700}
.vbar .lbl{padding:0 10px;color:#D1D5DB;white-space:nowrap}
.vbar a{color:#9CA3AF;text-decoration:none;padding:0 8px;font-size:12px}

.s1-ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:14px 0 18px;padding:6px 10px;background:#ECEEF1;border:1px solid #DDE1E6;border-radius:6px;font-size:12px;color:#4B5563}
.s1-ctl b{color:#111827;margin-right:4px}
.s1-ctl button{border:1px solid #D1D5DB;background:#fff;border-radius:5px;padding:2px 9px;font-size:12px;color:#374151}
.s1-ctl button.on{background:#111827;color:#fff;border-color:#111827}
.s1-ctl .sep{width:1px;height:16px;background:#D1D5DB;margin:0 6px}
.s1-rg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:help;white-space:nowrap}
.s1-rg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.s1-rg i.g,.s1b-r .sw.g{background:#fff;border:2px solid #4285F4}
.s1-try{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.s1-try.no>span:last-child{color:var(--muted)}
.s1-try.ok>span:last-child{color:var(--aInk);font-weight:600}
.s1-arr{color:var(--faint);margin:0 8px}
.s1-lh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.s1-turn{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--aTint);border-top-color:var(--a);animation:s1spin .8s linear infinite;flex:none}
@keyframes s1spin{to{transform:rotate(360deg)}}
.s1-dotsep{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--faint);margin:0 12px;vertical-align:middle}
.s1-end{margin-top:22px;padding:24px 26px;border:1px solid var(--line);border-radius:8px;background:#fff;animation:rise .35s var(--ease)}
.s1-end.bad{background:#FFFBFB}
.s1-end h2{margin:6px 0 0;font-size:26px;font-weight:900;letter-spacing:-.02em;color:var(--ink);line-height:1.2}
.s1-end p{margin:10px 0 0;max-width:720px;font-size:15.5px}
.s1-endrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.s1-tried{margin-top:14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.s1-tried div{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12.5px;color:var(--muted)}
.s1-next{max-width:560px;font-size:14px}
/* A */
.s1a-head{margin-bottom:18px}
.s1a-line{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink)}
.s1a-det{color:var(--muted)}
.s1a-bar{height:4px;background:var(--soft);border-radius:2px;margin:14px 0 10px;overflow:hidden}
.s1a-bar i{display:block;height:100%;background:var(--a);transition:width .3s var(--ease)}
.s1a-counts{display:flex;gap:22px;font-size:14px;color:var(--body)}
.s1a-counts b{color:var(--ink);font-variant-numeric:tabular-nums}
.s1a-cur{margin-top:8px;min-height:24px;display:flex;align-items:center;gap:16px;overflow:hidden}
.s1a-climb{display:inline-flex;align-items:center}
.s1a-legend{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:26px 0 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.s1a-lg{display:inline-flex;align-items:center;gap:7px}
.s1a-lg b{font-variant-numeric:tabular-nums;color:var(--ink);font-size:13px}
.s1a-logh{margin:22px 0 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.s1a-log{height:420px;overflow:hidden}
.s1a-row{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:center;padding:7px 16px;border-bottom:1px solid #F0F1F4}
.s1a-row .url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s1a-row.climb{background:#F7FBFA}
.s1a-row.bad{background:#FFF7F7}
.s1a-how{overflow:hidden;white-space:nowrap}
.s1a-empty{padding:18px;color:var(--muted);font-size:13.5px}
/* B */
.s1b .h1 b{font-variant-numeric:tabular-nums}
.s1b-det{min-height:24px}
.s1b-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:36px;margin-top:22px;align-items:start}
.s1b-field{display:grid;grid-template-columns:repeat(auto-fill,15px);gap:4px}
.s1b-field.dense{grid-template-columns:repeat(auto-fill,9px);gap:3px}
.s1b-field i{width:15px;height:15px;border-radius:3px;border:1px solid #DCE0E6;background:#fff;transition:background .25s}
.s1b-field.dense i{width:9px;height:9px;border-radius:2px}
.s1b-field i[data-r]{border-color:transparent}
.s1b-field i.link{border:1px dashed #98A2B3}
.s1b-field i.link[data-r]{border:1px dashed rgba(255,255,255,.9)}
.s1b-field i.cur{outline:2px solid var(--ink);outline-offset:1px}
.s1b-field i.x{background:var(--now)!important;border-color:var(--now);position:relative}
.s1b-cur{margin-top:14px;min-height:46px}
.s1b-tries{margin-top:6px;display:flex;align-items:center;flex-wrap:wrap}
.s1b-cap{margin-top:4px;font-size:12.5px;color:var(--muted)}
.s1b-side{border-left:1px solid var(--line);padding-left:22px}
.s1b-r{display:grid;grid-template-columns:14px minmax(0,1fr) 34px;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid #F0F1F4}
.s1b-r .sw{width:12px;height:12px;border-radius:3px;margin-top:4px}
.s1b-r .sw.link{border:1px dashed #98A2B3;background:#fff}
.s1b-r b{font-size:13.5px;color:var(--ink)}
.s1b-r span:not(.sw):not(.sample){display:block;font-size:12.5px;color:var(--muted)}
.s1b-r em{font-style:normal;text-align:right;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.s1-lh+.s1b-r{margin-top:6px}
/* C */
.s1c .sub{margin-bottom:22px}
.s1c-steps{max-width:880px;border-top:1px solid var(--line)}
.s1c-step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.s1c-mk{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--soft)}
.s1c-mk svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.s1c-step.done .s1c-mk{background:var(--a)}
.s1c-step.on .s1c-mk{background:var(--aTint)}
.s1c-step.bad .s1c-mk{background:var(--now);color:#fff;font-size:16px}
.s1c-step.todo b,.s1c-step.skip b{color:var(--faint)}
.s1c-t{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:26px}
.s1c-t b{font-size:15.5px;color:var(--ink)}
.s1c-note{font-size:13.5px;color:var(--muted);text-align:right}
.s1c-body{margin-top:10px}
.s1c-det{font-size:14px;color:var(--body)}
.s1c-prog{display:flex;align-items:center;gap:16px;font-size:14px}
.s1c-prog b{color:var(--ink);font-variant-numeric:tabular-nums}
.s1c-mini{flex:1;height:4px;background:var(--soft);border-radius:2px;overflow:hidden;max-width:360px}
.s1c-mini i{display:block;height:100%;background:var(--a);transition:width .3s}
.s1c-cur{margin-top:6px;min-height:20px}
.s1c-ladder{margin-top:12px;padding:12px 14px;background:var(--soft);border-radius:8px}
.s1c-lh{font-size:13px;color:var(--muted);margin-bottom:6px}
.s1c-rung{display:grid;grid-template-columns:22px 190px minmax(0,1fr) minmax(0,250px) 34px;gap:10px;align-items:center;padding:6px 0;font-size:13.5px;transition:background .25s}
.s1c-rung .n{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;color:#fff;font-size:11.5px;font-weight:700}
.s1c-rung:first-of-type .n{color:var(--aInk)}
.s1c-rung .d{color:var(--muted)}
.s1c-rung .t{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s1c-rung.ok .t{color:var(--aInk);font-weight:600}
.s1c-rung.no .t{color:var(--now)}
.s1c-rung em{font-style:normal;text-align:right;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.s1c-rung .sample{margin:0 0 0 6px}

/* #1413 shared: kit TurningDot, StepList marks, notes, misses */
.cp-dot{position:relative;display:inline-block;width:14px;height:14px;border-radius:50%;background:linear-gradient(90deg,#0F766E,#0891B2);flex:none}
.cp-dot:after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1.5px dotted #7CC8BC;animation:s1spin 6s linear infinite}
.cp-spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:1.5px solid #0F766E;border-top-color:transparent;animation:s1spin .8s linear infinite;flex:none}
.cp-notes{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.cp-note{font-size:14px;line-height:1.45;padding:8px 12px;border-radius:6px;background:var(--soft);color:var(--body)}
.cp-note.warn{background:#FFF7ED00;background:#F4F5F7;color:var(--ink2)}
.cp-note.note{background:var(--aTint);color:var(--aInk)}
.cp-note.ok{background:#F0FDF4;color:#166534}
.cp-miss{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.cp-miss div{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;padding:10px 14px;border:1px solid var(--line);border-radius:6px;font-size:14px}
.cp-miss b{color:var(--ink)}
.cp-miss span{color:var(--muted)}
.tipword{border-bottom:1px dotted #0F766E99;cursor:help}
.cp-shim{height:2px;max-width:420px;border-radius:1px;background:#EEF0F5;overflow:hidden;position:relative;margin-top:8px}
.cp-shim:after{content:'';position:absolute;top:0;bottom:0;width:35%;background:linear-gradient(90deg,transparent,#7CC8BC,transparent);animation:cpshim 2.2s ease-in-out infinite}
@keyframes cpshim{from{left:-35%}to{left:100%}}
.cp-grad{background:linear-gradient(90deg,#0F766E,#0891B2);-webkit-background-clip:text;background-clip:text;color:transparent}
.cp-mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:var(--faint)}
.cp-steps{list-style:none;margin:0;padding:2px 0 0;display:flex;flex-direction:column;gap:8px}
.cp-steps li{display:flex;align-items:center;gap:10px;font-size:14.5px;color:#98A2B3}
.cp-steps li.now{font-weight:600;color:#0B1020}
.cp-steps li.done{color:#273043}
.cp-steps li.bad{color:var(--now);font-weight:600}
.cp-steps .mk{width:16px;height:16px;border-radius:50%;border:1.5px solid #D0D5DD;flex:none}
.cp-steps li.done .mk{border:0;background:#15803D;color:#fff;font-size:10px;display:grid;place-items:center}
.cp-steps li.bad .mk{border:0;background:var(--now);color:#fff;font-size:11px;display:grid;place-items:center}
.cp-steps li.now .mk{border-color:#0F766E;border-top-color:transparent;animation:s1spin .8s linear infinite}
.btn-quiet{background:none;border:0;color:var(--aInk);font-weight:600;font-size:13.5px;padding:8px 6px}

.c1-n{font-variant-numeric:tabular-nums}
.c1-end:empty{display:none}
.c1a-tries{display:inline-flex;align-items:center;margin-left:14px}
/* C */
.c1c-strip{margin-top:22px;padding:16px 18px}
.c1c-segs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.c1c-seg{font-size:12px;font-weight:600;color:var(--faint);cursor:help}
.c1c-seg i{display:block;height:4px;border-radius:2px;background:var(--soft);margin-bottom:6px}
.c1c-seg.done{color:var(--body)}.c1c-seg.done i{background:var(--a)}
.c1c-seg.on{color:var(--ink)}.c1c-seg.on i{background:linear-gradient(90deg,var(--a),var(--aSoft))}
.c1c-line{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:15px;color:var(--ink2);min-height:26px}
.c1c-cur{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.c1c-fresh{margin-left:auto}
.c1c-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;min-height:24px}
.c1c-chips span{font-size:12.5px;padding:2px 8px;border-radius:4px;background:var(--soft);color:var(--body)}
.c1c-chips span.w{background:#F1F2F5;color:var(--ink)}
.c1c-chips span.n{background:var(--aTint);color:var(--aInk)}
.c1c-log{max-width:880px}
.c1c-ev{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:8px 16px;border-bottom:1px solid #F0F1F4;font-size:14px}
.c1c-ev.warn span:last-child{color:var(--ink)}.c1c-ev.ok span:last-child{color:#166534}.c1c-ev.note span:last-child{color:var(--aInk)}
.c2-v{padding:16px 18px;border:1px solid var(--line);border-radius:8px;background:#fff;animation:rise .3s var(--ease);max-width:820px}
.c2-v.bad{background:#FFFBFB}
.c2-v.rest{background:var(--soft)}
.c2-vt{display:flex;align-items:center;gap:10px}
.c2-vt b{font-size:17px;color:var(--ink);font-weight:800;letter-spacing:-.01em}
.c2-vt span[class^=c2-]{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.c2-ok{background:#15803D}.c2-x{background:var(--now)}.c2-w{background:var(--ink2)}.c2-r{background:#A3ACB9}
.c2-v p{margin:8px 0 0;font-size:15px;max-width:720px}
.c2-acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.c2-in{display:inline-flex;align-items:center;gap:8px}
.c2-input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:13.5px;width:230px}
.c2-input:focus{outline:2px solid #0F766E47;border-color:var(--a)}
.c2-flag{display:flex;align-items:flex-start;gap:8px;margin-top:12px;font-size:12.5px;color:var(--muted);max-width:720px}
.c2-flag .sample{margin:2px 0 0;flex:none}
.c2-none{color:var(--faint)}
.s1c-step.bad .s1c-mk{background:var(--now);color:#fff}
.s1c-step.rest .s1c-mk{background:#A3ACB9;color:#fff;font-size:16px}
.s1c-step.warn .s1c-mk{background:var(--ink2);color:#fff}
/* B */
.c2b-tab{margin-top:22px;max-width:1000px}
.c2b-hd,.c2b-row{display:grid;grid-template-columns:180px minmax(0,1fr) minmax(0,1.3fr) 36px;gap:14px;align-items:center;padding:10px 16px}
.c2b-hd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border-bottom:1px solid var(--line)}
.c2b-row{border-bottom:1px solid #F0F1F4;font-size:14px;min-height:46px}
.c2b-row .src{font-weight:600;color:var(--ink)}
.c2b-row .url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c2b-row .land{display:flex;align-items:center;gap:8px;color:var(--body)}
.c2b-row .arr{color:var(--faint)}
.c2b-row .mark i{font-style:normal;font-weight:800;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:13px}
.c2b-row .mark .ok{background:#DCFCE7;color:#15803D}.c2b-row .mark .d{background:#F1F2F5;color:var(--ink)}.c2b-row .mark .x{background:var(--nowTint);color:var(--now)}
.c2b-v{margin-top:18px}
.c2b-next{margin-top:10px;font-size:14px;color:var(--muted)}
.c2-in-strip{margin-top:14px}
.c2-in-strip .c2-v{max-width:none;border:0;padding:0;background:none;animation:none}
.c1c-seg.bad{color:var(--now)}.c1c-seg.bad i{background:var(--now)}
.c1c-seg.rest{color:var(--ink2)}.c1c-seg.rest i{background:#A3ACB9}
.c2-ev .c2b-tab{margin-top:0}

</path><path d="M19 14v4"></path><path d="M10 2v2"></path><path d="M7 8H3"></path><path d="M21 16h-4"></path><path d="M11 3H9"></path></svg></a><a class="oq-rail-item" data-href="" title="Retrieval Simulator"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search "><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></a><a class="oq-rail-item" data-href="" title="Query Fan-Out"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-git-fork "><circle cx="12" cy="18" r="3"></circle><circle cx="6" cy="6" r="3"></circle><circle cx="18" cy="6" r="3"></circle><path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9"></path><path d="M12 12v3"></path></svg></a><a class="oq-rail-item" data-href="" title="Relevance Analyzer"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sparkles "><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path><path d="M5 3v4"></path><path d="M19 17v4"></path><path d="M3 5h4"></path><path d="M17 19h4"></path></svg></a><div class="oq-rail-sep"></div><a class="oq-rail-item" data-href="" title="SEO Dashboard"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-gauge "><path d="m12 14 4-4"></path><path d="M3.34 19a10 10 0 1 1 17.32 0"></path></svg></a><a class="oq-rail-item" data-href="" title="Client Status"><svg x <script>/* Shared pieces for the round 2 Story mockups: frame, tabs, hovers, How it works window,
   and a small tween engine for ONE persistent SVG (marks keyed by id, never unmounted). */
(function () {
  const FL = (window.FL = {});
  FL.reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  FL.esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  FL.$ = (s, r = document) => r.querySelector(s);
  FL.$$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  FL.h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  FL.fmt = (n) => Number(n).toLocaleString('en-US');
  FL.round = (n, to) => Math.round(n / to) * to;
  FL.toast = (msg) => { const t = FL.h(`<div class="toast">${FL.esc(msg)}</div>`); document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };

  /* ---------- frame ---------- */
  FL.shell = function ({ mock }) {
    const page = document.getElementById('page');
    const bar = FL.h(`<div class="mockbar">${mock}</div>`);
    const app = FL.h(`<div class="fl-app">

      <main class="fl-main"><div class="fl-wrap">
        <div class="fl-top"><div class="fl-brand"><span class="fl-mark"><svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg></span>Market Trends</div>
          <div class="fl-right"><span id="method-slot"></span><span class="who">Expedition Pediatric Dentistry</span><span class="when">Check #22 · Oct 29, 2026 · read for Washington</span>
          <button class="btn btn-line" id="share">Share report</button><button class="btn btn-line" id="newc">New check</button></div></div>
      </div></main></div>`);
    page.parentNode.insertBefore(bar, page);
    page.parentNode.insertBefore(app, page);
    app.querySelector('.fl-wrap').appendChild(page);
    FL.$('#method-slot').innerHTML = '<button type="button" class="method-btn"><span class="dot"></span>How it works</button>';
    FL.$('#share').onclick = () => FL.toast('Opens the client report: link, access code, PDF and email.');
    FL.$('#newc').onclick = () => FL.toast('Starts a new check (not part of this mockup).');
  };

  FL.tabs = function (host, { tabs, value, onChange }) {
    host.classList.add('tabs');
    host.innerHTML = tabs.map((t) => `<button type="button" data-k="${t.key}">${FL.esc(t.label)}</button>`).join('') + '<span class="ink"></span>';
    const ink = host.querySelector('.ink');
    const set = (k, fire) => {
      host.querySelectorAll('button').forEach((b) => { const on = b.dataset.k === k; b.classList.toggle('on', on); if (on) { ink.style.left = `${b.offsetLeft}px`; ink.style.width = `${b.offsetWidth}px`; } });
      if (fire && onChange) onChange(k);
    };
    host.querySelectorAll('button').forEach((b) => { b.onclick = () => set(b.dataset.k, true); });
    requestAnimationFrame(() => set(value, false));
  };

  /* branded hover for words in the text (never over the chart) */
  let tipEl = null; let tipFor = null; let tipT = null;
  const hideTip = () => { clearTimeout(tipT); tipEl?.remove(); tipEl = null; tipFor = null; };
  document.addEventListener('mouseover', (e) => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (t === tipFor) return; hideTip(); if (!t) return; tipFor = t;
    tipT = setTimeout(() => {
      const r = t.getBoundingClientRect();
      tipEl = FL.h(`<div class="tipcard">${t.dataset.tipH ? `<b>${FL.esc(t.dataset.tipH)}</b>` : ''}${FL.esc(t.dataset.tip)}</div>`);
      document.body.appendChild(tipEl);
      tipEl.style.left = `${Math.max(8, Math.min(r.left, innerWidth - 288))}px`;
      if (innerHeight - r.bottom < 130) tipEl.style.bottom = `${innerHeight - r.top + 6}px`; else tipEl.style.top = `${r.bottom + 6}px`;
    }, 120);
  });
  addEventListener('scroll', hideTip, true);

  /* How it works: teaser on hover, window on click, a looping real-data picture per section */
  FL.method = function ({ teaser, title, sections }) {
    const btn = FL.$('.method-btn'); let tip = null;
    btn.addEventListener('mouseenter', () => { if (!tip) { tip = FL.h(`<span class="teaser">${FL.esc(teaser)}</span>`); btn.appendChild(tip); } });
    btn.addEventListener('mouseleave', () => { tip?.remove(); tip = null; });
    btn.addEventListener('click', () => {
      tip?.remove(); tip = null;
      const m = FL.h(`<div class="modal"><div class="bd"></div><div class="win" role="dialog" aria-modal="true">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px">
          <div><div style="font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--aInk)">Market Trends</div><h2 style="margin:2px 0 0;font-size:26px;font-weight:900;letter-spacing:-.02em;color:var(--ink)">${FL.esc(title)}</h2></div>
          <button class="x" aria-label="Close">×</button></div>
        ${sections.map((s, i) => `<section class="msec"><div><h3>${FL.esc(s.title)}</h3>${s.body.map((p) => `<p>${p}</p>`).join('')}</div>
          <figure><div class="figbox" data-fig="${i}"></div><figcaption>${FL.esc(s.caption)}</figcaption></figure></section>`).join('')}
      </div></div>`);
      document.body.appendChild(m);
      const stops = sections.map((s, i) => s.figure(m.querySelector(`[data-fig="${i}"]`)));
      const close = () => { stops.forEach((f) => f && f()); m.remove(); removeEventListener('keydown', onKey); };
      const onKey = (e) => { if (e.key === 'Escape') close(); };
      addEventListener('keydown', onKey);
      m.querySelector('.bd').onclick = close; m.querySelector('.x').onclick = close;
    });
  };
  FL.loop = function (count, ms, fn) {
    let s = FL.reduce ? count - 1 : 0; fn(s);
    if (FL.reduce) return () => {};
    const t = setInterval(() => { s = (s + 1) % count; fn(s); }, ms);
    return () => clearInterval(t);
  };

  /* ---------- easing + tween engine ---------- */
  function bez(p1x, p1y, p2x, p2y) {
    const cx = 3 * p1x; const bx = 3 * (p2x - p1x) - cx; const ax = 1 - cx - bx;
    const cy = 3 * p1y; const by = 3 * (p2y - p1y) - cy; const ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t; const sy = (t) => ((ay * t + by) * t + cy) * t; const ds = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x; for (let i = 0; i < 8; i++) { const e = sx(t) - x; const d = ds(t); if (Math.abs(e) < 1e-5 || Math.abs(d) < 1e-6) break; t -= e / d; } return sy(t); };
  }
  FL.EASE = bez(0.2, 0.8, 0.2, 1);
  const NS = 'http://www.w3.org/2000/svg';
  FL.NS = NS;
  const NUM = ['x', 'y', 'width', 'height', 'cx', 'cy', 'r', 'x1', 'y1', 'x2', 'y2', 'tx', 'ty', 's', 'sx'];
  const STY = { o: 'opacity', stroke: 'stroke', fill: 'fill', sw: 'stroke-width', dash: 'stroke-dasharray', fo: 'fill-opacity' };
  const ptsD = (p) => p.map((q, i) => `${i ? 'L' : 'M'}${q[0].toFixed(1)},${q[1].toFixed(1)}`).join('');

  FL.Fig = class {
    constructor(svg) { this.svg = svg; this.m = new Map(); this.tw = []; this.raf = null; this.lab = null; this.labHtml = null; this.labT = null; }
    layer(name) { const g = document.createElementNS(NS, 'g'); g.setAttribute('data-layer', name); this.svg.appendChild(g); return g; }
    /* create a mark once; init = {tag, layer, attrs (static), ...targets} */
    mk(id, tag, layer, attrs = {}, init = {}) {
      if (this.m.has(id)) return this.m.get(id);
      const el = document.createElementNS(NS, tag);
      Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
      el.style.transition = 'opacity .5s, stroke .5s, fill .5s, stroke-width .5s';
      layer.appendChild(el);
      const mk = { id, el, tag, cur: {} };
      this.m.set(id, mk);
      this.apply(mk, init, true);
      return mk;
    }
    write(mk) {
      const c = mk.cur; const el = mk.el;
      if (c.pts) el.setAttribute('d', ptsD(c.pts));
      if ('tx' in c || 's' in c) el.setAttribute('transform', `translate(${(c.tx || 0).toFixed(2)},${(c.ty || 0).toFixed(2)}) scale(${(c.s ?? 1).toFixed(4)},${(c.sx ?? c.s ?? 1).toFixed(4)})`);
      NUM.forEach((k) => { if (k in c && !['tx', 'ty', 's', 'sx'].includes(k)) el.setAttribute(k, c[k].toFixed(2)); });
    }
    /* move a mark to a target. Position over dur (0.9s), style by CSS (0.5s). */
    apply(mk, t, instant = false, { dur = 900, delay = 0 } = {}) {
      const el = mk.el;
      if (t.attr) Object.entries(t.attr).forEach(([k, v]) => (v == null ? el.removeAttribute(k) : el.setAttribute(k, v)));
      Object.entries(STY).forEach(([k, css]) => {
        if (!(k in t)) return;
        el.style.transitionDelay = instant || FL.reduce ? '0s' : `${delay}ms`;
        if (instant) { const tr = el.style.transition; el.style.transition = 'none'; el.style.setProperty(css, t[k]); el.getBoundingClientRect(); el.style.transition = tr; } else el.style.setProperty(css, t[k]);
      });
      const tgt = {};
      if (t.pts) tgt.pts = t.pts.map((p) => [p[0], p[1]]);
      NUM.forEach((k) => { if (k in t) tgt[k] = t[k]; });
      if (!Object.keys(tgt).length) return;
      this.tw = this.tw.filter((w) => w.mk !== mk);
      if (instant || FL.reduce || dur === 0) { Object.assign(mk.cur, tgt); this.write(mk); return; }
      const from = {};
      Object.keys(tgt).forEach((k) => {
        if (k === 'pts') { const cp = mk.cur.pts || tgt.pts; from.pts = tgt.pts.map((_, i) => (cp[Math.min(i, cp.length - 1)] || tgt.pts[i]).slice()); } else from[k] = k in mk.cur ? mk.cur[k] : tgt[k];
      });
      this.tw.push({ mk, from, to: tgt, t0: performance.now() + delay, dur });
      if (!this.raf) this.raf = requestAnimationFrame((n) => this.tick(n));
    }
    set(id, t, o) { const mk = this.m.get(id); if (!mk) throw new Error(`no mark ${id}`); this.apply(mk, t, false, o); }
    pre(id, t) { const mk = this.m.get(id); if (!mk) throw new Error(`no mark ${id}`); this.apply(mk, t, true); }
    tick(now) {
      this.tw = this.tw.filter((w) => {
        const p = Math.min(1, Math.max(0, (now - w.t0) / w.dur)); const e = FL.EASE(p); const c = w.mk.cur;
        Object.keys(w.to).forEach((k) => {
          if (k === 'pts') c.pts = w.to.pts.map((q, i) => [w.from.pts[i][0] + (q[0] - w.from.pts[i][0]) * e, w.from.pts[i][1] + (q[1] - w.from.pts[i][1]) * e]);
          else c[k] = w.from[k] + (w.to[k] - w.from[k]) * e;
        });
        if (now >= w.t0) this.write(w.mk);
        return p < 1;
      });
      this.raf = this.tw.length ? requestAnimationFrame((n) => this.tick(n)) : null;
    }
    stop() { this.tw = []; }
    /* draw a path in from its start (a new mark arriving); keeps its points */
    drawIn(id, { dur = 900, delay = 0 } = {}) {
      const el = this.m.get(id).el; if (FL.reduce) return;
      const len = el.getTotalLength(); const keep = el.getAttribute('stroke-dasharray');
      el.style.strokeDasharray = `${len} ${len}`; el.style.strokeDashoffset = `${len}`; el.getBoundingClientRect();
      const tr = el.style.transition; el.style.transition = `${tr}, stroke-dashoffset ${dur}ms cubic-bezier(.2,.8,.2,1) ${delay}ms`;
      el.style.strokeDashoffset = '0';
      setTimeout(() => { el.style.transition = tr; el.style.strokeDasharray = keep || ''; el.style.strokeDashoffset = ''; }, dur + delay + 30);
    }
    /* label layer: old labels out (0.35s), new labels in (0.35s), then count-ups */
    labels(html, host) {
      const g = host; if (this.labHtml === html) return; this.labHtml = html;
      clearTimeout(this.labT);
      g.style.transition = 'opacity .35s'; g.style.opacity = 0;
      this.labT = setTimeout(() => {
        g.innerHTML = html; g.getBoundingClientRect(); g.style.opacity = 1;
        g.querySelectorAll('[data-count]').forEach((t) => FL.countTo(t, +t.dataset.count, { from: +(t.dataset.from || 0), ms: 900, fmt: (t.dataset.fmt === 'x' ? (v) => `${v.toFixed(1)} times` : (v) => FL.fmt(Math.round(v))) }));
      }, FL.reduce ? 0 : 350);
    }
  };
  FL.countTo = function (el, to, { from = 0, ms = 900, fmt = (v) => Math.round(v) } = {}) {
    if (FL.reduce) { el.textContent = fmt(to); return; }
    const t0 = performance.now();
    const tick = (n) => { const p = Math.min(1, (n - t0) / ms); el.textContent = fmt(from + (to - from) * FL.EASE(p)); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  };

  /* ---------- the readout bar above the figure (fixed 52px, fixed slots) ---------- */
  FL.key = (k = {}) => `<svg width="16" height="8" viewBox="0 0 16 8"><line x1="1" y1="4" x2="15" y2="4" stroke="${k.c || '#0F766E'}" stroke-width="${Math.min(2.6, k.w || 2)}" ${k.dash ? `stroke-dasharray="${k.dash}"` : ''} stroke-linecap="round"/></svg>`;
  FL.dotKey = (c, hollow) => `<svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.6" fill="${hollow ? '#fff' : c}" stroke="${c}" stroke-width="1.4"/></svg>`;
  FL.readout = function (host) {
    host.innerHTML = '<div class="r1"><span class="m"></span><span class="n"></span></div><div class="r2"></div>';
    const m = host.querySelector('.m'); const n = host.querySelector('.n'); const r2 = host.querySelector('.r2');
    return {
      set({ title = '', note = '', slots = null, text = null, cols = null }) {
        m.textContent = title; n.textContent = note;
        if (text != null) { r2.style.gridTemplateColumns = '1fr'; r2.innerHTML = `<span class="txt">${text}</span>`; return; }
        const s = slots || [];
        r2.style.gridTemplateColumns = `repeat(${cols || Math.max(1, s.length)}, minmax(0,1fr))`;
        r2.innerHTML = s.map((x) => `<span class="s">${x.key || ''}<b>${FL.esc(x.v)}</b><span>${FL.esc(x.name)}</span></span>`).join('');
      },
    };
  };
})();
</script>
<script>/* Site Audit mockups (#1426): shell (OQ rail + tool top bar) and the ?v= variant switcher. */
(function () {
  const SA = (window.SA = {});
  SA.LV = { now: { name: 'Fix now', tip: 'Loses a visitor or loses Google: a page that does not load, or a page Google is told to skip. Asana due date: 1 week.' },
    soon: { name: 'Fix soon', tip: 'Weakens a page that works: shared titles, missing descriptions or headings, thin service pages. Asana due date: 3 weeks.' },
    tidy: { name: 'Tidy up', tip: 'Worth doing when there is time: long titles, pages left out of the sitemap, missing alt text. No due date.' } };
  SA.lv = (k, label) => `<span class="lv ${k}" data-tip-h="${SA.LV[k].name}" data-tip="${SA.LV[k].tip}"><i></i>${label ?? SA.LV[k].name}</span>`;
  SA.sample = (why) => `<span class="sample" data-tip-h="Sample" data-tip="${FL.esc(why || 'Today’s crawl does not keep this, so the mockup shows a made-up example. The new shared crawl keeps it.')}">sample</span>`;
  SA.shell = function ({ mock, right, brand }) {
    const page = document.getElementById('page');
    const bar = FL.h(`<div class="mockbar">${mock}</div>`);
    const app = FL.h(`<div class="fl-app"><main class="fl-main"><div class="fl-wrap">
      <div class="fl-top"><div class="fl-brand"><span class="fl-mark"><svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h3l2-4 2 8 2-4h1"/></svg></span>${brand ?? 'Site Audit'}</div>
      <div class="fl-right"><span id="method-slot"><button type="button" class="method-btn"><span class="dot"></span>How it works</button></span>${right ?? '<span class="who">Liberty Family Dentistry</span><span class="when">libertyfamilydentistry.com</span>'}</div></div>
    </div></main></div>`);
    page.parentNode.insertBefore(bar, page); page.parentNode.insertBefore(app, page);
    app.querySelector('.fl-wrap').appendChild(page);
    FL.$('.method-btn').onclick = () => FL.toast('Opens “How it works” (not part of this mockup).');
  };
  /* variants: { A: { name, render(host) }, B: ... } */
  SA.variants = function (V, keep) {
    if (keep && keep.length) { V = Object.fromEntries(Object.entries(V).filter(([k]) => keep.includes(k)));
      const mb = FL.$('.mockbar'); if (mb) mb.prepend(FL.h(`<div style="margin-bottom:4px;color:#0F766E;font-weight:700">Owner’s pick, Oct 30: ${keep.map((k) => `${k}, ${FL.esc(V[k].name)}`).join(' + ')}. Round 2 shows only the pick.</div>`)); }
    const keys = Object.keys(V); const host = document.getElementById('page');
    let cur = new URLSearchParams(location.search).get('v'); if (!keys.includes(cur)) cur = keys[0];
    const bar = FL.h(`<div class="vbar"><button data-d="-1" aria-label="Previous">←</button>${keys.map((k) => `<button data-k="${k}">${k}</button>`).join('')}<span class="lbl"></span><button data-d="1" aria-label="Next">→</button><a href="index-crawl-progress.html">all screens</a></div>`);
    document.body.appendChild(bar);
    if (keys.length === 1) { FL.$$('button', bar).forEach((b) => (b.style.display = 'none')); }
    const show = (k) => { cur = k; const u = new URL(location); u.searchParams.set('v', k); history.replaceState(null, '', u);
      FL.$$('button[data-k]', bar).forEach((b) => b.classList.toggle('on', b.dataset.k === k));
      bar.querySelector('.lbl').textContent = `${k}: ${V[k].name}`; host.innerHTML = ''; window.scrollTo({ top: 0 }); V[k].render(host); };
    bar.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.k) show(b.dataset.k); else show(keys[(keys.indexOf(cur) + +b.dataset.d + keys.length) % keys.length]); };
    addEventListener('keydown', (e) => { if (e.target.closest('input,textarea,[contenteditable]')) return;
      if (e.key === 'ArrowRight') show(keys[(keys.indexOf(cur) + 1) % keys.length]); if (e.key === 'ArrowLeft') show(keys[(keys.indexOf(cur) - 1 + keys.length) % keys.length]); });
    show(cur);
  };
})();
</script>
<script>/* #1413 crawl progress mockups: the simulated crawls. One timeline per case; every look reads the same state.
   Real sources: Liberty = crawl 319 (Oct 22) + live sitemap Oct 30 (159 URLs, 26 more through links).
   Guava, Dublin, Kay Jordan, Smile Haus = #1412 re-crawl (docs/research/recrawl-failed-thin-2026-10-30.md).
   Endings are what the #1408 bar promises, not what today's crawler does (today: a page count every 3 pages). */
(function () {
  const CPS = (window.CPS = {});
  const lib = (i) => ['/', '/services/sedation', '/articles', '/reviews', '/team', '/services', '/first-visit', '/services/orthodontics', '/services/dental-implants', '/services/sleep-apnea', '/our-approach', '/services/invisalign', '/accessibility', '/video', '/covid-19', '/privacy-practices'][i] ?? `/articles/${['3-reasons-our-dentists-prefer-implants', '5-tips-for-healthy-enamel', '7-causes-of-bad-breath', 'are-your-gums-healthy', 'braces-for-adults', 'choosing-the-right-toothbrush', 'do-you-get-enough-sleep', 'every-six-months', 'is-snoring-dangerous', 'keeping-teeth-white', 'same-day-crowns-how-they-work', 'the-magic-of-invisalign', 'use-it-or-lose-it', 'why-we-screen-for-oral-cancer'][i % 14]}`;
  const gen = (pfx, n) => Array.from({ length: n }, (_, i) => `${pfx}${i}`);

  CPS.fresh = (c) => ({ key: c.key, domain: c.domain, practice: c.practice, stage: c.wait ? 'wait' : 'domain', detail: '', ahead: c.wait || 0,
    sitemapTotal: 0, kept: 0, found: 0, blocked: 0, blockedWhy: '', slow: '', paused: '', cur: null, tries: null, reconnects: 0, resumes: 0,
    rc: [0, 0, 0, 0], embedded: 0, clock: 0, beat: 0, events: [], done: null, domainNote: '' });

  /* builders: at(dt ms of replay, fn(state), sim seconds that pass) */
  const mk = () => { const ev = []; let t = 0; const at = (dt, fn, sim = 0) => { t += dt; ev.push({ t, fn, sim }); }; return { ev, at }; };
  const log = (s, txt, kind = '') => s.events.unshift({ at: s.clock, txt, kind });
  const domainOk = (at, d, note) => {
    at(0, (s) => { s.stage = 'domain'; s.detail = `Looking up ${d}, following where its home page lands`; });
    at(700, (s) => { s.detail = 'Comparing it with the Google listing and Search Console'; }, 2);
    at(700, (s) => { s.domainNote = note; log(s, `Domain checked: ${note}`); s.stage = 'sitemap'; s.detail = `Opening ${d}/sitemap.xml`; }, 2);
  };
  const sitemap = (at, n, note) => at(800, (s) => { s.sitemapTotal = n; log(s, note || `${n} pages listed in the sitemap`); s.stage = 'pages'; s.detail = ''; }, 2);
  const read = (at, path, opt = {}) => at(opt.dt ?? 60, (s) => { s.cur = path; s.tries = opt.tries || null; s.kept++; if (opt.link) s.found++; s.rc[opt.r || 1]++; }, opt.sim ?? 1.6);
  const embed = (at, n) => {
    at(400, (s) => { s.cur = null; s.tries = null; s.stage = 'embed'; s.detail = ''; log(s, `All pages read: ${s.kept} kept`); }, 1);
    for (let k = 1; k <= 12; k++) at(140, (s) => { s.embedded = Math.round(n * k / 12); }, 2);
    at(300, (s) => { log(s, 'Every page mapped by what it is about'); }, 1);
  };

  CPS.cases = {
    complete: { key: 'complete', label: 'Complete', practice: 'Liberty Family Dentistry', domain: 'libertyfamilydentistry.com', build() {
      const { ev, at } = mk(); domainOk(at, this.domain, 'same site as the Google listing and Search Console');
      sitemap(at, 159);
      for (let i = 0; i < 159; i++) {
        if (i === 41) { at(120, (s) => { s.cur = lib(i); s.tries = [{ r: 1, msg: 'Turned away (403)' }]; }, 2); at(650, (s) => { s.tries = [{ r: 1, msg: 'Turned away (403)' }, { r: 2, msg: 'Read', ok: 1 }]; s.kept++; s.rc[2]++; log(s, `${lib(i)} read on the plain retry`); }, 3); continue; }
        read(at, lib(i), { dt: i < 6 ? 200 : 45 });
      }
      for (let i = 0; i < 26; i++) read(at, `/reviews-view/${['dawn', 'bret', 'joy', 'rhonda', 'adam', 'tina', 'christine', 'greg', 'kim', 'elza', 'melissa', 'jessica', 'michelle'][i % 13]}`, { link: 1, dt: 45 });
      embed(at, 185);
      at(500, (s) => { s.stage = 'done'; s.done = 'complete'; s.out = { kick: 'Complete', h: 'Kept all 185 pages of libertyfamilydentistry.com',
        p: 'Every one of the 159 pages in the sitemap, plus 26 more found by following links. One page needed a second way in.', misses: [] }; }, 1);
      return ev; } },

    slow: { key: 'slow', label: 'Site slows us down', practice: 'Guava Dental', domain: 'guavadental.com', build() {
      const { ev, at } = mk(); domainOk(at, this.domain, 'same site as the Google listing');
      sitemap(at, 42, '42 pages listed across 3 sitemaps');
      const P = ['/', '/about', '/services', '/new-patients', '/contact', '/team', '/insurance', '/emergency-dentist', '/dental-implants', '/invisalign', '/teeth-whitening', '/pediatric-dentistry', '/root-canal', '/crowns', '/veneers', '/dentures', '/sedation-dentistry', '/oral-surgery', '/periodontics', '/blog', '/reviews'];
      for (let i = 0; i < 42; i++) {
        const p = P[i] ?? `/blog/post-${i}`;
        if (i >= 3 && i <= 7) { at(200, (s) => { s.cur = p; s.tries = [{ r: 1, msg: 'Too many requests (429)' }]; }, 3);
          at(500, (s) => { s.tries = [{ r: 1, msg: 'Too many requests (429)' }, { r: 1, msg: 'Read, after a pause', ok: 1 }]; s.kept++; s.rc[1]++;
            s.slow = i < 7 ? `The site asked us to slow down, so we wait ${[4, 8, 15, 30][i - 3]} seconds between pages` : 'The site is happy again, so we’re speeding back up';
            if (i === 3) log(s, 'The site asked us to slow down (too many requests)', 'note'); if (i === 7) log(s, 'Back to normal speed', 'note'); }, [4, 8, 15, 30, 30][i - 3]); continue; }
        if (i === 18) { at(150, (s) => { s.cur = p; s.tries = [{ r: 1, msg: 'No answer in 15 seconds' }]; }, 15); at(600, (s) => { s.tries = [{ r: 1, msg: 'No answer in 15 seconds' }, { r: 1, msg: 'Read on the second try', ok: 1 }]; s.kept++; s.rc[1]++; log(s, `${p} timed out once, read on the second try`); }, 6); continue; }
        if (i === 9) at(0, (s) => { s.slow = ''; });
        read(at, p, { dt: 110, sim: i < 9 ? 12 : 4 });
      }
      embed(at, 42);
      at(500, (s) => { s.stage = 'done'; s.done = 'complete'; s.out = { kick: 'Complete', h: 'Kept all 42 pages of guavadental.com',
        p: 'The site asked us to slow down early on; we waited, then sped back up once it was happy. One page took two tries.', misses: [] }; }, 1);

    resumed: { key: 'resumed', label: 'Server update mid-crawl', practice: 'Dublin Dental Care', domain: 'dublindentalcare.com', build() {

        if (i === 16) { at(250, (s) => { s.cur = null; s.paused = 'deploy'; log(s, 'Paused for a server update; 16 pages saved', 'warn'); }, 2);
          for (let b = 10; b <= 40; b += 10) at(480, (s) => { s.beat = b; }, 10);

      }

      at(500, (s) => { s.stage = 'done'; s.done = 'complete'; s.out = { kick: 'Complete', h: 'Kept all 25 pages of dublindentalcare.com',

    waiting: { key: 'waiting', label: 'Waiting for a free crawler', practice: 'Smile Haus Dental Studio', domain: 'smilehausdentalstudio.net', wait: 3, build() {

    misses: { key: 'misses', label: 'Firewall on one section', practice: 'Kay Jordan DDS', domain: 'kayjordandds.com', projected: 1, build() {
      const { ev, at } = mk(); domainOk(at, this.domain, 'same site as the Google listing (Cloudflare in front)');

      for (let i = 0; i < 70; i++) {
        if (i % 3 === 2) { const p = `/articles/general/${['flossing', 'gum-disease', 'implants', 'whitening', 'sleep-apnea', 'crowns', 'bonding'][i % 7]}-${i}`;
          at(70, (s) => { s.cur = p; s.tries = [{ r: 1, msg: 'Challenge page (403)' }, { r: 2, msg: 'Refused (403)' }, { r: 3, msg: 'Challenge not passed' }]; s.blocked += 4; s.kept += 4; s.rc[1] += 4;
            s.blockedWhy = 'Cloudflare, the security service in front of the site, turns every way in away on the /articles pages'; if (i === 2) log(s, '/articles pages are behind a firewall challenge; every way in turned away', 'warn'); }, 18); }

  CPS.endings = {

    { name: 'Paid fetch', c: '#334155', tip: 'A paid fetching service reads the page for us: Browserbase’s home-internet addresses first, then ScrapingBee. Only for pages turned away twice, and only pages robots.txt allows. Logged in the cost ledger.' }];

<script>/* #1413 crawl progress mockups: shared pieces (runner, mockup control, CountUp, TurningDot, notes, end card). */
(function () {
  const CP = (window.CP = {});
  CP.STAGES = [
    { k: 'domain', name: 'Check the domain', tip: 'Follows where the home page lands and compares it with the practice’s Google listing and Search Console, so we never crawl the wrong site. Takes 2 to 5 seconds.' },
    { k: 'sitemap', name: 'Read the sitemap', tip: 'The sitemap is the site’s own list of its pages. It tells us how many pages to expect.' },
    { k: 'pages', name: 'Read every page', tip: 'One page at a time, at a pace the site is happy with. Every page is saved as soon as it is read, so nothing is lost if the server restarts.' },
    { k: 'embed', name: 'Map what each page is about', tip: 'Turns each page’s text into a position on a map of meaning, so the Relevance Analyzer can see which topics the site covers. Runs on its own after every crawl.' }];
  CP.CASE = 'complete'; CP.END = null;
  const stageIdx = (s) => (s.done ? 99 : s.stage === 'wait' ? -1 : CP.STAGES.findIndex((x) => x.k === s.stage));
  CP.stageIdx = stageIdx;

  CP.run = function (draw) {
    clearInterval(CP._t);
    const c = CPS.cases[CP.CASE]; const who = FL.$('.fl-right .who'); if (who) who.textContent = c.practice; const ev = c.build(); const s = CPS.fresh(c); let i = 0; const t0 = performance.now();
    const step = (to) => { while (i < ev.length && ev[i].t <= to) { s.clock += ev[i].sim || 0; ev[i].fn(s); i++; } if (CP.END && i >= ev.length) CP.applyEnd(s); draw(s); if (i >= ev.length) clearInterval(CP._t); };
    CP._t = setInterval(() => step(performance.now() - t0), 50);
    CP.skip = () => step(Infinity); step(0);
  };
  CP.applyEnd = (s) => { const e = CPS.endings[CP.END]; s.done = 'other'; s.out = { kick: e.kick, h: e.h, p: e.p, bad: 1, misses: [], sample: 1 }; };

  CP.ctl = function (host, rerender, opt = {}) {
    const cases = opt.cases || Object.keys(CPS.cases); const ends = opt.endings === false ? [] : Object.keys(CPS.endings);
    const c = FL.h(`<div class="s1-ctl"><b>Mockup</b> case:
      ${cases.map((k) => `<button data-c="${k}">${FL.esc((CPS.cases[k] || {}).label || k)}</button>`).join('')}
      ${ends.length ? `<span class="sep"></span>other endings: ${ends.map((k) => `<button data-x="${k}">${FL.esc(CPS.endings[k].kick)}</button>`).join('')}` : ''}
      <span class="sep"></span><button data-a="replay">Replay</button><button data-a="skip">Skip to the end</button></div>`);
    const mark = () => { FL.$$('button[data-c]', c).forEach((b) => b.classList.toggle('on', b.dataset.c === CP.CASE && !CP.END)); FL.$$('button[data-x]', c).forEach((b) => b.classList.toggle('on', b.dataset.x === CP.END)); };
    c.onclick = (e) => { const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.c) { CP.CASE = b.dataset.c; CP.END = null; mark(); rerender(); }
      if (b.dataset.x) { CP.END = b.dataset.x; mark(); rerender(); setTimeout(() => CP.skip(), 30); }
      if (b.dataset.a === 'replay') rerender(); if (b.dataset.a === 'skip') CP.skip(); };
    mark(); host.appendChild(c);
  };

  /* CountUp: eases a number to its new value (kit CountUp: 0.6 s, ease .2,.8,.2,1) */
  CP.count = function (el, v) {
    if (!el) return; const from = el._v ?? 0; if (from === v) return; el._v = v; const t0 = performance.now();
    cancelAnimationFrame(el._raf);
    const tick = (t) => { const k = Math.min(1, (t - t0) / 600); const e = 1 - Math.pow(1 - k, 3); el.textContent = FL.fmt(Math.round(from + (v - from) * e)); if (k < 1) el._raf = requestAnimationFrame(tick); };
    el._raf = requestAnimationFrame(tick);
  };
  CP.dot = () => '<span class="cp-dot"></span>';
  CP.spin = () => '<span class="cp-spin"></span>';
  CP.tip = (word, head, text) => `<span class="tipword" data-tip-h="${FL.esc(head)}" data-tip="${FL.esc(text)}">${word}</span>`;
  CP.rung = (r, label) => `<span class="s1-rg" data-tip-h="${r}. ${CPS.R[r].name}" data-tip="${FL.esc(CPS.R[r].tip)}"><i style="background:${CPS.R[r].c}"></i>${label ?? CPS.R[r].name}</span>`;
  CP.tries = (tries) => (tries || []).map((x) => `<span class="s1-try ${x.ok ? 'ok' : 'no'}">${CP.rung(x.r, `${x.r}`)}<span>${FL.esc(x.msg)}</span></span>`).join('<span class="s1-arr">›</span>');
  CP.t = (sec) => `${Math.floor(sec / 60)}:${String(Math.round(sec % 60)).padStart(2, '0')}`;
  CP.mins = (sec) => (sec < 60 ? 'under a minute' : `${Math.round(sec / 60)} min`);

  /* the plain notes that can sit under the live numbers; one line each, newest state only */
  CP.notes = function (s) {
    const n = [];
    if (s.paused === 'deploy') n.push({ k: 'warn', t: `Paused for a server update. Every page read so far is saved; the crawl picks back up on its own in about a minute.` });
    if (s.paused === 'browser') n.push({ k: 'warn', t: 'The browser connection dropped. Opening a new one and carrying on from the same page.' });
    if (s.slow) n.push({ k: 'note', t: s.slow });
    if (s.blocked) n.push({ k: 'warn', t: `${FL.fmt(s.blocked)} pages turned away so far. ${s.blockedWhy}` });
    if (!s.paused && (s.resumes || s.reconnects)) n.push({ k: 'ok', t: [s.resumes ? 'Picked back up after a server update' : '', s.reconnects ? `reopened the browser ${s.reconnects === 1 ? 'once' : `${s.reconnects} times`}` : ''].filter(Boolean).join(', and ').replace(/^r/, 'R') + '. No pages lost.' });
    return n;
  };
  CP.notesHtml = (s, cls = 'cp-notes') => { const n = CP.notes(s); return n.length ? `<div class="${cls}">${n.map((x) => `<div class="cp-note ${x.k}">${x.t}</div>`).join('')}</div>` : ''; };
  CP.fresh = (s) => (s.paused === 'deploy' ? `last update ${s.beat || 5} s ago` : 'updated just now');
  CP.waitLine = (s) => `Waiting for a free crawler. ${s.ahead} ${s.ahead === 1 ? 'crawl is' : 'crawls are'} running for other practices; this one starts as soon as one finishes.`;

  CP.end = function (s, extra = '') {
    const o = s.out; const bad = o.bad;
    const misses = o.misses.length ? `<div class="cp-miss">${o.misses.map(([a, b]) => `<div><b>${FL.esc(a)}</b><span>${FL.esc(b)}</span></div>`).join('')}</div>` : '';
    const proj = CPS.cases[CP.CASE].projected && !CP.END ? SA.sample('A projection from the #1412 re-crawl: today’s crawler reads 0 sitemap pages here (a namespace bug) and stops at 200 pages.') : '';
    return `<div class="s1-end ${bad ? 'bad' : 'ok'}"><div class="kick" ${bad ? 'style="color:var(--now)"' : ''}>${FL.esc(o.kick)}${o.sample ? SA.sample('No crawl has ended this way in the records we read; wording and numbers are an example.') : ''}${proj}</div>
      <h2>${FL.esc(o.h)}</h2><p>${FL.esc(o.p)}</p>${misses}
      <div class="s1-endrow"><div class="s1-next">${bad ? 'Pages read before the stop are kept.' : 'Saved as the crawl for this practice, dated today. Every tool reuses it for 30 days.'}</div>
      <div style="display:flex;gap:8px">${extra || (bad ? '<button class="btn btn-go" onclick="FL.toast(\'Starts the crawl again (not part of this mockup).\')">Try again</button>' : '<button class="btn btn-go" onclick="FL.toast(\'Opens the result (not part of this mockup).\')">See the audit</button>')}</div></div></div>`;
  };
})();
</script>

/* #1413 screen 2: the "Check the domain" step, every named cause from #1409, with its actions. */
const C2 = { CASE: 'pass' };
C2.ctl = (host, go) => { const c = FL.h(`<div class="s1-ctl"><b>Mockup</b> case: ${Object.entries(C2CASES).map(([k, v]) => `<button data-c="${k}">${FL.esc(v.label)}</button>`).join('')}<span class="sep"></span><button data-a="replay">Replay</button></div>`);

C2.btn = ([k, label, hint]) => k === 'input' ? `<span class="c2-in"><input class="c2-input" placeholder="${hint ? '(the website on the Google listing)' : 'practice-website.com'}">${hint ? SA.sample('The Google listing’s website is read live from Google; this mockup does not have it.') : ''}<button class="btn btn-line" onclick="FL.toast('Checks the new domain, then crawls it.')">${FL.esc(label)}</button></span>`
  : k === 'save' ? `<button class="btn btn-quiet" data-tip-h="Save as the website" data-tip="Updates the stored website on the client and on its strategies, together. Logged with who, when, and the old and new address. The crawl never changes it on its own." onclick="FL.toast('Saved and logged (not part of this mockup).')">${FL.esc(label)}</button>`
  : `<button class="btn ${k === 'go' ? 'btn-go' : 'btn-line'}" onclick="FL.toast('${k === 'go' ? 'Starts the crawl on that site.' : 'Not part of this mockup.'}')">${FL.esc(label)}</button>`;
C2.flags = (c) => [c.unverified, c.note, c.combo ? 'Two #1409 rows meet here (broken certificate + a witness naming another site); the actions combine both.' : '', c.flag ? 'The #1409 ruling says “note that Google is blocked too”. That is true only for sites not launched yet; Lefberg lets Google in, so this wording differs.' : ''].filter(Boolean);
C2.flagHtml = (c) => C2.flags(c).map((f) => `<div class="c2-flag">${SA.sample(f)}<span>${FL.esc(f)}</span></div>`).join('');
C2.verdict = (c) => { const cls = { go: 'ok', stop: 'bad', rest: 'rest', warn: 'warn' }[c.kind];
  return `<div class="c2-v ${cls}"><div class="c2-vt">${c.kind === 'go' ? '<span class="c2-ok">✓</span>' : c.kind === 'stop' ? '<span class="c2-x">×</span>' : c.kind === 'warn' ? '<span class="c2-w">!</span>' : '<span class="c2-r">–</span>'}<b>${FL.esc(c.title)}</b>${c.sample ? SA.sample('A prospect case built from Twinkle Tooth’s real stored site; no prospect crawl has run this way.') : ''}</div>
    <p>${FL.esc(c.line)}</p>${c.actions.length ? `<div class="c2-acts">${c.actions.map(C2.btn).join('')}</div>` : ''}${C2.flagHtml(c)}</div>`; };
C2.after = (c) => (c.kind === 'go' ? 'go' : 'stop');
C2.checking = ['Looking up the address', 'Following where the home page lands', 'Comparing it with the Google listing and Search Console'];
C2.run = (host, draw) => { clearTimeout(C2._t); let k = 0; const tick = () => { draw(k); if (k < 3) { k++; C2._t = setTimeout(tick, 650); } }; tick(); };

/* round 2 (owner 10/30): verdict first inside screen 1 C's live line, the evidence table under it, then the log */
C2.table = (c, k) => `<div class="c2b-tab card"><div class="c2b-hd"><span>Where it comes from</span><span>Address</span><span>Lands on</span><span></span></div>${c.rows.map((r, i) => { const shown = k >= 3 || i < k;
  return `<div class="c2b-row ${shown ? r[3] : 'wait'}"><span class="src">${FL.esc(r[0])}</span><span class="url">${FL.esc(r[1]) || '<span class="c2-none">none</span>'}</span><span class="land">${shown ? (r[3] === 'none' && !r[2] ? '<span class="c2-none">nothing to compare</span>' : `<span class="arr">→</span>${FL.esc(r[2])}`) : '<span class="s1-turn"></span>'}</span><span class="mark">${shown ? { same: '<i class="ok">✓</i>', diff: '<i class="d">≠</i>', bad: '<i class="x">×</i>', none: '' }[r[3]] : ''}</span></div>`; }).join('')}</div>`;
C2.log = (c, k) => { const L = [[1, `Looked up ${c.typed || 'the stored website'}`]];
  if (k >= 2) L.push([2, c.rows[0][3] === 'bad' || c.rows[0][3] === 'none' ? `Home page: ${c.rows[0][2]}` : `Home page lands on ${c.rows[0][2]}`]);
  if (k >= 3) { c.rows.slice(1).forEach((r) => L.push([3, `${r[0]}: ${r[3] === 'none' ? 'nothing to compare' : r[3] === 'same' ? `${r[2]}, matches` : r[2]}`])); L.push([4, c.title]); }
  return L.reverse().map(([t, x], i) => `<div class="c1c-ev ${i === 0 && k >= 3 ? { go: 'ok', stop: 'warn', rest: '', warn: 'warn' }[c.kind] : ''}"><span class="cp-mono">0:0${t}</span><span>${FL.esc(x)}</span></div>`).join(''); };
const C2V = { name: 'Verdict first in the live line, where each address lands under it', render(host) {
  const go = () => { host.innerHTML = ''; C2.ctl(host, go); const c = C2CASES[C2.CASE]; FL.$('.fl-right .who').textContent = c.practice;
    host.appendChild(FL.h(`<div class="c1c"><div class="kick">Site Audit · crawl</div><h1 class="h1">${c.typed ? `Reading ${FL.esc(c.typed.replace(/^www\./, ''))}` : FL.esc(c.practice)}</h1>
      <div class="c1c-strip card"></div><div class="s1a-logh">Where each address lands</div><div class="c2-ev"></div><div class="s1a-logh">What happened</div><div class="c1c-log card"></div></div>`));
    C2.run(host, (k) => { const done = k >= 3; const ok = done && c.kind === 'go';
      const seg = CP.STAGES.map((st, i) => { const cl = i === 0 ? (!done ? 'on' : ok ? 'done' : c.kind === 'rest' ? 'rest' : 'bad') : ok && i === 1 ? 'on' : ''; return `<span class="c1c-seg ${cl}" data-tip-h="${st.name}" data-tip="${FL.esc(st.tip)}"><i></i>${st.name}</span>`; }).join('');
      host.querySelector('.c1c-strip').innerHTML = `<div class="c1c-segs">${seg}</div>${!done ? `<div class="c1c-line">${CP.dot()}<span>Checking the domain: ${C2.checking[k].toLowerCase()}…</span><span class="cp-mono c1c-fresh">2 to 5 seconds</span></div>`
        : `<div class="c2-in-strip">${C2.verdict(c)}</div>${ok ? `<div class="c1c-line">${CP.dot()}<span>Reading the sitemap: opening ${FL.esc(c.rows[0][2])}/sitemap.xml</span><span class="cp-mono c1c-fresh">updated just now</span></div>` : ''}`}`;
      host.querySelector('.c2-ev').innerHTML = C2.table(c, k);
      host.querySelector('.c1c-log').innerHTML = C2.log(c, k); }); };
  go();
} };

window.SCREEN = {
  title: 'Crawl progress 2: checking the domain, every named cause',
  mock: `<b>Crawl progress · 2 Checking the domain, round 2</b> <span class="src">· owner picks Oct 30: screen 1 C for the strip; here the verdict leads inside that live line, the “where each address lands” table sits under it as the evidence, then the log. Every #1409 cause on a real practice from the Oct 30 domain check: Liberty, Smile Haus, SST, Twinkle Tooth, Duck Duck Tooth (live domain read off the staging page Oct 30), Hilltop (Squarespace “Coming Soon”), Winter Garden (no DNS, rechecked Oct 30), Westfield Center (certificate expired Jul 30), Lefberg (robots.txt allowlist), Whole Dental (parked leftover), Gulf Breeze (no domain).</span>
<span class="nr">Approved Oct 30: Lefberg says “Google can still read the site”; Westfield shows both causes’ buttons. Green check = crawl goes ahead; red cross = stopped with a cause; grey dash = nothing to crawl, not a failure; “!” = waits for a click. Buttons do nothing here.</span>`,
  right: '<span class="who">Liberty Family Dentistry</span><span class="when">Started today, 2:14 PM</span>',
  variants: { C: C2V },
};
</script>
