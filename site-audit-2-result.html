<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Site Audit 2: Result page</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>.oq-rail{position:fixed;inset:0 auto 0 0;width:56px;background:#fff;border-right:1px solid rgba(231,229,228,.6);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px;z-index:40}.oq-rail-item{width:39px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#44403c}.oq-rail-item:hover{background:#f5f5f4}.oq-rail-item.is-active{background:#1c1917;color:#fff}.oq-rail-item:first-child{color:#a8a29e;margin-bottom:8px}.oq-rail-sep{width:24px;height:1px;background:#e7e5e4;margin:6px 0}.oq-rail-foot{margin-top:auto}.oq-rail-av{position:relative;display:flex;width:28px;height:28px;border-radius:6px;background:#e7e5e4;color:#44403c;font:600 10px Inter,system-ui;align-items:center;justify-content:center}.oq-rail-av i{position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-radius:2px;background:#16a34a;border:2px solid #fff}
/* Market Trends Story mockups, round 2. Facelift shared look (AIV experience in OQ teal), trimmed. */
:root{
  --ink:#0B1020;--ink2:#0F172A;--body:#273043;--muted:#667085;--faint:#98A2B3;--line:#E7E9EE;--soft:#F6F7FA;
  --a:#0F766E;--aInk:#115E59;--aTint:#E6F4F1;--aSoft:#99D5CC;
  --up:#15803D;--down:#E11D48;--rose:#DB2777;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.55;color:var(--body);background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:var(--aInk)}

/* mockup bar: outside the design */
.mockbar{background:#ECEEF1;color:#4B5563;font-size:12px;line-height:1.45;padding:7px 18px;border-bottom:1px solid #DDE1E6}
.mockbar b{color:#111827;font-weight:700}
.mockbar .src{color:#6B7280}
.mockbar ul{margin:3px 0 0;padding:0 0 0 16px}
.mockbar li{margin:0}
.mockbar .nr{display:inline-block;margin-top:3px;color:#6B7280}

/* app chrome */
.fl-app{margin-left:56px;min-height:100vh}
.mockbar{margin-left:56px}
.fl-main{min-width:0}
.fl-wrap{max-width:1240px;margin:0 auto;padding:0 28px 120px}
.fl-top{position:sticky;top:0;z-index:30;margin:0 -28px 0;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #EEF0F4}
.fl-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;color:var(--ink)}
.fl-mark{width:26px;height:26px;border-radius:8px;background:var(--a);display:grid;place-items:center;flex:none}
.fl-mark svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8}
.fl-right{display:flex;align-items:center;gap:12px;font-size:13px;flex-wrap:wrap;justify-content:flex-end}
.fl-right .who{color:var(--ink);font-weight:700}
.fl-right .when{color:var(--muted)}
.btn{border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13.5px;transition:background .2s,box-shadow .2s}
.btn-go{background:var(--a);color:#fff;box-shadow:0 6px 18px rgba(15,118,110,.25)}
.btn-line{background:#fff;border:1px solid var(--line);color:var(--ink);padding:7px 12px;font-size:13px}
.btn-line:hover{background:var(--soft)}
.method-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;border-radius:8px;padding:6px 10px;font-weight:600;color:var(--aInk);position:relative;font-size:13.5px}
.method-btn:hover{background:var(--aTint)}
.method-btn .dot{width:14px;height:14px;border-radius:50%;background:var(--a);position:relative}
.method-btn .dot:after{content:'';position:absolute;inset:3.5px;border-radius:50%;border:1px dotted #fff}
.teaser{position:absolute;right:0;top:100%;margin-top:8px;width:300px;z-index:40;border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px 16px;font-size:13px;font-weight:400;line-height:1.5;color:var(--body);text-align:left;box-shadow:0 12px 32px rgba(11,16,32,.12)}

/* tabs */
.tabs{position:sticky;top:55px;z-index:20;display:flex;gap:26px;margin:0 -28px 6px;padding:10px 28px 0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(12px)}
.tabs button{position:relative;border:0;background:none;padding:0 0 10px;font-size:15px;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--ink)}
.tabs .ink{position:absolute;bottom:-1px;height:2px;background:var(--a);transition:left .3s var(--ease),width .3s var(--ease)}
.tabnote{padding:60px 0;color:var(--muted);font-size:14px}

/* modal (How it works) */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:5vh 16px}
.modal .bd{position:fixed;inset:0;background:rgba(11,16,32,.4)}
.modal .win{position:relative;width:100%;max-width:880px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:24px 28px;box-shadow:0 24px 60px rgba(11,16,32,.18);animation:rise .25s var(--ease)}
.modal .x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);border-radius:6px;padding:4px 8px}
.msec{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:center;border-top:1px solid var(--line);padding:20px 0}
.msec h3{margin:0 0 8px;font-size:16.5px;color:var(--ink)}
.msec p{margin:8px 0;font-size:15px;line-height:1.6}
.msec figure{margin:0}
.msec figcaption{margin-top:6px;text-align:center;font-size:12px;color:var(--muted)}
.figbox{height:200px;overflow:hidden;border-radius:8px;background:var(--soft)}
.figbox svg{display:block;width:100%;height:100%}
.figbox svg *{transition:opacity .45s, fill .45s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:300;background:var(--ink);color:#fff;border-radius:8px;padding:12px 18px;font-size:14px;box-shadow:0 12px 32px rgba(11,16,32,.25);animation:rise .25s var(--ease)}
.tipcard{position:fixed;z-index:200;width:280px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:10px 14px;font-size:13px;line-height:1.5;color:var(--body);box-shadow:0 12px 32px rgba(11,16,32,.12);pointer-events:none}
.tipcard b{display:block;color:var(--aInk);font-size:13px;margin-bottom:2px}
.tipword{border-bottom:1px dotted var(--faint);cursor:help}

/* Story */
.story{display:grid;grid-template-columns:minmax(0,1fr) 600px;gap:44px}
.chap{min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding:24px 0;opacity:.25;transition:opacity .4s}
.chap.on{opacity:1}
.chap .k{margin-bottom:12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--aInk)}
.chap .k .act{color:var(--muted)}
.chap h2{margin:0;font-size:36px;font-weight:900;line-height:1.12;letter-spacing:-.025em;color:var(--ink)}
.chap h2 .g{color:var(--a)}
.chap h2 .r{color:var(--down)}
.chap p{margin:14px 0 0;max-width:540px;font-size:17px;line-height:1.6}
.defs{margin-top:18px;max-width:540px;padding:12px 14px;background:#F8FAFB;border:1px solid var(--line);border-radius:6px}
.defs .dh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.chap .defs p{margin:0;font-size:13.5px;line-height:1.55;color:#273043}
.chap .defs p+p{margin-top:6px}
.chap .note{font-size:13.5px;color:var(--muted);margin-top:12px}
.facts{margin-top:18px;max-width:540px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.facts div{padding:9px 10px 9px 0;border-bottom:1px solid var(--line)}
.facts b{display:block;font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.facts span{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.qlist{margin-top:16px;max-width:540px;border-top:1px solid var(--line)}
.qlist div{display:grid;grid-template-columns:minmax(0,1fr) 70px 54px;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.qlist div span:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.qlist .h span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)!important}
.stick{position:sticky;top:104px;height:calc(100vh - 112px);display:flex;flex-direction:column;justify-content:center}
.ro{height:52px;padding:4px 2px 6px;border-bottom:1px solid #EEF0F3;margin-bottom:6px;overflow:hidden}
.ro .r1{display:flex;justify-content:space-between;align-items:baseline;height:20px;font-size:13px;white-space:nowrap}
.ro .r1 .m{font-weight:700;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.ro .r1 .n{color:var(--muted);font-size:12px;margin-left:12px}
.ro .r2{display:grid;height:22px;align-items:center;gap:10px;font-size:12.5px;white-space:nowrap}
.ro .r2 .s{display:flex;align-items:center;gap:6px;overflow:hidden;min-width:0}
.ro .r2 .s b{color:var(--ink2);font-variant-numeric:tabular-nums}
.ro .r2 .s span{color:var(--body);overflow:hidden;text-overflow:ellipsis}
.ro .r2 .s svg{flex:none}
.ro .r2 .txt{grid-column:1/-1;color:var(--body);overflow:hidden;text-overflow:ellipsis}
.figsvg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.figsvg text{font-family:Inter,sans-serif}
.figsvg .num{font-variant-numeric:tabular-nums}
.figcap{margin-top:6px;min-height:36px;font-size:12.5px;line-height:1.45;color:var(--muted);text-align:center}
.storyend{margin:24px 0 0;padding:28px;border:1px solid var(--line);border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;opacity:0;transform:translateY(14px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.storyend.in{opacity:1;transform:none}
.storyend h3{margin:0;font-size:24px;font-weight:900;color:var(--ink);letter-spacing:-.02em}
.storyend p{margin:4px 0 0;color:var(--muted);font-size:14px}
@media (max-width:1180px){.story{grid-template-columns:minmax(0,1fr) 520px;gap:32px}}
@media (max-width:980px){.story{grid-template-columns:1fr}.stick{position:static;height:auto}.chap{opacity:1;min-height:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

/* Site Audit mockups (#1426): additions on top of the approved facelift base. */
:root{--now:#DC2626;--nowTint:#FEF2F2;--soon:#2563EB;--soonTint:#EFF6FF;--tidy:#A3ACB9;--tidyTint:#F4F5F7}
.lv{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--ink)}
.lv i{width:9px;height:9px;border-radius:2px;display:inline-block}
.lv.now i{background:var(--now)}.lv.soon i{background:var(--soon)}.lv.tidy i{background:var(--tidy)}
.sample{display:inline-block;margin-left:6px;padding:0 5px;border:1px dashed #C3C8D2;border-radius:4px;font-size:10.5px;font-weight:600;color:#6B7280;letter-spacing:.02em;vertical-align:1px}
.card{border:1px solid var(--line);border-radius:8px;background:#fff}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px}
.url{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;color:var(--ink2)}
.kick{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--aInk)}
.h1{margin:6px 0 0;font-size:34px;font-weight:900;line-height:1.12;letter-spacing:-.025em;color:var(--ink)}
.sub{margin:8px 0 0;color:var(--muted);font-size:15px}
/* variant switcher: outside the design */
.vbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:500;display:flex;align-items:center;gap:4px;background:#111827;color:#fff;border-radius:10px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13px}
.vbar button{border:0;background:none;color:#fff;border-radius:7px;padding:6px 10px}
.vbar button:hover{background:#374151}
.vbar button.on{background:#fff;color:#111827;font-weight:700}
.vbar .lbl{padding:0 10px;color:#D1D5DB;white-space:nowrap}
.vbar a{color:#9CA3AF;text-decoration:none;padding:0 8px;font-size:12px}

/* #1426 screen 2: result page */
.sa-now{color:var(--now)}
.sa-meta{display:flex;align-items:center;gap:14px;margin-top:14px;font-size:13px;color:var(--muted)}
.sa-meta span+span:before{content:'·';margin-right:14px;color:var(--faint)}
.sa-link{border:0;background:none;padding:0;color:var(--aInk);font-weight:600;font-size:13px}
.sa-link:hover{text-decoration:underline}
.sa-acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.sa-go{color:var(--aInk);font-size:12.5px;font-weight:600;opacity:0;transition:opacity .2s}
.sa-irow:hover .sa-go,.sa-brow:hover .sa-go{opacity:1}
.sa-key{display:flex;gap:16px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.sa-key .lv{font-weight:500;font-size:12.5px;color:var(--body)}
.lv.tidy i{background:#fff!important;border:2px solid var(--tidy);width:9px;height:9px;box-sizing:border-box}
/* issue rows (A, C) */
.sa-ilist{margin-top:18px;max-width:540px;border-top:1px solid var(--line)}
.sa-irow{display:grid;grid-template-columns:minmax(0,1fr) 80px 44px;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 4px;text-align:left;font-size:14px;color:var(--ink2)}
.sa-irow b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.sa-irow:hover{background:var(--soft)}
/* A */
.sa-a .chap h2{font-size:32px}
.sa-a .facts .lv{font-weight:500;font-size:12px;color:var(--muted)}
.sa-a .stick svg{max-height:calc(100vh - 170px)}
/* B */
.sa-b{max-width:860px;margin:0 auto;padding-top:36px}
.sa-bhead{display:flex;justify-content:space-between;align-items:baseline}
.sa-bhead .sa-meta{margin:0}
.sa-big{margin:10px 0 0;font-size:36px;font-weight:900;line-height:1.14;letter-spacing:-.025em;color:var(--ink);max-width:820px}
.sa-secs{margin-top:34px;border-top:1px solid var(--line)}
.sa-sec{border-bottom:1px solid var(--line)}
.sa-sech{display:grid;grid-template-columns:110px auto minmax(0,1fr) 44px;align-items:center;gap:14px;width:100%;border:0;background:none;padding:16px 2px;text-align:left}
.sa-sech .lv{font-size:15px}
.sa-secn{font-size:13px;color:var(--muted);white-space:nowrap}
.sa-peek{font-size:13px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sa-chev{font-size:12.5px;font-weight:600;color:var(--aInk);text-align:right}
.sa-secb{display:none;padding:0 0 12px}
.sa-sec.open .sa-secb{display:block;animation:rise .3s var(--ease)}
.sa-brow{display:grid;grid-template-columns:minmax(0,1fr) 110px 70px 44px;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:6px;padding:9px 10px;text-align:left;font-size:14.5px;color:var(--ink2)}
.sa-brow:hover{background:var(--soft)}
.sa-brow .ct{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);font-size:13.5px}
.sa-bar{display:block;width:100px;height:6px;background:#F1F2F5;border-radius:3px;overflow:hidden}
.sa-bar i{display:block;height:100%;border-radius:3px}
.sa-bar i.now{background:var(--now)}.sa-bar i.soon{background:var(--soon)}.sa-bar i.tidy{background:#94A3B8}
/* C */
.sa-c{padding-top:30px}
.sa-chead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.sa-chead .sa-big{font-size:32px;max-width:760px}
.sa-chead .sa-acts{margin:0;flex:none}
.sa-nowbox{margin-top:26px;border:1px solid var(--line);border-radius:8px;padding:12px 16px 6px;background:var(--nowTint)}
.sa-nowh{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:4px}
.sa-nowbox .sa-irow{border-bottom-color:#F6DADA}
.sa-nowbox .sa-irow:last-child{border-bottom:0}
.sa-nowbox .sa-irow:hover{background:rgba(255,255,255,.6)}
.sa-maph{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:6px 24px;margin-top:34px}
.sa-maph h3{margin:0;font-size:18px;color:var(--ink)}
.sa-maph p{margin:0;grid-column:1;font-size:14px;color:var(--muted)}
.sa-maph .sa-key{grid-column:2;grid-row:1/3;margin:0}
.sa-map{margin-top:14px;border-top:1px solid var(--line)}
.sa-fcols,.sa-fh{display:grid;grid-template-columns:150px 54px 54px minmax(0,1fr);gap:12px;align-items:start}
.sa-fcols{padding:8px 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line)}
.sa-fcols span:nth-child(2),.sa-fcols span:nth-child(3){text-align:right}
.sa-frow{border-bottom:1px solid var(--line)}
.sa-fh{width:100%;border:0;background:none;padding:11px 4px;text-align:left}
.sa-fh:hover{background:var(--soft)}
.sa-fh .ct,.sa-fh .wd{text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--ink);font-weight:600}
.sa-fh .wd.zero{color:var(--now)}
.sqs{display:flex;flex-wrap:wrap;gap:3px;padding-top:3px}
.q{width:11px;height:11px;border-radius:2px;display:block}
.q.now{background:var(--now)}.q.soon{background:var(--soon)}.q.tidy{background:#fff;box-shadow:inset 0 0 0 2px var(--tidy)}.q.ok{background:#E4E7EC}
.sa-fb{display:none;padding:2px 4px 12px 220px}
.sa-frow.open .sa-fb{display:block;animation:rise .3s var(--ease)}
.sa-fb .sa-irow{font-size:13.5px}
.sa-fb .lv{gap:0}
.sa-none{font-size:13px;color:var(--muted);padding:6px 0}

<script>/* Shared pieces for the round 2 Story mockups: frame, tabs, hovers, How it works window,
   and a small tween engine for ONE persistent SVG (marks keyed by id, never unmounted). */
(function () {
  const FL = (window.FL = {});
  FL.reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  FL.esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  FL.$ = (s, r = document) => r.querySelector(s);
  FL.$$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  FL.h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  FL.fmt = (n) => Number(n).toLocaleString('en-US');
  FL.round = (n, to) => Math.round(n / to) * to;
  FL.toast = (msg) => { const t = FL.h(`<div class="toast">${FL.esc(msg)}</div>`); document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };

  /* ---------- frame ---------- */
  FL.shell = function ({ mock }) {
    const page = document.getElementById('page');
    const bar = FL.h(`<div class="mockbar">${mock}</div>`);
    const app = FL.h(`<div class="fl-app">

      <main class="fl-main"><div class="fl-wrap">
        <div class="fl-top"><div class="fl-brand"><span class="fl-mark"><svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg></span>Market Trends</div>
          <div class="fl-right"><span id="method-slot"></span><span class="who">Expedition Pediatric Dentistry</span><span class="when">Check #22 · Oct 29, 2026 · read for Washington</span>
          <button class="btn btn-line" id="share">Share report</button><button class="btn btn-line" id="newc">New check</button></div></div>
      </div></main></div>`);
    page.parentNode.insertBefore(bar, page);
    page.parentNode.insertBefore(app, page);
    app.querySelector('.fl-wrap').appendChild(page);
    FL.$('#method-slot').innerHTML = '<button type="button" class="method-btn"><span class="dot"></span>How it works</button>';
    FL.$('#share').onclick = () => FL.toast('Opens the client report: link, access code, PDF and email.');
    FL.$('#newc').onclick = () => FL.toast('Starts a new check (not part of this mockup).');
  };

  FL.tabs = function (host, { tabs, value, onChange }) {
    host.classList.add('tabs');
    host.innerHTML = tabs.map((t) => `<button type="button" data-k="${t.key}">${FL.esc(t.label)}</button>`).join('') + '<span class="ink"></span>';
    const ink = host.querySelector('.ink');
    const set = (k, fire) => {
      host.querySelectorAll('button').forEach((b) => { const on = b.dataset.k === k; b.classList.toggle('on', on); if (on) { ink.style.left = `${b.offsetLeft}px`; ink.style.width = `${b.offsetWidth}px`; } });
      if (fire && onChange) onChange(k);
    };
    host.querySelectorAll('button').forEach((b) => { b.onclick = () => set(b.dataset.k, true); });
    requestAnimationFrame(() => set(value, false));
  };

  /* branded hover for words in the text (never over the chart) */
  let tipEl = null; let tipFor = null; let tipT = null;
  const hideTip = () => { clearTimeout(tipT); tipEl?.remove(); tipEl = null; tipFor = null; };
  document.addEventListener('mouseover', (e) => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (t === tipFor) return; hideTip(); if (!t) return; tipFor = t;
    tipT = setTimeout(() => {
      const r = t.getBoundingClientRect();
      tipEl = FL.h(`<div class="tipcard">${t.dataset.tipH ? `<b>${FL.esc(t.dataset.tipH)}</b>` : ''}${FL.esc(t.dataset.tip)}</div>`);
      document.body.appendChild(tipEl);
      tipEl.style.left = `${Math.max(8, Math.min(r.left, innerWidth - 288))}px`;
      if (innerHeight - r.bottom < 130) tipEl.style.bottom = `${innerHeight - r.top + 6}px`; else tipEl.style.top = `${r.bottom + 6}px`;
    }, 120);
  });
  addEventListener('scroll', hideTip, true);

  /* How it works: teaser on hover, window on click, a looping real-data picture per section */
  FL.method = function ({ teaser, title, sections }) {
    const btn = FL.$('.method-btn'); let tip = null;
    btn.addEventListener('mouseenter', () => { if (!tip) { tip = FL.h(`<span class="teaser">${FL.esc(teaser)}</span>`); btn.appendChild(tip); } });
    btn.addEventListener('mouseleave', () => { tip?.remove(); tip = null; });
    btn.addEventListener('click', () => {
      tip?.remove(); tip = null;
      const m = FL.h(`<div class="modal"><div class="bd"></div><div class="win" role="dialog" aria-modal="true">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px">
          <div><div style="font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--aInk)">Market Trends</div><h2 style="margin:2px 0 0;font-size:26px;font-weight:900;letter-spacing:-.02em;color:var(--ink)">${FL.esc(title)}</h2></div>
          <button class="x" aria-label="Close">×</button></div>
        ${sections.map((s, i) => `<section class="msec"><div><h3>${FL.esc(s.title)}</h3>${s.body.map((p) => `<p>${p}</p>`).join('')}</div>
          <figure><div class="figbox" data-fig="${i}"></div><figcaption>${FL.esc(s.caption)}</figcaption></figure></section>`).join('')}
      </div></div>`);
      document.body.appendChild(m);
      const stops = sections.map((s, i) => s.figure(m.querySelector(`[data-fig="${i}"]`)));
      const close = () => { stops.forEach((f) => f && f()); m.remove(); removeEventListener('keydown', onKey); };
      const onKey = (e) => { if (e.key === 'Escape') close(); };
      addEventListener('keydown', onKey);
      m.querySelector('.bd').onclick = close; m.querySelector('.x').onclick = close;
    });
  };
  FL.loop = function (count, ms, fn) {
    let s = FL.reduce ? count - 1 : 0; fn(s);
    if (FL.reduce) return () => {};
    const t = setInterval(() => { s = (s + 1) % count; fn(s); }, ms);
    return () => clearInterval(t);
  };

  /* ---------- easing + tween engine ---------- */
  function bez(p1x, p1y, p2x, p2y) {
    const cx = 3 * p1x; const bx = 3 * (p2x - p1x) - cx; const ax = 1 - cx - bx;
    const cy = 3 * p1y; const by = 3 * (p2y - p1y) - cy; const ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t; const sy = (t) => ((ay * t + by) * t + cy) * t; const ds = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x; for (let i = 0; i < 8; i++) { const e = sx(t) - x; const d = ds(t); if (Math.abs(e) < 1e-5 || Math.abs(d) < 1e-6) break; t -= e / d; } return sy(t); };
  }
  FL.EASE = bez(0.2, 0.8, 0.2, 1);
  const NS = 'http://www.w3.org/2000/svg';
  FL.NS = NS;
  const NUM = ['x', 'y', 'width', 'height', 'cx', 'cy', 'r', 'x1', 'y1', 'x2', 'y2', 'tx', 'ty', 's', 'sx'];
  const STY = { o: 'opacity', stroke: 'stroke', fill: 'fill', sw: 'stroke-width', dash: 'stroke-dasharray', fo: 'fill-opacity' };
  const ptsD = (p) => p.map((q, i) => `${i ? 'L' : 'M'}${q[0].toFixed(1)},${q[1].toFixed(1)}`).join('');

  FL.Fig = class {
    constructor(svg) { this.svg = svg; this.m = new Map(); this.tw = []; this.raf = null; this.lab = null; this.labHtml = null; this.labT = null; }
    layer(name) { const g = document.createElementNS(NS, 'g'); g.setAttribute('data-layer', name); this.svg.appendChild(g); return g; }
    /* create a mark once; init = {tag, layer, attrs (static), ...targets} */
    mk(id, tag, layer, attrs = {}, init = {}) {
      if (this.m.has(id)) return this.m.get(id);
      const el = document.createElementNS(NS, tag);
      Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
      el.style.transition = 'opacity .5s, stroke .5s, fill .5s, stroke-width .5s';
      layer.appendChild(el);
      const mk = { id, el, tag, cur: {} };
      this.m.set(id, mk);
      this.apply(mk, init, true);
      return mk;
    }
    write(mk) {
      const c = mk.cur; const el = mk.el;
      if (c.pts) el.setAttribute('d', ptsD(c.pts));
      if ('tx' in c || 's' in c) el.setAttribute('transform', `translate(${(c.tx || 0).toFixed(2)},${(c.ty || 0).toFixed(2)}) scale(${(c.s ?? 1).toFixed(4)},${(c.sx ?? c.s ?? 1).toFixed(4)})`);
      NUM.forEach((k) => { if (k in c && !['tx', 'ty', 's', 'sx'].includes(k)) el.setAttribute(k, c[k].toFixed(2)); });
    }
    /* move a mark to a target. Position over dur (0.9s), style by CSS (0.5s). */
    apply(mk, t, instant = false, { dur = 900, delay = 0 } = {}) {
      const el = mk.el;
      if (t.attr) Object.entries(t.attr).forEach(([k, v]) => (v == null ? el.removeAttribute(k) : el.setAttribute(k, v)));
      Object.entries(STY).forEach(([k, css]) => {
        if (!(k in t)) return;
        el.style.transitionDelay = instant || FL.reduce ? '0s' : `${delay}ms`;
        if (instant) { const tr = el.style.transition; el.style.transition = 'none'; el.style.setProperty(css, t[k]); el.getBoundingClientRect(); el.style.transition = tr; } else el.style.setProperty(css, t[k]);
      });
      const tgt = {};
      if (t.pts) tgt.pts = t.pts.map((p) => [p[0], p[1]]);
      NUM.forEach((k) => { if (k in t) tgt[k] = t[k]; });
      if (!Object.keys(tgt).length) return;
      this.tw = this.tw.filter((w) => w.mk !== mk);
      if (instant || FL.reduce || dur === 0) { Object.assign(mk.cur, tgt); this.write(mk); return; }
      const from = {};
      Object.keys(tgt).forEach((k) => {
        if (k === 'pts') { const cp = mk.cur.pts || tgt.pts; from.pts = tgt.pts.map((_, i) => (cp[Math.min(i, cp.length - 1)] || tgt.pts[i]).slice()); } else from[k] = k in mk.cur ? mk.cur[k] : tgt[k];
      });
      this.tw.push({ mk, from, to: tgt, t0: performance.now() + delay, dur });
      if (!this.raf) this.raf = requestAnimationFrame((n) => this.tick(n));
    }
    set(id, t, o) { const mk = this.m.get(id); if (!mk) throw new Error(`no mark ${id}`); this.apply(mk, t, false, o); }
    pre(id, t) { const mk = this.m.get(id); if (!mk) throw new Error(`no mark ${id}`); this.apply(mk, t, true); }
    tick(now) {
      this.tw = this.tw.filter((w) => {
        const p = Math.min(1, Math.max(0, (now - w.t0) / w.dur)); const e = FL.EASE(p); const c = w.mk.cur;
        Object.keys(w.to).forEach((k) => {
          if (k === 'pts') c.pts = w.to.pts.map((q, i) => [w.from.pts[i][0] + (q[0] - w.from.pts[i][0]) * e, w.from.pts[i][1] + (q[1] - w.from.pts[i][1]) * e]);
          else c[k] = w.from[k] + (w.to[k] - w.from[k]) * e;
        });
        if (now >= w.t0) this.write(w.mk);
        return p < 1;
      });
      this.raf = this.tw.length ? requestAnimationFrame((n) => this.tick(n)) : null;
    }
    stop() { this.tw = []; }
    /* draw a path in from its start (a new mark arriving); keeps its points */
    drawIn(id, { dur = 900, delay = 0 } = {}) {
      const el = this.m.get(id).el; if (FL.reduce) return;
      const len = el.getTotalLength(); const keep = el.getAttribute('stroke-dasharray');
      el.style.strokeDasharray = `${len} ${len}`; el.style.strokeDashoffset = `${len}`; el.getBoundingClientRect();
      const tr = el.style.transition; el.style.transition = `${tr}, stroke-dashoffset ${dur}ms cubic-bezier(.2,.8,.2,1) ${delay}ms`;
      el.style.strokeDashoffset = '0';
      setTimeout(() => { el.style.transition = tr; el.style.strokeDasharray = keep || ''; el.style.strokeDashoffset = ''; }, dur + delay + 30);
    }
    /* label layer: old labels out (0.35s), new labels in (0.35s), then count-ups */
    labels(html, host) {
      const g = host; if (this.labHtml === html) return; this.labHtml = html;
      clearTimeout(this.labT);
      g.style.transition = 'opacity .35s'; g.style.opacity = 0;
      this.labT = setTimeout(() => {
        g.innerHTML = html; g.getBoundingClientRect(); g.style.opacity = 1;
        g.querySelectorAll('[data-count]').forEach((t) => FL.countTo(t, +t.dataset.count, { from: +(t.dataset.from || 0), ms: 900, fmt: (t.dataset.fmt === 'x' ? (v) => `${v.toFixed(1)} times` : (v) => FL.fmt(Math.round(v))) }));
      }, FL.reduce ? 0 : 350);
    }
  };
  FL.countTo = function (el, to, { from = 0, ms = 900, fmt = (v) => Math.round(v) } = {}) {
    if (FL.reduce) { el.textContent = fmt(to); return; }
    const t0 = performance.now();
    const tick = (n) => { const p = Math.min(1, (n - t0) / ms); el.textContent = fmt(from + (to - from) * FL.EASE(p)); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  };

  /* ---------- the readout bar above the figure (fixed 52px, fixed slots) ---------- */
  FL.key = (k = {}) => `<svg width="16" height="8" viewBox="0 0 16 8"><line x1="1" y1="4" x2="15" y2="4" stroke="${k.c || '#0F766E'}" stroke-width="${Math.min(2.6, k.w || 2)}" ${k.dash ? `stroke-dasharray="${k.dash}"` : ''} stroke-linecap="round"/></svg>`;
  FL.dotKey = (c, hollow) => `<svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.6" fill="${hollow ? '#fff' : c}" stroke="${c}" stroke-width="1.4"/></svg>`;
  FL.readout = function (host) {
    host.innerHTML = '<div class="r1"><span class="m"></span><span class="n"></span></div><div class="r2"></div>';
    const m = host.querySelector('.m'); const n = host.querySelector('.n'); const r2 = host.querySelector('.r2');
    return {
      set({ title = '', note = '', slots = null, text = null, cols = null }) {
        m.textContent = title; n.textContent = note;
        if (text != null) { r2.style.gridTemplateColumns = '1fr'; r2.innerHTML = `<span class="txt">${text}</span>`; return; }
        const s = slots || [];
        r2.style.gridTemplateColumns = `repeat(${cols || Math.max(1, s.length)}, minmax(0,1fr))`;
        r2.innerHTML = s.map((x) => `<span class="s">${x.key || ''}<b>${FL.esc(x.v)}</b><span>${FL.esc(x.name)}</span></span>`).join('');
      },
    };
  };
})();
</script>
<script>/* Site Audit mockups (#1426): shell (OQ rail + tool top bar) and the ?v= variant switcher. */
(function () {
  const SA = (window.SA = {});
  SA.LV = { now: { name: 'Fix now', tip: 'Loses a visitor or loses Google: a page that does not load, or a page Google is told to skip. Asana due date: 1 week.' },
    soon: { name: 'Fix soon', tip: 'Weakens a page that works: shared titles, missing descriptions or headings, thin service pages. Asana due date: 3 weeks.' },
    tidy: { name: 'Tidy up', tip: 'Worth doing when there is time: long titles, pages left out of the sitemap, missing alt text. No due date.' } };
  SA.lv = (k, label) => `<span class="lv ${k}" data-tip-h="${SA.LV[k].name}" data-tip="${SA.LV[k].tip}"><i></i>${label ?? SA.LV[k].name}</span>`;
  SA.sample = (why) => `<span class="sample" data-tip-h="Sample" data-tip="${FL.esc(why || 'Today’s crawl does not keep this, so the mockup shows a made-up example. The new shared crawl keeps it.')}">sample</span>`;
  SA.shell = function ({ mock, right }) {
    const page = document.getElementById('page');
    const bar = FL.h(`<div class="mockbar">${mock}</div>`);
    const app = FL.h(`<div class="fl-app"><main class="fl-main"><div class="fl-wrap">
      <div class="fl-top"><div class="fl-brand"><span class="fl-mark"><svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h3l2-4 2 8 2-4h1"/></svg></span>Site Audit</div>
      <div class="fl-right"><span id="method-slot"><button type="button" class="method-btn"><span class="dot"></span>How it works</button></span>${right ?? '<span class="who">Liberty Family Dentistry</span><span class="when">libertyfamilydentistry.com</span>'}</div></div>
    </div></main></div>`);
    page.parentNode.insertBefore(bar, page); page.parentNode.insertBefore(app, page);
    app.querySelector('.fl-wrap').appendChild(page);
    FL.$('.method-btn').onclick = () => FL.toast('Opens “Site Audit · How it works” (not part of this mockup).');
  };
  /* variants: { A: { name, render(host) }, B: ... } */
  SA.variants = function (V, keep) {
    if (keep && keep.length) { V = Object.fromEntries(Object.entries(V).filter(([k]) => keep.includes(k)));
      const mb = FL.$('.mockbar'); if (mb) mb.prepend(FL.h(`<div style="margin-bottom:4px;color:#0F766E;font-weight:700">Owner’s pick, Oct 30: ${keep.map((k) => `${k}, ${FL.esc(V[k].name)}`).join(' + ')}. Round 2 shows only the pick.</div>`)); }
    const keys = Object.keys(V); const host = document.getElementById('page');
    let cur = new URLSearchParams(location.search).get('v'); if (!keys.includes(cur)) cur = keys[0];
    const bar = FL.h(`<div class="vbar"><button data-d="-1" aria-label="Previous">←</button>${keys.map((k) => `<button data-k="${k}">${k}</button>`).join('')}<span class="lbl"></span><button data-d="1" aria-label="Next">→</button><a href="index-site-audit.html">all screens</a></div>`);
    document.body.appendChild(bar);
    if (keys.length === 1) { FL.$$('button', bar).forEach((b) => (b.style.display = 'none')); }
    const show = (k) => { cur = k; const u = new URL(location); u.searchParams.set('v', k); history.replaceState(null, '', u);
      FL.$$('button[data-k]', bar).forEach((b) => b.classList.toggle('on', b.dataset.k === k));
      bar.querySelector('.lbl').textContent = `${k}: ${V[k].name}`; host.innerHTML = ''; window.scrollTo({ top: 0 }); V[k].render(host); };
    bar.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.k) show(b.dataset.k); else show(keys[(keys.indexOf(cur) + +b.dataset.d + keys.length) % keys.length]); };
    addEventListener('keydown', (e) => { if (e.target.closest('input,textarea,[contenteditable]')) return;
      if (e.key === 'ArrowRight') show(keys[(keys.indexOf(cur) + 1) % keys.length]); if (e.key === 'ArrowLeft') show(keys[(keys.indexOf(cur) - 1 + keys.length) % keys.length]); });
    show(cur);
  };
})();
</script>
<script>/* #1426 Site Audit mockups, screen 2: the result page. Three directions on Liberty Family Dentistry's real crawl. */
(function () {
  const I = D.issues;
  const LVS = ['now', 'soon', 'tidy'];
  const byLv = (k) => I.filter((i) => i.level === k);
  const types = (k) => byLv(k).length;
  const STUB = ['/reviews-view', '/review-sites', '/landing-pages'];
  // Real: crawl 319 grouped by first folder, each page counted once at its most urgent level (computed from data/liberty.json).
  const FOLDERS = [
    { f: '/articles', n: 136, now: 0, soon: 0, tidy: 27, ok: 109, med: 453 },
    { f: '/reviews-view', n: 16, now: 0, soon: 16, tidy: 0, ok: 0, med: 0 },
    { f: '(top level)', n: 11, now: 0, soon: 1, tidy: 9, ok: 1, med: 411 },
    { f: '/topics', n: 7, now: 0, soon: 1, tidy: 3, ok: 3, med: 668 },
    { f: '/landing-pages', n: 6, now: 0, soon: 6, tidy: 0, ok: 0, med: 0 },
    { f: '/services', n: 5, now: 1, soon: 0, tidy: 1, ok: 3, med: 520 },
    { f: '/review-sites', n: 4, now: 0, soon: 4, tidy: 0, ok: 0, med: 0 },
  ];
  const OK = FOLDERS.reduce((s, f) => s + f.ok, 0);
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const THING = 'data-tip-h="A thing to fix" data-tip="One kind of problem, however many pages it touches. Each one becomes one Asana task."';

  const headline = () => `${FL.esc(D.client)} needs attention: <span class="sa-now">${types('now')} <span class="tipword" ${THING}>things</span> to fix now</span> and ${types('soon')} to fix soon.`;
  const meta = () => `<div class="sa-meta"><span>Crawled ${D.crawled}</span><span>${D.pages} pages</span><button class="sa-link" data-act="recrawl">Re-crawl</button></div>`;
  const actions = (cls = '') => `<div class="sa-acts ${cls}"><button class="btn btn-go" data-act="asana">Make the Asana tasks</button><button class="btn btn-line" data-act="draft">Draft the fixes</button></div>`;
  const wire = (host) => host.addEventListener('click', (e) => {
    const a = e.target.closest('[data-act],[data-issue]'); if (!a) return;
    if (a.dataset.issue) return FL.toast(`Opens the page list for “${I.find((i) => i.key === a.dataset.issue).name}” (screen 3).`);
    FL.toast({ asana: 'Opens the Asana preview (screen 5).', draft: 'Opens Draft the fixes (screen 4).', recrawl: 'Starts a new crawl of libertyfamilydentistry.com (screen 6).' }[a.dataset.act]);
  });
  const tag = (i) => (i.real ? '' : SA.sample());

  /* ---------------- A: Story, the site as 185 dots ---------------- */
  function renderA(host) {
    const dots = [];
    FOLDERS.forEach((f) => ['now', 'soon', 'tidy', 'ok'].forEach((lv) => { for (let k = 0; k < f[lv]; k++) dots.push({ lv, stub: STUB.includes(f.f) }); }));
    const RK = { now: 0, soon: 1, tidy: 2, ok: 3 };
    dots.sort((p, q) => RK[p.lv] - RK[q.lv] || (q.stub - p.stub));
    const out = [{ lv: 'now', out: true }, { lv: 'now', out: true }]; // the two missing pages: linked to, never crawled (sample)
    const all = dots.concat(out);
    const COLS = 20; const G = 24; const X0 = 40; const W = 600;
    const fill = (d) => (d.lv === 'now' ? (d.out ? '#fff' : '#DC2626') : d.lv === 'soon' ? '#2563EB' : d.lv === 'tidy' ? '#fff' : '#E4E7EC');
    const stroke = (d) => (d.lv === 'now' ? '#DC2626' : d.lv === 'tidy' ? '#94A3B8' : 'none');
    // layout: chosen dots in a block at the top, the rest faded in a block below
    function layout(pick, groups) {
      const pos = new Map(); let y = 40; const labels = [];
      (groups || [{ test: pick, label: null }]).forEach((g) => {
        const sel = all.filter((d) => !pos.has(d) && g.test(d));
        if (!sel.length) return;
        if (g.label) { labels.push({ x: X0 - 6, y: y - 12, t: g.label }); }
        sel.forEach((d, i) => pos.set(d, { x: X0 + (i % COLS) * G, y: y + Math.floor(i / COLS) * G, o: 1 }));
        y += Math.ceil(sel.length / COLS) * G + 34;
      });
      const rest = all.filter((d) => !pos.has(d));
      if (rest.length && pick) { labels.push({ x: X0 - 6, y: y - 12, t: `${rest.length} other pages`, muted: true }); }
      rest.forEach((d, i) => pos.set(d, { x: X0 + (i % COLS) * G, y: y + Math.floor(i / COLS) * G, o: pick ? 0.28 : 1 }));
      return { pos, labels };
    }
    const STATES = [
      layout(null, [{ test: (d) => !d.out, label: `All ${D.pages} pages crawled` }, { test: (d) => d.out, label: 'Linked to, but missing' }]),
      layout((d) => d.lv === 'now', [{ test: (d) => d.lv === 'now' && d.out, label: '2 links lead to pages that don’t load' }, { test: (d) => d.lv === 'now', label: '1 page Google is told to skip' }]),
      layout((d) => d.lv === 'soon', [{ test: (d) => d.lv === 'soon' && d.stub, label: '26 empty pages' }, { test: (d) => d.lv === 'soon', label: '2 other pages' }]),
      layout((d) => d.lv === 'tidy', [{ test: (d) => d.lv === 'tidy', label: '40 pages to tidy' }]),
      layout(null, [{ test: (d) => !d.out, label: `All ${D.pages} pages crawled` }, { test: (d) => d.out, label: 'Linked to, but missing' }]),
    ];
    const row = (i) => `<button class="sa-irow" data-issue="${i.key}"><span>${FL.esc(i.name)}${tag(i)}</span><b>${plural(i.count, 'page')}</b><span class="sa-go">Open</span></button>`;
    const chap = (k, kick, h2, body) => `<section class="chap" data-s="${k}"><div class="k">${kick}</div><h2>${h2}</h2>${body}</section>`;
    host.innerHTML = `<div class="sa-a">
      <div class="story"><div>
        ${chap(0, `Site audit · ${D.crawled}`, headline(), `<p>Each dot is one of the ${D.pages} pages crawled, coloured by its most urgent problem. ${OK} pages have nothing to fix.</p>
          <div class="facts">${LVS.map((k) => `<div><b>${types(k)}</b><span>${SA.lv(k)}</span></div>`).join('')}</div>${meta()}${actions()}`)}
        ${chap(1, SA.lv('now'), `${types('now')} things lose a visitor or lose Google.`, `<p>Two links send patients to pages that don’t load, and the sedation page tells Google to skip it.</p><div class="sa-ilist">${byLv('now').map(row).join('')}</div>`)}
        ${chap(2, SA.lv('soon'), `${types('soon')} things to fix soon. Most come from 26 empty pages.`, `<p>The pages under <span class="url">/reviews-view</span>, <span class="url">/review-sites</span> and <span class="url">/landing-pages</span> have no text and the bare title “Liberty Family Dentistry”. They are behind 26 of the 26 shared titles, 26 of the 27 missing descriptions and 26 of the 27 missing headings.</p><div class="sa-ilist">${byLv('soon').map(row).join('')}</div>`)}
        ${chap(3, SA.lv('tidy'), `${types('tidy')} things to tidy up when there is time.`, `<p>Mostly titles longer than Google shows, on 38 pages. No due date in Asana.</p><div class="sa-ilist">${byLv('tidy').map(row).join('')}</div>`)}
        ${chap(4, 'Next', 'Turn it into work.', `<p>One Asana task per thing to fix, due by level. Or let the model draft new titles, descriptions and alt text first.</p>${actions()}`)}
      </div><div class="stick"><div class="sa-key sa-keya">${SA.lv('now')}${SA.lv('soon')}${SA.lv('tidy')}<span class="lv"><i style="background:#E4E7EC"></i>Nothing to fix</span></div><svg class="figsvg" viewBox="0 0 ${W} 560" id="sa-fig"></svg></div></div></div>`;
    const svg = host.querySelector('#sa-fig');
    const cs = all.map((d) => { const c = document.createElementNS(FL.NS, 'circle'); c.setAttribute('r', d.lv === 'tidy' || d.out ? 6.2 : 7); c.setAttribute('fill', fill(d)); c.setAttribute('stroke', stroke(d)); c.setAttribute('stroke-width', d.lv === 'tidy' || d.out ? 2 : 0); c.style.transition = 'transform .8s var(--ease), opacity .6s'; svg.appendChild(c); return c; });
    const lab = document.createElementNS(FL.NS, 'g'); svg.appendChild(lab);
    const go = (s) => {
      const st = STATES[s];
      all.forEach((d, i) => { const p = st.pos.get(d); cs[i].style.transform = `translate(${p.x}px,${p.y}px)`; cs[i].style.opacity = p.o; });
      lab.innerHTML = st.labels.map((l) => `<text x="${l.x}" y="${l.y}" font-size="13" font-weight="${l.muted ? 500 : 700}" fill="${l.muted ? '#98A2B3' : '#0F172A'}" style="animation:fade .5s">${FL.esc(l.t)}</text>`).join('');
      FL.$$('.chap', host).forEach((c) => c.classList.toggle('on', +c.dataset.s === s));
    };
    go(0);
    const io = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && go(+e.target.dataset.s)), { rootMargin: '-45% 0px -45% 0px' });
    FL.$$('.chap', host).forEach((c) => io.observe(c));
    wire(host);
  }

  /* ---------------- B: calm triage list ---------------- */
  function renderB(host) {
    const bar = (i) => `<span class="sa-bar" data-tip-h="${plural(i.count, 'page')} of ${D.pages}" data-tip="The bar is the share of the crawled pages this touches."><i class="${i.level}" style="width:${Math.max(3, (i.count / D.pages) * 100)}px"></i></span>`;
    const rowB = (i) => `<button class="sa-brow" data-issue="${i.key}"><span class="nm">${FL.esc(i.name)}${tag(i)}</span>${bar(i)}<span class="ct">${plural(i.count, 'page')}</span><span class="sa-go">Open</span></button>`;
    const sec = (k, open) => {
      const L = byLv(k); const pages = L.reduce((s, i) => s + i.count, 0);
      return `<section class="sa-sec ${open ? 'open' : ''}" data-k="${k}"><button class="sa-sech" data-tog="${k}">${SA.lv(k)}<span class="sa-secn">${plural(L.length, 'thing')} · ${plural(pages, 'page problem')}</span><span class="sa-peek">${open ? '' : FL.esc(L.map((i) => i.name).join(', '))}</span><span class="sa-chev">${open ? 'Hide' : 'Show'}</span></button>
        <div class="sa-secb">${L.map(rowB).join('')}</div></section>`;
    };
    host.innerHTML = `<div class="sa-b">
      <div class="sa-bhead"><div class="kick">Site audit · ${D.domain}</div>${meta()}</div>
      <h1 class="sa-big">${headline()}</h1>
      <p class="sub">Plus ${types('tidy')} things to tidy up. ${OK} of the ${D.pages} pages have nothing to fix. The 26 empty review and landing pages are behind most of it.</p>
      ${actions('sa-acts-b')}
      <div class="sa-secs">${LVS.map((k, n) => sec(k, n === 0)).join('')}</div></div>`;
    host.addEventListener('click', (e) => {
      const t = e.target.closest('[data-tog]'); if (!t) return;
      const s = t.closest('.sa-sec'); s.classList.toggle('open');
      const open = s.classList.contains('open'); const L = byLv(s.dataset.k);
      s.querySelector('.sa-peek').textContent = open ? '' : L.map((i) => i.name).join(', ');
      s.querySelector('.sa-chev').textContent = open ? 'Hide' : 'Show';
    });
    wire(host);
  }

  /* ---------------- C: where the problems sit (site map by folder) ---------------- */
  function renderC(host) {
    const sq = (lv, n) => Array.from({ length: n }, () => `<i class="q ${lv}"></i>`).join('');
    const inFolder = (f) => I.filter((i) => i.real && i.pages.some((p) => (f === '(top level)' ? p.url.split('/').length <= 2 : p.url.startsWith(f + '/'))));
    const frow = (f) => {
      const empty = f.med === 0;
      return `<div class="sa-frow" data-f="${f.f}"><button class="sa-fh" data-fold="${f.f}"><span class="url">${f.f}</span><span class="ct">${f.n}</span>
        <span class="wd ${empty ? 'zero' : ''}" ${empty ? 'data-tip-h="Empty pages" data-tip="Every page in this folder has 0 words and the title “Liberty Family Dentistry”. These look like leftover review and landing page templates."' : ''}>${f.med}</span>
        <span class="sqs">${sq('now', f.now)}${sq('soon', f.soon)}${sq('tidy', f.tidy)}${sq('ok', f.ok)}</span></button>
        <div class="sa-fb">${inFolder(f.f).map((i) => `<button class="sa-irow" data-issue="${i.key}"><span>${SA.lv(i.level, '')} ${FL.esc(i.name)}</span><b>${plural(i.pages.filter((p) => (f.f === '(top level)' ? p.url.split('/').length <= 2 : p.url.startsWith(f.f + '/'))).length, 'page')}</b><span class="sa-go">Open</span></button>`).join('') || '<div class="sa-none">Nothing to fix here.</div>'}</div></div>`;
    };
    host.innerHTML = `<div class="sa-c">
      <div class="sa-chead"><div><div class="kick">Site audit · ${D.domain}</div><h1 class="sa-big">${headline()}</h1>${meta()}</div>${actions()}</div>
      <div class="sa-nowbox"><div class="sa-nowh">${SA.lv('now')}<span>Do these first</span></div>${byLv('now').map((i) => `<button class="sa-irow" data-issue="${i.key}"><span>${FL.esc(i.name)}${tag(i)}</span><b>${plural(i.count, 'page')}</b><span class="sa-go">Open</span></button>`).join('')}</div>
      <div class="sa-maph"><h3>Where the rest sits</h3><p>Every square is a page, in its folder, coloured by its most urgent problem. Open a folder to see what to fix there.</p>
        <div class="sa-key">${SA.lv('now')}${SA.lv('soon')}${SA.lv('tidy')}<span class="lv"><i style="background:#E4E7EC"></i>Nothing to fix</span></div></div>
      <div class="sa-map"><div class="sa-fcols"><span>Folder</span><span>Pages</span><span data-tip-h="Words" data-tip="The middle word count of the pages in the folder.">Words</span><span></span></div>${FOLDERS.map(frow).join('')}</div>
      <p class="sa-foot">The two missing pages are linked to but were never crawled, so they sit outside the map. ${SA.sample()}</p></div>`;
    host.addEventListener('click', (e) => { const t = e.target.closest('[data-fold]'); if (t) t.parentNode.classList.toggle('open'); });
    wire(host);
  }

  window.SCREEN = {
    title: 'Site Audit 2: Result page',
    mock: `<b>Site Audit · 2 Result page</b> <span class="src">· data: Liberty Family Dentistry, real crawl of Oct 22, 2026 (185 pages, local snapshot of prod)</span>
<ul><li><b>A The site as dots:</b> a Story. One sticky figure, every page a dot coloured by its most urgent problem; each level’s chapter pulls its pages out of the crowd (the 26 empty pages cluster on their own).</li>
<li><b>B Triage list:</b> one sentence, then three level sections; Fix now open, the other two folded to a one-line peek. Each row: name, a small bar against the 185 pages, page count.</li>
<li><b>C Where it sits:</b> Fix now in a box up top, then the site by folder, a square per page. The real story pops out: /reviews-view, /review-sites and /landing-pages are 26 pages with 0 words.</li></ul>
<span class="nr">PROPOSAL, not ruled: the headline wording (“needs attention” whenever anything is Fix now; “Healthy” when nothing is) and which issue type sits at which level. Sample (today’s crawl does not keep it): pages that don’t load, the noindex page, the redirect chain, sitemap misses, alt text. Everything else is counted from the real crawl.</span>`,
    variants: {
      A: { name: 'The site as dots (Story)', render: renderA },
      B: { name: 'Triage list', render: renderB },
      C: { name: 'Where it sits (by folder)', render: renderC },
    },
  };
})();
</script>
<script>const KEEP={"s1": ["C"], "s2": ["B"], "s6": ["A"], "s7": ["A"]};</script>
<script>SA.shell({ mock: window.SCREEN.mock, right: window.SCREEN.right }); SA.variants(window.SCREEN.variants, window.SCREEN.keep || KEEP['s2']);</script>
</body></html>
