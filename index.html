<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>S8E8 Mockups</title>
<style>
  :root { --bg:#f4f5f6; --surface:#fff; --ink:#1e1f21; --soft:#6d6f73; --line:#e7e6e6; --accent:#f06a6a; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#191a1c; --surface:#26272a; --ink:#f3f3f2; --soft:#a6a8ac; --line:#35363a; --accent:#f47c7c; } }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.5; }
  .wrap{ max-width:760px; margin:0 auto; padding:56px 24px 80px; }
  .mark{ width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,var(--accent),#f9a25a);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px; }
  h1{ font-size:26px; letter-spacing:-0.02em; margin:18px 0 6px; }
  .lede{ color:var(--soft); margin:0 0 28px; }
  a.card{ display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:12px;
    box-shadow:0 1px 2px rgba(0,0,0,.06); transition:border-color .12s, transform .08s; }
  a.card:hover{ border-color:var(--accent); transform:translateY(-1px); }
  a.card .t{ flex:1; }
  a.card .t b{ display:block; font-size:15.5px; }
  a.card .t span{ color:var(--soft); font-size:13px; }
  a.card .arrow{ color:var(--soft); font-size:20px; }
  .foot{ color:var(--soft); font-size:12px; margin-top:32px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">S8</div>
    <h1>S8E8 Mockups</h1>
    <p class="lede">Shareable internal mockups and prototypes. Private index — not indexed by search.</p>

    <a class="card" href="./seo-faq.html">
      <div class="t"><b>SEO &amp; Account Management FAQ</b><span>Every recurring team question from Slack, grouped and copy-ready · Jul 2026</span></div>
      <div class="arrow">→</div>
    </a>

    <p class="foot">Hosted on GitHub Pages · add a new mockup by dropping its .html here.</p>
  </div>
</body>
</html>
