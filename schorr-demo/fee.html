<script>
(function () {
  var D = JSON.parse(document.getElementById('d').textContent), KEY = 'fp-key-' + D.g;
  var f = document.getElementById('f'), c = document.getElementById('c'), b = document.getElementById('b'), e = document.getElementById('e');
  var un = function (s) { var r = atob(s), a = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; };
  var b64 = function (a) { var s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };
  var clean = function (v) { return v.toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g, '').slice(0, 12); };
  var fails = 0;

  function open(raw) {   // raw = the 32-byte key
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: un(D.iv) }, k, un(D.ct)); })
      .then(function (buf) {
        try { sessionStorage.setItem(KEY, b64(new Uint8Array(raw))); } catch (x) {}
        var html = new TextDecoder().decode(buf);
        // Swap the whole document only once this screen has finished loading; earlier, the page would be mixed into it.
        var swap = function () { document.open(); document.write(html); document.close(); };
        if (document.readyState === 'complete') swap(); else window.addEventListener('load', swap);
      });
  }
  function derive(code) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: un(D.s), iterations: D.n, hash: 'SHA-256' }, k, 256); });
  }
  function ask() { f.hidden = false; c.focus(); }

  if (!window.crypto || !crypto.subtle) { f.hidden = false; c.disabled = true; e.textContent = 'This browser cannot open protected pages. Please use a current version of Chrome, Edge, Safari or Firefox.'; return; }
  var saved = null; try { saved = sessionStorage.getItem(KEY); } catch (x) {}
  if (saved) open(un(saved).buffer).catch(function () { try { sessionStorage.removeItem(KEY); } catch (x) {} ask(); }); else ask();

  c.addEventListener('input', function () {
    var v = clean(c.value); c.value = v.replace(/(.{4})(?=.)/g, '$1-'); b.disabled = v.length !== 12; e.textContent = '';
  });
  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var v = clean(c.value); if (v.length !== 12) return;
    var label = b.textContent; b.disabled = true; c.disabled = true; b.textContent = 'Checking...';
    var wait = new Promise(function (r) { setTimeout(r, Math.min(8000, 400 * Math.pow(2, fails))); });   // each wrong try waits longer
    wait.then(function () { return derive(v); }).then(open).catch(function () {
      fails++; b.textContent = label; c.disabled = false; b.disabled = false; e.textContent = 'Incorrect code. Please try again.'; c.select();
    });
  });
})();
