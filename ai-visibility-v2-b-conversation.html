function drawList(progress = null) {
  const groups = [...new Set(QUESTIONS.map(q => q.svc))];
  qlist.innerHTML = groups.map(g => `<div class="qg">${g}${g === 'Branded' ? ' · not in the headline' : ''}</div>` + QUESTIONS.filter(q => q.svc === g).map(q => `<div class="qi${q.id === SEL ? ' on' : ''}" data-id="${q.id}"><div style="flex:1"><div class="t">${q.text}</div><div class="m">${q.byAi.map(v => `<i class="${progress ? (progress > q.id ? (v >= 3 ? 'hit' : v >= 1 ? 'part' : '') : '') : v >= 3 ? 'hit' : v >= 1 ? 'part' : ''}"></i>`).join('')}</div></div><span class="sc">${progress && progress <= q.id ? '…' : score(q) + '/25'}</span></div>`).join('')).join('');
  qlist.querySelectorAll('.qi').forEach(n => n.onclick = () => { SEL = +n.dataset.id; if (VIEW !== 'conv') VIEW = 'conv'; render(); });
}
function header(extra = '') {
  return `<div class="top"><div class="tabs">${[['conv', 'Answers'], ['summary', 'Summary'], ['watch', 'Over time']].map(([k, l]) => `<button data-v="${k}" class="${VIEW === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <span class="sumline">AI names you in about <b>4 of 10</b> answers</span><span style="margin-left:auto;display:flex;gap:8px">${extra}<button class="btn sm">Share report</button>${TRACKED ? '' : '<button class="btn go sm" id="trk">Keep watching</button>'}</span></div>`;
}
function bindHeader() { right.querySelectorAll('.top .tabs button').forEach(b => b.onclick = () => { VIEW = b.dataset.v; render(); }); right.querySelector('#trk')?.addEventListener('click', () => { TRACKED = true; toast('Tracking starts tonight: twice a day.'); VIEW = 'watch'; render(); }); }

function conv() {
  const q = QUESTIONS[SEL], ais = AIS.slice(0, 5).concat(q.near ? [AIS[5]] : []);
  const named = ais.filter((a, j) => (q.byAi[Math.min(j, 4)] ?? 0) >= 3).length;
  right.innerHTML = header() + `<div class="conv fade-swap"><div class="patient"><div><div class="bub">${q.text}</div><div class="who">a patient in Bothell · ${q.svc}</div></div></div>
    ${ais.map((a, j) => { const k = q.byAi[Math.min(j, 4)] ?? 0; return `<div class="reply" style="animation-delay:${j * 90}ms" data-j="${j}"><span class="av" style="background:${AV[a.key][0]}">${AV[a.key][1]}</span><div class="bub${k >= 1 ? ' hit' : ''}"><div class="meta"><b>${a.name}</b><span>named you in ${k} of 5 asks</span><span class="asks">${[0, 1, 2, 3, 4].map(r => `<button class="${r < k ? 'hit' : ''}${r === 0 ? ' cur' : ''}" data-r="${r}">${r + 1}</button>`).join('')}</span></div><pre>${answerFor(q, a, k > 0)}</pre>${a.key === 'near' ? `<div style="margin-top:10px;font-size:12px;color:var(--muted)">${a.note}</div>` : ''}</div></div>`; }).join('')}
    <div class="takeaway"><b>${named >= 3 ? 'You usually come up for this question.' : named >= 1 ? 'You come up sometimes, not reliably.' : 'AI does not name you for this question.'}</b> <span style="color:var(--body)">${named >= 3 ? 'Keep the page that earns it strong.' : 'A page that answers it directly is the usual fix.'}</span>
      ${named < 3 ? `<div style="margin-top:12px"><button class="btn go sm" id="plan">${q.svc === 'Emergency' ? 'Optimize the emergency page' : 'Plan a page for this'}</button></div>` : ''}</div></div>`;
  bindHeader();
  right.querySelectorAll('.asks button').forEach(b => b.onclick = () => { const rep = b.closest('.reply'), j = +rep.dataset.j, r = +b.dataset.r; rep.querySelectorAll('.asks button').forEach(x => x.classList.toggle('cur', x === b)); rep.querySelector('pre').textContent = ''; rep.querySelector('pre').innerHTML = answerFor(q, ais[j], r < (q.byAi[Math.min(j, 4)] ?? 0)); rep.querySelector('pre').classList.add('fade-swap'); });
  right.querySelector('#plan')?.addEventListener('click', e => { e.target.textContent = 'Added ✓'; e.target.disabled = true; toast(q.svc === 'Emergency' ? 'Opened in On-Page optimization.' : 'Drafted a calendar item: new page.'); });
}

function summary() {
  right.innerHTML = header() + `<div class="cards">
    <div class="card reveal"><div class="eyebrow">Long story short</div><p class="big" style="margin-top:8px">AI names you in about <span style="color:var(--a)">4 of 10</span> answers.</p>
      <div style="margin-top:16px">${AIS.map(a => `<div class="row" data-tip="<b>${a.name}</b><br>${a.k} of ${a.n} answers · could fairly be ${Math.max(0, pct(a.k, a.n) - range(a.k, a.n))} to ${pct(a.k, a.n) + range(a.k, a.n)}%"><span style="width:150px;font-weight:600;color:var(--ink)">${a.name}</span><span class="meter"><i data-w="${pct(a.k, a.n)}"></i></span><span class="mono" style="width:52px;text-align:right;font-weight:600" data-count="${pct(a.k, a.n)}">0%</span></div>`).join('')}</div></div>
    ${TRACKED ? `<div class="card reveal"><div class="eyebrow">Since last week</div><h3>Three things moved</h3>${CHANGES.map(c => `<div class="row"><b style="color:${c.up ? 'var(--up)' : 'var(--down)'};width:20px">${c.up ? '↑' : '↓'}</b><div><b style="color:var(--ink)">${c.text}</b><div style="color:var(--muted);font-size:13px">${c.detail}</div></div></div>`).join('')}</div>` : ''}
    <div class="card reveal"><div class="eyebrow">Where patients find you, and where they don't</div><h3>Strong on kids. Invisible for implants.</h3>${SERVICES.map(s => `<div class="row"><span style="width:110px;font-weight:600;color:var(--ink)">${s.svc}</span><span class="meter"><i data-w="${s.rate}"></i></span><span class="mono" style="width:44px;text-align:right">${s.rate}%</span><span style="width:160px;text-align:right">${s.state === 'gap' ? `<button class="btn soft sm" data-act="${s.thin ? 'o' : 'p'}">${s.thin ? 'Optimize page' : 'Plan a page'}</button>` : ''}</span></div>`).join('')}</div>
    <div class="card reveal"><div class="eyebrow">Who AI names instead</div><h3>Accent Dental comes up more often.</h3>${RIVALS.map(r => `<div class="row"><span style="width:250px;font-weight:${r.you ? 700 : 500};color:${r.you ? 'var(--a-ink)' : 'var(--ink)'}">${r.name}${r.you ? ' (you)' : ''}</span><span class="meter"><i data-w="${r.rate}" style="${r.you ? '' : 'background:#B6BCC8'}"></i></span><span class="mono" style="width:44px;text-align:right">${r.rate}%</span></div>`).join('')}</div>
    <div class="card reveal"><div class="eyebrow">Next steps</div><h3>Four things worth doing.</h3>${NEXT.map((n, i) => `<div class="row"><span class="chk" id="c${i}"></span><div style="flex:1"><b style="color:var(--ink)">${n.title}</b><div style="color:var(--muted);font-size:13px">${n.why}</div></div><button class="btn go sm" data-i="${i}">${n.cta}</button></div>`).join('')}</div></div>`;
  bindHeader(); bindTips(right); revealAll(right);
  setTimeout(() => right.querySelectorAll('.meter i').forEach(i => i.style.width = i.dataset.w + '%'), 250);
  right.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { b.textContent = 'Added ✓'; b.disabled = true; toast(b.dataset.act === 'o' ? 'Opened in On-Page optimization.' : 'Drafted a calendar item: new page.'); });
  right.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { document.getElementById('c' + b.dataset.i).classList.add('on'); b.textContent = 'Done ✓'; b.disabled = true; toast(NEXT[+b.dataset.i].where + '.'); });
}

function watch() {
  if (!TRACKED) { right.innerHTML = header() + `<div class="cards"><div class="card"><h3>See how the answers change.</h3><p>Twice a day, the same questions, every AI. Each question on the left gets its own history.</p><button class="btn go" id="tw">Keep watching, about $28 a month</button><p style="color:var(--muted);font-size:13px">Clients only. Prospects get Snapshots.</p></div></div>`; bindHeader(); right.querySelector('#tw').onclick = () => { TRACKED = true; render(); }; return; }
  const q = QUESTIONS[SEL], days = 8, hist = Array.from({ length: days }, (_, d) => Math.max(0, Math.min(5, q.byAi[0] - 1 + Math.round(d / 4))));
  right.innerHTML = header() + `<div class="conv fade-swap"><div class="patient"><div><div class="bub">${q.text}</div><div class="who">the same question, asked twice a day</div></div></div>
    ${AIS.slice(0, 5).map((a, j) => `<div class="reply"><span class="av" style="background:${AV[a.key][0]}">${AV[a.key][1]}</span><div class="bub"><div class="meta"><b>${a.name}</b><span>last 8 weeks, one row a week</span></div><div style="display:grid;grid-template-columns:repeat(8,1fr);gap:6px">${hist.map((v, w) => `<div title="week ${w + 1}" style="height:${12 + (v + j % 2) * 9}px;align-self:end;border-radius:6px;background:${v + j % 2 >= 3 ? 'var(--a)' : '#DDD6EE'};transition:height .5s"></div>`).join('')}</div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:4px"><span>Sep 8</span><span>Oct 27</span></div></div></div>`).join('')}
    <div class="takeaway"><b>Across every question:</b> ChatGPT names you in 44% of the last 7 days' answers, up from 36% a month ago. $21.90 spent this month.</div></div>`;
  bindHeader();
}

function setup() {
  document.getElementById('prac').innerHTML = '<b>New check</b>Answer three questions and we will write the rest.';
  qlist.innerHTML = '<div style="padding:30px 16px;color:var(--faint);font-size:14px">Patient questions will appear here as they are written.</div>';
  right.innerHTML = `<div class="chat-setup" id="cs"></div><div class="composer"><div class="box"><input id="cin" placeholder="Type a practice name or website"><button class="btn go sm" id="csend">Send</button></div></div>`;
  const cs = document.getElementById('cs');
  const sys = html => { const d = document.createElement('div'); d.className = 'sys'; d.innerHTML = `<span class="av" style="background:var(--a)">AI</span><div class="bub">${html}</div>`; cs.appendChild(d); d.scrollIntoView({ behavior: 'smooth', block: 'end' }); return d; };
  const me = t => { const d = document.createElement('div'); d.className = 'me'; d.innerHTML = `<div class="bub">${t}</div>`; cs.appendChild(d); };
  sys('Which practice should we check? A client name or a website works.');
  let stage = 0;
  const send = async () => {
    const v = document.getElementById('cin').value.trim() || 'Bothell Family Dentistry'; document.getElementById('cin').value = '';
    if (stage === 0) { me(v); stage = 1; await new Promise(r => setTimeout(r, 400));
      const d = sys(`Found it: <b>${PRACTICE.name}</b>, ${PRACTICE.address}. A client, ${PRACTICE.domain}.<div><button class="btn soft sm opt" id="yes">That's the one</button><button class="btn sm opt">Not quite</button></div>`);
      d.querySelector('#yes').onclick = async () => { me("That's the one"); document.getElementById('prac').innerHTML = `<b>${PRACTICE.name}</b>${PRACTICE.city} · client`;
        sys('Writing the questions patients ask, from your website. Watch the list on the left.'); qlist.innerHTML = '';
        const groups = [...new Set(QUESTIONS.map(q => q.svc))];
        for (const g of groups) { const h = document.createElement('div'); h.className = 'qg'; h.textContent = g; qlist.appendChild(h); for (const q of QUESTIONS.filter(x => x.svc === g)) { const n = document.createElement('div'); n.className = 'qi'; n.innerHTML = `<span class="chk on"></span><div class="t"></div>`; qlist.appendChild(n); await typeText(n.querySelector('.t'), q.text, 5); n.onclick = () => { n.style.opacity = n.style.opacity === '.4' ? 1 : .4; n.querySelector('.chk').classList.toggle('on'); }; } }
        const d2 = sys('30 questions, grouped by service. Tap any on the left to leave it out. Next: I found 4 nearby practices on Google Maps to compare against: Accent Dental Center Bothell, Bothell Smiles Family Dentistry, Hello Kids Dentistry, Annigan Dental.<div><button class="btn soft sm opt" id="ok2">Compare against those</button><button class="btn sm opt">Add another</button></div>');
        d2.querySelector('#ok2').onclick = () => { me('Compare against those'); const d3 = sys(`Ready. Each question goes to six AIs, five times each, a few minutes apart: <b>$2.35</b>, about an hour. You can leave; I'll keep going.<div><button class="btn go sm opt" id="run">Run the Snapshot, $2.35</button></div>`); d3.querySelector('#run').onclick = () => go('running'); };
      };
    }
  };
  document.getElementById('csend').onclick = send; document.getElementById('cin').onkeydown = e => { if (e.key === 'Enter') send(); };
}

function running() {
  VIEW = 'conv'; SEL = 9;
  document.getElementById('prac').innerHTML = `<b>${PRACTICE.name}</b>Snapshot running · round <span id="rr">1</span> of 5`;
  drawList(1);
  const q = QUESTIONS[SEL], ais = AIS.slice(0, 5).concat([AIS[5]]);
  right.innerHTML = `<div class="top"><span class="sumline">Asking six AIs every question, five times each. Replies land below as they come in.</span><span class="mono" style="margin-left:auto;color:var(--muted)" id="cnt">0 of 750</span></div>
    <div class="conv"><div class="patient"><div><div class="bub">${q.text}</div><div class="who">a patient in Bothell · ${q.svc}</div></div></div>${ais.map((a, j) => `<div class="reply" data-j="${j}"><span class="av" style="background:${AV[a.key][0]}">${AV[a.key][1]}</span><div class="bub"><div class="meta"><b>${a.name}</b><span class="st">asking…</span></div><div class="typing-dots"><i></i><i></i><i></i></div></div></div>`).join('')}</div>`;
  let shown = 0;
  stop = runSim({ speed: 4, onAnswer: (x, i, total) => { document.getElementById('cnt').textContent = `${i + 1} of ${total}`; const prog = Math.floor((i + 1) / total * 30) + 1; if (prog % 3 === 0) drawList(prog);
      if (i % 40 === 20 && shown < ais.length) { const rep = right.querySelector(`.reply[data-j="${shown}"]`); const k = q.byAi[Math.min(shown, 4)]; rep.querySelector('.typing-dots').outerHTML = `<pre class="fade-swap">${answerFor(q, ais[shown], k > 0)}</pre>`; rep.querySelector('.st').textContent = k > 0 ? 'named you' : 'did not name you'; if (k > 0) rep.querySelector('.bub').classList.add('hit'); shown++; } },
    onRound: r => { const n = document.getElementById('rr'); if (n) n.textContent = Math.min(5, r + 1); }, onDone: () => setTimeout(() => go('result'), 900) });
}

function render() { document.getElementById('prac').innerHTML = `<b>${PRACTICE.name}</b>${PRACTICE.city} · ${TRACKED ? 'watched twice a day' : 'Snapshot Oct 27 · 750 answers'}`; drawList(); ({ conv, summary, watch })[VIEW](); }
function go(k) { if (stop) { stop(); stop = null; } document.querySelectorAll('.statebar button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  if (k === 'setup') return setup(); if (k === 'running') return running();
  if (k === 'result') { VIEW = 'conv'; } if (k === 'summary') VIEW = 'summary'; if (k === 'watch') { TRACKED = true; VIEW = 'watch'; } render(); }
stateBar([['setup', 'Setup'], ['running', 'Live run'], ['result', 'Answers'], ['summary', 'Summary'], ['watch', 'Over time']], 'setup', go);
</script>
</body>
</html>
