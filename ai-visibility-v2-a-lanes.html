  const per = AIS.map(a => ({ a, n: a.asks / 5, k: a.k / a.n * a.asks / 5 })); let round = 1, idx = 0; const queue = [];
  for (let r = 1; r <= 5; r++) per.forEach(({ a, n, k }, j) => { const on = lit(Math.round(k), Math.round(n), r * 13 + j); for (let i = 0; i < Math.round(n); i++) queue.push({ r, a, j, hit: on.has(i) }); });
  const h = setInterval(() => { for (let s = 0; s < speed && idx < queue.length; s++, idx++) { const q = queue[idx]; if (q.r !== round) { onRound && onRound(round); round = q.r; } onAnswer(q, idx, queue.length); } if (idx >= queue.length) { clearInterval(h); onRound && onRound(5); onDone && onDone(); } }, 60);
  return () => clearInterval(h);
}
function stateBar(states, initial, onPick) {
  const bar = document.createElement('div'); bar.className = 'statebar';
  bar.innerHTML = '<span>Prototype</span>' + states.map(([k, l]) => `<button data-k="${k}">${l}</button>`).join('');
  document.body.appendChild(bar);
  const set = k => { bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === k)); onPick(k); };
  bar.querySelectorAll('button').forEach(b => b.addEventListener('click', () => set(b.dataset.k)));
  set(initial);
}

/* ---------- Running: lanes fill with dots ---------- */
function running() {
  who(`<b>${PRACTICE.name}</b><span>Snapshot running</span>`);
  screen.innerHTML = `<div class="runhero"><div><div class="eyebrow" id="rnd">Round 1 of 5</div><h1 class="big" style="font-size:36px;margin-top:8px">Asking six AIs<br>30 questions, 5 times each.</h1>

    <div class="lanes" id="lanes">${AIS.map(a => `<div class="lanerow"><div class="nm">${a.name}<small>${a.how}</small></div><div class="lane" data-k="${a.key}"></div><div class="val"><span data-v="${a.key}">·</span><small data-c="${a.key}"></small></div></div>`).join('')}</div></div>
    <div class="ticker"><div class="eyebrow" style="margin-bottom:6px">Just in</div><div id="tick"></div></div></div>`;
  const got = {}; AIS.forEach(a => got[a.key] = { k: 0, n: 0 });
  stopSim = runSim({ speed: 3, onAnswer: (q, i) => {
    const lane = screen.querySelector(`.lane[data-k="${q.a.key}"]`); const d = document.createElement('i'); d.className = 'drop' + (q.hit ? ' hit' : ''); lane.appendChild(d);
    const g = got[q.a.key]; g.n++; if (q.hit) g.k++;

    if (q.hit && i % 9 === 0) { const qq = QUESTIONS[i % 27]; const t = document.getElementById('tick'); const it = document.createElement('div'); it.className = 'item'; it.innerHTML = `<b>${q.a.name}</b> · “${qq.text}”<br><span style="color:var(--muted)">…3. <mark>${PRACTICE.name}</mark>: patients mention…</span>`; t.prepend(it); if (t.children.length > 4) t.lastChild.remove(); }
  }, onRound: r => { document.getElementById('rnd').textContent = r >= 5 ? 'All 5 rounds in' : `Round ${r + 1} of 5`; }, onDone: () => setTimeout(() => go('story'), 900) });
}

function answers(p) {
  let aj = 0, svc = 'All', named = 'all', sel = 0, ask = 0;
  const draw = () => {
    const rows = QUESTIONS.filter(q => (svc === 'All' || q.svc === svc) && (named === 'all' || (named === 'yes' ? q.byAi[aj] > 0 : q.byAi[aj] === 0)));

    p.innerHTML = `<div class="seg">${AIS.slice(0, 5).map((a, j) => `<button data-aj="${j}" class="${j === aj ? 'on' : ''}">${a.name}</button>`).join('')}</div>

      <div class="seg">${['All', ...new Set(QUESTIONS.map(q => q.svc))].map(v => `<button data-sv="${v}" class="${v === svc ? 'on' : ''}">${v}</button>`).join('')}</div>
      <div class="ans-grid"><div class="ans-list">${rows.map((q, i) => `<div class="ans-row${i === sel ? ' on' : ''}" data-i="${i}"><div style="flex:1"><b style="color:var(--ink);font-weight:600">${q.text}</b><div style="display:flex;gap:4px;margin-top:6px;align-items:center">${[0, 1, 2, 3, 4].map(r => `<span class="d${r < q.byAi[aj] ? ' hit' : ''}" style="margin:0"></span>`).join('')}<span style="color:var(--faint);font-size:12px;margin-left:6px">${q.byAi[aj]} of 5 · ${q.svc}</span></div></div></div>`).join('')}</div>
      <div>${cur ? `<div style="display:flex;gap:6px;margin-bottom:10px">${[0, 1, 2, 3, 4].map(r => `<button class="btn sm${r === ask ? ' soft' : ''}" data-ask="${r}">Ask ${r + 1}${r < cur.byAi[aj] ? ' ●' : ''}</button>`).join('')}</div>
        <div class="answer fade-swap"><div class="eyebrow">${AIS[aj].name} · ask ${ask + 1} of 5 · Oct 27, ${10 + ask}:${ask * 12 % 60 || '05'} am · ${hit ? 'named you' : 'did not name you'}</div><div class="q">“${cur.text}”</div><pre>${answerFor(cur, AIS[aj], hit)}</pre></div>

    p.querySelectorAll('[data-aj]').forEach(b => b.onclick = () => { aj = +b.dataset.aj; sel = 0; ask = 0; draw(); });

    p.querySelectorAll('.ans-row').forEach(r => r.onclick = () => { sel = +r.dataset.i; ask = 0; draw(); });

  draw();
}
