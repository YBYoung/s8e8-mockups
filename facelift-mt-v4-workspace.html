<!doctype html><html lang="en"><head><title>Market Trends · V4 Workspace</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>/* Facelift shared look: the AI Visibility page's experience in OQ teal.
   Tokens follow components/tools/ai-visibility/aivTheme.ts with indigo swapped for teal. */
:root{
  --ink:#0B1020;--body:#273043;--muted:#667085;--faint:#98A2B3;--line:#E7E9EE;--soft:#F6F7FA;
  --a:#0F766E;--aInk:#115E59;--aTint:#E6F4F1;--aSoft:#99D5CC;--a2:#0891B2;--aRing:rgba(15,118,110,.35);
  --up:#15803D;--down:#E11D48;
  --g:#15803D;--y:#F5C518;--r:#DC2626;--n:#94A3B8;
  --t1:#0D9488;--t2:#3B5BDB;--t3:#E0527A;--t4:#5F7D16;--t5:#9C36B5;
  --rose:#DB2777;
  --shadowPanel:0 20px 50px rgba(11,16,32,.10);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.55;color:var(--body);background:#fff;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
button{font:inherit;cursor:pointer}
input,textarea{font:inherit}
a{color:var(--aInk)}

/* app chrome: the OQ sidebar, then the tool page */
.fl-app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
.fl-side{background:#0B0B0C;color:#C9CDD4;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:hidden}
.fl-side .wm{color:#fff;font-weight:800;letter-spacing:.14em;font-size:11px;line-height:1.35}
.fl-side .rule{height:2px;margin:10px 0 18px;background:linear-gradient(90deg,#FF2D8F,#F5C518,#22C55E,#29ABE2,#7C3AED);border-radius:2px;opacity:.85}
.fl-side .grp{font:600 10px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#6B7280;margin:16px 6px 6px}
.fl-side a{display:block;padding:6px 8px;border-radius:6px;color:#C9CDD4;text-decoration:none;font:500 11.5px 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
.fl-side a.on{color:#29ABE2;background:rgba(41,171,226,.08)}
.fl-main{min-width:0}
.fl-wrap{max-width:1180px;margin:0 auto;padding:0 28px 120px}
@media (max-width:900px){.fl-app{grid-template-columns:1fr}.fl-side{display:none}.fl-wrap{padding:0 16px 80px}}

/* the sticky frosted top bar (AivShell) */
.fl-top{position:sticky;top:0;z-index:30;margin:0 -28px 22px;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #EEF0F4}
@media (max-width:900px){.fl-top{margin:0 -16px 18px;padding:12px 16px}}
.fl-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;color:var(--ink)}
.fl-mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(120deg,var(--a),var(--a2));display:grid;place-items:center;flex:none}
.fl-mark svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8}
.fl-right{display:flex;align-items:center;gap:12px;font-size:13px;flex-wrap:wrap;justify-content:flex-end}
.fl-sample{font:600 10.5px 'JetBrains Mono',monospace;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}

/* buttons (BTN_GO / BTN_SOFT / BTN_LINE) */
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;transition:box-shadow .2s,transform .1s,background .2s,opacity .2s;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn-go{background:var(--a);color:#fff;box-shadow:0 6px 18px rgba(15,118,110,.28)}
.btn-go:hover{box-shadow:0 8px 24px rgba(15,118,110,.32)}
.btn-go:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.btn-soft{background:var(--aTint);color:var(--aInk)}
.btn-line{background:#fff;border:1px solid var(--line);color:var(--ink);padding:8px 12px;font-size:13px}
.btn-line:hover{background:var(--soft)}
.btn-big{padding:14px 22px;font-size:16px}
.btn-link{background:none;border:0;padding:0;color:var(--aInk);font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:14px}
.btn.ready{animation:flReady 1.8s ease-in-out infinite}
@keyframes flReady{0%,100%{box-shadow:0 6px 18px rgba(15,118,110,.28),0 0 0 0 rgba(15,118,110,.45)}50%{box-shadow:0 8px 24px rgba(15,118,110,.32),0 0 0 10px rgba(15,118,110,0)}}
.sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:flSheen 1.3s ease-in-out infinite}
@keyframes flSheen{to{transform:translateX(100%)}}

/* type */
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.panel-head{margin-bottom:12px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--aInk)}
.grad{background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.h-sentence{margin:0;max-width:980px;font-size:42px;font-weight:800;line-height:1.28;letter-spacing:-.025em;color:var(--ink)}
.h-big{font-size:88px;font-weight:900;line-height:1;letter-spacing:-.04em}
.h-chapter{margin:0;font-size:42px;font-weight:900;line-height:1.1;letter-spacing:-.025em;color:var(--ink)}
.lede{font-size:17px;color:var(--body);max-width:640px}
.small{font-size:13px;color:var(--muted)}
@media (max-width:700px){.h-sentence{font-size:30px}.h-big{font-size:64px}.h-chapter{font-size:30px}}

/* the dotted blank in a setup sentence (Blank.tsx) */
.blank{display:inline;margin:0 2px;padding:0 4px;border:0;background:none;color:var(--aInk);font:inherit;border-radius:6px 6px 0 0;border-bottom:4px dotted var(--a);transition:background .2s}
.blank:hover,.blank.open{background:var(--aTint)}
.blank.ok{border-bottom-style:solid}
.blank .tick{margin-left:2px;vertical-align:.6em;font-size:.5em;color:var(--up)}

/* the panel a blank opens (SetupPanel.tsx) */
.panel{margin-top:24px;max-width:820px;border:1px solid var(--line);border-radius:18px;background:#fff;padding:20px 22px;box-shadow:var(--shadowPanel);animation:flRise .3s var(--ease)}
.panel.wide{max-width:1100px}
@keyframes flRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise{animation:flRise .35s var(--ease) both}
.fade{animation:flFade .35s ease both}
@keyframes flFade{from{opacity:0}to{opacity:1}}

/* inputs */
.field{display:block}
.field>span{display:block;margin-bottom:4px;font-size:12px;font-weight:600;color:var(--body)}
.field>span i{color:var(--down);font-style:normal}
.input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;color:var(--ink);outline:none;background:#fff;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--a);box-shadow:0 0 0 4px var(--aTint)}

/* a found listing (FoundListing.tsx) */
.found{display:flex;align-items:center;gap:14px;padding:16px;border-radius:12px;background:var(--soft);cursor:pointer;transition:background .15s,box-shadow .15s}
.found:hover{background:var(--aTint)}
.found.on{background:var(--aTint);box-shadow:0 0 0 1px var(--a)}
.found .lt{width:42px;height:42px;border-radius:12px;background:var(--aTint);color:var(--aInk);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.found b{display:block;color:var(--ink);font-size:15px}
.found small{display:block;color:var(--muted);font-size:13px}

/* list rows with a box and a number (RivalRow.tsx) */
.row{display:grid;grid-template-columns:18px 24px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s,opacity .2s}
.row.hot{border-color:#A7D8CF;background:#FAFDFC}
.row.off{opacity:.6}
.row.off .nm{text-decoration:line-through;color:var(--faint)}
.row input{width:18px;height:18px;accent-color:var(--a)}
.num{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--aTint);color:var(--aInk)}
.row.off .num{background:var(--soft);color:var(--faint)}
.nm{display:block;font-weight:600;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11.5px;font-weight:600;background:var(--soft);color:var(--muted)}
.tag.a{background:var(--aTint);color:var(--aInk)}

/* the orb (Orb.tsx), steps (StepList.tsx), the map search (MapSearch.tsx) */
.orb{position:relative;display:inline-block;flex:none}
.orb .ring{position:absolute;inset:0;border-radius:50%;border:2px dotted #7CC8BC;animation:flSpin 2.4s linear infinite}
.orb .core{position:absolute;border-radius:50%;background:linear-gradient(120deg,var(--a),var(--a2));animation:flBreathe 1.6s ease-in-out infinite}
@keyframes flSpin{to{transform:rotate(360deg)}}
@keyframes flBreathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.86);opacity:.85}}
.steps{list-style:none;margin:0;padding:2px 0 0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--faint);transition:color .2s}
.steps li.now{font-weight:600;color:var(--ink)}
.steps li.done{color:var(--body)}
.steps .st{width:16px;height:16px;border-radius:50%;flex:none;border:1.5px solid #D0D5DD;display:grid;place-items:center;font-size:10px;color:#fff}
.steps li.now .st{border-color:var(--a);border-top-color:transparent;animation:flSpin .8s linear infinite}
.steps li.done .st{background:var(--up);border-color:var(--up)}
.mapsearch{position:relative;height:120px;overflow:hidden;border-radius:12px;border:1px solid var(--line);background:repeating-linear-gradient(135deg,#F3F4F7 0 14px,#EEF0F4 14px 28px)}
.mapsearch .pulse{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px;border-radius:50%;border:2px solid var(--a);animation:flPulse 1.8s ease-out infinite}
.mapsearch .pulse.b{animation-delay:.9s}
@keyframes flPulse{from{transform:scale(.6);opacity:.9}to{transform:scale(6);opacity:0}}
.mapsearch .c{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:var(--a)}
.mapsearch .f{position:absolute;width:10px;height:10px;border-radius:3px;border:2px solid var(--a);background:#fff;animation:flPop .4s var(--ease) both}
@keyframes flPop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.turning{position:relative;display:inline-block;width:14px;height:14px;border-radius:50%;background:linear-gradient(120deg,var(--a),var(--a2));flex:none}
.turning:after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1.5px dotted #7CC8BC;animation:flSpin 6s linear infinite}
.skel{height:11px;border-radius:6px;background:#E8EAEF;margin:10px 0;animation:flSkel 1.4s ease-in-out infinite}
@keyframes flSkel{50%{opacity:.5}}
.caret{display:inline-block;width:2px;height:1em;background:var(--a);vertical-align:-2px;margin-left:1px;animation:flBlink 1s steps(1) infinite}
@keyframes flBlink{50%{opacity:0}}
.shimmer-line{position:relative;height:2px;max-width:420px;margin-top:4px;overflow:hidden;border-radius:1px;background:#EEF0F5}
.shimmer-line:after{content:'';position:absolute;inset:0 auto 0 0;width:35%;background:linear-gradient(90deg,transparent,#7CC8BC,transparent);animation:flShim 2.2s ease-in-out infinite}
@keyframes flShim{from{transform:translateX(-100%)}to{transform:translateX(300%)}}

/* the method button + window (MethodButton / MethodWindow) */
.method-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;border-radius:10px;padding:6px 10px;font-weight:600;color:var(--aInk);position:relative}
.method-btn:hover{background:var(--aTint)}
.method-btn .dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(120deg,var(--a),var(--a2));position:relative}
.method-btn .dot:after{content:'';position:absolute;inset:3.5px;border-radius:50%;border:1px dotted #fff}
.teaser{position:absolute;right:0;top:100%;margin-top:8px;width:300px;z-index:40;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 16px;font-size:13px;font-weight:400;line-height:1.5;color:var(--body);text-align:left;box-shadow:0 12px 32px rgba(11,16,32,.12);animation:flFade .15s}
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:6vh 16px}
.modal .bd{position:fixed;inset:0;background:rgba(11,16,32,.4);animation:flFade .2s}
.modal .win{position:relative;width:100%;max-width:860px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:24px 28px;box-shadow:0 24px 60px rgba(11,16,32,.18);animation:flRise .25s var(--ease)}
.modal .x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);border-radius:8px;padding:4px 8px}
.modal .x:hover{background:var(--soft)}
.msec{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:center;border-top:1px solid var(--line);padding:20px 0}
.msec h3{margin:0 0 8px;font-size:16.5px;color:var(--ink)}
.msec p{margin:8px 0;font-size:15px;line-height:1.6}
.msec figure{margin:0}
.msec figcaption{margin-top:6px;text-align:center;font-size:12px;color:var(--muted)}
.figbox{height:200px;overflow:hidden;border-radius:14px;background:var(--soft)}
@media (max-width:760px){.msec{grid-template-columns:1fr}}

/* branded tooltip (BrandedTooltip.tsx) */
.tipcard{position:fixed;z-index:200;width:280px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 14px;font-size:13px;line-height:1.5;color:var(--body);box-shadow:0 12px 32px rgba(11,16,32,.12);pointer-events:none;animation:flFade .12s}
.tipcard b{display:block;color:var(--aInk);font-size:13px;margin-bottom:2px}
[data-tip]{cursor:help}
.tipword{border-bottom:1px dotted var(--faint);cursor:help}

/* segmented control with a sliding white thumb (Segmented.tsx) */
.seg{position:relative;display:inline-flex;flex-wrap:wrap;gap:2px;border-radius:10px;background:var(--soft);padding:3px}
.seg button{position:relative;z-index:1;border:0;background:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);transition:color .2s;white-space:nowrap}
.seg button:hover{color:var(--body)}
.seg button.on{color:var(--ink)}
.seg .thumb{position:absolute;z-index:0;border-radius:8px;background:#fff;box-shadow:0 1px 3px rgba(11,16,32,.1);transition:left .25s var(--ease),width .25s var(--ease),top .25s var(--ease)}
.seg .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}

/* tabs with a sliding underline (ResultView.tsx) */
.tabs{position:sticky;top:57px;z-index:20;display:flex;gap:26px;margin:0 -28px 10px;padding:8px 28px 0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);backdrop-filter:blur(12px)}
@media (max-width:900px){.tabs{margin:0 -16px 10px;padding:8px 16px 0}}
.tabs button{position:relative;border:0;background:none;padding:0 0 10px;font-size:15px;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--ink)}
.tabs .ink{position:absolute;bottom:-1px;height:2px;background:var(--a);transition:left .3s var(--ease),width .3s var(--ease)}

/* branded dropdown (audit-hub-option-g .dd) */
.dd{position:relative;display:inline-block}
.dd-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.dd-btn:after{content:'';width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translateY(-2px)}
.dd-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:50;min-width:220px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;padding:4px;box-shadow:0 12px 32px rgba(11,16,32,.12);animation:flFade .12s}
.dd-opt{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;text-align:left;border-radius:7px;padding:7px 10px;font-size:13px;color:var(--body)}
.dd-opt:hover{background:var(--soft)}
.dd-opt.on{color:var(--aInk);font-weight:600}
.dd-opt.on:after{content:'✓'}

/* switch (Clients only) */
.switch{display:inline-flex;align-items:center;gap:8px;border:0;background:none;font-size:13px;font-weight:500;color:var(--muted)}
.switch i{position:relative;display:inline-block;width:30px;height:16px;border-radius:6px;background:#D0D5DD;transition:background .2s}
.switch i:after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:4px;background:#fff;transition:left .2s}
.switch.on i{background:var(--a)}
.switch.on i:after{left:16px}

/* past runs (PastSnapshotRow.tsx) */
.past{display:grid;grid-template-columns:minmax(0,1fr) 220px 150px;align-items:center;gap:16px;width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px 16px;text-align:left;transition:border-color .15s,background .15s;animation:flRise .35s var(--ease) both}
.past:hover{border-color:#A7D8CF;background:#FAFDFC}
.past .p1 b{display:block;font-size:15.5px;color:var(--ink)}
.past .p1 span{font-size:12.5px;color:var(--muted)}
.past .p3{text-align:right;font:12px 'JetBrains Mono',monospace;color:var(--faint)}
@media (max-width:700px){.past{grid-template-columns:minmax(0,1fr) auto}.past .p3{display:none}}

/* heat tiles (variation C) */
.htile{width:34px;height:34px;border-radius:4px;display:grid;place-items:center;font:800 13px Inter,sans-serif;border:1px solid rgba(255,255,255,.7);box-shadow:0 1px 2px rgba(11,16,32,.18);transform:translate(-50%,-50%);transition:background .35s,color .35s,transform .35s var(--ease),opacity .35s}
.htile.wait{background:rgba(255,255,255,.55)!important;color:transparent!important;box-shadow:inset 0 0 0 1.5px rgba(15,118,110,.25)}
.htile.land{animation:flLand .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes flLand{from{transform:translate(-50%,-50%) scale(.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.hpin{transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:auto}
.hpin i{width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(11,16,32,.25),0 4px 10px rgba(11,16,32,.3)}
.hpin span{margin-top:3px;white-space:nowrap;font:700 11px Inter,sans-serif;color:var(--ink);background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:6px;padding:1px 6px;opacity:0;transition:opacity .15s}
.hpin:hover span,.hpin.lbl span{opacity:1}
.leaflet-container{font-family:Inter,sans-serif;background:#EEF0F2}
.mini{display:grid;gap:2px}
.mini i{display:block;aspect-ratio:1;border-radius:2px;transition:background .3s}

/* charts (Demand chart language) */
.readout{min-height:44px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;padding:6px 0 8px;font-size:13px;color:var(--body)}
.readout b{color:var(--ink)}
.readout .sw{display:inline-block;width:12px;height:2px;vertical-align:4px;margin-right:6px;border-radius:1px}
.chart svg{display:block;width:100%;overflow:visible}
.chart .gl{stroke:#EEF0F3;stroke-width:1}
.chart .ax{fill:var(--muted);font:11px Inter,sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--body);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:2px;border-radius:1px}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}
</style>
<script>/* Facelift shared behaviours (window.FL): the AI Visibility page's pieces
   (frame, How it works window, branded hovers, sliding controls, waits that
   show their steps, typing, counting) in OQ teal, plus the Grid Scan heat map
   (variation C) and a line chart in the approved Demand chart language. */
(function () {
  const FL = (window.FL = {});
  FL.reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  FL.esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  FL.wait = (ms) => new Promise((r) => setTimeout(r, FL.reduce ? 0 : ms));
  FL.$ = (sel, root = document) => root.querySelector(sel);
  FL.$$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  FL.h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  FL.money = (n) => `$${Number(n).toFixed(2)}`;
  FL.fmt = (n) => Number(n).toLocaleString('en-US');

  const ICON = {
    grid: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="9.5" y="3" width="5" height="5" rx="1"/><rect x="16" y="3" width="5" height="5" rx="1"/><rect x="3" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><rect x="16" y="9.5" width="5" height="5" rx="1"/><rect x="3" y="16" width="5" height="5" rx="1"/><rect x="9.5" y="16" width="5" height="5" rx="1"/><rect x="16" y="16" width="5" height="5" rx="1"/></svg>',
    trends: '<svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>',
  };
  FL.icon = ICON;

  /* The app frame: OQ sidebar, sticky frosted top bar (brand mark, tool name,
     How it works, a right slot), then #page. Call once, before building the page. */
  FL.shell = function ({ tool, name, right = '', methodLabel = 'How it works' }) {
    const page = document.getElementById('page');
    const nav = [['Dashboard'], ['Clients'], ['Content Strategy'], ['Production'], ['Performance']];
    const tools = [['Grid Scan', tool === 'grid'], ['Market Trends', tool === 'trends'], ['AI Visibility'], ['Relevance Analyzer']];
    const app = FL.h(`<div class="fl-app">
      <aside class="fl-side"><div class="wm">STUDIO<br>EIGHTY EIGHT</div><div class="rule"></div>
        ${nav.map(([n]) => `<a href="#">${n}</a>`).join('')}
        <div class="grp">Tools</div>${tools.map(([n, on]) => `<a href="#" class="${on ? 'on' : ''}">${n}</a>`).join('')}
      </aside>
      <main class="fl-main"><div class="fl-wrap">
        <div class="fl-top"><div class="fl-brand"><span class="fl-mark">${ICON[tool]}</span>${FL.esc(name)}</div>
          <div class="fl-right"><span class="fl-sample">Mockup</span><span id="method-slot"></span><span id="top-right">${right}</span></div></div>
      </div></main></div>`);
    page.parentNode.insertBefore(app, page);
    app.querySelector('.fl-wrap').appendChild(page);
    FL.$('#method-slot').innerHTML = `<button type="button" class="method-btn"><span class="dot"></span>${FL.esc(methodLabel)}</button>`;
    return { right: (html) => { FL.$('#top-right').innerHTML = html; } };
  };

  /* How it works: hover for the one-line teaser, click for the window; each
     section has a small looping picture beside it (figure(el) -> stop()). */
  FL.method = function ({ teaser, kicker, title, sections }) {
    const btn = FL.$('.method-btn');
    let tip = null;
    btn.addEventListener('mouseenter', () => { if (tip) return; tip = FL.h(`<span class="teaser" role="tooltip">${FL.esc(teaser)}</span>`); btn.appendChild(tip); });
    btn.addEventListener('mouseleave', () => { tip?.remove(); tip = null; });
    window.addEventListener('scroll', () => { tip?.remove(); tip = null; }, true);
    document.addEventListener('click', (e) => { if (!btn.contains(e.target)) { tip?.remove(); tip = null; } });
    btn.addEventListener('click', () => {
      tip?.remove(); tip = null;
      const m = FL.h(`<div class="modal"><div class="bd"></div><div class="win" role="dialog" aria-modal="true">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px">
          <div><div class="panel-head" style="margin-bottom:4px">${FL.esc(kicker)}</div><h2 style="margin:0;font-size:26px;font-weight:900;letter-spacing:-.02em;color:var(--ink)">${FL.esc(title)}</h2></div>
          <button class="x" aria-label="Close">×</button></div>
        ${sections.map((s, i) => `<section class="msec"><div><h3>${FL.esc(s.title)}</h3>${s.body.map((p) => `<p>${p}</p>`).join('')}</div>
          <figure><div class="figbox" data-fig="${i}"></div><figcaption>${FL.esc(s.caption || '')}</figcaption></figure></section>`).join('')}
      </div></div>`);
      document.body.appendChild(m);
      const stops = sections.map((s, i) => (s.figure ? s.figure(m.querySelector(`[data-fig="${i}"]`)) : null));
      const close = () => { stops.forEach((f) => f && f()); m.remove(); tip?.remove(); tip = null; document.removeEventListener('keydown', onKey); };
      const onKey = (e) => { if (e.key === 'Escape') close(); };
      document.addEventListener('keydown', onKey);
      m.querySelector('.bd').onclick = close;
      m.querySelector('.x').onclick = close;
    });
  };
  /* A step counter for method pictures: fn(step) every ms, 0..count-1, looping. */
  FL.loop = function (count, ms, fn) {
    let s = FL.reduce ? count - 1 : 0;
    fn(s);
    if (FL.reduce) return () => {};
    const t = setInterval(() => { s = (s + 1) % count; fn(s); }, ms);
    return () => clearInterval(t);
  };

  /* Branded hover: any element with data-tip (and optional data-tip-h). Delegated, so content added later works. */
  let tipEl = null; let tipFor = null; let tipTimer = null;
  const hideTip = () => { clearTimeout(tipTimer); tipEl?.remove(); tipEl = null; tipFor = null; };
  document.addEventListener('mouseover', (e) => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (t === tipFor) return;
    hideTip();
    if (!t) return;
    tipFor = t;
    tipTimer = setTimeout(() => {
      const r = t.getBoundingClientRect();
      tipEl = FL.h(`<div class="tipcard">${t.dataset.tipH ? `<b>${FL.esc(t.dataset.tipH)}</b>` : ''}${FL.esc(t.dataset.tip)}</div>`);
      document.body.appendChild(tipEl);
      const left = Math.max(8, Math.min(r.left, innerWidth - 288));
      if (innerHeight - r.bottom < 130) tipEl.style.bottom = `${innerHeight - r.top + 6}px`; else tipEl.style.top = `${r.bottom + 6}px`;
      tipEl.style.left = `${left}px`;
    }, 120);
  });
  window.addEventListener('scroll', hideTip, true);

  /* Branded dropdown, never a native select. */
  FL.dropdown = function (host, { options, value, onChange, label }) {
    let v = value; let open = false;
    const draw = () => {
      const cur = options.find((o) => o.value === v) || options[0];
      host.innerHTML = `<div class="dd"><button type="button" class="dd-btn" aria-label="${FL.esc(label || '')}">${FL.esc(cur.label)}</button>
        ${open ? `<div class="dd-menu">${options.map((o) => `<button type="button" class="dd-opt ${o.value === v ? 'on' : ''}" data-v="${FL.esc(o.value)}"><span>${FL.esc(o.label)}${o.count != null ? ` <span style="color:var(--faint)">${o.count}</span>` : ''}</span></button>`).join('')}</div>` : ''}</div>`;
      host.querySelector('.dd-btn').onclick = (e) => { e.stopPropagation(); open = !open; draw(); };
      host.querySelectorAll('.dd-opt').forEach((b) => { b.onclick = () => { v = b.dataset.v; open = false; draw(); onChange && onChange(v); }; });
    };
    document.addEventListener('click', () => { if (open) { open = false; draw(); } });
    draw();
    return { set: (x) => { v = x; draw(); } };
  };

  /* Segmented control: the white thumb slides to the pick. */
  FL.segmented = function (host, { options, value, onChange, label }) {
    host.innerHTML = `<div class="seg" role="radiogroup" aria-label="${FL.esc(label || '')}"><span class="thumb"></span>${options.map((o) =>
      `<button type="button" role="radio" data-v="${FL.esc(o.value)}">${o.color ? `<span class="sw" style="background:${o.color}"></span>` : ''}${FL.esc(o.label)}</button>`).join('')}</div>`;
    const seg = host.firstElementChild; const thumb = seg.querySelector('.thumb');
    const set = (v, fire) => {
      seg.querySelectorAll('button').forEach((b) => { const on = b.dataset.v === String(v); b.classList.toggle('on', on); b.setAttribute('aria-checked', on);
        if (on) { thumb.style.left = `${b.offsetLeft}px`; thumb.style.top = `${b.offsetTop}px`; thumb.style.width = `${b.offsetWidth}px`; thumb.style.height = `${b.offsetHeight}px`; } });
      if (fire && onChange) onChange(v);
    };
    seg.querySelectorAll('button').forEach((b) => { b.onclick = () => set(b.dataset.v, true); });
    requestAnimationFrame(() => set(value, false));
    return { set: (v) => set(v, false) };
  };

  /* Tabs with a sliding underline; sticky under the top bar. */
  FL.tabs = function (host, { tabs, value, onChange }) {
    host.classList.add('tabs');
    host.setAttribute('role', 'tablist');
    host.innerHTML = tabs.map((t) => `<button type="button" role="tab" data-k="${t.key}">${FL.esc(t.label)}</button>`).join('') + '<span class="ink"></span>';
    const ink = host.querySelector('.ink');
    const set = (k, fire) => {
      host.querySelectorAll('button').forEach((b) => { const on = b.dataset.k === k; b.classList.toggle('on', on); b.setAttribute('aria-selected', on);
        if (on) { ink.style.left = `${b.offsetLeft}px`; ink.style.width = `${b.offsetWidth}px`; } });
      if (fire && onChange) onChange(k);
    };
    host.querySelectorAll('button').forEach((b) => { b.onclick = () => set(b.dataset.k, true); });
    requestAnimationFrame(() => set(value, false));
    return { set: (k) => set(k, false) };
  };

  /* Waits that show what they are doing. */
  FL.orb = (size = 44) => `<span class="orb" aria-hidden="true" style="width:${size}px;height:${size}px"><span class="ring"></span><span class="core" style="inset:${size * 0.2}px"></span></span>`;
  FL.sheen = () => '<span class="sheen" aria-hidden="true"></span>';
  FL.mapSearch = (label) => `<div><div class="mapsearch" aria-hidden="true"><span class="pulse"></span><span class="pulse b"></span><span class="c"></span>
    ${[[30, 32], [64, 40], [44, 70], [70, 66], [24, 62]].map(([x, y], i) => `<span class="f" style="left:${x}%;top:${y}%;animation-delay:${0.6 + i * 0.35}s"></span>`).join('')}</div>
    <p style="margin:10px 0 0;font-size:14px;font-weight:600;color:var(--ink)">${FL.esc(label)}</p></div>`;
  FL.steps = function (host, labels) {
    host.innerHTML = `<ul class="steps">${labels.map((l) => `<li><span class="st"></span>${FL.esc(l)}</li>`).join('')}</ul>`;
    const lis = host.querySelectorAll('li');
    return { set(i, state) { const li = lis[i]; li.className = state; li.querySelector('.st').textContent = state === 'done' ? '✓' : ''; } };
  };
  FL.skeleton = (widths = ['92%', '84%', '88%', '46%']) => widths.map((w) => `<div class="skel" style="width:${w}"></div>`).join('');

  /* Typing: text into el, a few characters a tick, with a caret while it types. */
  FL.type = function (el, text, { cps = 180 } = {}) {
    if (FL.reduce) { el.textContent = text; return Promise.resolve(); }
    return new Promise((res) => {
      let n = 0; el.innerHTML = '<span class="caret"></span>';
      const step = Math.max(1, Math.round(cps / 60));
      const t = setInterval(() => {
        n = Math.min(text.length, n + step);
        el.innerHTML = `${FL.esc(text.slice(0, n))}${n < text.length ? '<span class="caret"></span>' : ''}`;
        if (n >= text.length) { clearInterval(t); res(); }
      }, 16);
    });
  };
  /* Count a number up (or down) to `to`, easing out. */
  FL.countTo = function (el, to, { from = null, ms = 900, fmt = (v) => Math.round(v) } = {}) {
    const start = from ?? (parseFloat(el.dataset.v) || 0);
    el.dataset.v = to;
    if (FL.reduce) { el.textContent = fmt(to); return; }
    const t0 = performance.now();
    const tick = (now) => { const p = Math.min(1, (now - t0) / ms); const e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(start + (to - start) * e); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  };
  FL.wilson = function (k, n) {
    if (!n) return [0, 0];
    const z = 1.96; const p = k / n; const d = 1 + (z * z) / n; const c = (p + (z * z) / (2 * n)) / d;
    const h = (z * Math.sqrt((p * (1 - p)) / n + (z * z) / (4 * n * n))) / d;
    return [Math.max(0, c - h), Math.min(1, c + h)];
  };

  /* ---------------- Grid Scan: ranks and the heat map (variation C) ---------------- */
  FL.RANK = { g: '#15803D', y: '#F5C518', r: '#DC2626', n: '#94A3B8' };
  FL.rankStyle = (v) => (v == null || v > 20 ? { bg: FL.RANK.n, ink: '#fff', t: '20+' }
    : v <= 3 ? { bg: FL.RANK.g, ink: '#fff', t: String(Math.round(v)) }
      : v <= 10 ? { bg: FL.RANK.y, ink: '#0B1020', t: String(Math.round(v)) }
        : { bg: FL.RANK.r, ink: '#fff', t: String(Math.round(v)) });
  FL.band = (v) => (v == null || v > 20 ? 'not in top 20' : v <= 3 ? 'top 3' : v <= 10 ? '4 to 10' : '11 to 20');
  FL.flat = (g) => g.flat();
  FL.top3 = (g) => FL.flat(g).filter((v) => v != null && v <= 3).length;
  FL.solv = (g) => (100 * FL.top3(g)) / FL.flat(g).length;
  FL.avgRank = (g) => FL.flat(g).reduce((a, v) => a + (v == null || v > 20 ? 21 : v), 0) / FL.flat(g).length;
  /* The all-keywords average: mean rank per point, 21 for not in top 20. */
  FL.avgGrid = (grids) => grids[0].map((row, i) => row.map((_, j) => grids.reduce((a, g) => a + (g[i][j] > 20 ? 21 : g[i][j]), 0) / grids.length));
  FL.legendHtml = () => `<div style="display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px">${[[1, 'top 3'], [7, '4 to 10'], [14, '11 to 20'], [21, 'not in top 20']].map(([v, l]) => { const s = FL.rankStyle(v); return `<span style="display:inline-flex;align-items:center"><b style="display:inline-grid;place-items:center;width:22px;height:22px;border-radius:4px;margin-right:6px;font-size:11px;background:${s.bg};color:${s.ink}">${s.t}</b>${l}</span>`; }).join('')}</div>`;
  FL.mini = (g, px = 6) => `<div class="mini" style="grid-template-columns:repeat(${g.length},${px}px)">${FL.flat(g).map((v) => `<i style="background:${FL.rankStyle(v).bg}"></i>`).join('')}</div>`;

  /* The map: Esri light grey canvas (no names), 34px square rank tiles at the grid spacing,
     pins above the tiles with a white halo. Points row 0 = north, col 0 = west. */
  FL.heatMap = function (el, { center, size = 9, spacingMi = 0.25, zoom = 14, interactive = true }) {
    const map = L.map(el, { scrollWheelZoom: false, zoomControl: interactive, dragging: interactive, attributionControl: true, zoomSnap: 0.25 });
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: 'Tiles &copy; Esri' }).addTo(map);
    const dLat = spacingMi / 69; const dLng = spacingMi / (69 * Math.cos((center[0] * Math.PI) / 180));
    const mid = (size - 1) / 2;
    const pt = (i, j) => [center[0] + (mid - i) * dLat, center[1] + (j - mid) * dLng];
    map.fitBounds(L.latLngBounds([pt(0, 0), pt(size - 1, size - 1)]), { paddingTopLeft: [interactive ? 48 : 18, 18], paddingBottomRight: [18, 18] });
    const tiles = [];
    for (let i = 0; i < size; i++) for (let j = 0; j < size; j++) {
      const m = L.marker(pt(i, j), { icon: L.divIcon({ className: '', html: '<div class="htile wait"></div>', iconSize: [0, 0] }), interactive: false, keyboard: false }).addTo(map);
      tiles.push({ i, j, m });
    }
    const pinLayer = L.layerGroup().addTo(map);
    const api = {
      map, pt,
      tileEl: (i, j) => tiles[i * size + j].m.getElement()?.firstElementChild,
      set(i, j, v, { land = false, exact = true } = {}) {
        const d = api.tileEl(i, j); if (!d) return;
        const s = FL.rankStyle(v);
        d.className = `htile${land && !FL.reduce ? ' land' : ''}`;
        d.style.background = s.bg; d.style.color = s.ink;
        d.textContent = v == null || v > 20 ? '20+' : exact ? String(Math.round(v)) : (Math.round(v * 10) / 10).toFixed(1).replace(/\.0$/, '');
        if (!exact) d.style.fontSize = '11.5px'; else d.style.fontSize = '';
      },
      clear() { tiles.forEach(({ i, j }) => { const d = api.tileEl(i, j); if (d) { d.className = 'htile wait'; d.textContent = ''; } }); },
      setGrid(g, { exact = true } = {}) { tiles.forEach(({ i, j }) => api.set(i, j, g[i][j], { exact })); },
      /* Paint a grid in the order a scan reads it (rings out from the office), one point every `ms`. */
      async sweep(g, { ms = 18, exact = true, onPoint } = {}) {
        api.clear();
        const order = tiles.map(({ i, j }) => ({ i, j, d: Math.hypot(i - mid, j - mid) + (Math.atan2(i - mid, j - mid) + Math.PI) / 50 })).sort((a, b) => a.d - b.d);
        for (let k = 0; k < order.length; k++) { const { i, j } = order[k]; api.set(i, j, g[i][j], { land: true, exact }); onPoint && onPoint(k + 1, g[i][j], i, j); if (ms) await FL.wait(ms); }
      },
      /* pins: [{lat,lng,label,kind:'you'|'comp'|'custom',n}] */
      setPins(pins, { labels = false } = {}) {
        pinLayer.clearLayers();
        pins.forEach((p) => {
          const color = p.kind === 'you' ? 'var(--a)' : p.kind === 'custom' ? '#3B5BDB' : '#0B1020';
          L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', iconSize: [0, 0], html: `<div class="hpin ${labels || p.kind === 'you' ? 'lbl' : ''}"><i style="background:${color}"></i><span>${p.n ? `${p.n} · ` : ''}${FL.esc(p.label)}</span></div>` }), zIndexOffset: p.kind === 'you' ? 2000 : 1000 }).addTo(pinLayer);
        });
      },
      tilesVisible(on) { tiles.forEach(({ m }) => { const e = m.getElement(); if (e) e.style.opacity = on ? 1 : 0; }); },
    };
    return api;
  };

  /* ---------------- Market Trends: the line chart (Demand chart language) ----------------
     Thin 2px monotone lines, no dots; the lead line in white casing with a soft area and an
     end dot; dashed slate hover guide with a dot per line; the readout ABOVE the chart keeps
     its height (no layout shift); end labels pushed apart; legend for 2+ series. */
  FL.lineChart = function (host, opts) {
    let o = { height: 260, range: 60, upto: null, endLabels: true, draw: true, yMax: 100, legend: true, ...opts };
    const W = 820; const PL = 30; const PR = o.endLabels ? 130 : 14; const PT = 10; const PB = 24;
    host.classList.add('chart');
    host.innerHTML = `${o.readout === false ? '' : '<div class="readout"></div>'}<svg viewBox="0 0 ${W} ${o.height}" role="img"></svg>${o.legend ? '<div class="legend"></div>' : ''}`;
    const svg = host.querySelector('svg'); const ro = host.querySelector('.readout'); const lg = host.querySelector('.legend');
    const NS = 'http://www.w3.org/2000/svg';
    const render = (animate) => {
      const H = o.height; const months = o.months; const N = months.length;
      const start = Math.max(0, N - o.range); const span = N - 1 - start;
      const x = (i) => PL + ((i - start) / Math.max(1, span)) * (W - PL - PR);
      const y = (v) => PT + (1 - v / o.yMax) * (H - PT - PB);
      const last = o.upto == null ? N - 1 : Math.min(N - 1, o.upto);
      const path = (vals) => { let d = ''; for (let i = start; i <= last; i++) { if (vals[i] == null) continue; d += `${d ? 'L' : 'M'}${x(i).toFixed(1)},${y(vals[i]).toFixed(1)}`; } return d; };
      let s = '<defs><linearGradient id="fl-area" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0F766E" stop-opacity=".2"/><stop offset="1" stop-color="#0F766E" stop-opacity="0"/></linearGradient></defs>';
      [0, 25, 50, 75, 100].filter((v) => v <= o.yMax).forEach((v) => { s += `<line class="gl" x1="${PL}" x2="${W - PR}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${PL - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; });
      for (let i = start; i < N; i++) if (/^Jan/.test(months[i]) || (o.range <= 24 && /^(Apr|Jul|Oct)/.test(months[i]))) s += `<text class="ax" x="${x(i)}" y="${H - 6}" text-anchor="middle">${months[i].replace(' 20', ' ’')}</text>`;
      const lines = o.lines.filter((l) => !l.hidden);
      const lead = lines.find((l) => l.lead);
      if (lead) s += `<path d="${path(lead.values)}L${x(last)},${y(0)}L${x(start)},${y(0)}Z" fill="url(#fl-area)"/>`;
      [...lines].sort((a, b) => Number(!!a.lead) - Number(!!b.lead)).forEach((l) => {
        const d = path(l.values);
        if (l.lead) s += `<path d="${d}" fill="none" stroke="#fff" stroke-width="${(l.width || 2.4) + 3}" stroke-linejoin="round" stroke-linecap="round"/>`;
        s += `<path class="ln" d="${d}" fill="none" stroke="${l.color}" stroke-width="${l.width || 2}" ${l.dash ? `stroke-dasharray="${l.dash}"` : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
      });
      if (lead && lead.values[last] != null) s += `<circle cx="${x(last)}" cy="${y(lead.values[last])}" r="4" fill="${lead.color}" stroke="#fff" stroke-width="2"/>`;
      if (o.endLabels) {
        const ends = lines.filter((l) => l.values[last] != null).map((l) => ({ l, y: y(l.values[last]) })).sort((a, b) => a.y - b.y);
        for (let k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 14) ends[k].y = ends[k - 1].y + 14;
        ends.forEach(({ l, y: ly }) => { const ty = y(l.values[last]); s += `${Math.abs(ly - ty) > 2 ? `<line x1="${x(last) + 4}" y1="${ty}" x2="${x(last) + 10}" y2="${ly - 3}" stroke="#C3C8D2"/>` : ''}<text x="${x(last) + 12}" y="${ly + 1}" font-size="11.5" font-weight="${l.lead ? 700 : 500}" fill="#273043">${FL.esc(l.short || l.label)}</text>`; });
      }

</style></head><body><div id="page"></div>
<script>
const D = FLDATA.MT; const G = FLDATA.GS; const PAST = FLDATA.PAST;

const stateOf = (city) => STATE[(city || '').split(',')[1]?.trim()] || D.practice.state;

const esc = FL.esc;

/* ---------- words ---------- */
const change = (r) => (r >= 1.3 ? 'up about a third' : r >= 1.15 ? 'up about a fifth' : r >= 1.05 ? 'up about a tenth' : r > 0.95 ? 'about the same as' : r > 0.85 ? 'down about a tenth' : 'down about a fifth');
const VERDICT = { growing: ['Growing', 'var(--up)'], emerging: ['Emerging', 'var(--up)'], stable: ['Steady', 'var(--muted)'], decaying: ['Falling', 'var(--down)'] };
const rising = (t) => t.verdict === 'growing' || t.verdict === 'emerging';
function sentence(t, name) {
  const c = change(t.yoy); const vs = c.startsWith('about') ? `${c} last year` : `${c} on last year`;
  if (t.verdict === 'growing') return `Searches are ${vs}, ahead of dental searches overall. Busiest in ${t.peakMonthName}.`;
  if (t.verdict === 'emerging') return `Still small, but searches are ${vs} and climbing faster than anything else ${name} offers.`;
  if (t.verdict === 'stable') return `Searches are ${vs}, moving with dental searches overall. Busiest in ${t.peakMonthName}.`;
  return `Searches are ${vs}, slipping while dental searches overall hold. Busiest in ${t.peakMonthName}.`;
}
const spark = (vals, color, w = 58, h = 20) => { const v = vals.slice(-24); const mx = Math.max(...v); const mn = Math.min(...v);
  const pts = v.map((y, i) => `${((i / (v.length - 1)) * (w - 2) + 1).toFixed(1)},${(h - 2 - ((y - mn) / Math.max(1, mx - mn)) * (h - 4)).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`; };
const ring = (p) => { const r = 8; const c = 2 * Math.PI * r; return `<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="${r}" fill="none" stroke="#E7E9EE" stroke-width="2.5"/><circle cx="11" cy="11" r="${r}" fill="none" stroke="var(--a)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" transform="rotate(-90 11 11)" style="transition:stroke-dashoffset .35s ease"/></svg>`; };
const toast = (msg) => { const t = FL.h(`<div class="toast" role="status">${esc(msg)}</div>`); document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };

/* ---------- state ---------- */
const S = {
  view: 'land', clientsOnly: false, clientFilter: 'all',
  setup: null,   // {step, done:{}, fields, client, lookup, picked, topics:[], suggest:'idle'|'reading'|'ready', phrases:{topic:[{p,ok,why,head}]}, phr:'idle'|'writing'|'ready'}
  run: null,     // {name, client, domain, city, topics:[...], kept:{}, phase:'live'|'result'|'failed', read:{}, cost, selected, mode, range, hidden:Set}
};
const freshSetup = () => ({ step: 0, done: {}, fields: { domain: '', name: '', city: '' }, client: null, lookup: 'idle', picked: 0, topics: [], suggest: 'idle', phrases: {}, phr: 'idle', err: '' });

/* ---------- top bar: History dropdown + New check ---------- */
function drawTop() {
  shell.right(`<span id="hist"></span>${S.view === 'ws' ? '<button class="btn btn-line" id="newc">New check</button>' : ''}`);
  const done = PAST.filter((p) => p.status !== 'running');
  FL.dropdown(document.getElementById('hist'), { label: 'History', value: '', options: [{ value: '', label: 'History' }, ...done.map((p, i) => ({ value: String(PAST.indexOf(p)), label: `${p.name} · ${p.when.split(',')[0]}` }))],
    onChange: (v) => { if (v !== '') openPast(PAST[+v]); } });
  const n = document.getElementById('newc'); if (n) n.onclick = () => { S.view = 'land'; S.run = null; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
}

/* ---------- landing ---------- */
function drawLanding() {
  page.innerHTML = `<div class="land-hero rise">
      <div class="eyebrow" style="margin-bottom:14px">Market Trends</div>
      <h1 class="h-sentence">Which topics are patients searching for <span class="grad">more</span> this year, and which are fading?</h1>
      <div class="land-cta"><button class="btn btn-go btn-big" id="start">Start a check</button>
        <span class="small" style="font-size:14px">Any client or prospect. About a minute, read from Google Trends.</span></div>
    </div>
    <div class="pastbar"><h2 class="eyebrow" style="margin:0;flex:1">Past checks <span style="font-weight:500;text-transform:none;letter-spacing:0">${PAST.length}</span></h2>

    <div class="pastlist" id="plist"></div>`;
  document.getElementById('start').onclick = () => openSheet(freshSetup());
  document.getElementById('co').onclick = () => { S.clientsOnly = !S.clientsOnly; drawLanding(); };
  const clients = PAST.filter((p) => p.client);
  FL.dropdown(document.getElementById('cf'), { label: 'Filter by client', value: S.clientFilter, options: [{ value: 'all', label: 'All clients and prospects' }, ...clients.map((p) => ({ value: p.name, label: p.name, count: 1 }))],
    onChange: (v) => { S.clientFilter = v; drawPast(); } });
  drawPast();
}
function drawPast() {
  const rows = PAST.filter((p) => (!S.clientsOnly || p.client) && (S.clientFilter === 'all' || p.name === S.clientFilter));
  const host = document.getElementById('plist');
  host.innerHTML = rows.length ? rows.map((p, i) => {
    const mid = p.status === 'running' ? '<span style="display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--aInk)"><span class="turning"></span>Reading phrases</span>'
      : p.status === 'failed' ? '<span style="font-size:13.5px;font-weight:600;color:var(--down)">Stopped</span>'
        : `<span class="hl"><span class="grad">${esc(p.mt.split(' rising')[0])}</span><small>topics rising</small></span>`;
    return `<button class="past" data-i="${PAST.indexOf(p)}" style="animation-delay:${i * 40}ms"><span class="p1"><b>${esc(p.name)}</b><span>${esc(p.city)} <span class="tag ${p.client ? 'a' : ''}" style="margin-left:6px">${p.client ? 'Client' : 'Prospect'}</span></span></span>${mid}<span class="p3">${esc(p.when)}<br>${FL.money(p.cost)}</span></button>`;
  }).join('') : '<p class="small" style="border:1px dashed #D0D5DD;border-radius:14px;padding:22px;text-align:center">No checks match. Start one above.</p>';
  host.querySelectorAll('.past').forEach((b) => { b.onclick = () => openPast(PAST[+b.dataset.i]); });
}
function openPast(p) {
  // a past check keeps its own count: "2 of 4 rising" opens with four topics, two of them rising
  const m = /(\d+) of (\d+)/.exec(p.mt || ''); let topics = D.topics.map((t) => t.topic);
  if (m) { const k = +m[1]; const n = +m[2]; const up = D.topics.filter(rising).slice(0, k); const rest = D.topics.filter((t) => !rising(t)).slice(0, n - up.length); topics = D.topics.filter((t) => up.includes(t) || rest.includes(t)).map((t) => t.topic); }
  S.run = newRun({ name: p.name, client: p.client, domain: p.name === G.practice.title ? G.practice.domain : `${p.name.toLowerCase().replace(/[^a-z]/g, '')}.com`, city: p.city }, topics, null);
  S.view = 'ws';
  if (p.status === 'complete') { S.run.phase = 'result'; topics.forEach((t) => { S.run.read[t] = 1; }); S.run.cost = p.cost; S.run.when = p.when; render(); }
  else if (p.status === 'failed') { S.run.phase = 'failed'; S.run.cost = p.cost; S.run.when = p.when; ['Dental implants'].forEach((t) => { S.run.read[t] = 1; }); render(); }
  else { render(); runLive(); }
  window.scrollTo({ top: 0 });
}

/* ---------- the setup sheet ---------- */
let SU = null;
function openSheet(setup) {
  SU = setup;
  let bd = document.querySelector('.sheet-bd');
  if (!bd) {
    bd = FL.h('<div class="sheet-bd"></div>'); document.body.appendChild(bd);
    document.body.appendChild(FL.h('<aside class="sheet" role="dialog" aria-modal="true" aria-label="Set up a check"><nav class="sheet-steps"></nav><div class="sheet-body"></div><div class="sheet-foot"></div><button class="sheet-x" aria-label="Close">×</button></aside>'));
    bd.onclick = closeSheet; document.querySelector('.sheet-x').onclick = closeSheet;
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.querySelector('.sheet.on')) closeSheet(); });
  }
  drawSheet();
  requestAnimationFrame(() => { bd.classList.add('on'); document.querySelector('.sheet').classList.add('on'); });
}
function closeSheet() { document.querySelector('.sheet-bd')?.classList.remove('on'); document.querySelector('.sheet')?.classList.remove('on'); }
const STEPS = ['Practice', 'Topics', 'Phrases'];
const keptPhrases = (t) => (SU.phrases[t] || []).filter((x) => x.ok);
const phraseCount = () => SU.topics.reduce((n, t) => n + keptPhrases(t).length, 0);
function stepSummary(i) {
  if (i === 0) return SU.done[0] ? `${SU.fields.name} · ${SU.fields.city}` : 'Which practice, and where';
  if (i === 1) return SU.done[1] ? `${SU.topics.length} topic${SU.topics.length === 1 ? '' : 's'}: ${SU.topics.slice(0, 3).join(', ')}${SU.topics.length > 3 ? '…' : ''}` : 'What patients want, 1 to 10';
  return SU.done[2] ? `${phraseCount()} phrases` : 'How patients search each topic';
}
function drawSheet() {
  const nav = document.querySelector('.sheet-steps');
  nav.innerHTML = `<div class="eyebrow">${SU.edit ? 'Check again' : 'New check'}</div>${STEPS.map((s, i) => `${i ? '<div class="vline"></div>' : ''}<button class="vstep ${SU.step === i ? 'on' : ''} ${SU.done[i] ? 'done' : ''}" data-i="${i}" ${i > 0 && !SU.done[i - 1] ? 'disabled' : ''}>
      <span class="c">${SU.done[i] ? '✓' : i + 1}</span><span style="min-width:0"><b>${s}</b><span class="s">${esc(stepSummary(i))}</span></span></button>`).join('')}`;
  nav.querySelectorAll('.vstep').forEach((b) => { b.onclick = () => { SU.step = +b.dataset.i; drawSheet(); }; });
  [drawPractice, drawTopics, drawPhrases][SU.step]();
  drawFoot();
}
function drawFoot() {
  const ready = SU.done[0] && SU.done[1] && SU.done[2];
  const left = 3 - [0, 1, 2].filter((i) => SU.done[i]).length;
  const usd = phraseCount() * D.pricePerPhrase;
  const foot = document.querySelector('.sheet-foot');
  foot.innerHTML = `<span class="small" style="font-size:14px">${ready ? `${SU.topics.length} topics, ${phraseCount()} phrases. About a minute; keeps going if this page is closed.` : `Finish the ${left} step${left === 1 ? '' : 's'} first.`}</span>
    <button class="btn btn-go btn-big ${ready ? 'ready' : ''}" id="runb" ${ready ? '' : 'disabled'}>${ready ? `Run the check · ${FL.money(usd)}` : 'Run the check'}</button>`;
  document.getElementById('runb').onclick = async (e) => {
    const b = e.currentTarget; b.classList.remove('ready'); b.innerHTML = `Starting…${FL.sheen()}`; b.disabled = true;
    await FL.wait(900);
    closeSheet();
    const kept = Object.fromEntries(SU.topics.map((t) => [t, keptPhrases(t).map((x) => x.p)]));
    S.run = newRun({ name: SU.fields.name, client: !!SU.client, domain: SU.fields.domain, city: SU.fields.city }, SU.topics, kept);
    S.view = 'ws'; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    setTimeout(runLive, 450);
  };
}
const body = () => document.querySelector('.sheet-body');
function drawPractice() {
  const f = SU.fields;
  if (SU.lookup === 'loading') { body().innerHTML = `<h2>Which practice</h2><p class="sub">Looking for ${esc(f.name)} around ${esc(f.city)}.</p>${FL.mapSearch('Looking it up on Google Maps…')}`; return; }
  if (SU.lookup === 'found') {
    const other = G.competitors.find((c) => c.title === 'Bothell Dental Care');
    const cands = [{ t: f.name, a: G.practice.address, r: `${G.practice.rating} (${G.practice.reviews} reviews)`, gbp: true }, { t: other.title, a: other.address, r: `${other.rating} (${other.reviews} reviews)` }];
    body().innerHTML = `<h2>Which practice</h2><p class="sub">Pick the listing that is this practice. Its city sets where the searches are read.</p>
      <div style="display:flex;flex-direction:column;gap:8px;max-width:640px" role="radiogroup">${cands.map((c, i) => `<div class="found ${SU.picked === i ? 'on' : ''} rise" style="animation-delay:${i * 70}ms" role="radio" aria-checked="${SU.picked === i}" data-i="${i}" tabindex="0">
        <span class="lt">${esc(c.t[0])}</span><span style="min-width:0"><b>${esc(c.t)}</b><small>${esc(c.a)} · ${esc(c.r)}</small>${c.gbp ? '<small style="color:var(--aInk);font-weight:600">From their Google Business Profile</small>' : ''}</span></div>`).join('')}</div>
      <div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-go" id="one">That's the one</button><button class="btn btn-line" id="chg">Change the name or city</button></div>`;
    body().querySelectorAll('.found').forEach((el) => { el.onclick = () => { SU.picked = +el.dataset.i; drawPractice(); }; });
    document.getElementById('chg').onclick = () => { SU.lookup = 'idle'; drawPractice(); };
    document.getElementById('one').onclick = () => { if (SU.picked === 1) f.name = cands[1].t; SU.done[0] = true; SU.step = 1; if (SU.suggest === 'idle') readSite(); drawSheet(); };
    return;
  }
  const clients = [G.practice.title, ...PAST.filter((p) => p.client && p.name !== G.practice.title).map((p) => p.name)];
  body().innerHTML = `<h2>Which practice</h2><p class="sub">Pick a client to fill this in, or type a prospect.</p>
    <label class="field cs" style="max-width:520px"><span>Client</span><input class="input" id="cli" placeholder="Search clients" autocomplete="off" value="${esc(SU.client || '')}"></label>
    <div class="f3">${[['domain', 'Domain', 'smiledental.com'], ['name', 'Business name', 'As it reads on Google'], ['city', 'City and state', 'Bothell, WA']].map(([k, l, ph]) =>
      `<label class="field"><span>${l}<i> *</i></span><input class="input" data-k="${k}" placeholder="${ph}" value="${esc(f[k])}"></label>`).join('')}</div>
    ${SU.err ? `<div class="err">${esc(SU.err)}</div>` : ''}
    <button class="btn btn-go" id="find" style="margin-top:18px">Find the practice</button>`;
  const cli = document.getElementById('cli');
  const menu = (q) => { body().querySelector('.cs-menu')?.remove(); const hits = clients.filter((c) => c.toLowerCase().includes(q.toLowerCase())); if (!hits.length) return;
    const m = FL.h(`<div class="cs-menu">${hits.map((c) => `<button type="button" data-c="${esc(c)}">${esc(c)}<span class="tag a">Client</span></button>`).join('')}</div>`); cli.parentNode.appendChild(m);
    m.querySelectorAll('button').forEach((b) => { b.onmousedown = (e) => { e.preventDefault(); pickClient(b.dataset.c); }; }); };
  cli.onfocus = () => menu(cli.value); cli.oninput = () => menu(cli.value); cli.onblur = () => setTimeout(() => body().querySelector('.cs-menu')?.remove(), 120);
  body().querySelectorAll('[data-k]').forEach((i) => { i.oninput = () => { f[i.dataset.k] = i.value; }; });
  document.getElementById('find').onclick = async () => {
    if (!f.domain.trim() || !f.name.trim() || !f.city.trim()) { SU.err = 'Fill in the domain, the business name and the city first.'; drawPractice(); return; }
    SU.err = ''; SU.lookup = 'loading'; drawPractice(); await FL.wait(1900); SU.lookup = 'found'; SU.picked = 0; if (SU.step === 0) drawPractice();
  };
}
function pickClient(name) {
  SU.client = name;
  const p = PAST.find((x) => x.name === name);
  SU.fields = name === G.practice.title ? { domain: G.practice.domain, name, city: G.practice.city } : { domain: `${name.toLowerCase().replace(/[^a-z]/g, '')}.com`, name, city: p ? p.city : '' };
  drawPractice();
}
async function readSite() {
  SU.suggest = 'reading';
  await FL.wait(2600);
  SU.suggest = 'ready';
  if (!SU.topics.length) SU.topics = D.topics.map((t) => t.topic);
  if (SU.step === 1 && document.querySelector('.sheet.on')) drawSheet();
}
function drawTopics() {
  if (SU.suggest !== 'ready') {
    body().innerHTML = `<h2>Topics</h2><p class="sub">What patients want from ${esc(SU.fields.name)}, in their words.</p><div style="display:flex;gap:16px;align-items:flex-start">${FL.orb()}<div id="rsteps"></div></div>`;
    const st = FL.steps(document.getElementById('rsteps'), [`Reading ${SU.fields.domain} for the services it names`, 'Checking which ones patients search for']);
    st.set(0, 'now'); setTimeout(() => { if (document.getElementById('rsteps')) { st.set(0, 'done'); st.set(1, 'now'); } }, 1300);
    return;
  }
  const all = [...new Set([...D.suggestedTopics, ...SU.topics])];
  body().innerHTML = `<h2>Topics</h2><p class="sub">Read from ${esc(SU.fields.domain)}. Keep what the practice wants more patients for; add any the client asks about.</p>
    <div class="tiles">${all.map((t, i) => { const on = SU.topics.includes(t); const d = BY[t];
      return `<button class="ttile ${on ? 'on' : ''}" data-t="${esc(t)}" style="animation-delay:${i * 45}ms"><span class="bx">${on ? '✓' : ''}</span><span>${esc(t)}<small>${d ? 'Named on the homepage' : D.suggestedTopics.includes(t) ? 'Named on a service page' : 'Added by the team'}</small></span></button>`; }).join('')}</div>
    <div class="addrow"><input class="input" id="addt" placeholder="Add a topic, e.g. dental bonding"><button class="btn btn-line" id="addtb">Add</button></div>
    ${SU.err ? `<div class="err">${esc(SU.err)}</div>` : ''}
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:22px;max-width:100%"><span class="mono small">${SU.topics.length} of 10 topics</span>
      <button class="btn btn-go" id="tok" ${SU.topics.length ? '' : 'disabled'}>Write the phrases</button></div>`;
  body().querySelectorAll('.ttile').forEach((b) => { b.onclick = () => { const t = b.dataset.t; SU.err = '';
    if (SU.topics.includes(t)) SU.topics = SU.topics.filter((x) => x !== t); else if (SU.topics.length >= 10) SU.err = 'Ten topics at most in one check.'; else SU.topics.push(t);
    SU.done[1] = false; SU.done[2] = false; drawSheet(); }; });
  const add = () => { const v = document.getElementById('addt').value.trim(); if (!v) return; const t = v[0].toUpperCase() + v.slice(1);
    if (SU.topics.length >= 10) { SU.err = 'Ten topics at most in one check.'; drawSheet(); return; }
    if (!SU.topics.includes(t)) SU.topics.push(t); SU.err = ''; SU.done[1] = false; SU.done[2] = false; drawSheet(); };
  document.getElementById('addtb').onclick = add;
  document.getElementById('addt').onkeydown = (e) => { if (e.key === 'Enter') add(); };
  document.getElementById('tok').onclick = () => { SU.done[1] = true; SU.step = 2; writePhrases(); drawSheet(); };
}
async function writePhrases() {
  const fresh = SU.topics.filter((t) => !SU.phrases[t]);
  Object.keys(SU.phrases).forEach((t) => { if (!SU.topics.includes(t)) delete SU.phrases[t]; });
  if (!fresh.length) { SU.phr = 'ready'; return; }
  SU.phr = 'writing'; SU.typed = false;
  await FL.wait(2200);
  fresh.forEach((t) => { const d = BY[t]; const low = t.toLowerCase();
    SU.phrases[t] = d ? [...d.phrases.map((p, k) => ({ p: p.phrase, ok: true, head: k === 0 })), ...d.gateRefused.map((r) => ({ p: r.phrase, ok: false, why: r.why }))]
      : [{ p: low, ok: true, head: true }, { p: `${low} cost`, ok: true }, { p: `${low} near me`, ok: false, why: 'near me' }]; });
  SU.phr = 'ready';
  if (SU.step === 2 && document.querySelector('.sheet.on')) drawSheet();
}
const WHY = { 'names a place': 'It names a place. Google Trends already reads the whole state, so a city in the phrase splits the same searches in two.', 'near me': 'It says near me. Google Trends cannot place a near-me search, so it adds noise rather than demand.' };
function drawPhrases() {
  if (SU.phr !== 'ready') {
    body().innerHTML = `<h2>Phrases</h2><p class="sub">How patients search each topic.</p><div style="display:flex;gap:16px;align-items:flex-start">${FL.orb()}<div id="psteps"></div></div>`;
    const st = FL.steps(document.getElementById('psteps'), ['Writing how patients search each topic', 'Checking each phrase against our search data']);
    st.set(0, 'now'); setTimeout(() => { if (document.getElementById('psteps')) { st.set(0, 'done'); st.set(1, 'now'); } }, 1100);
    return;
  }
  const typeIn = !SU.typed && !FL.reduce; SU.typed = true;
  body().innerHTML = `<h2>Phrases</h2><p class="sub">The first phrase in each topic leads its chart. Remove any that are not this practice; add the ones the client hears.</p>
    <div>${SU.topics.map((t, ti) => { const list = SU.phrases[t] || []; const n = list.filter((x) => x.ok).length;
      return `<div class="ptopic" style="animation-delay:${ti * 60}ms"><div class="th"><b><i style="background:${BY[t] ? COL[D.topics.indexOf(BY[t])] : '#B6BCC8'}"></i>${esc(t)}</b><span class="mono small">${n} of 5</span></div>
        <div class="chips">${list.map((x, k) => (x.ok

  if (typeIn) (async () => { for (const el of body().querySelectorAll('.tx')) { const [ti, k] = el.dataset.t.split('-').map(Number); await FL.type(el, SU.phrases[SU.topics[ti]][k].p, { cps: 420 }); } })();
  body().querySelectorAll('.rm').forEach((b) => { b.onclick = () => { const L = SU.phrases[b.dataset.t]; const k = +b.dataset.k; const wasHead = L[k].head; L.splice(k, 1); if (wasHead) { const f = L.find((x) => x.ok); if (f) f.head = true; } SU.done[2] = false; drawSheet(); }; });

/* ---------- a run ---------- */
function newRun(pr, topics, kept) {
  return { ...pr, topics, kept: kept || Object.fromEntries(topics.map((t) => [t, (BY[t]?.phrases || []).map((p) => p.phrase)])), phase: 'live', read: {}, cost: 0,
    selected: topics.find((t) => BY[t]) || topics[0], mode: 'one', range: 60, hidden: new Set(), asking: '', upto: null, when: 'Today' };
}
const readTopics = (R) => R.topics.filter((t) => BY[t] && R.read[t] >= 1);
async function runLive() {
  const R = S.run; R.phase = 'live';
  const queue = R.topics; const total = queue.reduce((n, t) => n + (R.kept[t] || []).length, 0); let done = 0;
  for (const t of queue) {
    if (S.run !== R) return;
    const phrases = R.kept[t] || [];
    R.selected = BY[t] ? t : R.selected; R.upto = 0; R.read[t] = 0.02; drawWorkspace();
    for (let k = 0; k < phrases.length; k++) {
      if (S.run !== R) return;
      R.asking = phrases[k]; drawAsking();
      // the months fill in left to right across the topic's phrases, so the lines are always drawing
      for (let m = 0; m <= 60; m += 3) {
        if (S.run !== R) return;
        if (BY[t]) { R.upto = Math.min(60, Math.round(((k + m / 60) / phrases.length) * 60)); chartObj?.update({ upto: R.upto }); }
        await FL.wait(BY[t] ? 32 : 24);
      }
      done += 1; R.cost = done * D.pricePerPhrase; R.read[t] = (k + 1) / phrases.length;
      drawRail(); drawSpend(done, total);
    }
    R.read[t] = 1; R.upto = null; drawRail(); drawHead();
    await FL.wait(250);
  }
  R.phase = 'result'; R.asking = ''; R.selected = R.topics.find((t) => BY[t]) || R.selected;
  drawWorkspace(true);
}

/* Compare: each topic scaled to its own peak; a focused topic keeps its colour, the rest go pale. */
function compareLines(ts, focus) {
  return ts.map((t) => { const d = BY[t]; const mx = Math.max(...d.combined); const on = !focus || focus === t;
    return { key: t, label: t, short: d.short, values: d.combined.map((v) => Math.round((v * 100) / mx)), color: on ? COL[D.topics.indexOf(d)] : '#DCE0E6', width: focus === t ? 2.6 : 2, lead: false }; });
}

      body: ['A topic is what a patient wants, like dental implants. A phrase is how they type it: "tooth implant", "implant dentist". Each topic is read through one to five phrases, and the first one, the head phrase, leads its chart.', 'Phrases that name a place or say near me are left out: Google Trends already reads the whole state, so they only split the same searches.'],
      figure: (el) => { const ph = [['dental implants', 1], ['tooth implant', 1], ['implant dentist', 1], ['implants bothell wa', 0]];
        const s = svgFig(el, `<rect x="14" y="82" width="104" height="36" rx="9" fill="#fff" stroke="#99D5CC"/><text x="66" y="104" font-size="11" font-weight="700" fill="#0B1020" text-anchor="middle">Dental implants</text>
          ${ph.map(([p, ok], i) => `<g class="r" data-i="${i}" style="opacity:0;transition:opacity .4s"><path d="M118 100 C 140 100, 140 ${40 + i * 40}, 160 ${40 + i * 40}" fill="none" stroke="${ok ? '#0F766E' : '#C3C8D2'}" stroke-width="1.5"/>
          <rect x="160" y="${28 + i * 40}" width="128" height="24" rx="6" fill="${ok ? (i ? '#fff' : '#E6F4F1') : '#F6F7FA'}" stroke="${ok ? '#E7E9EE' : '#E7E9EE'}"/><text x="170" y="${44 + i * 40}" font-size="10.5" font-weight="600" fill="${ok ? '#0B1020' : '#98A2B3'}" ${ok ? '' : 'text-decoration="line-through"'}>${p}</text></g>`).join('')}`);
        return FL.loop(6, 700, (k) => s.querySelectorAll('.r').forEach((g) => { g.style.opacity = +g.dataset.i < k ? 1 : 0; })); } },
    { title: 'Growing, steady, falling or emerging', caption: 'The topic (teal) against dental searches overall (grey).',
      body: ['A topic is called against dental searches overall, not on its own. If every dental search rose a tenth this year, a topic that rose a tenth is steady, not growing.', 'Growing means it rose clearly faster than dental searches overall; falling, clearly slower. Emerging is a small topic climbing fast from a low start.'],
      figure: (el) => { const st = [['Growing', [[20, 130], [100, 115], [180, 90], [285, 50]]], ['Steady', [[20, 110], [100, 104], [180, 98], [285, 92]]], ['Falling', [[20, 70], [100, 86], [180, 110], [285, 130]]], ['Emerging', [[20, 158], [100, 156], [180, 140], [285, 92]]]];
        const s = svgFig(el, `<path d="${P([[20, 110], [100, 104], [180, 98], [285, 92]])}" fill="none" stroke="#B6BCC8" stroke-width="1.6" stroke-dasharray="4 3"/><path id="tl" fill="none" stroke="#0F766E" stroke-width="2.4" style="transition:d .7s"/><text id="tw" x="20" y="30" font-size="15" font-weight="800" fill="#0B1020"></text>`);
        return FL.loop(st.length, 1600, (i) => { s.querySelector('#tl').setAttribute('d', P(st[i][1])); s.querySelector('#tw').textContent = st[i][0]; }); } },
    { title: 'Seasons', caption: 'Three years of whitening: the same summer rise each year.',
      body: ['Many topics have a season. Teeth whitening climbs every spring into early summer; emergency visits rise over the winter holidays.', 'The check names the busiest month so pages and posts can land a few weeks before patients start searching.'],
      figure: (el) => { const pts = Array.from({ length: 37 }, (_, i) => [20 + i * 7.3, 110 - 40 * Math.cos(((i - 5) * Math.PI) / 6) + i * 0.4]);
        const s = svgFig(el, `${[5, 17, 29].map((i) => `<rect class="sb" x="${20 + i * 7.3 - 10}" y="30" width="20" height="140" rx="4" fill="#E6F4F1" style="opacity:0;transition:opacity .4s"/>`).join('')}<path d="${P(pts)}" fill="none" stroke="#0F766E" stroke-width="2.2" stroke-linejoin="round"/>
          ${['2024', '2025', '2026'].map((y, i) => `<text x="${20 + (i * 12 + 5) * 7.3}" y="186" font-size="10" fill="#667085" text-anchor="middle">Jun ${y}</text>`).join('')}`);
        return FL.loop(4, 800, (k) => s.querySelectorAll('.sb').forEach((r, i) => { r.style.opacity = i < k ? 1 : 0; })); } },
    { title: 'The 1 to 10 rating', caption: 'The parts add up to the rating.',
      body: ['Each topic gets a rating from 1 to 10 that orders the topics, from most to least worth a page: how demand is moving, how many people search, how steady it is through the year, and whether patients search it by name.', 'The rating only orders the list. It never changes whether a topic is called growing or falling.'],
      figure: (el) => { const parts = [['Demand is growing', 3], ['Large search volume', 3], ['Steady all year', 1], ['Searched by name', 1]];
        const s = svgFig(el, `${parts.map(([l, p], i) => `<g class="pr" data-i="${i}" style="opacity:0;transition:opacity .35s"><text x="20" y="${44 + i * 28}" font-size="12" fill="#273043">${l}</text><text x="190" y="${44 + i * 28}" font-size="12" font-weight="700" fill="#0B1020" text-anchor="end">+${p}</text></g>`).join('')}
          <line x1="20" x2="190" y1="156" y2="156" stroke="#E7E9EE"/><text id="tot" x="190" y="182" font-size="22" font-weight="900" fill="#0F766E" text-anchor="end"></text><text x="196" y="182" font-size="12" fill="#667085">/10</text>`);
        return FL.loop(6, 750, (k) => { let t = 0; s.querySelectorAll('.pr').forEach((g) => { const on = +g.dataset.i < k; g.style.opacity = on ? 1 : 0; if (on) t += parts[+g.dataset.i][1]; }); s.querySelector('#tot').textContent = t; }); } },
  ],
});

// the teaser stays up when the window opens under the pointer; any scroll or click clears it
['scroll', 'click'].forEach((ev) => window.addEventListener(ev, () => document.querySelectorAll('.teaser').forEach((t) => { if (!t.parentNode.matches(':hover')) t.remove(); }), true));
render();
</script></body></html>
