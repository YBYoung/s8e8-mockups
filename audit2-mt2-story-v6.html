<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Market Trends, V6 Two questions per page</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>.oq-rail{position:fixed;inset:0 auto 0 0;width:56px;background:#fff;border-right:1px solid rgba(231,229,228,.6);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px;z-index:40}.oq-rail-item{width:39px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#44403c}.oq-rail-item:hover{background:#f5f5f4}.oq-rail-item.is-active{background:#1c1917;color:#fff}.oq-rail-item:first-child{color:#a8a29e;margin-bottom:8px}.oq-rail-sep{width:24px;height:1px;background:#e7e5e4;margin:6px 0}.oq-rail-foot{margin-top:auto}.oq-rail-av{position:relative;display:flex;width:28px;height:28px;border-radius:6px;background:#e7e5e4;color:#44403c;font:600 10px Inter,system-ui;align-items:center;justify-content:center}.oq-rail-av i{position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-radius:2px;background:#16a34a;border:2px solid #fff}
/* Market Trends Story mockups, round 2. Facelift shared look (AIV experience in OQ teal), trimmed. */
:root{
  --ink:#0B1020;--ink2:#0F172A;--body:#273043;--muted:#667085;--faint:#98A2B3;--line:#E7E9EE;--soft:#F6F7FA;
  --a:#0F766E;--aInk:#115E59;--aTint:#E6F4F1;--aSoft:#99D5CC;
  --up:#15803D;--down:#E11D48;--rose:#DB2777;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.55;color:var(--body);background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:var(--aInk)}

/* mockup bar: outside the design */
.mockbar{background:#ECEEF1;color:#4B5563;font-size:12px;line-height:1.45;padding:7px 18px;border-bottom:1px solid #DDE1E6}
.mockbar b{color:#111827;font-weight:700}
.mockbar .src{color:#6B7280}
.mockbar ul{margin:3px 0 0;padding:0 0 0 16px}
.mockbar li{margin:0}
.mockbar .nr{display:inline-block;margin-top:3px;color:#6B7280}

/* app chrome */
.fl-app{margin-left:56px;min-height:100vh}
.mockbar{margin-left:56px}
.fl-main{min-width:0}
.fl-wrap{max-width:1240px;margin:0 auto;padding:0 28px 120px}
.fl-top{position:sticky;top:0;z-index:30;margin:0 -28px 0;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #EEF0F4}
.fl-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;color:var(--ink)}
.fl-mark{width:26px;height:26px;border-radius:8px;background:var(--a);display:grid;place-items:center;flex:none}
.fl-mark svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8}
.fl-right{display:flex;align-items:center;gap:12px;font-size:13px;flex-wrap:wrap;justify-content:flex-end}
.fl-right .who{color:var(--ink);font-weight:700}
.fl-right .when{color:var(--muted)}
.btn{border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13.5px;transition:background .2s,box-shadow .2s}
.btn-go{background:var(--a);color:#fff;box-shadow:0 6px 18px rgba(15,118,110,.25)}
.btn-line{background:#fff;border:1px solid var(--line);color:var(--ink);padding:7px 12px;font-size:13px}
.btn-line:hover{background:var(--soft)}
.method-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;border-radius:8px;padding:6px 10px;font-weight:600;color:var(--aInk);position:relative;font-size:13.5px}
.method-btn:hover{background:var(--aTint)}
.method-btn .dot{width:14px;height:14px;border-radius:50%;background:var(--a);position:relative}
.method-btn .dot:after{content:'';position:absolute;inset:3.5px;border-radius:50%;border:1px dotted #fff}
.teaser{position:absolute;right:0;top:100%;margin-top:8px;width:300px;z-index:40;border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px 16px;font-size:13px;font-weight:400;line-height:1.5;color:var(--body);text-align:left;box-shadow:0 12px 32px rgba(11,16,32,.12)}

/* tabs */
.tabs{position:sticky;top:55px;z-index:20;display:flex;gap:26px;margin:0 -28px 6px;padding:10px 28px 0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(12px)}
.tabs button{position:relative;border:0;background:none;padding:0 0 10px;font-size:15px;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--ink)}
.tabs .ink{position:absolute;bottom:-1px;height:2px;background:var(--a);transition:left .3s var(--ease),width .3s var(--ease)}
.tabnote{padding:60px 0;color:var(--muted);font-size:14px}

/* modal (How it works) */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:5vh 16px}
.modal .bd{position:fixed;inset:0;background:rgba(11,16,32,.4)}
.modal .win{position:relative;width:100%;max-width:880px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:24px 28px;box-shadow:0 24px 60px rgba(11,16,32,.18);animation:rise .25s var(--ease)}
.modal .x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);border-radius:6px;padding:4px 8px}
.msec{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:center;border-top:1px solid var(--line);padding:20px 0}
.msec h3{margin:0 0 8px;font-size:16.5px;color:var(--ink)}
.msec p{margin:8px 0;font-size:15px;line-height:1.6}
.msec figure{margin:0}
.msec figcaption{margin-top:6px;text-align:center;font-size:12px;color:var(--muted)}
.figbox{height:200px;overflow:hidden;border-radius:8px;background:var(--soft)}
.figbox svg{display:block;width:100%;height:100%}
.figbox svg *{transition:opacity .45s, fill .45s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:300;background:var(--ink);color:#fff;border-radius:8px;padding:12px 18px;font-size:14px;box-shadow:0 12px 32px rgba(11,16,32,.25);animation:rise .25s var(--ease)}
.tipcard{position:fixed;z-index:200;width:280px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:10px 14px;font-size:13px;line-height:1.5;color:var(--body);box-shadow:0 12px 32px rgba(11,16,32,.12);pointer-events:none}
.tipcard b{display:block;color:var(--aInk);font-size:13px;margin-bottom:2px}
.tipword{border-bottom:1px dotted var(--faint);cursor:help}

/* Story */
.story{display:grid;grid-template-columns:minmax(0,1fr) 600px;gap:44px}
.chap{min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding:24px 0;opacity:.25;transition:opacity .4s}
.chap.on{opacity:1}
.chap .k{margin-bottom:12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--aInk)}
.chap .k .act{color:var(--muted)}
.chap h2{margin:0;font-size:36px;font-weight:900;line-height:1.12;letter-spacing:-.025em;color:var(--ink)}
.chap h2 .g{color:var(--a)}
.chap h2 .r{color:var(--down)}
.chap p{margin:14px 0 0;max-width:540px;font-size:17px;line-height:1.6}
.defs{margin-top:18px;max-width:540px;padding:12px 14px;background:#F8FAFB;border:1px solid var(--line);border-radius:6px}
.defs .dh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.chap .defs p{margin:0;font-size:13.5px;line-height:1.55;color:#273043}
.chap .defs p+p{margin-top:6px}
.chap .note{font-size:13.5px;color:var(--muted);margin-top:12px}
.facts{margin-top:18px;max-width:540px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.facts div{padding:9px 10px 9px 0;border-bottom:1px solid var(--line)}
.facts b{display:block;font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.facts span{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.qlist{margin-top:16px;max-width:540px;border-top:1px solid var(--line)}
.qlist div{display:grid;grid-template-columns:minmax(0,1fr) 70px 54px;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.qlist div span:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.qlist .h span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)!important}
.stick{position:sticky;top:104px;height:calc(100vh - 112px);display:flex;flex-direction:column;justify-content:center}
.ro{height:52px;padding:4px 2px 6px;border-bottom:1px solid #EEF0F3;margin-bottom:6px;overflow:hidden}
.ro .r1{display:flex;justify-content:space-between;align-items:baseline;height:20px;font-size:13px;white-space:nowrap}
.ro .r1 .m{font-weight:700;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.ro .r1 .n{color:var(--muted);font-size:12px;margin-left:12px}
.ro .r2{display:grid;height:22px;align-items:center;gap:10px;font-size:12.5px;white-space:nowrap}
.ro .r2 .s{display:flex;align-items:center;gap:6px;overflow:hidden;min-width:0}
.ro .r2 .s b{color:var(--ink2);font-variant-numeric:tabular-nums}
.ro .r2 .s span{color:var(--body);overflow:hidden;text-overflow:ellipsis}
.ro .r2 .s svg{flex:none}
.ro .r2 .txt{grid-column:1/-1;color:var(--body);overflow:hidden;text-overflow:ellipsis}
.figsvg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.figsvg text{font-family:Inter,sans-serif}
.figsvg .num{font-variant-numeric:tabular-nums}
.figcap{margin-top:6px;min-height:36px;font-size:12.5px;line-height:1.45;color:var(--muted);text-align:center}
.storyend{margin:24px 0 0;padding:28px;border:1px solid var(--line);border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;opacity:0;transform:translateY(14px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.storyend.in{opacity:1;transform:none}
.storyend h3{margin:0;font-size:24px;font-weight:900;color:var(--ink);letter-spacing:-.02em}
.storyend p{margin:4px 0 0;color:var(--muted);font-size:14px}
@media (max-width:1180px){.story{grid-template-columns:minmax(0,1fr) 520px;gap:32px}}
@media (max-width:980px){.story{grid-template-columns:1fr}.stick{position:static;height:auto}.chap{opacity:1;min-height:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

/* V5: chapter = lead sentence, number tiles, short points, optional detail table, How-this-is-measured link */
.v5 .chap{min-height:92vh}
.v5 .chap .k{letter-spacing:.12em}
.v5 .chap h2{font-size:30px;line-height:1.14;max-width:560px}
.tiles{margin-top:20px;max-width:560px;display:grid;gap:8px}
.tiles.t2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tiles div{border:1px solid var(--line);border-radius:6px;background:#fff;padding:10px 12px 9px}
.tiles b{display:block;font-size:20px;font-weight:800;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.015em;white-space:nowrap}
.tiles span{display:block;margin-top:3px;font-size:12px;line-height:1.35;color:var(--muted)}
.tiles div[data-tip]{cursor:help}
.pts{margin:16px 0 0;padding:0;max-width:560px;list-style:none}
.pts li{position:relative;padding:4px 0 4px 16px;font-size:15.5px;line-height:1.45;color:var(--body)}
.pts li:before{content:'';position:absolute;left:2px;top:13px;width:6px;height:6px;border-radius:1px;background:var(--aSoft)}
.pts li b{color:var(--ink)}
.dt{margin-top:14px;width:100%;max-width:560px;border-collapse:collapse;font-size:13px}
.dt th{text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 0 5px;border-bottom:1px solid var(--line)}
.dt td{padding:5px 0;border-bottom:1px solid var(--line);color:var(--body)}
.dt .n{text-align:right;font-variant-numeric:tabular-nums;padding-left:10px;white-space:nowrap}
.dt td.n{color:var(--ink);font-weight:600}
.dtn{margin-top:5px;font-size:11.5px;color:var(--faint)}
.hm{margin-top:14px;display:flex;gap:18px;flex-wrap:wrap}
.hm a{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--aInk);text-decoration:none;border-radius:6px;padding:3px 6px 3px 0}
.hm a:hover{text-decoration:underline}
.hm .i{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--a);display:inline-grid;place-items:center;font:700 9.5px/1 Inter,sans-serif;color:var(--a);font-style:italic}
.mnote{margin-top:12px;max-width:560px;padding:6px 10px;background:#F1F2F4;border-radius:4px;font-size:11.5px;line-height:1.45;color:#6B7280}
.mnote b{color:#4B5563}
/* chapter 01: three topic tiles */
.ttiles{margin-top:20px;max-width:560px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ttiles>div{border:1px solid var(--line);border-radius:6px;background:#fff;padding:10px 12px}
.ttiles .tn{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ttiles .ta{margin-top:3px;font-size:15.5px;font-weight:800;line-height:1.25;color:var(--ink)}
.ttiles .ta i{font-style:normal;color:var(--a)}
.ttiles .tf{margin-top:4px;font-size:12px;line-height:1.4;color:var(--muted)}
@keyframes tolit{from{fill:#115E59}to{fill:#fff}}
@keyframes toink{from{fill:#98A2B3}to{fill:#0B1020}}

/* V6: hover sentences in the readout may wrap to two lines inside the same fixed 52px bar (no layout shift) */
.ro:has(.txt){padding-top:1px;padding-bottom:1px}
.ro .r2:has(.txt){height:30px;align-items:start}
.ro .r2 .txt{white-space:normal;font-size:11.5px;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

          <div><div style="font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--aInk)">Market Trends</div><h2 style="margin:2px 0 0;font-size:26px;font-weight:900;letter-spacing:-.02em;color:var(--ink)">${FL.esc(title)}</h2></div>

    }
    write(mk) {
      const c = mk.cur; const el = mk.el;
      if (c.pts) el.setAttribute('d', ptsD(c.pts));
      if ('tx' in c || 's' in c) el.setAttribute('transform', `translate(${(c.tx || 0).toFixed(2)},${(c.ty || 0).toFixed(2)}) scale(${(c.s ?? 1).toFixed(4)},${(c.sx ?? c.s ?? 1).toFixed(4)})`);

      el.style.strokeDashoffset = '0';

        g.innerHTML = html; g.getBoundingClientRect(); g.style.opacity = 1;
        g.querySelectorAll('[data-count]').forEach((t) => FL.countTo(t, +t.dataset.count, { from: +(t.dataset.from || 0), ms: 900, fmt: (t.dataset.fmt === 'x' ? (v) => `${v.toFixed(1)} times` : (v) => FL.fmt(Math.round(v))) }));

    }
  };
  FL.countTo = function (el, to, { from = 0, ms = 900, fmt = (v) => Math.round(v) } = {}) {
    if (FL.reduce) { el.textContent = fmt(to); return; }

    requestAnimationFrame(tick);
  };

  /* ---------- the readout bar above the figure (fixed 52px, fixed slots) ---------- */
  FL.key = (k = {}) => `<svg width="16" height="8" viewBox="0 0 16 8"><line x1="1" y1="4" x2="15" y2="4" stroke="${k.c || '#0F766E'}" stroke-width="${Math.min(2.6, k.w || 2)}" ${k.dash ? `stroke-dasharray="${k.dash}"` : ''} stroke-linecap="round"/></svg>`;
  FL.dotKey = (c, hollow) => `<svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.6" fill="${hollow ? '#fff' : c}" stroke="${c}" stroke-width="1.4"/></svg>`;
  FL.readout = function (host) {
    host.innerHTML = '<div class="r1"><span class="m"></span><span class="n"></span></div><div class="r2"></div>';
    const m = host.querySelector('.m'); const n = host.querySelector('.n'); const r2 = host.querySelector('.r2');
    return {
      set({ title = '', note = '', slots = null, text = null, cols = null }) {
        m.textContent = title; n.textContent = note;
        if (text != null) { r2.style.gridTemplateColumns = '1fr'; r2.innerHTML = `<span class="txt">${text}</span>`; return; }
        const s = slots || [];
        r2.style.gridTemplateColumns = `repeat(${cols || Math.max(1, s.length)}, minmax(0,1fr))`;
        r2.innerHTML = s.map((x) => `<span class="s">${x.key || ''}<b>${FL.esc(x.v)}</b><span>${FL.esc(x.name)}</span></span>`).join('');
      },
    };

<script>/* V5 story runner (copy of story.js; chapter = lead sentence, number tiles, short points, optional detail table, How-this-is-measured link).
   Story runner: text chapters on the left, ONE persistent SVG on the right.
   A chapter becomes active in a 10% band at mid-viewport (IntersectionObserver, -45%/-45%).
   Each chapter returns targets for EVERY mark (base + its own changes); marks glide, never remount. */
(function () {
  const esc = FL.esc;
  FL.story = function (host, cfg) {
    const { chapters, end } = cfg;
    const HIW = 'mt2-how-it-works.html';
    const tiles = (t) => (t && t.length ? `<div class="tiles t${t.length}">${t.map(([v, l, tip]) => `<div${tip ? ` data-tip="${esc(tip)}"` : ''}><b>${v}</b><span>${l}</span></div>`).join('')}</div>` : '');
    const pts = (p) => (p && p.length ? `<ul class="pts">${p.map((x) => `<li>${x}</li>`).join('')}</ul>` : '');
    const table = (t) => (t ? `<table class="dt"><thead><tr>${t.cols.map((c, j) => `<th${j ? ' class="n"' : ''}>${c}</th>`).join('')}</tr></thead><tbody>${t.rows.map((r) => `<tr>${r.map((c, j) => `<td${j ? ' class="n"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>${t.note ? `<div class="dtn">${t.note}</div>` : ''}` : '');
    const link = (l) => (l ? `<div class="hm">${(Array.isArray(l) ? l : [l]).map(([id, t]) => `<a href="${HIW}#${id}" target="mt-how-it-works" data-hiw="${id}"><span class="i">i</span>${t || 'How this is measured'}</a>`).join('')}</div>` : '');
    host.innerHTML = `<div class="story v5"><div class="chs">${chapters.map((c, i) => `<section class="chap ${i === 0 ? 'on' : ''}" data-i="${i}" id="ch-${c.key}">
        <div class="k">${c.kick}</div>
        <h2>${c.head}</h2>${c.extra || ''}${tiles(c.tiles)}${pts(c.points)}${table(c.table)}
        ${c.mock ? `<div class="mnote">${c.mock}</div>` : ''}${link(c.link)}</section>`).join('')}
        <div class="storyend" id="storyend">${end}</div></div>
      <div><div class="stick"><div class="ro" id="ro" aria-live="polite"></div>
        <svg class="figsvg" id="fig" viewBox="0 0 640 ${cfg.vh || 440}" role="img" aria-label=""></svg>
        <div class="figcap" id="figcap"></div></div></div></div>`;
    const svg = FL.$('#fig'); const fig = new FL.Fig(svg);
    svg.insertAdjacentHTML('beforeend', `<defs>${cfg.defs || ''}</defs>`);
    const L = {};
    ['bg', 'grid', 'lines', 'marks', 'top', 'lab', 'hov'].forEach((n) => { L[n] = fig.layer(n); });
    if (cfg.clip) L.lines.setAttribute('clip-path', `url(#${cfg.clip})`);
    cfg.init(fig, L);
    const ro = FL.readout(FL.$('#ro'));
    let cur = -1; let timers = [];
    const later = (ms, fn) => { timers.push(setTimeout(fn, FL.reduce ? 0 : ms)); };

    const go = (i, first = false) => {
      if (i === cur) return; const prev = cur; cur = i;
      timers.forEach(clearTimeout); timers = [];
      const ch = chapters[i];
      const S = new Map(); cfg.base(S); ch.build(S, { prev: prev >= 0 ? chapters[prev].key : null, first });
      S.forEach((v, id) => { if (v.pre) fig.pre(id, v.pre); });
      S.forEach((v, id) => { fig.set(id, v.t, { dur: v.dur ?? 900, delay: v.delay ?? 0 }); });
      const lab = typeof ch.labels === 'function' ? ch.labels({ first }) : ch.labels;
      if (ch.labelsAt && !FL.reduce && !first) { fig.labels(ch.labelsPre ? ch.labelsPre() : '', L.lab); later(ch.labelsAt, () => fig.labels(lab, L.lab)); } else fig.labels(lab, L.lab);
      if (ch.enter) ch.enter(fig, later, { first, prev: prev >= 0 ? chapters[prev].key : null, L });

    };
    const idle = () => { const c = chapters[cur]; ro.set(typeof c.idle === 'function' ? c.idle() : c.idle || { title: '', text: '' }); };

    /* hover: the plot of line chapters reads into the bar; marks with data-ro-t read their own sentence */
    const hit = document.createElementNS(FL.NS, 'rect');
    Object.entries(cfg.hit).forEach(([k, v]) => hit.setAttribute(k, v));
    hit.setAttribute('fill', 'transparent'); L.hov.appendChild(hit);
    const guide = document.createElementNS(FL.NS, 'g'); L.hov.appendChild(guide);
    let HB = cfg.hit;
    const clearHover = () => { guide.innerHTML = ''; HB = chapters[cur].hit || cfg.hit; Object.entries(HB).forEach(([k, v]) => hit.setAttribute(k, v)); hit.style.pointerEvents = chapters[cur].hv ? 'all' : 'none'; };
    hit.addEventListener('pointermove', (e) => {
      const hv = chapters[cur].hv; if (!hv) return;
      const b = svg.getBoundingClientRect(); const px = ((e.clientX - b.left) / b.width) * 640;
      let best = hv.i0; let bd = 1e9;
      for (let i = hv.i0; i <= hv.i1; i++) { const d = Math.abs(hv.x(i) - px); if (d < bd) { bd = d; best = i; } }
      const i = best; const gx = hv.x(i);
      let g = `<line x1="${gx}" x2="${gx}" y1="${HB.y}" y2="${+HB.y + +HB.height}" stroke="#475569" stroke-dasharray="2 2"/>`;
      hv.series.forEach((s) => {
        const v = s.vals[i]; if (v == null || s.nodot) return;
        const r = s.kind === 'lead' ? 4.2 : s.kind === 'rose' ? 4.5 : 2.6; const ring = s.kind === 'lead' ? 1.5 : s.kind === 'rose' ? 2 : 0;
        g += `<circle cx="${gx}" cy="${s.y(v)}" r="${r}" fill="${s.key.c}" ${ring ? `stroke="#fff" stroke-width="${ring}"` : ''}/>`;
      });

      ro.set({ title: hv.title(i), note: hv.note, slots: hv.series.map((s) => ({ key: FL.key(s.key), v: s.vals[i] == null ? 'no data' : s.fmt(s.vals[i], i), name: s.name })), cols: hv.cols });
    });

    FL.$$('.chap').forEach((c) => io.observe(c));

  FL.put = (S, id, t, o = {}) => { const v = S.get(id) || { t: {} }; Object.assign(v.t, t); if (o.pre) v.pre = Object.assign(v.pre || {}, o.pre); if ('dur' in o) v.dur = o.dur; if ('delay' in o) v.delay = o.delay; S.set(id, v); };

  FL.spread = (items, gap, top, bottom) => {
    const a = items.map((d) => ({ ...d, ly: d.y })).sort((p, q) => p.ly - q.ly);
    for (let pass = 0; pass < 6; pass++) {
      for (let k = 1; k < a.length; k++) {

  FL.MONF = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  FL.ml = (ym) => `${FL.MON[+ym.slice(5) - 1]} ${ym.slice(0, 4)}`;
  FL.T = (x, y, txt, { s = 11, w = 500, c = '#273043', a = 'start', extra = '' } = {}) => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${s}" font-weight="${w}" fill="${c}" text-anchor="${a}" ${extra}>${txt}</text>`;
})();
</script>
<script>/* V6 core (from v5.js): geometry, persistent marks, the year band, and the two "reach" pictures.
   New in V6 (owner 10/29, "this section is incredibly complex"):
   - r4 (owner 10/29, "it bleeds and meshes over itself"): the year band is a compact panel of FIXED height at the
     foot of the figure in every chapter from the first topic chapter on (v6band.js); only its pins animate.
     The opening and the plan keep the large band; the two swap by cross-fade, never by a height tween.
   - "how patients reach the page" is split: WHO SEES IT (one picture, one scale: Expedition's showings a week
     against our other practices' average) and WHERE PATIENTS LAND (one row per page as a small path:
     showings -> visits -> calls or forms, ending in the work for that page).
   V6 pins (owner ruling 10/29): every pin is an action. Write = no page (new page, content calendar);
   Improve = a page Google lists outside the top results or that rarely brings visits (On-Page tool);
   no pin = a page that performs well. Peak, dip and the held level are context marks, not pins.
   Same engine: one SVG, marks keyed by id, never unmounted. */
(function () {
  const D = window.D; const M = D.months; const P = D.phrases; const T = FL.T; const put = FL.put; const fmt = FL.fmt;
  const K = (window.V6K = { D, M, P, T, put, fmt });

  K.VH = 552; K.BT = 420;

  Object.assign(K, { X0, X1, Y0, Y1 });

  const avg = (K.avg = (a) => a.reduce((s, v) => s + v, 0) / a.length);

  const C = { TEAL: '#0F766E', TEAL_D: '#115E59', ROSE: '#DB2777', ROSE_D: '#9D174D', INK: '#0B1020', MUTED: '#667085', GREY: '#98A2B3', QUIET: '#5FA79E' };
  Object.assign(K, C);

  K.BK24 = Math.round(bkAvg(2024)); K.BK26 = Math.round(bkAvg(2026, 1, 9));

    const c = K.cl(k); const pts = CLI.map((i) => [xw(i, i0, i1), c.yR(c.v[i])]); const flat = pts.map(([x]) => [x, Y1]);

    put(S, 'cr', { pts, o: 1, sw: 2, stroke: ROSE }, { pre: { pts: flat, o: 0, sw: 2, stroke: ROSE }, delay, dur: 1000 });
    const tl = [[xw(59, i0, i1), c.yR(c.v[59])], [xw(60, i0, i1), c.yR(c.v[60])]];
    put(S, 'cr-tl', { pts: tl, o: 1 }, { pre: { pts: tl.map(([x]) => [x, Y1]), o: 0 }, delay: delay + 300, dur: 900 });
    put(S, 'cr-end', { cx: tl[0][0], cy: tl[0][1], o: 1 }, { pre: { cx: tl[0][0], cy: Y1, o: 0 }, delay, dur: 1000 });
    const h = hw(i0, i1); put(S, 'gap', { x: xw(59, i0, i1) - h, width: 2 * h, y: Y0, height: Y1 - Y0, o: 1 }, { delay });
  };
  /* right-hand rose axis + a quiet note where the rose line starts */
  K.rTicks = (labels, c) => labels.map(([v, t]) => T(X1 + 5, v + 3.5, t, { s: 10, w: 600, c, extra: 'class="num"' })).join('');
  K.clLabels = (k, i0, i1) => { const c = K.cl(k); const x = xw(CL0, i0, i1); const y = c.yR(c.v[CL0]);
    /* the middle rose tick steps aside when a line ends level with it (the end-label leaders run through that column) */
    const ym = (Y0 + Y1) / 2; const clash = [c.yR(c.v[59]), yv(VALS[k][59])].some((v) => Math.abs(v - ym) < 12);
    return `${K.rTicks([[Y1, '0'], ...(clash ? [] : [[ym, fmt(c.max / 2)]]), [Y0, fmt(c.max)]], ROSE_D)}
      <line x1="${x}" x2="${x}" y1="${y + 6}" y2="${Y1 - 20}" stroke="#D1D5DB" stroke-dasharray="1.5 2.5"/>${T(x, Y1 - 8, 'our data starts Sep 2025', { s: 9.5, c: '#9CA3AF', a: 'middle' })}`; };
  K.clGut = (k, i0, i1) => { const c = K.cl(k); const y = c.yR(c.v[59]);
    return [{ x0: xw(59, i0, i1), y: y - 7, t: 'Our clients', w: 700, c: ROSE_D }, { x0: xw(59, i0, i1), y: y + 7, t: 'combined', w: 700, c: ROSE_D }]; };
  K.clSer = (k) => { const c = K.cl(k); return { name: 'Our clients’ average', vals: c.v, y: c.yR, kind: 'rose', key: { c: ROSE, w: 2 }, fmt: (v) => v.toFixed(1) }; };
  K.hvCall = (k, i0, i1, s) => ({ ...K.hvLines(i0, i1, [s, K.clSer(k)], 'Google Trends 0 to 100, Washington · our clients: showings per practice a week'), cols: 2,
    title: (i) => (i === 60 ? 'Oct 2026, not over yet' : i === 59 ? 'Sep 2026 · Expedition missing 3 of 4 weeks' : i === CL0 ? 'Sep 2025 · our data starts, 2 weeks' : FL.ml(M[i])) });
  /* one compact chip row under a chart: [{ c, w, dash, cs, t }] */
  K.keyRow = (items, y = Y1 + 42) => { let x = 0; let s = '';
    items.forEach((d) => { const w = 34 + d.t.length * 5.3;
      s += `<rect x="${x}" y="${y - 11}" width="${w.toFixed(1)}" height="16" rx="4" fill="#F6F7F9"/>${d.cs ? `<line x1="${x + 7}" x2="${x + 23}" y1="${y - 3}" y2="${y - 3}" stroke="#fff" stroke-width="${d.w + 2.4}" stroke-linecap="round"/>` : ''}<line x1="${x + 7}" x2="${x + 23}" y1="${y - 3}" y2="${y - 3}" stroke="${d.c}" stroke-width="${d.w}" stroke-linecap="round" ${d.dash ? `stroke-dasharray="${d.dash}"` : ''}/>${T(x + 29, y + 0.5, d.t, { s: 10, c: '#475569' })}`;
      x += w + 8; });
    return s; };

  /* ---------- text helpers ---------- */
  K.xTicks = (i0, i1, every = 3, y0 = Y1) => { let s = ''; let py = null; for (let i = i0; i <= i1; i++) { if ((i - i0) % every !== 0) continue; const m = +M[i].slice(5); const y = M[i].slice(0, 4); const lab = y !== py ? `${FL.MON[m - 1]} ${y}` : FL.MON[m - 1]; py = y; const x = xw(i, i0, i1); s += `<line x1="${x}" x2="${x}" y1="${y0}" y2="${y0 + 4}" stroke="#D1D5DB"/>${T(x, y0 + 15, lab, { s: 10.5, c: '#9CA3AF', a: 'middle' })}`; } return s; };
  K.yTicks = (labels) => labels.map(([v, t]) => T(X0 - 6, v + 3.5, t, { s: 10.5, c: '#9CA3AF', a: 'end', extra: 'class="num"' })).join('');
  K.y0100 = () => K.yTicks([[yv(0), '0'], [yv(50), '50'], [yv(100), '100']]);
  K.title = (t, sub) => `${T(0, 18, t, { s: 15, w: 800, c: INK })}${sub ? T(0, 35, sub, { s: 11.5, c: MUTED }) : ''}`;
  K.gutter = (items, top = Y0, bottom = Y1 + 6, lx = 552) => FL.spread(items, 14, top, bottom).map((d) => `${Math.abs(d.ly - d.y) > 2 ? `<path d="M${d.x0 + 4},${d.y} h${lx - 552 + 6} L${lx - 4},${d.ly - 3.5}" fill="none" stroke="#C3C8D2"/>` : ''}${T(lx, d.ly, d.t, { s: 11.5, w: d.w || 500, c: d.c || '#273043' })}`).join('');
  /* the plot's foot note: one line between the plot and the year band, never under it */
  K.foot = (t) => T(0, K.BT - 10, t, { s: 10.5, c: MUTED });
  K.footEnd = (t) => T(0, 518, t, { s: 10.5, c: MUTED });
  K.fadeIn = (s) => (FL.reduce ? '' : `style="animation:fade .35s ease ${s}s both"`);
  K.notOver = (i0, i1) => T(xw(60, i0, i1), Y1 + 27, 'not over', { s: 9.5, c: '#9CA3AF', a: 'middle' });

  /* band text for the large bands (open / plan); the compact band draws its own (v6band.js) */
  const pinTexts = (g, isLit, fs0) => PIN_IDS.map((id) => {
    const p = PINS[id]; const fs = g.name === 'open' ? fs0 : p.fs || fs0; const c = cell(g, p.lane, p.k0, p.k1 ?? p.k0); const cx = c.x + c.width / 2; const cy = c.y + c.height / 2;
    const on = isLit(id); const col = on && p.dark ? '#fff' : on && p.l1 === 'dip' ? MUTED : TEAL_D;
    const ex = `pointer-events="none" data-pt="${id}"`;
    return p.l2 ? `${T(cx, cy - 1.5, p.l1, { s: fs, w: 700, c: col, a: 'middle', extra: ex })}${T(cx, cy + fs, p.l2, { s: fs, w: 600, c: col, a: 'middle', extra: ex })}` : T(cx, cy + 3, p.l1, { s: fs + 0.5, w: 700, c: col, a: 'middle', extra: ex });
  }).join('');
  K.bandLabels = function (g, ch, active, { lighting = [] } = {}) {
    let s = '';
    const isLit = (id) => lit(id, ch) && !lighting.includes(id);
    if (g.name === 'open') {
      s += BM.map((m, k) => T(bx(g, k), g.months, m, { s: 10.5, w: k === 0 || k === 2 ? 700 : 500, c: k === 0 || k === 2 ? '#475569' : GREY, a: 'middle' })).join('');
      LANES.forEach((k, l) => { const t0 = g.top(l);
        s += `${T(0, t0 - 25, TERM[k], { s: 15, w: 800, c: INK })}${T(640, t0 - 25, LANE[k].verdict, { s: 11.5, w: 600, c: '#475569', a: 'end' })}`;
        s += T(0, t0 - 8, LANE[k].act, { s: 12, w: 600, c: TEAL_D }); });
      s += pinTexts(g, isLit, 9.5);
      s += T(bx(g, 5.5), K.heldY(g) - 8, K.heldText(ch), { s: 10, w: 600, c: isLit('p-held') ? TEAL_D : QUIET, a: 'middle', extra: 'pointer-events="none"' });
      return s;
    }
    if (g.name === 'plan') {
      s += BM.map((m, k) => T(bx(g, k), g.months, m, { s: 10, w: k === 0 || k === 2 ? 700 : 500, c: GREY, a: 'middle' })).join('');
      LANES.forEach((k, l) => { const y = mid(g, l); s += `${T(0, y - 1, TERM[k], { s: 11, w: 700, c: INK })}${T(0, y + 10, LANE[k].short, { s: 9.5, c: MUTED })}`; });
      s += pinTexts(g, isLit, 9.5);
      s += T(bx(g, 5.5), K.heldY(g) - 8, K.heldText(ch), { s: 10, w: 600, c: TEAL_D, a: 'middle', extra: 'pointer-events="none"' });
      return s;
    }
    return ''; // cb: the compact band draws its own text (v6band.js)
  };
  K.heldText = (ch) => (ch >= (K.ORD.level ?? 99) ? 'searches held near 50 all year' : 'where searches settle');

  /* ---------- readouts: idle says only what hovering does; the tiles carry the numbers ---------- */
  K.ser = (k, name, kind = 'lead', y = yv) => ({ name, vals: VALS[k], y, kind, key: kind === 'lead' ? { c: TEAL, w: 2.2 } : kind === 'ghost' ? { c: GREY, w: 1.6 } : { c: '#475569', w: 1.6, dash: '4 3' }, fmt: (v) => String(Math.round(v * 10) / 10) });
  K.hvLines = (i0, i1, series, note = 'Google Trends, Washington, 0 to 100') => ({ i0, i1: 60, x: (i) => xw(i, i0, i1), series, note, title: (i) => (i === 60 ? 'Oct 2026, not over yet' : FL.ml(M[i])) });
  K.idleHint = (title, note = '') => () => ({ title, note, slots: [] });
})();
</script>
<script>/* V6 r4 (owner 10/29): the compact year band. One panel of FIXED geometry at the foot of the figure, present in
   every chapter from the first topic chapter on: header, month row, three topic rows, legend line. Its geometry
   never animates. Only these change: the row being discussed gets a light tint; a landing pin fades and settles
   into its month cell (opacity + a short translate and scale, house easing); outlined pins fill once explained;
   the held line draws along its row. It sits below the plot's foot note, so it never covers chart or page rows. */
(function () {
  const K = window.V6K;
  const { T, PINS, PIN_IDS, ACT_IDS, LANES, TERM, LANE, BM, TEAL, TEAL_D, INK, MUTED, GREY, QUIET } = K;
  const g = K.GEO.cb; const BT = K.BT; const NS = FL.NS;
  const EASE = 'cubic-bezier(.2,.8,.2,1)';
  /* short labels so every pin fits its cell at this size; the hover carries the detail */
  const LAB = { 'p-tt': ['improve now'], 'p-pd': ['improve now'], 'p-pub': ['improve', 'by June'], 'p-dip': ['dip'], 'p-peak': ['peak'] };
  const txtOn = (id) => (PINS[id].dark ? '#fff' : PINS[id].l1 === 'dip' ? MUTED : TEAL_D);
  let root = null; const E = {}; const q = (k) => E[k] || (E[k] = root.querySelector(`[data-cb="${k}"]`));
  const lit = (id, ch, hold) => K.ORD[id] <= ch && !hold.includes(id);

  K.cbInit = function (layer) {
    root = document.createElementNS(NS, 'g'); root.setAttribute('data-band', '1');
    root.style.transition = 'opacity .45s'; root.style.opacity = 0; root.style.pointerEvents = 'none';
    const mid = (l) => g.top(l) + g.h / 2;
    let s = `<rect data-bandbox="${BT}" x="0" y="${BT}" width="640" height="${K.VH - BT}" fill="#fff"/>
      <line x1="0" x2="640" y1="${BT + 0.5}" y2="${BT + 0.5}" stroke="#E7E9EE"/>
      ${T(0, g.head, 'The year ahead · Nov 2026 to Oct 2027', { s: 10.5, w: 700, c: '#475569' })}
      <text data-cb="count" x="640" y="${g.head}" font-size="10.5" font-weight="500" fill="${GREY}" text-anchor="end"></text>
      ${BM.map((m, k) => T(K.bx(g, k), g.months, m, { s: 9.5, w: k === 0 || k === 2 ? 700 : 500, c: k === 0 || k === 2 ? '#475569' : GREY, a: 'middle' })).join('')}`;
    LANES.forEach((k, l) => {
      s += `<g data-ro-t="${FL.esc(`${TERM[k]}: ${LANE[k].verdict}`)}" data-ro-n="Google’s 0 to 100, Washington" data-ro-b="${FL.esc(LANE[k].ro)}">
        <rect data-cb="lane${l}" x="${g.x0}" y="${g.top(l)}" width="${g.x1 - g.x0}" height="${g.h}" rx="3" fill="#F6F7FA" style="transition:fill .5s"/>
        <rect x="0" y="${g.top(l)}" width="${g.x0}" height="${g.h}" fill="transparent"/>
        <text data-cb="name${l}" x="0" y="${(mid(l) + 3.5).toFixed(1)}" font-size="10" font-weight="700" fill="#475569" style="transition:fill .5s">${TERM[k]}</text></g>`;
    });
    for (let k = 1; k < 12; k++) { const x = g.x0 + k * K.CW(g); s += `<line x1="${x}" x2="${x}" y1="${g.top(0)}" y2="${g.top(2) + g.h}" stroke="#fff" stroke-width="2"/>`; }
    /* the held level: a quiet dashed line, and a lit line that draws over it */
    const hy = K.heldY(g); const hx0 = K.heldX0(g); const hx1 = g.x1 - 8;
    s += `<g data-ro-t="Pediatric dentist searches, all year: held near 50" data-ro-n="Google Trends, Washington · a level, not a pin" data-ro-b="Searches tripled in summer 2025 and held near 50 on Google’s 0 to 100 scale. The level the home page work is planned at.">
      <rect x="${hx0}" y="${g.top(1)}" width="${hx1 - hx0}" height="${g.h}" fill="transparent"/>
      <line x1="${hx0}" x2="${hx1}" y1="${hy}" y2="${hy}" stroke="${QUIET}" stroke-width="1.2" stroke-dasharray="3 2"/>
      <line data-cb="held" x1="${hx0}" x2="${hx1}" y1="${hy}" y2="${hy}" stroke="${TEAL}" stroke-width="2" stroke-linecap="round" style="opacity:0"/>
      <text data-cb="heldT" x="${K.bx(g, 6.5)}" y="${hy - 4}" font-size="9" font-weight="600" fill="${QUIET}" text-anchor="middle" style="transition:fill .5s"></text></g>`;
    PIN_IDS.forEach((id) => {
      const p = PINS[id]; const c = K.cell(g, p.lane, p.k0, p.k1 ?? p.k0); const cx = c.x + c.width / 2; const cy = c.y + c.height / 2; const L = LAB[id];
      const txt = L.length === 1 ? T(cx, cy + 3.2, L[0], { s: 9, w: 700, c: TEAL_D, a: 'middle' }) : `${T(cx, cy - 1.2, L[0], { s: 8.5, w: 700, c: TEAL_D, a: 'middle' })}${T(cx, cy + 7.6, L[1], { s: 8.5, w: 600, c: TEAL_D, a: 'middle' })}`;
      s += `<g data-cb="g-${id}" data-ro-t="${FL.esc(p.t)}" data-ro-b="${FL.esc(p.b)}">
        <rect x="${c.x}" y="${c.y}" width="${c.width}" height="${c.height}" rx="3" fill="#fff" stroke="${QUIET}" stroke-width="1.2" stroke-dasharray="3 2"/>
        <rect data-cb="f-${id}" x="${c.x}" y="${c.y}" width="${c.width}" height="${c.height}" rx="3" fill="${p.fill}" stroke="${p.fill}" stroke-width="1.2" style="opacity:0;transform-box:fill-box;transform-origin:center"/>
        <g data-cb="t-${id}" style="transition:fill .4s">${txt}</g></g>`;
    });
    /* legend line */
    const ly = BT + 124;
    s += `<rect x="0" y="${ly - 9}" width="20" height="11" rx="2.5" fill="#fff" stroke="${QUIET}" stroke-dasharray="3 2"/>${T(26, ly, 'outlined: explained further down', { s: 9.5, c: MUTED })}
      <rect x="196" y="${ly - 9}" width="20" height="11" rx="2.5" fill="${TEAL}"/>${T(222, ly, 'filled: explained', { s: 9.5, c: MUTED })}
      ${T(326, ly, 'dip and peak: season marks, not pins', { s: 9.5, c: MUTED })}`;
    root.innerHTML = s; layer.appendChild(root);
  };
  const paintText = (id, on) => q(`t-${id}`).querySelectorAll('text').forEach((t) => t.setAttribute('fill', on ? txtOn(id) : TEAL_D));
  const count = (ch, hold) => { q('count').textContent = `${ACT_IDS.filter((id) => lit(id, ch, hold)).length} of ${ACT_IDS.length} pins explained`; };
  /* the state of a chapter: tint, lit pins, held line, counter. Fills fade; nothing moves. */
  K.cbSet = function (ch, active, { hold = [], delay = 0 } = {}) {
    /* coming from a large band: wait until that chapter's content has faded out, then fade in at final size */
    root.style.transition = `opacity .45s ${delay}ms`; root.style.opacity = 1; root.style.pointerEvents = '';
    K.cb = { ch, hold: [...hold] };
    LANES.forEach((k, l) => { q(`lane${l}`).setAttribute('fill', active === l ? '#E3F2EE' : '#F6F7FA'); q(`name${l}`).setAttribute('fill', active === l ? INK : '#475569'); });
    PIN_IDS.forEach((id) => {
      const on = lit(id, ch, hold); const f = q(`f-${id}`);
      f.style.transition = 'opacity .5s'; f.style.transform = 'none'; f.style.opacity = on ? 1 : 0; f.setAttribute('stroke-width', 1.2);
      paintText(id, on); q(`g-${id}`).setAttribute('data-ro-n', `${PINS[id].n} · ${on ? 'explained above' : 'explained further down'}`);
    });
    const hon = lit('p-held', ch, hold); const hl = q('held');
    hl.style.transition = 'opacity .5s'; hl.style.strokeDasharray = ''; hl.style.strokeDashoffset = ''; hl.style.opacity = hon ? 1 : 0;
    const ht = q('heldT'); ht.textContent = hon ? 'searches held near 50 all year' : 'where searches settle'; ht.setAttribute('fill', hon ? TEAL_D : QUIET);
    count(ch, hold);
  };
  K.cbHide = () => { if (!root) return; root.style.transition = 'opacity .25s'; root.style.opacity = 0; root.style.pointerEvents = 'none'; };
  /* a pin lands: it fades in a little above and a little large, then settles into its cell (0.8s, house easing) */
  K.cbLand = function (id) {
    const st = K.cb; st.hold = st.hold.filter((h) => h !== id);
    if (id === 'p-held') {
      const hl = q('held'); const len = hl.getTotalLength();
      hl.style.transition = 'none'; hl.style.strokeDasharray = `${len} ${len}`; hl.style.strokeDashoffset = len; hl.style.opacity = 1; hl.getBoundingClientRect();
      hl.style.transition = `stroke-dashoffset .9s ${EASE}`; hl.style.strokeDashoffset = 0;
      const ht = q('heldT'); ht.textContent = 'searches held near 50 all year'; ht.setAttribute('fill', TEAL_D);
    } else {
      const f = q(`f-${id}`);
      f.style.transition = 'none'; f.style.opacity = 0; f.style.transform = 'translate(0px,-4px) scale(1.12)'; f.getBoundingClientRect();
      f.style.transition = `opacity .6s ${EASE}, transform .8s ${EASE}`; f.style.opacity = 1; f.style.transform = 'translate(0px,0px) scale(1)';
      setTimeout(() => paintText(id, true), 250);
      q(`g-${id}`).setAttribute('data-ro-n', `${PINS[id].n} · explained above`);
    }
    count(st.ch, st.hold);
  };
  /* a lit pin pulses once (its outline thickens and returns): used when the season explains June */
  K.cbPulse = function (id) {
    const f = q(`f-${id}`); f.style.transition = 'stroke-width .25s'; f.setAttribute('stroke', TEAL_D); f.style.strokeWidth = '3.2';
    setTimeout(() => { f.style.transition = 'stroke-width .4s'; f.style.strokeWidth = ''; }, 280);
  };
})();
</script>
<script>/* V6 reach pictures (split from V5's one crowded figure).
   WHO SEES IT: one chart, two scales (r4): Expedition's national (left) and local (right) showings a week
   (grouped by the words in the search). Sep 2026 hatched: Expedition is missing 3 of its 4 weeks.
   WHERE PATIENTS LAND: one row per page, read left to right: showings in Google -> visits -> calls or forms
   (one dot each), ending in the work for that page: Improve (On-Page) or Covered (no pin). Sorted by calls or forms; top 3 pages only.
   Data: D.c5 from src/combined5_extract.py (V5's read-only pull, synonyms count). */
(function () {
  const K = window.V6K; const { D, M, T, put, fmt, xw, idx, X0, X1, Y0, Y1, ROSE, ROSE_D, TEAL, TEAL_D, INK, MUTED, GREY } = K;
  const C5 = D.c5;
  const ySc = (K.ySc = (top, bot, max) => (v) => bot - (v / max) * (bot - top));
  const CI = Array.from({ length: 12 }, (_, j) => idx('2025-10') + j);
  const OI = Array.from({ length: 11 }, (_, j) => idx('2025-10') + j);
  const OWN_KEY = (K.OWN_KEY = { c: ROSE, w: 2, dash: '6 3' });
  /* hover sentences (owner 10/29): every number names its source in plain words; 2 to 4 lines, never over the chart */
  const GAP = 'Expedition recorded no calls or forms anywhere on its site May to July 2026, likely a tracking gap.';
  const MATCH = 'The page is matched to the topic by its address and the searches it shows up for; other names count, such as frenectomy.';
  K.HV = {
    ses: 'Visits: Google Analytics, Expedition’s own account. Every way people arrive, last 12 months, saved nightly by week.',
    ke: 'Calls or forms: what Expedition’s Google Analytics counts as key events, such as calls and form sends; set up per practice. Last 12 months.',
    gap: GAP, match: MATCH,
    imp: 'Showings: how often Google showed the page in search results. Search Console, Expedition’s own account, last 12 months, saved nightly by week.',
    place: 'Avg. position: average position in Google, weighted by how often it was shown. 1 is the top; above 10 means past the first 10 results. Search Console.',
    clk: 'Clicks: people who clicked through from Google. Search Console, Expedition’s own account, last 12 months.',
    rank: 'Rank among our practices by Search Console showings for these searches, last 12 months, with other names counted.',
  };
  /* tile tips: [value, label, tip] */
  K.tip = (kind, extra = '') => `${K.HV[kind]}${extra ? ` ${extra}` : ''}`;
  K.ord = (n) => `${n}${n % 10 === 1 && n % 100 !== 11 ? 'st' : n % 10 === 2 && n % 100 !== 12 ? 'nd' : n % 10 === 3 && n % 100 !== 13 ? 'rd' : 'th'}`;

  K.comb = function (k) {
    const P = C5.topics[k]; const o = { avg: {}, own: {}, ownPart: {}, P, rep: {} };
    C5.months.forEach((m, j) => {
      const i = M.indexOf(m); if (i < 0) return;
      o.avg[i] = P.mAvgX[j]; o.rep[i] = C5.mReporting[j];
      if (P.mOwnWeeks[j] && P.mOwnWeeks[j] === C5.monthWeeks[j]) o.own[i] = P.mOwn[j] / P.mOwnWeeks[j];
      else if (P.mOwnWeeks[j]) o.ownPart[i] = `${P.mOwnWeeks[j]} of ${C5.monthWeeks[j]} weeks`;
    });
    const ownWk = OI.map((i) => o.own[i]); const othWk = CI.slice(0, 12).map((i) => o.avg[i]);
    Object.assign(o, { imp: P.impYear, clk: P.clkYear, seen: P.seenYear, rank: P.ownRank, ownImp: P.ownImpYear, ownClk: P.ownClkYear, nameClk: P.ownNameClicks, list: C5.searchList[k],
      ownWk: K.avg(ownWk), othWk: K.avg(othWk) });
    return o;
  };

  /* ---------- WHO SEES IT (V6 split; r4 owner 10/29: one chart, two scales) ----------
     Expedition's showings a week in NATIONAL searches (slate #64748B, 1.6px, left scale) and LOCAL searches
     (a place, a care word, a cost or booking; OQ teal 2.2px with a white casing, right scale: the Improve pins are
     about local). About 20 times apart, so each has its own scale and its tick labels in its line's colour.
     Grouped by the words in the search (src6/split_extract.py). Sep 2026 hatched: Expedition is missing 3 of its
     4 weeks; Oct 2026 a dotted ring, not over. The plot ends at XQ to leave room for the right scale and the end labels. */
  const SP = D.split;
  const XQ = (K.XQ = 498); const SLATE = (K.SLATE = '#64748B');
  const xq = (K.xq = (i) => X0 + ((i - K.W12[0]) / (60 - K.W12[0])) * (XQ - X0));
  K.WHO_TIP = {
    reach: 'National searches: every search that is not local, such as frenectomy or what is a frenectomy. Unclear searches count here. Sorted only by the words in the search; it says nothing about who searched.',
    patients: 'Local searches: the search names a place such as Bellevue or near me, a care word such as dentist, doctor or clinic, a cost, or booking. Everything else is national. Sorted only by the words in the search; it says nothing about who searched.',
    patientsY: 'Local searches: the search names a place such as Bellevue or near me, a cost, or booking. Dentist is in every pediatric dentistry search, so here it does not make a search local. Everything else is national. Sorted only by the words in the search; it says nothing about who searched.',
    rank: 'Rank among our practices by Search Console showings for these searches, last 12 months. Searches that name a practice are left out for every practice.',
  };
  K.split = function (k) {
    const T = SP.topics[k]; const g = { reach: {}, patients: {} };
    ['reach', 'patients'].forEach((n) => SP.months.forEach((m, j) => { const i = M.indexOf(m); if (i >= 0 && T.groups[n].m[j] != null) g[n][i] = T.groups[n].m[j]; }));
    const own = T.top.find((r) => r[0].startsWith('Expedition')); const tot = T.groups.reach.imp + T.groups.patients.imp;
    return { T, g, tot, own, R: T.groups.reach, Pt: T.groups.patients, nextP: T.top.find((r) => r !== own) };
  };
  K.who = function (S, sp, yA, yB) {
    [['g0', Y1], ['g50', (Y0 + Y1) / 2], ['g100', Y0]].forEach(([id, y]) => put(S, id, { x1: X0, x2: XQ, y1: y, y2: y, o: 1 }));
    put(S, 'base', { x1: X0, x2: XQ, y1: Y1, y2: Y1, o: 1 });
    const ra = OI.map((i) => [xq(i), yA(sp.g.reach[i])]); const pb = OI.map((i) => [xq(i), yB(sp.g.patients[i])]);
    /* the act: national rises out of the floor first, then local rises on its own scale over it */
    put(S, 'wn', { pts: ra, o: 1 }, { pre: { pts: ra.map(([x]) => [x, Y1]), o: 0 }, delay: 200, dur: 1000 });
    put(S, 'wl-cs', { pts: pb, o: 1 }, { pre: { pts: pb.map(([x]) => [x, Y1]), o: 0 }, delay: 1000, dur: 1000 });
    put(S, 'wl', { pts: pb, o: 1 }, { pre: { pts: pb.map(([x]) => [x, Y1]), o: 0 }, delay: 1000, dur: 1000 });
    put(S, 'wn-oct', { cx: xq(60), cy: yA(sp.g.reach[60]), o: 1 }, { pre: { cx: xq(60), cy: Y1, o: 0 }, delay: 1100, dur: 900 });
    put(S, 'wl-oct', { cx: xq(60), cy: yB(sp.g.patients[60]), o: 1 }, { pre: { cx: xq(60), cy: Y1, o: 0 }, delay: 1900, dur: 900 });
    const h = (xq(60) - xq(59)) / 2;
    put(S, 'gap', { x: xq(59) - h, width: 2 * h, y: Y0, height: Y1 - Y0, o: 1 }, { delay: 1900 });
  };
  /* end labels in each line's colour, carrying the totals; spread apart with leaders when they collide */
  const endLab = (sp, yA, yB) => {
    const R = sp.R; const Pt = sp.Pt; const lx = 540;
    const it = [{ k: 'n', y: yA(sp.g.reach[58]), c: SLATE, head: 'National', l: [`${fmt(R.imp)} showings`, `${fmt(R.clk)} clicks`], tip: [`National searches: ${fmt(R.imp)} showings, ${fmt(R.clk)} clicks`, K.WHO_TIP.reach] },
      { k: 'l', y: yB(sp.g.patients[58]), c: TEAL_D, head: 'Local', l: [`${fmt(Pt.imp)} showings`, `${fmt(Pt.clk)} clicks`], tip: [`Local searches: ${fmt(Pt.imp)} showings, ${fmt(Pt.clk)} clicks`, sp.T === SP.topics.pdy ? K.WHO_TIP.patientsY : K.WHO_TIP.patients] }];
    return FL.spread(it, 44, Y0 + 12, Y1 - 28).map((d) => { const top = d.ly - 12;
      return `<g data-ro-t="${FL.esc(d.tip[0])}" data-ro-n="Search Console, last 12 months" data-ro-b="${FL.esc(d.tip[1])}">
        ${Math.abs(d.ly - d.y) > 3 ? `<path d="M${xq(58) + 5},${d.y} L${lx - 5},${top + 8}" fill="none" stroke="#C3C8D2"/>` : ''}
        ${T(lx, top + 11, d.head, { s: 11.5, w: 700, c: d.c })}${d.l.map((t, j) => T(lx, top + 24 + j * 12, t, { s: 10, w: 600, c: d.c, extra: 'class="num"' })).join('')}
        <rect x="${lx - 4}" y="${top - 2}" width="${644 - lx}" height="44" fill="transparent"/></g>`; }).join(''); };
  K.whoLabels = (sp, yA, yB, tA, tB) => {
    let ticks = ''; for (let i = K.W12[0]; i <= 60; i += 2) { const m = +M[i].slice(5); const y = M[i].slice(0, 4); const lab = m === 10 || m === 1 ? `${FL.MON[m - 1]} ${y}` : FL.MON[m - 1]; ticks += `<line x1="${xq(i)}" x2="${xq(i)}" y1="${Y1}" y2="${Y1 + 4}" stroke="#D1D5DB"/>${T(xq(i), Y1 + 15, lab, { s: 10.5, c: '#9CA3AF', a: 'middle' })}`; }
    return `${tA.map((v) => T(X0 - 3, yA(v) + 3.5, fmt(v), { s: 9, w: 600, c: SLATE, a: 'end', extra: 'class="num"' })).join('')}
      ${tB.map((v) => T(XQ + 5, yB(v) + 3.5, fmt(v), { s: 9.5, w: 600, c: TEAL_D, extra: 'class="num"' })).join('')}${ticks}
      ${T(xq(59), Y0 + 13, 'no data', { s: 10, w: 600, c: MUTED, a: 'middle' })}${T(xq(59), Y0 + 25, 'for 3', { s: 10, c: MUTED, a: 'middle' })}${T(xq(59), Y0 + 37, 'weeks', { s: 10, c: MUTED, a: 'middle' })}
      ${T(xq(60), Y1 + 27, 'not over', { s: 9.5, c: '#9CA3AF', a: 'middle' })}
      ${endLab(sp, yA, yB)}
      ${K.keyRow([{ c: SLATE, w: 1.6, t: 'National searches, left scale' }, { c: TEAL, w: 2.2, cs: true, t: 'Local searches, right scale' }])}`;
  };
  /* the lead point: read the two shapes in plain words, numbers from the data */
  K.whoShape = (k, sp) => {
    const v = (n, ms) => K.avg(ms.map((m) => sp.g[n][idx(m)])); const r = (x) => fmt(x >= 1000 ? Math.round(x / 500) * 500 : Math.round(x / 5) * 5);
    if (k === 'tt') { const lo = sp.g.patients[idx('2026-05')]; const hi = sp.g.patients[idx('2026-08')];
      const nat = ['2026-01', '2026-02', '2026-03', '2026-04', '2026-05', '2026-06', '2026-07', '2026-08'].map((m) => sp.g.reach[idx(m)]);
      return `<b>Local showings have climbed since May</b>, from about ${r(lo)} a week in May to about ${r(hi)} in August, while national held between about ${r(Math.min(...nat))} and ${r(Math.max(...nat))} a week since January.`; }
    const w = v('patients', ['2025-11', '2025-12', '2026-01']); const s = v('patients', ['2026-04', '2026-05', '2026-06', '2026-07']);
    const np = v('reach', ['2026-04', '2026-05']); const nl = v('reach', ['2026-06', '2026-07', '2026-08']);
    return `<b>Local showings fell through the spring</b>, from about ${r(w)} a week in winter to about ${r(s)} from April on, while national rose to about ${r(np)} in April and May, then settled near ${r(nl)}.`;
  };
  K.whoHv = (sp, yA, yB) => ({ i0: CI[0], i1: 60, x: xq, note: 'Expedition’s showings in Google a week · sorted by the words in the search', cols: 2,
    title: (i) => (i === 59 ? 'Sep 2026 · Expedition missing 3 of 4 weeks' : i === 60 ? 'Oct 2026, 2 weeks so far' : FL.ml(M[i])),
    series: [{ name: 'National searches, left scale', vals: sp.g.reach, y: yA, kind: 'other', key: { c: SLATE, w: 1.6 }, fmt: (v) => fmt(Math.round(v)) },
      { name: 'Local searches, right scale', vals: sp.g.patients, y: yB, kind: 'lead', key: { c: TEAL, w: 2.2 }, fmt: (v) => fmt(Math.round(v)) }] });
  K.plotHit = { x: X0, y: Y0, width: X1 - X0, height: Y1 - Y0 };

  /* ---------- WHERE PATIENTS LAND ---------- */
  const PG = C5.pages;
  const NX = { imp: 262, ses: 386, ke: 478 }; // node centres: showings, visits, calls or forms
  const RY = (K.RY = (j) => 124 + j * 70); // row baseline of the numbers
  K.CHIP = (j) => ({ x: 566, y: RY(j) - 15, width: 74, height: 22 });
  /* r3 (owner 10/29: the 81-dot cluster bled out of its row): at most about 40 dots, in at most 4 rows, so the cluster
     always sits inside its cell (y+10 to y+29, about 62px wide). Over 40 in a chapter: one dot = 2 for every row,
     an odd remainder is a half dot. */
  K.DOT_CAP = 40;
  const dots = (n, x, y, per = 1) => { let s = ''; const p = 5.6; const full = Math.floor(n / per); const half = n % per ? 1 : 0; const count = full + half;
    const cols = Math.max(10, Math.ceil(count / 4)); const w = Math.min(count, cols) * p;
    for (let d = 0; d < count; d++) { const c = d % cols; const r = Math.floor(d / cols); const cx = (x - w / 2 + p / 2 + c * p).toFixed(1); const cy = (y + r * p).toFixed(1);
      s += d < full ? `<circle cx="${cx}" cy="${cy}" r="2.1" fill="${TEAL}"/>` : `<circle cx="${cx}" cy="${cy}" r="1.75" fill="#fff" stroke="${TEAL}" stroke-width="0.7"/><path d="M${cx},${(+cy - 2.1).toFixed(1)} a2.1,2.1 0 0 0 0,4.2 z" fill="${TEAL}"/>`; }
    return s; };
  const node = (x, y, hw, t, n, b) => `<g data-ro-t="${FL.esc(t)}" data-ro-n="${FL.esc(n)}" data-ro-b="${FL.esc(b)}"><rect x="${x - hw}" y="${y - 22}" width="${2 * hw}" height="58" fill="transparent"/></g>`;
  /* rows: [title, kind, path, verdict, when, why] in display order (most calls or forms first).
     verdict: 'Improve' (a pin, On-Page tool) or 'Covered' (performs well, no pin); when: the line under the chip */
  K.paths = function (rows, { extra = '', from = 0.5, step = 0.22 } = {}) {
    const hy = 76; const maxKe = Math.max(0, ...rows.map((r) => (PG[r[2]] || {}).ke || 0)); const per = maxKe > K.DOT_CAP ? 2 : 1;
    const DOTS = per === 1 ? 'one dot each' : 'one dot = 2 calls or forms';
    let s = `${T(0, hy, 'Page', { s: 10, w: 700, c: '#9CA3AF' })}${T(NX.imp, hy, 'showings in Google', { s: 10, w: 700, c: '#9CA3AF', a: 'middle' })}${T(NX.ses, hy, 'visits', { s: 10, w: 700, c: '#9CA3AF', a: 'middle' })}${T(NX.ke, hy, 'calls or forms', { s: 10, w: 700, c: '#9CA3AF', a: 'middle' })}
      ${T(603, hy, 'the work', { s: 10, w: 700, c: '#9CA3AF', a: 'middle' })}
      <line x1="0" x2="640" y1="${hy + 7}" y2="${hy + 7}" stroke="#E7E9EE"/>`;
    rows.forEach(([title, kind, path, verdict, when = '', why = ''], j) => {
      const p = PG[path] || {}; const y = RY(j); const c = K.CHIP(j);
      const ses = p.ses != null ? fmt(p.ses) : 'none'; const ke = p.ke != null ? p.ke : null;
      const wk = p.place != null && p.placeWeekly != null && Math.abs(p.place - p.placeWeekly) > 3 ? `, ${Math.round(p.placeWeekly)} week by week` : '';
      const ro = `${MATCH} ${fmt(p.imp || 0)} showings · avg. position ${p.place != null ? p.place.toFixed(1) : 'none'}${wk} · ${fmt(p.clk || 0)} clicks · ${p.ses != null ? fmt(p.ses) : 'no'} visits · ${ke != null ? ke : 'no'} calls or forms`;
      const keep = verdict === 'Covered';
      s += `<g data-ro-t="${FL.esc(`${title}: ${verdict}${when ? `, ${when}` : ''}`)}" data-ro-n="${FL.esc(path.length > 34 ? `${path.slice(0, 32)}…` : path)}" data-ro-b="${FL.esc(why ? `${why} ${ro}` : ro)}" ${K.fadeIn(from + j * step)}>
        <rect x="0" y="${y - 26}" width="640" height="70" fill="transparent"/>
        ${T(0, y, title, { s: 13, w: 700, c: INK })}${T(0, y + 16, kind, { s: 10.5, c: MUTED })}
        <line x1="${NX.imp + 42}" x2="${NX.ses - 32}" y1="${y - 5}" y2="${y - 5}" stroke="#C3C8D2"/><path d="M${NX.ses - 36},${y - 8} l4,3 l-4,3" fill="none" stroke="#C3C8D2"/>
        <line x1="${NX.ses + 32}" x2="${NX.ke - 32}" y1="${y - 5}" y2="${y - 5}" stroke="#C3C8D2"/><path d="M${NX.ke - 36},${y - 8} l4,3 l-4,3" fill="none" stroke="#C3C8D2"/>
        ${node(NX.imp, y, 46, `${title}: ${fmt(p.imp || 0)} showings, avg. position ${p.place.toFixed(1)}`, 'Search Console', `${K.HV.place} Here ${p.place.toFixed(1)}${wk}, ${fmt(p.clk || 0)} clicks. ${K.HV.imp}`)}
        ${node(NX.ses, y, 34, `${title}: ${p.ses != null ? `${ses} visits` : 'no visits recorded'}`, 'Google Analytics', `${K.HV.ses} ${MATCH}`)}
        ${node(NX.ke + 8, y, 64, `${title}: ${ke == null ? 'no calls or forms recorded' : `${ke} calls or forms`}`, 'Google Analytics, key events', `${K.HV.ke}${per === 1 ? '' : ' Drawn as one dot for every 2; a half dot is 1.'} ${GAP}`)}
        ${T(NX.imp, y, fmt(p.imp || 0), { s: 15, w: 700, c: '#334155', a: 'middle', extra: 'class="num" pointer-events="none"' })}${T(NX.imp, y + 16, `avg. position ${Math.round(p.place)}`, { s: 10.5, c: p.place > 10 ? INK : MUTED, a: 'middle', extra: `font-weight="${p.place > 10 ? 700 : 500}" pointer-events="none"` })}
        ${T(NX.ses, y, ses, { s: 15, w: 800, c: p.ses != null ? INK : GREY, a: 'middle', extra: 'class="num" pointer-events="none"' })}
        ${ke == null ? T(NX.ke, y, 'none', { s: 15, w: 800, c: GREY, a: 'middle', extra: 'pointer-events="none"' }) : `${T(NX.ke, y, String(ke), { s: 15, w: 800, c: ke ? TEAL_D : GREY, a: 'middle', extra: 'class="num" pointer-events="none"' })}${ke ? `<g pointer-events="none" data-dots="${j}">${dots(ke, NX.ke, y + 12, per)}</g>` : `<circle cx="${NX.ke}" cy="${y + 12}" r="2.1" fill="none" stroke="#C3C8D2" pointer-events="none"/>`}`}
        <rect data-chip="${j}" x="${c.x}" y="${c.y}" width="${c.width}" height="${c.height}" rx="4" fill="${keep ? '#E6F4F1' : '#fff'}" stroke="${keep ? '#99D5CC' : TEAL}" style="transition:fill .4s"/>${T(c.x + c.width / 2, c.y + 15, verdict, { s: 11, w: 700, c: TEAL_D, a: 'middle', extra: `data-chipt="${j}" style="transition:fill .4s"` })}${when ? T(c.x + c.width / 2, c.y + c.height + 13, when, { s: 9.5, w: 600, c: keep ? GREY : TEAL_D, a: 'middle' }) : ''}
        ${j < rows.length - 1 ? `<line x1="0" x2="640" y1="${y + 42}" y2="${y + 42}" stroke="#F1F2F5"/>` : ''}</g>`;
    });
    if (extra) s += T(0, RY(rows.length) - 20, extra, { s: 10.5, c: MUTED, extra: K.fadeIn(from + rows.length * step) });
    s += T(NX.ke, 96, DOTS, { s: 9.5, c: '#9CA3AF', a: 'middle' });
    return s;
  };
  /* the page lines replace the plot: Expedition's lines fold into the top row's showings, the rest sinks */
  K.landMarks = function (S) {
    const pt = (n) => K.at(NX.imp, RY(0) - 5, n);
    ['wn', 'wl', 'wl-cs'].forEach((id) => put(S, id, { pts: pt(11), o: 0 }, { dur: 800 }));
    put(S, 'cr', { pts: pt(12), o: 0 }, { dur: 800 }); put(S, 'cr-cs', { pts: pt(12), o: 0 }, { dur: 800 });
  };
  /* r4: the deciding row's own Improve chip fills where it is, then its pin lands in the year band below;
     nothing travels across the figure */
  K.chipFly = function (fig, later, j, word, pinId, { t0 = 2400 } = {}) {
    later(t0, () => { const r = fig.svg.querySelector(`[data-chip="${j}"]`); const t = fig.svg.querySelector(`[data-chipt="${j}"]`);
      if (r) r.setAttribute('fill', TEAL); if (t) t.setAttribute('fill', '#fff'); });
    later(t0 + 500, () => K.cbLand(pinId));
  };
})();
</script>
<script>/* V6 chapters (from v5ch.js). Each: lead sentence, number tiles, short points, an optional mockup note, a
   "How this is measured" link into the approved How it works page. V6 splits "how patients reach the page"
   into WHO SEES IT and WHERE PATIENTS LAND, per topic; pediatric dentist's "who sees it" folds into one tile. */
(function () {
  const K = window.V6K;
  const { M, P, T, put, fmt, xw, yv, idx, GEO, LANES, TERM, VALS, tt, pd, pdy, W24, W12, W36, X0, Y0, Y1, TEAL, TEAL_D, ROSE_D, INK, MUTED, GREY, csR } = K;
  /* the chapter that explains (lights) each pin */
  K.ORD = { 'p-tt': 4, 'p-pd': 6, 'p-held': 7, level: 7, 'p-pub': 10, 'p-dip': 11, 'p-peak': 11 };
  const G = GEO.cb;
  const kick = (topic, q) => `${topic} · <span class="kq">${q}</span>`;
  const chapters = [];
  const HOVER_LINE = K.idleHint('Hover the chart to read any month');

  /* ===== 01 the answer first (full band) ===== */
  chapters.push({
    key: 'open', kick: 'In short · Expedition’s year ahead, read for Washington',
    head: 'The plan: <span class="g">improve two pages now</span>, and one more by June.',
    extra: `<div class="ttiles">
      <div><div class="tn">Tongue tie</div><div class="ta"><i>Improve</i> the frenectomy service page, now</div><div class="tf">Rarely found on local searches: avg. position 23. Its 144 visits brought 6 calls or forms</div></div>
      <div data-tip="81 calls or forms: what Expedition’s Google Analytics counts as key events, such as calls and form sends, on the home page, last 12 months. None site-wide May to July 2026, likely a tracking gap."><div class="tn">Pediatric dentist</div><div class="ta"><i>Improve</i> the home page, now</div><div class="tf">Avg. position 7 on local searches; 81 calls or forms in a year</div></div>
      <div><div class="tn">Pediatric dentistry</div><div class="ta"><i>Improve</i> the benefits article, by June</div><div class="tf">Avg. position 17; searches peak in July or August</div></div></div>`,
    points: ['All three topics are <b>Steady</b> in Washington: moving about the same as dental searches overall.',
      'Expedition already has a page for each topic, so nothing new goes to the content calendar. All three pins are On-Page work.',
      'Each pin on the year is outlined until the Story explains it, then it fills in.'],
    link: [['hiw-rising', 'How Steady is measured'], ['hiw-pages', 'How the pins are chosen']],
    cap: 'Expedition’s year ahead, Nov 2026 to Oct 2027, one row per topic. Every pin is already placed; outlined pins are explained further down.',
    build(S, { first }) {
      K.band(S, GEO.open, 0, null, { first });
      LANES.forEach((k, l) => { const f = K.laneFlat(...W24, l, GEO.open); put(S, `ln-${k}`, { pts: f, o: 0 }); put(S, `cs-${k}`, { pts: f, o: 0 }); put(S, `tl-${k}`, { pts: [f[59], f[59]], o: 0 }); });
    },
    labelsAt: 500, labelsPre: () => '',
    labels: () => `${K.title('Expedition’s plan for the year ahead', 'Nov 2026 to Oct 2027 · one row per topic · searches read for Washington')}${K.bandLabels(GEO.open, 0, null)}
      <rect x="0" y="436" width="26" height="14" rx="3" fill="#fff" stroke="${K.QUIET}" stroke-dasharray="3 2"/>${T(34, 447, 'outlined: explained further down', { s: 11, c: MUTED })}
      <rect x="240" y="436" width="26" height="14" rx="3" fill="${TEAL}"/>${T(274, 447, 'filled: explained', { s: 11, c: MUTED })}
      ${K.footEnd('Steady, Rising and Fading: each topic against dental searches overall, July to September against a year earlier.')}`,
    idle: K.idleHint('Hover a pin or a row to read it'),
  });

  /* ===== tongue tie ===== */
  const near = (prev, keys) => keys.includes(prev);
  const TTK = ['tt-call', 'tt-phr', 'tt-who', 'tt-land']; const PDK = ['pd-call', 'pd-land', 'pd-step']; const PDYK = ['pdy-call', 'pdy-who', 'pdy-land', 'pdy-season'];
  /* r4 (owner 10/29): the Trends line and our clients’ average share ONE chart: Trends on the grey 0 to 100 left
     scale, our clients in rose on a small rose right-hand scale. Lines named at their ends; one chip row as the key. */
  const yc = yv;
  const CALL_KEY = [{ c: TEAL, w: 2, t: 'Google demand, 0 to 100' }, { c: K.ROSE, w: 2, cs: true, t: 'Our clients’ average, showings per client a week' }];
  const callLabels = (k, ch, l, headT, gut, foot) => `${K.title(headT, `${TERM[k][0].toUpperCase()}${TERM[k].slice(1)} in Washington, Jul to Sep this year against last year`)}${K.winLabels(k, ...W24)}
      ${K.y0100()}${K.xTicks(...W24)}${K.notOver(...W24)}${K.clLabels(k, ...W24)}${K.gutter([...gut, ...K.clGut(k, ...W24)], Y0, Y1 + 6, 568)}${K.keyRow(CALL_KEY)}${K.foot(foot)}`;
  const callBuild = (S, k, prev, keys, lane, d0) => {
    K.grid(S); K.band(S, G, [1, 5, 8][lane], lane);
    K.line(S, k, ...W24, 'lead', { delay: near(prev, keys) ? 0 : d0, rise: near(prev, keys) ? null : lane });
    K.windows(S, k, ...W24, { delay: d0 + 700 }); K.endDot(S, k, ...W24, TEAL, d0 + 700);
    K.clLine(S, k, ...W24, d0 + 1300);
  };

  const spY = K.split('pdy'); const ownY = spY.own[1];
  const avgM = (n, ms) => K.avg(ms.map((m) => spY.g[n][idx(m)]));
  const winterY = Math.round(avgM('patients', ['2025-11', '2025-12', '2026-01']) / 10) * 10; const summerY = Math.round(avgM('patients', ['2026-06', '2026-07', '2026-08']) / 10) * 10;
  chapters.push(who({
    key: 'pdy-who', topic: 'Pediatric dentistry', ch: 9, lane: 2, sp: spY,
    head: `Expedition shows up less on local pediatric dentistry searches: <span class="g">about ${summerY} times a week, down from ${winterY}</span>.`,
    tiles: [[`${K.ord(spY.T.rank)} of ${spY.T.practices}`, 'our practices, name searches left out', K.WHO_TIP.rank], [fmt(spY.R.imp), 'National searches: showings', K.WHO_TIP.reach], [fmt(spY.Pt.imp), 'Local searches: showings', K.WHO_TIP.patientsY]],
    points: [K.whoShape('pdy', spY), `${spY.T.top[0][0]} leads with ${fmt(spY.T.top[0][1])} showings, ${times(spY.T.top[0][1] / ownY)} Expedition’s ${fmt(ownY)}.`,
      `National searches, about ${Math.round(in100(spY.R.imp, spY.Pt.imp) / 10)} in 10 showings: mostly ${q(spY.R.top[0])} and ${q(spY.R.top[1])}, with ${spY.R.clk} clicks in all.`,
      `Local showings fell from about ${winterY} a week last winter to about ${summerY} this summer. Expedition is ${K.ord(spY.Pt.rank)} of our practices there.`,
      `Searches that name Expedition are set aside: ${fmt(spY.T.ownName[0])} showings, ${fmt(spY.T.ownName[1])} clicks, most of its clicks.`],
    cap: 'Expedition’s showings a week for searches with pediatric, kids or children’s dentistry, name searches left out, sorted into national and local by the words in the search. One chart, two scales: national (slate) on the left, local (teal) on the right. Hatched: Expedition is missing 3 weeks of September.',
    yA: K.ySc(Y0, Y1, 300), yB: K.ySc(Y0, Y1, 200), tA: [0, 150, 300], tB: [0, 100, 200],
    figT: 'Pediatric dentistry: who sees Expedition’s site',
    foot: 'Local: the search names a place, a cost or booking. Every other search is national. Searches naming a practice are left out.',
  }));
  chapters.push(land({
    key: 'pdy-land', topic: 'Pediatric dentistry', ch: 10, lane: 2, hold: ['p-pub'],
    head: 'Pediatric dentistry’s own work: <span class="g">improve the benefits article by June</span>.',
    tiles: [['avg. position 17', 'the benefits article', K.tip('place')], ['16', 'visits to it in a year', K.tip('ses', 'Matched by its address and the benefits searches it shows up for.')], ['avg. position 8', 'the home page, for bellevue pediatric dentistry', K.tip('place', 'Here 7.8: 2,574 showings, 8 clicks. From Expedition’s top 5,000 searches.')]],
    points: ['“benefits of pediatric dentistry”: 1,139 showings at avg. position 14, no clicks.',
      'The article that answers it has avg. position 17, past the first 10 results. Improve it in the On-Page tool.',
      'Local searches find the home page at avg. position 8, so its November pin covers them too.',
      'Why June and not now: the season, next.'],
    mock: `<b>Mockup:</b> the special health care needs page also meets the Improve rule, 282 showings and 1 visit: marked, not pinned, for the owner to decide. ${MOCK_LAND}`,
    cap: 'Expedition’s pediatric dentistry pages, sorted by calls or forms. The benefits article’s Improve lands on June in the year below; the next chapter shows why June.',
    figT: 'Pediatric dentistry: where patients land',
    rows: [['Home page', 'Expedition’s pediatric dentistry page', '/', 'Improve', 'Nov · same pin', 'Covered by the November home page pin: avg. position 8 on local searches like bellevue pediatric dentistry.'],
      ['Benefits of a pediatric dentist', 'article', '/articles/benefits-of-a-pediatric-dentist', 'Improve', 'Jun · On-Page', 'Improve a page: avg. position 17, past the first 10 results, 16 visits. On-Page tool, by June.'],
      ['Special health care needs', 'service page', '/dental-services/pediatric-dentistry-for-children-with-special-health-care-needs', 'Improve', 'not pinned yet', 'Meets the Improve rule, 1 visit in a year, but is not on this year’s plan yet.']],
    fly: (fig, later) => K.chipFly(fig, later, 1, 'Improve', 'p-pub'),
  }));
  window.V6CH = { chapters, kick, TTK, PDK, PDYK };
})();

<script>/* V6 (from v5end.js): the season chapter (the strip rises, peak and dip drop onto it, June lights, the strip sinks)
   and the plan (the full band returns; every pin becomes a card with its reason). */
(function () {
  const K = window.V6K; const { chapters, kick } = window.V6CH;
  const { T, put, xw, yv, idx, avg, GEO, pdy, Y0, Y1, TEAL, TEAL_D, INK, MUTED, GREY, PINS } = K;
  const G = GEO.cb; const PG = GEO.plan;
  const YRS = [2022, 2023, 2024, 2025];
  const yrRel = YRS.map((y) => { const i = idx(`${y}-01`); const seg = pdy.m.slice(i, i + 12); const a = avg(seg); return seg.map((v) => v / a); });
  const yrMean = yrRel[0].map((_, m) => avg(yrRel.map((a) => a[m])));
  const kToM = (k) => (k + 10) % 12;
  const yr = (r) => Y1 - ((r - 0.6) / 0.75) * (Y1 - Y0);
  const WF = [idx('2021-11'), idx('2025-12')];
  const bandOrder = (arr) => Array.from({ length: 12 }, (_, k) => arr[kToM(k)]);
  const pkVals = yrRel.map((a) => Math.max(...a)); const dcVals = yrRel.map((a) => a[11]);
  const LAT = 1.8;
  const SEASON = ['p-dip', 'p-peak']; // season marks; the June pin was lit by the page chapter and pulses here
  chapters.push({
    key: 'pdy-season', kick: kick('Pediatric dentistry', 'when searches peak'),
    head: 'Pediatric dentistry peaks in <span class="g">late summer</span> and dips every December.',
    tiles: [['4 of 4', 'years busiest in July or August'], ['4 of 4', 'years quietest in December'], [`about ${yrMean[7].toFixed(1)}`, 'times an average month, in August'], ['June 2027', 'benefits article improved by, two months ahead']],
    points: ['Busiest in August 2022, 2023 and 2024, and July 2025.',
      `The peak ran ${Math.round((Math.min(...pkVals) - 1) * 100)} to ${Math.round((Math.max(...pkVals) - 1) * 100)} in every 100 above an average month.`,
      `December was the quietest month every year, about ${avg(dcVals).toFixed(1)} times an average month.`,
      'Tongue tie and pediatric dentist have no repeating season, so their pins are now, in November.'],
    link: [['hiw-seasons', 'How a season is found']],
    labelsAt: LAT * 1000, labelsPre: () => `${K.title('Four years of pediatric dentistry, in Washington', 'Nov 2021 to Dec 2025, then each year laid onto the coming one')}`,
    /* r4: the peak and dip stay marked on the chart, straight above their month columns; their marks fade in on the
       band row below, then the June pin pulses. Nothing travels across the figure. */
    enter(fig, later) {
      later(1000, () => ['ln-pdy', 'cs-pdy', 'tl-pdy'].forEach((id) => fig.set(id, { o: 0 })));
      later(3000, () => K.cbLand('p-peak'));
      later(3300, () => K.cbLand('p-dip'));
      later(4400, () => K.cbPulse('p-pub'));
    },
    cap: 'Pediatric dentistry, Washington: 2022 to 2025, each calendar year against its own average month, laid onto the months of the year ahead. Bold: the 4-year average. Peak and dip are marked on its row of the year below, then the June pin pulses: two months before the peak.',
    build(S) {
      put(S, 'base', { x1: G.x0, x2: G.x1, y1: Y1, y2: Y1, o: 1 }); K.band(S, G, 11, 2, { hold: SEASON });
      K.line(S, 'pdy', ...WF, 'lead', { delay: 400 }); // r4: waits for the previous page rows or the large band to fade first
      YRS.forEach((y, n) => {
        const cont = Array.from({ length: 12 }, (_, k) => { const i = idx(`${y - 1}-11`) + k; return [xw(i, ...WF), yv(pdy.m[i])]; });
        put(S, `yr${n}`, { pts: bandOrder(yrRel[n]).map((r, k) => [K.bx(G, k), yr(r)]), stroke: n % 2 ? '#475569' : '#8B98A9', sw: 1.2, dash: n % 2 ? '4 3' : 'none', o: 0.85 }, { pre: { pts: cont, o: 0 }, delay: 1000 + n * 120 });
      });
      const mp = bandOrder(yrMean).map((r, k) => [K.bx(G, k), yr(r)]); const flat = mp.map(([x]) => [x, yr(1)]);
      put(S, 'yrm', { pts: mp, o: 1 }, { pre: { pts: flat, o: 0 }, delay: 1900 }); put(S, 'yrm-cs', { pts: mp, o: 1 }, { pre: { pts: flat, o: 0 }, delay: 1900 });
      put(S, 'pk', { cx: K.bx(G, 9), cy: yr(yrMean[7]), stroke: TEAL, r: 4.5, o: 1 }, { delay: 2400 });
      put(S, 'dp', { cx: K.bx(G, 1), cy: yr(yrMean[11]), r: 4.5, o: 1 }, { delay: 2400 });
    },
    labels: () => `${K.title('Busiest in late summer, 4 years running', 'Pediatric dentistry, each year against its own average month, Washington')}
      <line x1="${G.x0}" x2="${G.x1}" y1="${yr(1)}" y2="${yr(1)}" stroke="#E7E9EE"/>${T(G.x0 - 6, yr(1) + 3.5, 'average', { s: 10, c: '#9CA3AF', a: 'end' })}
      ${T(G.x0 - 6, yr(1.25) + 3.5, '1.25 times', { s: 10, c: '#9CA3AF', a: 'end' })}${T(G.x0 - 6, yr(0.75) + 3.5, '0.75 times', { s: 10, c: '#9CA3AF', a: 'end' })}
      ${K.BM.map((m, k) => T(K.bx(G, k), Y1 + 16, m, { s: 10, c: '#9CA3AF', a: 'middle' })).join('')}
      ${T(K.bx(G, 9), yr(yrMean[7]) - 12, `Aug, about ${yrMean[7].toFixed(1)} times`, { s: 11.5, w: 700, c: INK, a: 'middle' })}
      ${T(K.bx(G, 1) + 10, yr(0.66), `Dec, about ${avg(dcVals).toFixed(1)} times`, { s: 11.5, w: 700, c: INK })}
      ${K.foot('A season: the same busiest months in at least 2 of the last 3 full years.')}`,
    hit: { x: G.x0, y: Y0, width: G.x1 - G.x0, height: Y1 - Y0 },
    hv: { i0: 0, i1: 11, x: (k) => K.bx(G, k), note: 'times an average month, Washington', title: (k) => `${FL.MONF[kToM(k)]}, 2022 to 2025`, cols: 5,
      series: [{ name: 'avg', vals: bandOrder(yrMean), y: yr, kind: 'lead', key: { c: TEAL, w: 2.2 }, fmt: (v) => v.toFixed(2) }, ...YRS.map((y, n) => ({ name: String(y), vals: bandOrder(yrRel[n]), y: yr, kind: 'other', key: { c: n % 2 ? '#475569' : '#8B98A9', w: 1.2, dash: n % 2 ? '4 3' : '' }, fmt: (v) => v.toFixed(2) }))] },
    idle: K.idleHint('Hover the chart to read any month', 'times an average month, Washington'),
  });

  /* ===== the plan: the plot empties, the full band returns, every pin becomes a card ===== */
  const PLAN = [
    { pin: 'p-tt', when: 'Nov 2026', who: 'tongue tie', verb: 'improve a page · On-Page', head: 'Improve the frenectomy service page', why: 'For local searches: 20,231 showings, 12 clicks. Avg. position 23.', hv: ['Frenectomy service page: avg. position 23, 144 visits, 6 calls or forms', 'Search Console and Google Analytics', `Local searches, sorted by the words in the search: 20,231 showings, 12 clicks. ${K.HV.place} ${K.HV.ke}`] },
    { pin: 'p-pd', when: 'Nov 2026', who: 'pediatric dentist', verb: 'improve a page · On-Page', head: 'Get the home page into the top 3', why: 'Avg. position 7 on local searches; 81 calls or forms. No season, so now.', hv: ['Home page: avg. position 7 on local searches, 1,265 visits, 81 calls or forms', 'Search Console and Google Analytics', `${K.HV.place} ${K.HV.ke} Also covers local pediatric dentistry searches, avg. position 8.`] },
    { pin: 'p-pub', when: 'Jun 2027', who: 'pediatric dentistry', verb: 'improve a page · On-Page', head: 'Refresh the benefits article by June', why: 'Avg. position 17, 16 visits; ready two months before the July to August peak.', hv: ['Benefits article: avg. position 17, 16 visits', 'Search Console and Google Analytics', `${K.HV.place} ${K.HV.match}`] },
    { pin: null, when: 'Calendar', who: 'new pages only', verb: 'write · content calendar', head: 'No new page this year', why: 'Expedition already has a page for each topic, so nothing goes to the content calendar.', hv: ['No Write pins', 'the pin rule', 'Write means no page covers the topic. Only Write pins go to the content calendar, which is for new content only. Expedition has a page for all three topics.'] },
  ];
  const CARD = (j) => ({ x: 0, y: 244 + j * 64, width: 640, height: 50 });
  chapters.push({
    key: 'plan', kick: 'The plan · Nov 2026 to Oct 2027',
    head: 'Expedition’s year: <span class="g">improve two pages in November</span>, one more by June.',
    tiles: [['3', 'pages to improve, all On-Page work'], ['0', 'new pages for the content calendar'], ['June 2027', 'benefits article improved by']],
    points: ['Every pin is an action from a written rule: no page means write one; a page Google lists outside the top results, or that rarely brings visits, means improve it.',
      'Pages that already perform well get no pin, such as the frenectomy guide article.',
      'Pins follow the calendar, not the 1 to 10 rating: every topic rates 2 of 10 here.',
      'The next check, in January 2027, can say whether tongue tie crossed into Rising.'],
    link: [['hiw-pages', 'How the pins are chosen']],
    mock: '<b>Mockup:</b> peak and dip on the band are season marks, not pins. Two small pages also meet the Improve rule, preventative care and special health care needs, and are not pinned yet.',
    cap: 'The finished year: every pin lit, each turned into a step with the page and the reason behind it, in calendar order.',
    build(S) {
      K.band(S, PG, 12, null, { delay: 250 });
      /* r4: each card fades in and settles a few pixels; no card grows out of a pin cell across the band */
      PLAN.forEach((p, j) => put(S, `card${j}`, { ...CARD(j), o: 1, fill: '#fff' }, { pre: { ...CARD(j), y: CARD(j).y + 6, o: 0, fill: '#fff' }, delay: 1250 + j * 160, dur: 700 }));
    },
    labelsAt: 1150, labelsPre: () => '',
    labels: () => `${K.title('Expedition’s plan, Nov 2026 to Oct 2027', 'Searches read for Washington · pages from Expedition’s own data · in calendar order')}
      ${K.bandLabels(PG, 12, null)}
      ${PLAN.map((p, j) => { const c = CARD(j); return `<g ${K.fadeIn(0.75 + j * 0.16)} ${p.hv ? `data-ro-t="${FL.esc(p.hv[0])}" data-ro-n="${FL.esc(p.hv[1])}" data-ro-b="${FL.esc(p.hv[2])}"` : ''}><rect x="0" y="${c.y}" width="640" height="${c.height}" fill="transparent"/>
        ${T(16, c.y + 20, p.when, { s: 12.5, w: 800, c: TEAL_D })}${T(16, c.y + 36, p.who, { s: 10, c: GREY })}
        ${T(140, c.y + 20, p.head, { s: 13.5, w: 800, c: INK })}${T(140, c.y + 37, p.why, { s: 11, c: MUTED })}
        ${p.verb ? T(624, c.y + 20, p.verb, { s: 10.5, w: 700, c: p.pin ? TEAL_D : MUTED, a: 'end' }) : ''}</g>`; }).join('')}
      ${K.footEnd('Ordered by month, not by the 1 to 10 rating: every topic rates 2 of 10 on this prospect check.')}`,
    idle: K.idleHint('Hover a pin to read it'),
  });

  window.V6 = { chapters, init: K.init, base: K.base, vh: K.VH, hit: { x: K.X0, y: Y0, width: K.X1 - K.X0, height: Y1 - Y0 } };
})();
</script>
<script>
