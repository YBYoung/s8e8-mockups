<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Market Trends, V6 Two questions per page</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>.oq-rail{position:fixed;inset:0 auto 0 0;width:56px;background:#fff;border-right:1px solid rgba(231,229,228,.6);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px;z-index:40}.oq-rail-item{width:39px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#44403c}.oq-rail-item:hover{background:#f5f5f4}.oq-rail-item.is-active{background:#1c1917;color:#fff}.oq-rail-item:first-child{color:#a8a29e;margin-bottom:8px}.oq-rail-sep{width:24px;height:1px;background:#e7e5e4;margin:6px 0}.oq-rail-foot{margin-top:auto}.oq-rail-av{position:relative;display:flex;width:28px;height:28px;border-radius:6px;background:#e7e5e4;color:#44403c;font:600 10px Inter,system-ui;align-items:center;justify-content:center}.oq-rail-av i{position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-radius:2px;background:#16a34a;border:2px solid #fff}
/* Market Trends Story mockups, round 2. Facelift shared look (AIV experience in OQ teal), trimmed. */
:root{
  --ink:#0B1020;--ink2:#0F172A;--body:#273043;--muted:#667085;--faint:#98A2B3;--line:#E7E9EE;--soft:#F6F7FA;
  --a:#0F766E;--aInk:#115E59;--aTint:#E6F4F1;--aSoft:#99D5CC;
  --up:#15803D;--down:#E11D48;--rose:#DB2777;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.55;color:var(--body);background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:var(--aInk)}

/* mockup bar: outside the design */
.mockbar{background:#ECEEF1;color:#4B5563;font-size:12px;line-height:1.45;padding:7px 18px;border-bottom:1px solid #DDE1E6}
.mockbar b{color:#111827;font-weight:700}
.mockbar .src{color:#6B7280}
.mockbar ul{margin:3px 0 0;padding:0 0 0 16px}
.mockbar li{margin:0}
.mockbar .nr{display:inline-block;margin-top:3px;color:#6B7280}

/* app chrome */
.fl-app{margin-left:56px;min-height:100vh}
.mockbar{margin-left:56px}
.fl-main{min-width:0}
.fl-wrap{max-width:1240px;margin:0 auto;padding:0 28px 120px}
.fl-top{position:sticky;top:0;z-index:30;margin:0 -28px 0;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #EEF0F4}
.fl-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;color:var(--ink)}
.fl-mark{width:26px;height:26px;border-radius:8px;background:var(--a);display:grid;place-items:center;flex:none}
.fl-mark svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8}
.fl-right{display:flex;align-items:center;gap:12px;font-size:13px;flex-wrap:wrap;justify-content:flex-end}
.fl-right .who{color:var(--ink);font-weight:700}
.fl-right .when{color:var(--muted)}
.btn{border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13.5px;transition:background .2s,box-shadow .2s}
.btn-go{background:var(--a);color:#fff;box-shadow:0 6px 18px rgba(15,118,110,.25)}
.btn-line{background:#fff;border:1px solid var(--line);color:var(--ink);padding:7px 12px;font-size:13px}
.btn-line:hover{background:var(--soft)}
.method-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;border-radius:8px;padding:6px 10px;font-weight:600;color:var(--aInk);position:relative;font-size:13.5px}
.method-btn:hover{background:var(--aTint)}
.method-btn .dot{width:14px;height:14px;border-radius:50%;background:var(--a);position:relative}
.method-btn .dot:after{content:'';position:absolute;inset:3.5px;border-radius:50%;border:1px dotted #fff}
.teaser{position:absolute;right:0;top:100%;margin-top:8px;width:300px;z-index:40;border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px 16px;font-size:13px;font-weight:400;line-height:1.5;color:var(--body);text-align:left;box-shadow:0 12px 32px rgba(11,16,32,.12)}

/* tabs */
.tabs{position:sticky;top:55px;z-index:20;display:flex;gap:26px;margin:0 -28px 6px;padding:10px 28px 0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(12px)}
.tabs button{position:relative;border:0;background:none;padding:0 0 10px;font-size:15px;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--ink)}
.tabs .ink{position:absolute;bottom:-1px;height:2px;background:var(--a);transition:left .3s var(--ease),width .3s var(--ease)}
.tabnote{padding:60px 0;color:var(--muted);font-size:14px}

/* modal (How it works) */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:5vh 16px}
.modal .bd{position:fixed;inset:0;background:rgba(11,16,32,.4)}
.modal .win{position:relative;width:100%;max-width:880px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:24px 28px;box-shadow:0 24px 60px rgba(11,16,32,.18);animation:rise .25s var(--ease)}
.modal .x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);border-radius:6px;padding:4px 8px}
.msec{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:center;border-top:1px solid var(--line);padding:20px 0}
.msec h3{margin:0 0 8px;font-size:16.5px;color:var(--ink)}
.msec p{margin:8px 0;font-size:15px;line-height:1.6}
.msec figure{margin:0}
.msec figcaption{margin-top:6px;text-align:center;font-size:12px;color:var(--muted)}
.figbox{height:200px;overflow:hidden;border-radius:8px;background:var(--soft)}
.figbox svg{display:block;width:100%;height:100%}
.figbox svg *{transition:opacity .45s, fill .45s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:300;background:var(--ink);color:#fff;border-radius:8px;padding:12px 18px;font-size:14px;box-shadow:0 12px 32px rgba(11,16,32,.25);animation:rise .25s var(--ease)}
.tipcard{position:fixed;z-index:200;width:280px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:10px 14px;font-size:13px;line-height:1.5;color:var(--body);box-shadow:0 12px 32px rgba(11,16,32,.12);pointer-events:none}
.tipcard b{display:block;color:var(--aInk);font-size:13px;margin-bottom:2px}
.tipword{border-bottom:1px dotted var(--faint);cursor:help}

/* Story */
.story{display:grid;grid-template-columns:minmax(0,1fr) 600px;gap:44px}
.chap{min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding:24px 0;opacity:.25;transition:opacity .4s}
.chap.on{opacity:1}
.chap .k{margin-bottom:12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--aInk)}
.chap .k .act{color:var(--muted)}
.chap h2{margin:0;font-size:36px;font-weight:900;line-height:1.12;letter-spacing:-.025em;color:var(--ink)}
.chap h2 .g{color:var(--a)}
.chap h2 .r{color:var(--down)}
.chap p{margin:14px 0 0;max-width:540px;font-size:17px;line-height:1.6}
.defs{margin-top:18px;max-width:540px;padding:12px 14px;background:#F8FAFB;border:1px solid var(--line);border-radius:6px}
.defs .dh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.chap .defs p{margin:0;font-size:13.5px;line-height:1.55;color:#273043}
.chap .defs p+p{margin-top:6px}
.chap .note{font-size:13.5px;color:var(--muted);margin-top:12px}
.facts{margin-top:18px;max-width:540px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.facts div{padding:9px 10px 9px 0;border-bottom:1px solid var(--line)}
.facts b{display:block;font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.facts span{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.qlist{margin-top:16px;max-width:540px;border-top:1px solid var(--line)}
.qlist div{display:grid;grid-template-columns:minmax(0,1fr) 70px 54px;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.qlist div span:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.qlist .h span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)!important}
.stick{position:sticky;top:104px;height:calc(100vh - 112px);display:flex;flex-direction:column;justify-content:center}
.ro{height:52px;padding:4px 2px 6px;border-bottom:1px solid #EEF0F3;margin-bottom:6px;overflow:hidden}
.ro .r1{display:flex;justify-content:space-between;align-items:baseline;height:20px;font-size:13px;white-space:nowrap}
.ro .r1 .m{font-weight:700;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.ro .r1 .n{color:var(--muted);font-size:12px;margin-left:12px}
.ro .r2{display:grid;height:22px;align-items:center;gap:10px;font-size:12.5px;white-space:nowrap}
.ro .r2 .s{display:flex;align-items:center;gap:6px;overflow:hidden;min-width:0}
.ro .r2 .s b{color:var(--ink2);font-variant-numeric:tabular-nums}
.ro .r2 .s span{color:var(--body);overflow:hidden;text-overflow:ellipsis}
.ro .r2 .s svg{flex:none}
.ro .r2 .txt{grid-column:1/-1;color:var(--body);overflow:hidden;text-overflow:ellipsis}
.figsvg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.figsvg text{font-family:Inter,sans-serif}
.figsvg .num{font-variant-numeric:tabular-nums}
.figcap{margin-top:6px;min-height:36px;font-size:12.5px;line-height:1.45;color:var(--muted);text-align:center}
.storyend{margin:24px 0 0;padding:28px;border:1px solid var(--line);border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;opacity:0;transform:translateY(14px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.storyend.in{opacity:1;transform:none}
.storyend h3{margin:0;font-size:24px;font-weight:900;color:var(--ink);letter-spacing:-.02em}
.storyend p{margin:4px 0 0;color:var(--muted);font-size:14px}
@media (max-width:1180px){.story{grid-template-columns:minmax(0,1fr) 520px;gap:32px}}
@media (max-width:980px){.story{grid-template-columns:1fr}.stick{position:static;height:auto}.chap{opacity:1;min-height:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

/* V5: chapter = lead sentence, number tiles, short points, optional detail table, How-this-is-measured link */
.v5 .chap{min-height:92vh}
.v5 .chap .k{letter-spacing:.12em}
.v5 .chap h2{font-size:30px;line-height:1.14;max-width:560px}
.tiles{margin-top:20px;max-width:560px;display:grid;gap:8px}
.tiles.t2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tiles div{border:1px solid var(--line);border-radius:6px;background:#fff;padding:10px 12px 9px}
.tiles b{display:block;font-size:20px;font-weight:800;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.015em;white-space:nowrap}
.tiles span{display:block;margin-top:3px;font-size:12px;line-height:1.35;color:var(--muted)}
.tiles div[data-tip]{cursor:help}
.pts{margin:16px 0 0;padding:0;max-width:560px;list-style:none}
.pts li{position:relative;padding:4px 0 4px 16px;font-size:15.5px;line-height:1.45;color:var(--body)}
.pts li:before{content:'';position:absolute;left:2px;top:13px;width:6px;height:6px;border-radius:1px;background:var(--aSoft)}
.pts li b{color:var(--ink)}
.dt{margin-top:14px;width:100%;max-width:560px;border-collapse:collapse;font-size:13px}
.dt th{text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 0 5px;border-bottom:1px solid var(--line)}
.dt td{padding:5px 0;border-bottom:1px solid var(--line);color:var(--body)}
.dt .n{text-align:right;font-variant-numeric:tabular-nums;padding-left:10px;white-space:nowrap}
.dt td.n{color:var(--ink);font-weight:600}
.dtn{margin-top:5px;font-size:11.5px;color:var(--faint)}
.hm{margin-top:14px;display:flex;gap:18px;flex-wrap:wrap}
.hm a{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--aInk);text-decoration:none;border-radius:6px;padding:3px 6px 3px 0}
.hm a:hover{text-decoration:underline}
.hm .i{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--a);display:inline-grid;place-items:center;font:700 9.5px/1 Inter,sans-serif;color:var(--a);font-style:italic}
.mnote{margin-top:12px;max-width:560px;padding:6px 10px;background:#F1F2F4;border-radius:4px;font-size:11.5px;line-height:1.45;color:#6B7280}
.mnote b{color:#4B5563}
/* chapter 01: three topic tiles */
.ttiles{margin-top:20px;max-width:560px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ttiles>div{border:1px solid var(--line);border-radius:6px;background:#fff;padding:10px 12px}
.ttiles .tn{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ttiles .ta{margin-top:3px;font-size:15.5px;font-weight:800;line-height:1.25;color:var(--ink)}
.ttiles .ta i{font-style:normal;color:var(--a)}
.ttiles .tf{margin-top:4px;font-size:12px;line-height:1.4;color:var(--muted)}
@keyframes tolit{from{fill:#115E59}to{fill:#fff}}
@keyframes toink{from{fill:#98A2B3}to{fill:#0B1020}}

/* V6: hover sentences in the readout may wrap to two lines inside the same fixed 52px bar (no layout shift) */
.ro:has(.txt){padding-top:1px;padding-bottom:1px}
.ro .r2:has(.txt){height:30px;align-items:start}
.ro .r2 .txt{white-space:normal;font-size:11.5px;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

<script>/* Shared pieces for the round 2 Story mockups: frame, tabs, hovers, How it works window,
   and a small tween engine for ONE persistent SVG (marks keyed by id, never unmounted). */
(function () {
  const FL = (window.FL = {});

        <div class="fl-top"><div class="fl-brand"><span class="fl-mark"><svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg></span>Market Trends</div>
          <div class="fl-right"><span id="method-slot"></span><span class="who">Expedition Pediatric Dentistry</span><span class="when">Check #22 · Oct 29, 2026 · read for Washington</span>
          <button class="btn btn-line" id="share">Share report</button><button class="btn btn-line" id="newc">New check</button></div></div>
      </div></main></div>`);
    page.parentNode.insertBefore(bar, page);
    page.parentNode.insertBefore(app, page);
    app.querySelector('.fl-wrap').appendChild(page);
    FL.$('#method-slot').innerHTML = '<button type="button" class="method-btn"><span class="dot"></span>How it works</button>';
    FL.$('#share').onclick = () => FL.toast('Opens the client report: link, access code, PDF and email.');
    FL.$('#newc').onclick = () => FL.toast('Starts a new check (not part of this mockup).');
  };

  FL.tabs = function (host, { tabs, value, onChange }) {
    host.classList.add('tabs');
    host.innerHTML = tabs.map((t) => `<button type="button" data-k="${t.key}">${FL.esc(t.label)}</button>`).join('') + '<span class="ink"></span>';
    const ink = host.querySelector('.ink');
    const set = (k, fire) => {
      host.querySelectorAll('button').forEach((b) => { const on = b.dataset.k === k; b.classList.toggle('on', on); if (on) { ink.style.left = `${b.offsetLeft}px`; ink.style.width = `${b.offsetWidth}px`; } });
      if (fire && onChange) onChange(k);

    host.querySelectorAll('button').forEach((b) => { b.onclick = () => set(b.dataset.k, true); });
    requestAnimationFrame(() => set(value, false));
  };

  /* branded hover for words in the text (never over the chart) */
  let tipEl = null; let tipFor = null; let tipT = null;

  document.addEventListener('mouseover', (e) => {

  /* How it works: teaser on hover, window on click, a looping real-data picture per section */
  FL.method = function ({ teaser, title, sections }) {
    const btn = FL.$('.method-btn'); let tip = null;

    btn.addEventListener('click', () => {
      tip?.remove(); tip = null;
      const m = FL.h(`<div class="modal"><div class="bd"></div><div class="win" role="dialog" aria-modal="true">

          <figure><div class="figbox" data-fig="${i}"></div><figcaption>${FL.esc(s.caption)}</figcaption></figure></section>`).join('')}

    return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x; for (let i = 0; i < 8; i++) { const e = sx(t) - x; const d = ds(t); if (Math.abs(e) < 1e-5 || Math.abs(d) < 1e-6) break; t -= e / d; } return sy(t); };

  const ptsD = (p) => p.map((q, i) => `${i ? 'L' : 'M'}${q[0].toFixed(1)},${q[1].toFixed(1)}`).join('');

  FL.Fig = class {
    constructor(svg) { this.svg = svg; this.m = new Map(); this.tw = []; this.raf = null; this.lab = null; this.labHtml = null; this.labT = null; }
    layer(name) { const g = document.createElementNS(NS, 'g'); g.setAttribute('data-layer', name); this.svg.appendChild(g); return g; }
    /* create a mark once; init = {tag, layer, attrs (static), ...targets} */
    mk(id, tag, layer, attrs = {}, init = {}) {

      const mk = { id, el, tag, cur: {} };
      this.m.set(id, mk);
      this.apply(mk, init, true);

    write(mk) {
      const c = mk.cur; const el = mk.el;
      if (c.pts) el.setAttribute('d', ptsD(c.pts));

      const el = mk.el;
      if (t.attr) Object.entries(t.attr).forEach(([k, v]) => (v == null ? el.removeAttribute(k) : el.setAttribute(k, v)));

<script>/* V5 story runner (copy of story.js; chapter = lead sentence, number tiles, short points, optional detail table, How-this-is-measured link).

        <div class="k">${c.kick}</div>
        <h2>${c.head}</h2>${c.extra || ''}${tiles(c.tiles)}${pts(c.points)}${table(c.table)}
        ${c.mock ? `<div class="mnote">${c.mock}</div>` : ''}${link(c.link)}</section>`).join('')}

    LANES.forEach((k, l) => fig.mk(`lane${l}`, 'rect', L.top, { rx: 3 }, { x: g.x0, width: g.x1 - g.x0, y: g.top(l), height: g.h, o: 0, fill: '#F6F7FA' }));
    for (let k = 0; k <= 12; k++) fig.mk(`col${k}`, 'line', L.top, { stroke: '#fff', 'stroke-width': 2 }, { x1: g.x0 + k * CW(g), x2: g.x0 + k * CW(g), y1: g.top(0), y2: g.top(2) + g.h, o: 0 });
    ['bk', 'ank', 'comb', 'pd', 'pdy', 'tt'].forEach((k) => {
      if (LANES.includes(k)) fig.mk(`cs-${k}`, 'path', L.lines, { fill: 'none', stroke: '#fff', 'stroke-width': 4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, { pts: at(X0, Y1), o: 0 });
      fig.mk(`ln-${k}`, 'path', L.lines, { fill: 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, { pts: at(X0, Y1), o: 0, stroke: TEAL, sw: 2 });
      fig.mk(`tl-${k}`, 'path', L.lines, { fill: 'none', 'stroke-dasharray': '2 3', 'stroke-linecap': 'round' }, { pts: at(X0, Y1, 2), o: 0, stroke: TEAL, sw: 1.6 });
    });
    for (let k = 0; k < 4; k++) fig.mk(`yr${k}`, 'path', L.marks, { fill: 'none', 'stroke-linejoin': 'round' }, { pts: at(X0, Y1, 12), o: 0, stroke: '#8B98A9', sw: 1.2 });
    fig.mk('yrm-cs', 'path', L.marks, { fill: 'none', stroke: '#fff', 'stroke-width': 4, 'stroke-linejoin': 'round' }, { pts: at(X0, Y1, 12), o: 0 });
    fig.mk('yrm', 'path', L.marks, { fill: 'none', stroke: TEAL, 'stroke-width': 2.2, 'stroke-linejoin': 'round' }, { pts: at(X0, Y1, 12), o: 0 });
    fig.mk('own', 'path', L.lines, { fill: 'none', stroke: ROSE, 'stroke-dasharray': '6 3', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, { pts: at(X0, Y1, 11), o: 0, sw: 2 });
    fig.mk('own-oct', 'circle', L.marks, { fill: '#fff', stroke: ROSE, 'stroke-width': 1.6, 'stroke-dasharray': '2 1.5' }, { cx: X1, cy: Y1, r: 3.4, o: 0 });
    fig.mk('cr-cs', 'path', L.lines, { fill: 'none', stroke: '#fff', 'stroke-width': 4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, { pts: at(X0, Y1, 12), o: 0 });
    fig.mk('cr', 'path', L.lines, { fill: 'none', stroke: ROSE, 'stroke-width': 2.2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, { pts: at(X0, Y1, 12), o: 0 });
    fig.mk('cr-tl', 'path', L.lines, { fill: 'none', stroke: ROSE, 'stroke-width': 1.8, 'stroke-dasharray': '2 3', 'stroke-linecap': 'round' }, { pts: at(X0, Y1, 2), o: 0 });
    fig.mk('pk', 'circle', L.marks, { fill: '#fff', 'stroke-width': 2 }, { cx: X1, cy: Y0, r: 4.5, o: 0, stroke: TEAL });
    fig.mk('dp', 'circle', L.marks, { fill: '#fff', 'stroke-width': 2 }, { cx: X1, cy: Y1, r: 4.5, o: 0, stroke: GREY });
    fig.mk('end', 'circle', L.marks, { stroke: '#fff', 'stroke-width': 2 }, { cx: X1, cy: Y1, r: 4, o: 0, fill: TEAL });
    for (let k = 0; k < 4; k++) fig.mk(`card${k}`, 'rect', L.bg, { rx: 6, stroke: '#E7E9EE' }, { x: 0, y: 300, width: 0, height: 0, o: 0, fill: '#fff' });
    PIN_IDS.forEach((id) => { const p = PINS[id]; fig.mk(id, 'rect', L.top, { rx: 3, 'stroke-width': 1.3, style: 'cursor:default' }, { ...cell(GEO.open, p.lane, p.k0, p.k1 ?? p.k0), o: 0, ...pinQuiet }); });
    fig.mk('p-held', 'line', L.top, { 'stroke-linecap': 'round', style: 'cursor:default' }, { x1: X0, x2: X0, y1: Y1, y2: Y1, o: 0, ...heldQuiet });
    fig.mk('chip', 'rect', L.top, { rx: 4, 'stroke-width': 1.3, 'pointer-events': 'none' }, { x: 0, y: 0, width: 10, height: 10, o: 0, fill: '#fff', stroke: TEAL });
    const ct = fig.mk('chip-t', 'text', L.top, { 'font-size': 11, 'font-weight': 700, 'text-anchor': 'middle', 'pointer-events': 'none' }, { x: 0, y: 0, o: 0, fill: TEAL_D });
    ct.el.textContent = '';
    ['pk', 'dp'].forEach((id) => L.top.appendChild(fig.m.get(id).el)); // drops land on top of the risen sheet
    fig.mk('hfly', 'line', L.top, { 'stroke-linecap': 'round', 'pointer-events': 'none' }, { x1: X0, x2: X0, y1: Y1, y2: Y1, o: 0, stroke: TEAL, sw: 2.6 });
  };

  /* ---------- band state (built per chapter) ---------- */
  K.band = function (S, g, ch, active, { first = false, delay = 0, hold = [] } = {}) {
    K.cur = { ch, active, hold: [...hold] };
    LANES.forEach((k, l) => {
      const on = active === l;
      put(S, `lane${l}`, { x: g.x0, width: g.x1 - g.x0, y: g.top(l), height: g.h, o: 1, fill: on ? (g.name === 'thin' ? '#BFE0D9' : '#EEF6F4') : (g.name === 'thin' ? '#ECEEF2' : '#F6F7FA'),
        attr: { 'data-ro-t': `${TERM[k]}: ${LANE[k].verdict}`, 'data-ro-n': 'Google’s 0 to 100, Washington', 'data-ro-b': LANE[k].ro } },
      first ? { pre: { x: g.x0, width: 0, y: g.top(l), height: g.h }, delay: 200 + l * 140 } : { delay });
    });
    for (let k = 0; k <= 12; k++) { const x = g.x0 + k * CW(g); put(S, `col${k}`, { x1: x, x2: x, y1: g.top(0), y2: g.top(2) + g.h, o: g.name === 'thin' ? 0 : 1 }, first ? { delay: 900 } : { delay }); }
    put(S, 'drawer', { x: 84, y: 436, width: 556, height: 44, o: 0 });
    K.pins(S, ch, g, { delay, first, hold });
  };
  const pinStyle = (id, on, g) => (on ? pinLit(id) : g.name === 'thin' ? pinQuietThin : pinQuiet);
  K.pins = function (S, ch, g, { delay = 0, first = false, hold = [] } = {}) {
    PIN_IDS.forEach((id, j) => {
      const p = PINS[id]; const c = cell(g, p.lane, p.k0, p.k1 ?? p.k0); const on = lit(id, ch) && !hold.includes(id);
      put(S, id, { ...c, o: 1, ...pinStyle(id, on, g), attr: { 'data-ro-t': p.t, 'data-ro-n': `${p.n} · ${on ? 'explained above' : 'explained further down'}`, 'data-ro-b': p.b } },
        first ? { pre: { ...c, o: 0, ...pinQuiet }, delay: 1100 + j * 140 } : { delay });
    });
    const hl = K.heldY(g);
    const on = lit('p-held', ch) && !hold.includes('p-held');
    put(S, 'p-held', { x1: g.x0 + 8, x2: g.x1 - 8, y1: hl, y2: hl, ...(on ? heldLit : heldQuiet), ...(g.name === 'thin' ? { sw: on ? 2 : 1, dash: on ? 'none' : '3 2' } : {}),
      attr: { 'data-ro-t': 'Pediatric dentist, all year: keep the home page', 'data-ro-n': `Google Analytics and Search Console · ${on ? 'explained above' : 'explained further down'}`, 'data-ro-b': 'The home page brought 1,265 visits and 81 calls or forms in 12 months; searches tripled in 2025 and held near 50' } },
    first ? { pre: { x1: g.x0 + 8, x2: g.x0 + 8, y1: hl, y2: hl, ...heldQuiet, o: 0 }, delay: 1500 } : { delay });
  };
  K.heldY = (g) => (g.name === 'thin' ? mid(g, 1) : mid(g, 1) + (g.name === 'plan' ? 9 : g.name === 'open' ? 10 : 8));
  /* light one pin now (after its chip lands); in the grown band its label turns white */
  K.light = (fig, id) => {
    K.cur.hold = K.cur.hold.filter((h) => h !== id);
    if (id === 'p-held') fig.set('p-held', heldLit, { dur: 500 }); else fig.set(id, pinLit(id), { dur: 0 });
    fig.svg.querySelectorAll(`[data-pt="${id}"]`).forEach((t) => { t.style.transition = 'fill .4s'; t.setAttribute('fill', PINS[id] && PINS[id].dark ? '#fff' : PINS[id] ? MUTED : TEAL_D); });
  };
  /* the drawer: grow the strip into a readable band, or sink it back */
  K.drawer = function (fig, up, { dur = 700 } = {}) {
    const g = up ? GROW : THIN;
    fig.set('drawer', up ? { y: 314, height: 166, o: 1 } : { y: 436, height: 44, o: 0 }, { dur });
    LANES.forEach((k, l) => fig.set(`lane${l}`, { x: g.x0, width: g.x1 - g.x0, y: g.top(l), height: g.h, fill: K.cur.active === l ? (up ? '#EEF6F4' : '#BFE0D9') : (up ? '#F6F7FA' : '#ECEEF2') }, { dur }));
    for (let k = 0; k <= 12; k++) { const x = g.x0 + k * CW(g); fig.set(`col${k}`, { x1: x, x2: x, y1: g.top(0), y2: g.top(2) + g.h, o: up ? 1 : 0 }, { dur }); }
    PIN_IDS.forEach((id) => { const p = PINS[id]; const on = lit(id, K.cur.ch) && !K.cur.hold.includes(id); fig.set(id, { ...cell(g, p.lane, p.k0, p.k1 ?? p.k0), ...pinStyle(id, on, g) }, { dur }); });
    const hl = K.heldY(g); const hon = lit('p-held', K.cur.ch) && !K.cur.hold.includes('p-held');
    fig.set('p-held', { x1: g.x0 + 8, x2: g.x1 - 8, y1: hl, y2: hl, sw: up ? (hon ? 2.4 : 1.4) : (hon ? 2 : 1) }, { dur });
    const th = fig.svg.querySelector('[data-bl="thin"]'); const gr = fig.svg.querySelector('[data-bl="grow"]'); const un = fig.svg.querySelectorAll('[data-under]');
    if (th) th.style.opacity = up ? 0 : 1;
    if (gr) gr.style.opacity = up ? 1 : 0;
    un.forEach((u) => { u.style.opacity = up ? 0 : 1; });
    /* any other label the sheet would cover steps aside while it is up */
    fig.svg.querySelectorAll('[data-layer="lab"] text, [data-layer="lab"] line, [data-layer="lab"] path, [data-layer="lab"] circle, [data-layer="lab"] rect').forEach((t) => {
      if (t.closest('[data-bl]') || t.closest('[data-under]')) return;
      const b = t.getBBox(); if (b.y + b.height < 314) return;
      t.style.transition = 'opacity .3s'; t.style.opacity = up ? 0 : ''; });
  };
  /* the usual end-of-chapter landing: drawer up, something lands at `land` ms, drawer down at `down` ms */
  K.landing = function (fig, later, { up = 2400, down = 5600 } = {}) { later(up, () => K.drawer(fig, true)); later(down, () => K.drawer(fig, false)); };

  const laneFlat = (K.laneFlat = (i0, i1, l, g = THIN) => Array.from({ length: N }, (_, i) => [xw(i, i0, i1), mid(g, l)]));
  const LOOK = { lead: { stroke: TEAL, sw: 2.2, o: 1 }, ghost: { stroke: '#C3C8D2', sw: 1.4, o: 1 }, faint: { stroke: TEAL, sw: 1.6, o: 0.3 } };
  K.line = function (S, k, i0, i1, look = 'lead', { delay = 0, y = yv, rise = null } = {}) {
    const v = VALS[k]; const st = typeof look === 'string' ? LOOK[look] : look;
    const o = { delay }; const ot = { delay };
    if (rise != null) { const f = laneFlat(i0, i1, rise); o.pre = { pts: f, o: 0 }; ot.pre = { pts: [f[59], f[59]], o: 0 }; }
    put(S, `ln-${k}`, { pts: linePts(v, i0, i1, y), ...st }, o);
    put(S, `tl-${k}`, { pts: tailPts(v, i0, i1, y), stroke: st.stroke, sw: Math.min(1.8, st.sw), o: st.o }, ot);
    if (LANES.includes(k)) put(S, `cs-${k}`, { pts: linePts(v, i0, i1, y), o: look === 'lead' ? 1 : 0 }, rise != null ? { delay, pre: { pts: o.pre.pts, o: 0 } } : { delay });
  };
  K.base = function (S) {
    ['g0', 'g50', 'g100', 'base', 'lg0', 'lg1', 'win-a', 'win-b', 'gap', 'lvl-a', 'lvl-b', 'usual', 'brk', 'pk', 'dp', 'end', 'yrm', 'yrm-cs', 'own', 'own-oct', 'cr', 'cr-cs', 'cr-tl', 'chip', 'chip-t', 'hfly', 'drawer'].forEach((id) => put(S, id, { o: 0 }));
    ['bk', 'ank', 'comb', 'pd', 'pdy', 'tt'].forEach((k) => { put(S, `ln-${k}`, { o: 0 }); put(S, `tl-${k}`, { o: 0 }); if (LANES.includes(k)) put(S, `cs-${k}`, { o: 0 }); });
    for (let k = 0; k < 4; k++) { put(S, `yr${k}`, { o: 0 }); put(S, `card${k}`, { o: 0 }); }
  };
  K.grid = (S, o = 1) => { [['g0', 0], ['g50', 50], ['g100', 100]].forEach(([id, v]) => put(S, id, { x1: X0, x2: X1, y1: yv(v), y2: yv(v), o })); put(S, 'base', { x1: X0, x2: X1, y1: Y1, y2: Y1, o }); };
  const hw = (K.hw = (i0, i1) => (X1 - X0) / (i1 - i0) / 2);
  K.windows = function (S, k, i0, i1, { only = null, delay = 700 } = {}) {
    const a = idx('2025-07'); const b = idx('2026-07'); const h = hw(i0, i1); const p = P[TERM[k]];
    [['win-a', a, p.prev, 'lvl-a'], ['win-b', b, p.cur, 'lvl-b']].forEach(([id, i, v, lv], n) => {
      if (only && only !== id) return;
      const x = xw(i, i0, i1) - h; const w = xw(i + 2, i0, i1) + h - x;
      put(S, id, { x, width: w, y: Y0, height: Y1 - Y0, o: 1 }, { pre: { x, width: 0, y: Y0, height: Y1 - Y0 }, delay: delay + n * 220 });
      put(S, lv, { x1: x, x2: x + w, y1: yv(v), y2: yv(v), o: 1 }, { pre: { x1: x, x2: x + w, y1: Y0, y2: Y0 }, delay: delay + 400 + n * 220 });
    });
  };
  const winX = (i0, i1, ym) => { const i = idx(ym); return (xw(i, i0, i1) + xw(i + 2, i0, i1)) / 2; };
  K.winLabels = (k, i0, i1, { only = null } = {}) => { const p = P[TERM[k]];
    const a = winX(i0, i1, '2025-07'); const b = Math.min(winX(i0, i1, '2026-07'), X1 - 50);
    return `${only === 'win-b' ? '' : `${T(a, Y0 - 17, 'last year', { s: 11, w: 700, c: '#475569', a: 'middle' })}${T(a, Y0 - 5, `Jul to Sep ’25 · avg ${p.prev.toFixed(1)}`, { s: 10, c: MUTED, a: 'middle', extra: 'class="num"' })}`}
      ${T(b, Y0 - 17, 'this year', { s: 11, w: 700, c: TEAL_D, a: 'middle' })}${T(b, Y0 - 5, `Jul to Sep ’26 · avg ${p.cur.toFixed(1)}`, { s: 10, c: MUTED, a: 'middle', extra: 'class="num"' })}`; };
  K.endDot = (S, k, i0, i1, c = TEAL, delay = 300) => put(S, 'end', { cx: xw(59, i0, i1), cy: yv(VALS[k][59]), r: 4, fill: c, o: 1 }, { delay });

  /* ---------- text helpers ---------- */
  K.xTicks = (i0, i1, every = 3, y0 = Y1) => { let s = ''; let py = null; for (let i = i0; i <= i1; i++) { if ((i - i0) % every !== 0) continue; const m = +M[i].slice(5); const y = M[i].slice(0, 4); const lab = y !== py ? `${FL.MON[m - 1]} ${y}` : FL.MON[m - 1]; py = y; const x = xw(i, i0, i1); s += `<line x1="${x}" x2="${x}" y1="${y0}" y2="${y0 + 4}" stroke="#D1D5DB"/>${T(x, y0 + 15, lab, { s: 10.5, c: '#9CA3AF', a: 'middle' })}`; } return s; };
  K.yTicks = (labels) => labels.map(([v, t]) => T(X0 - 6, v + 3.5, t, { s: 10.5, c: '#9CA3AF', a: 'end', extra: 'class="num"' })).join('');
  K.y0100 = () => K.yTicks([[yv(0), '0'], [yv(50), '50'], [yv(100), '100']]);
  K.title = (t, sub) => `${T(0, 18, t, { s: 15, w: 800, c: INK })}${sub ? T(0, 35, sub, { s: 11.5, c: MUTED }) : ''}`;
  K.gutter = (items, top = Y0, bottom = Y1 + 6) => FL.spread(items, 14, top, bottom).map((d) => `${Math.abs(d.ly - d.y) > 2 ? `<path d="M${d.x0 + 4},${d.y} h6 L${548},${d.ly - 3.5}" fill="none" stroke="#C3C8D2"/>` : ''}${T(552, d.ly, d.t, { s: 11.5, w: d.w || 500, c: d.c || '#273043' })}`).join('');
  /* the plot's foot note sits above the strip; it hides while the drawer is up */
  K.foot = (t) => `<g data-under="1" style="transition:opacity .3s">${T(0, 412, t, { s: 10.5, c: MUTED })}</g>`;
  K.footEnd = (t) => T(0, 474, t, { s: 10.5, c: MUTED });
  K.fadeIn = (s) => (FL.reduce ? '' : `style="animation:fade .35s ease ${s}s both"`);
  K.notOver = (i0, i1) => T(xw(60, i0, i1), Y1 + 27, 'not over', { s: 9.5, c: '#9CA3AF', a: 'middle' });

  /* band text. open / plan: as V5. thin: one quiet line over the strip, plus the grown band's text, hidden until it rises */
  const pinTexts = (g, isLit, fs) => PIN_IDS.map((id) => {
    const p = PINS[id]; const c = cell(g, p.lane, p.k0, p.k1 ?? p.k0); const cx = c.x + c.width / 2; const cy = c.y + c.height / 2;
    const on = isLit(id); const col = on && p.dark ? '#fff' : on && p.l1 === 'dip' ? MUTED : TEAL_D;
    const ex = `pointer-events="none" data-pt="${id}"`;
    return p.l2 ? `${T(cx, cy - 1.5, p.l1, { s: fs, w: 700, c: col, a: 'middle', extra: ex })}${T(cx, cy + fs, p.l2, { s: fs, w: 600, c: col, a: 'middle', extra: ex })}` : T(cx, cy + 3, p.l1, { s: fs + 0.5, w: 700, c: col, a: 'middle', extra: ex });
  }).join('');
  const countLit = (ch) => [...PIN_IDS, 'p-held'].filter((id) => lit(id, ch)).length;
  K.bandLabels = function (g, ch, active, { lighting = [] } = {}) {
    let s = '';
    const isLit = (id) => lit(id, ch) && !lighting.includes(id);
    if (g.name === 'open') {
      s += BM.map((m, k) => T(bx(g, k), g.months, m, { s: 10.5, w: k === 0 || k === 2 ? 700 : 500, c: k === 0 || k === 2 ? '#475569' : GREY, a: 'middle' })).join('');
      LANES.forEach((k, l) => { const t0 = g.top(l);
        s += `${T(0, t0 - 25, TERM[k], { s: 15, w: 800, c: INK })}${T(640, t0 - 25, LANE[k].verdict, { s: 11.5, w: 600, c: '#475569', a: 'end' })}`;
        s += T(0, t0 - 8, LANE[k].act, { s: 12, w: 600, c: TEAL_D }); });
      s += pinTexts(g, isLit, 9.5);
      s += T(bx(g, 5.5), K.heldY(g) - 8, K.heldText(ch), { s: 10, w: 600, c: isLit('p-held') ? TEAL_D : QUIET, a: 'middle', extra: 'pointer-events="none"' });
      return s;
    }
    if (g.name === 'plan') {
      s += BM.map((m, k) => T(bx(g, k), g.months, m, { s: 10, w: k === 0 || k === 2 ? 700 : 500, c: GREY, a: 'middle' })).join('');
      LANES.forEach((k, l) => { const y = mid(g, l); s += `${T(0, y - 1, TERM[k], { s: 11, w: 700, c: INK })}${T(0, y + 10, LANE[k].short, { s: 9.5, c: MUTED })}`; });
      s += pinTexts(g, isLit, 9.5);
      s += T(bx(g, 5.5), K.heldY(g) - 8, K.heldText(ch), { s: 10, w: 600, c: TEAL_D, a: 'middle', extra: 'pointer-events="none"' });
      return s;
    }
    /* thin strip */
    const n = countLit(ch);
    const th = `${T(0, THIN.head + 1, 'The year ahead', { s: 10, w: 700, c: '#475569' })}${T(88, THIN.head + 1, `Nov 2026 to Oct 2027 · ${n} of 5 pins explained`, { s: 10, c: GREY })}
      ${active != null ? T(THIN.x0 - 6, mid(THIN, active) + 3, TERM[LANES[active]], { s: 9, w: 700, c: TEAL_D, a: 'end' }) : ''}`;
    let gr = `${T(0, GROW.head, 'The year ahead · Nov 2026 to Oct 2027', { s: 10.5, w: 700, c: '#475569' })}${T(640, GROW.head, `${n} of 5 pins explained`, { s: 10.5, c: GREY, a: 'end' })}`;
    gr += BM.map((m, k) => T(bx(GROW, k), GROW.months, m, { s: 10, w: k === 0 || k === 2 ? 700 : 500, c: GREY, a: 'middle' })).join('');
    LANES.forEach((k, l) => { const on = active == null || active === l; const y = mid(GROW, l);
      gr += `${T(0, y - 1, TERM[k], { s: 11, w: on ? 700 : 600, c: on ? INK : GREY })}${T(0, y + 11, LANE[k].short, { s: 9.5, c: on ? MUTED : '#B6BCC8' })}`; });
    gr += pinTexts(GROW, isLit, 9.5);
    gr += T(bx(GROW, 5.5), K.heldY(GROW) - 8, K.heldText(ch), { s: 10, w: 600, c: isLit('p-held') || lighting.includes('p-held') ? TEAL_D : QUIET, a: 'middle', extra: 'pointer-events="none"' });
    return `<g data-bl="thin" style="transition:opacity .3s">${th}</g><g data-bl="grow" style="opacity:0;transition:opacity .35s">${gr}</g>`;
  };
  K.heldText = (ch) => (ch >= (K.ORD.level ?? 99) ? 'keep the home page · searches near 50 all year' : 'keep the home page');

  /* ---------- readouts: idle says only what hovering does; the tiles carry the numbers ---------- */
  K.ser = (k, name, kind = 'lead', y = yv) => ({ name, vals: VALS[k], y, kind, key: kind === 'lead' ? { c: TEAL, w: 2.2 } : kind === 'ghost' ? { c: GREY, w: 1.6 } : { c: '#475569', w: 1.6, dash: '4 3' }, fmt: (v) => String(Math.round(v * 10) / 10) });
  K.hvLines = (i0, i1, series, note = 'Google Trends, Washington, 0 to 100') => ({ i0, i1: 60, x: (i) => xw(i, i0, i1), series, note, title: (i) => (i === 60 ? 'Oct 2026, not over yet' : FL.ml(M[i])) });
  K.idleHint = (title, note = '') => () => ({ title, note, slots: [] });
})();
</script>
<script>/* V6 reach pictures (split from V5's one crowded figure).
   WHO SEES IT: one plot, one scale: Expedition's showings a week (dashed rose) against our other practices'
   average per practice (bold rose). Sep 2026 hatched: Expedition is missing 3 of its 4 weeks.
   WHERE PATIENTS LAND: one row per page, read left to right: showings in Google -> visits -> calls or forms
   (one dot each), ending in a Keep / Strengthen chip (PROPOSAL). Sorted by calls or forms; top 3 pages only.
   Data: D.c5 from src/combined5_extract.py (V5's read-only pull, synonyms count). */
(function () {
  const K = window.V6K; const { D, M, T, put, fmt, xw, idx, X0, X1, Y0, Y1, ROSE, ROSE_D, TEAL, TEAL_D, INK, MUTED, GREY } = K;
  const C5 = D.c5;
  const ySc = (K.ySc = (top, bot, max) => (v) => bot - (v / max) * (bot - top));
  const CI = Array.from({ length: 12 }, (_, j) => idx('2025-10') + j);
  const OI = Array.from({ length: 11 }, (_, j) => idx('2025-10') + j);
  const OWN_KEY = (K.OWN_KEY = { c: ROSE, w: 2, dash: '6 3' });
  /* hover sentences (owner 10/29): every number names its source in plain words; 2 to 4 lines, never over the chart */
  const GAP = 'Expedition recorded no calls or forms anywhere on its site May to July 2026, likely a tracking gap.';
  const MATCH = 'The page is matched to the topic by its address and the searches it shows up for; other names count, such as frenectomy.';
  K.HV = {
    ses: 'Visits: Google Analytics, Expedition’s own account. Every way people arrive, last 12 months, saved nightly by week.',
    ke: 'Calls or forms: what Expedition’s Google Analytics counts as key events, such as calls and form sends; set up per practice. Last 12 months.',
    gap: GAP, match: MATCH,
    imp: 'Showings: how often Google showed the page in search results. Search Console, Expedition’s own account, last 12 months, saved nightly by week.',
    place: 'Place: where Google showed it on average, weighted by showings. 1 is the top; past 10 is past the first page. Search Console.',
    clk: 'Clicks: people who clicked through from Google. Search Console, Expedition’s own account, last 12 months.',
    rank: 'Rank among our practices by Search Console showings for these searches, last 12 months, with other names counted.',
  };
  /* tile tips: [value, label, tip] */
  K.tip = (kind, extra = '') => `${K.HV[kind]}${extra ? ` ${extra}` : ''}`;
  K.ord = (n) => `${n}${n % 10 === 1 && n % 100 !== 11 ? 'st' : n % 10 === 2 && n % 100 !== 12 ? 'nd' : n % 10 === 3 && n % 100 !== 13 ? 'rd' : 'th'}`;

  K.comb = function (k) {
    const P = C5.topics[k]; const o = { avg: {}, own: {}, ownPart: {}, P, rep: {} };
    C5.months.forEach((m, j) => {
      const i = M.indexOf(m); if (i < 0) return;
      o.avg[i] = P.mAvgX[j]; o.rep[i] = C5.mReporting[j];
      if (P.mOwnWeeks[j] && P.mOwnWeeks[j] === C5.monthWeeks[j]) o.own[i] = P.mOwn[j] / P.mOwnWeeks[j];
      else if (P.mOwnWeeks[j]) o.ownPart[i] = `${P.mOwnWeeks[j]} of ${C5.monthWeeks[j]} weeks`;
    });
    const ownWk = OI.map((i) => o.own[i]); const othWk = CI.slice(0, 12).map((i) => o.avg[i]);
    Object.assign(o, { imp: P.impYear, clk: P.clkYear, seen: P.seenYear, rank: P.ownRank, ownImp: P.ownImpYear, ownClk: P.ownClkYear, nameClk: P.ownNameClicks, list: C5.searchList[k],
      ownWk: K.avg(ownWk), othWk: K.avg(othWk) });
    return o;
  };

  /* ---------- WHO SEES IT ---------- */
  K.who = function (S, cb, y, { rise = true } = {}) {
    put(S, 'g100', { x1: X0, x2: X1, y1: Y0, y2: Y0, o: 1 }); put(S, 'g50', { x1: X0, x2: X1, y1: (Y0 + Y1) / 2, y2: (Y0 + Y1) / 2, o: 1 }); put(S, 'base', { x1: X0, x2: X1, y1: Y1, y2: Y1, o: 1 });
    const cp = CI.map((i) => [xw(i, ...K.W12), y(cb.avg[i])]);
    put(S, 'cr', { pts: cp, o: 1 }, { pre: { pts: cp } }); put(S, 'cr-cs', { pts: cp, o: 1 }, { pre: { pts: cp } });
    put(S, 'cr-tl', { pts: [cp[11], [xw(60, ...K.W12), y(cb.avg[60])]], o: 1 }, { pre: { pts: [cp[11], cp[11]] }, delay: 900 });
    const op = OI.map((i) => [xw(i, ...K.W12), y(cb.own[i])]);
    /* the act: our other practices draw along the floor first, then Expedition's line rises out of them */
    put(S, 'own', { pts: op, o: 1, sw: 2 }, rise ? { pre: { pts: op.map(([x], j) => [x, cp[j][1]]), o: 0 }, delay: 1100, dur: 1100 } : {});
    put(S, 'own-oct', { cx: xw(60, ...K.W12), cy: y(cb.own[60]), o: 1 }, { pre: { cx: xw(60, ...K.W12), cy: y(cb.avg[60]), o: 0 }, delay: 1300, dur: 1000 });
    const h = K.hw(...K.W12);
    put(S, 'gap', { x: xw(59, ...K.W12) - h, width: 2 * h, y: Y0, height: Y1 - Y0, o: 1 }, { delay: 1900 });
  };
  K.whoLabels = (cb, y, ticks, notes) => `
      ${K.yTicks(ticks.map((v) => [y(v), fmt(v)]))}${K.xTicks(...K.W12, 2)}
      ${T(xw(59, ...K.W12), Y0 + 13, 'no data', { s: 10, w: 600, c: MUTED, a: 'middle' })}${T(xw(59, ...K.W12), Y0 + 25, 'for 3', { s: 10, c: MUTED, a: 'middle' })}${T(xw(59, ...K.W12), Y0 + 37, 'weeks', { s: 10, c: MUTED, a: 'middle' })}
      ${K.notOver(...K.W12)}
      ${notes.map(([i, v, t, c, w]) => T(xw(i, ...K.W12), y(v), t, { s: 12, w: w || 700, c, a: 'start', extra: K.fadeIn(2.1) })).join('')}
      ${K.gutter([{ x0: xw(58, ...K.W12), y: y(cb.own[58]), t: 'Expedition', w: 700, c: ROSE_D }, { x0: xw(60, ...K.W12), y: y(cb.avg[60]), t: 'Other practices', w: 600, c: ROSE_D }])}`;
  K.whoHv = (cb, y) => ({ i0: CI[0], i1: 60, x: (i) => xw(i, ...K.W12), note: 'showings in Google a week', cols: 3,
    title: (i) => (i === 59 ? 'Sep 2026 · Expedition missing 3 of 4 weeks' : i === 60 ? 'Oct 2026, 2 weeks so far' : FL.ml(M[i])),
    series: [{ name: 'Expedition', vals: cb.own, y, kind: 'rose', key: OWN_KEY, fmt: (v) => fmt(Math.round(v)) },
      { name: 'other practices, each', vals: cb.avg, y, kind: 'rose', key: { c: ROSE, w: 2.2 }, fmt: (v) => v.toFixed(1) },
      { name: 'practices with data', vals: cb.rep, y: () => 0, nodot: true, key: { c: ROSE, w: 0 }, fmt: (v) => String(v) }] });
  K.plotHit = { x: X0, y: Y0, width: X1 - X0, height: Y1 - Y0 };

  /* ---------- WHERE PATIENTS LAND ---------- */
  const PG = C5.pages;
  const NX = { imp: 262, ses: 386, ke: 478 }; // node centres: showings, visits, calls or forms
  const RY = (K.RY = (j) => 124 + j * 70); // row baseline of the numbers
  K.CHIP = (j) => ({ x: 566, y: RY(j) - 15, width: 74, height: 22 });
  const dots = (n, x, y) => { let s = ''; const cols = 18; const p = 5.6; const w = Math.min(n, cols) * p;
    for (let d = 0; d < n; d++) { const c = d % cols; const r = Math.floor(d / cols); s += `<circle cx="${(x - w / 2 + p / 2 + c * p).toFixed(1)}" cy="${(y + r * p).toFixed(1)}" r="2.1" fill="${TEAL}"/>`; }
    return s; };
  const node = (x, y, hw, t, n, b) => `<g data-ro-t="${FL.esc(t)}" data-ro-n="${FL.esc(n)}" data-ro-b="${FL.esc(b)}"><rect x="${x - hw}" y="${y - 22}" width="${2 * hw}" height="58" fill="transparent"/></g>`;
  /* rows: [title, kind, path, verdict] already in display order (most calls or forms first) */
  K.paths = function (rows, { extra = '', from = 0.5, step = 0.22 } = {}) {
    const hy = 76;
    let s = `${T(0, hy, 'Page', { s: 10, w: 700, c: '#9CA3AF' })}${T(NX.imp, hy, 'showings in Google', { s: 10, w: 700, c: '#9CA3AF', a: 'middle' })}${T(NX.ses, hy, 'visits', { s: 10, w: 700, c: '#9CA3AF', a: 'middle' })}${T(NX.ke, hy, 'calls or forms', { s: 10, w: 700, c: '#9CA3AF', a: 'middle' })}
      ${T(603, hy - 11, 'PROPOSAL', { s: 8.5, w: 700, c: '#9CA3AF', a: 'middle', extra: 'letter-spacing="1"' })}${T(603, hy, 'pin rule', { s: 10, w: 700, c: '#9CA3AF', a: 'middle' })}
      <line x1="0" x2="640" y1="${hy + 7}" y2="${hy + 7}" stroke="#E7E9EE"/>`;
    rows.forEach(([title, kind, path, verdict], j) => {
      const p = PG[path] || {}; const y = RY(j); const c = K.CHIP(j);
      const ses = p.ses != null ? fmt(p.ses) : 'none'; const ke = p.ke != null ? p.ke : null;
      const wk = p.place != null && p.placeWeekly != null && Math.abs(p.place - p.placeWeekly) > 3 ? `, ${Math.round(p.placeWeekly)} week by week` : '';
      const ro = `${MATCH} ${fmt(p.imp || 0)} showings · average place ${p.place != null ? p.place.toFixed(1) : 'none'}${wk} · ${fmt(p.clk || 0)} clicks · ${p.ses != null ? fmt(p.ses) : 'no'} visits · ${ke != null ? ke : 'no'} calls or forms`;
      const keep = verdict === 'Keep';
      s += `<g data-ro-t="${FL.esc(`${title}: ${verdict}, a proposal`)}" data-ro-n="${FL.esc(path.length > 34 ? `${path.slice(0, 32)}…` : path)}" data-ro-b="${FL.esc(ro)}" ${K.fadeIn(from + j * step)}>
        <rect x="0" y="${y - 26}" width="640" height="70" fill="transparent"/>
        ${T(0, y, title, { s: 13, w: 700, c: INK })}${T(0, y + 16, kind, { s: 10.5, c: MUTED })}
        <line x1="${NX.imp + 42}" x2="${NX.ses - 32}" y1="${y - 5}" y2="${y - 5}" stroke="#C3C8D2"/><path d="M${NX.ses - 36},${y - 8} l4,3 l-4,3" fill="none" stroke="#C3C8D2"/>
        <line x1="${NX.ses + 32}" x2="${NX.ke - 32}" y1="${y - 5}" y2="${y - 5}" stroke="#C3C8D2"/><path d="M${NX.ke - 36},${y - 8} l4,3 l-4,3" fill="none" stroke="#C3C8D2"/>
        ${node(NX.imp, y, 46, `${title}: ${fmt(p.imp || 0)} showings, place ${p.place.toFixed(1)}`, 'Search Console', `${K.HV.imp} Place ${p.place.toFixed(1)}${wk}, ${fmt(p.clk || 0)} clicks.`)}
        ${node(NX.ses, y, 34, `${title}: ${p.ses != null ? `${ses} visits` : 'no visits recorded'}`, 'Google Analytics', `${K.HV.ses} ${MATCH}`)}
        ${node(NX.ke + 8, y, 64, `${title}: ${ke == null ? 'no calls or forms recorded' : `${ke} calls or forms`}`, 'Google Analytics, key events', `${K.HV.ke} ${GAP}`)}
        ${T(NX.imp, y, fmt(p.imp || 0), { s: 15, w: 700, c: '#334155', a: 'middle', extra: 'class="num" pointer-events="none"' })}${T(NX.imp, y + 16, `place ${Math.round(p.place)}`, { s: 10.5, c: p.place > 10 ? INK : MUTED, a: 'middle', extra: `font-weight="${p.place > 10 ? 700 : 500}" pointer-events="none"` })}
        ${T(NX.ses, y, ses, { s: 15, w: 800, c: p.ses != null ? INK : GREY, a: 'middle', extra: 'class="num" pointer-events="none"' })}
        ${ke == null ? T(NX.ke, y, 'none', { s: 15, w: 800, c: GREY, a: 'middle', extra: 'pointer-events="none"' }) : `${T(NX.ke, y, String(ke), { s: 15, w: 800, c: ke ? TEAL_D : GREY, a: 'middle', extra: 'class="num" pointer-events="none"' })}${ke ? `<g pointer-events="none">${dots(ke, NX.ke, y + 12)}</g>` : `<circle cx="${NX.ke}" cy="${y + 12}" r="2.1" fill="none" stroke="#C3C8D2" pointer-events="none"/>`}`}
        <rect x="${c.x}" y="${c.y}" width="${c.width}" height="${c.height}" rx="4" fill="${keep ? '#E6F4F1' : '#fff'}" stroke="${keep ? '#99D5CC' : TEAL}"/>${T(c.x + c.width / 2, c.y + 15, verdict, { s: 11, w: 700, c: TEAL_D, a: 'middle' })}
        ${j < rows.length - 1 ? `<line x1="0" x2="640" y1="${y + 42}" y2="${y + 42}" stroke="#F1F2F5"/>` : ''}</g>`;
    });
    if (extra) s += T(0, RY(rows.length) - 20, extra, { s: 10.5, c: MUTED, extra: K.fadeIn(from + rows.length * step) });
    s += T(NX.ke, 96, 'one dot each', { s: 9.5, c: '#9CA3AF', a: 'middle' });
    return s;
  };
  /* the page lines replace the plot: Expedition's line folds into the top row's showings, the rest sinks */
  K.landMarks = function (S) {
    put(S, 'own', { pts: K.at(NX.imp, RY(0) - 5, 11), o: 0 }, { dur: 800 });
    put(S, 'cr', { pts: K.at(NX.imp, RY(0) - 5, 12), o: 0 }, { dur: 800 }); put(S, 'cr-cs', { pts: K.at(NX.imp, RY(0) - 5, 12), o: 0 }, { dur: 800 });
  };
  /* the chip: appears on the deciding row's verdict, the drawer rises, the chip flies to its pin, the pin lights */
  K.chipFly = function (fig, later, j, word, to, pinId, { t0 = 2600, down = 5900, pulse = false } = {}) {
    const v = K.CHIP(j); const ct = fig.m.get('chip-t').el; ct.textContent = word;
    fig.pre('chip', { ...v, o: 0, fill: '#fff', stroke: TEAL }); fig.pre('chip-t', { x: v.x + v.width / 2, y: v.y + 15, o: 0, fill: TEAL_D });
    later(t0, () => { fig.set('chip', { o: 1 }, { dur: 0 }); fig.set('chip-t', { o: 1 }, { dur: 0 }); K.drawer(fig, true); });
    later(t0 + 800, () => { fig.set('chip', { ...to, fill: TEAL, stroke: TEAL }, { dur: 900 }); fig.set('chip-t', { x: to.x + to.width / 2, y: to.y + to.height / 2 + 3.5, fill: '#fff' }, { dur: 900 }); });
    later(t0 + 1450, () => fig.set('chip-t', { o: 0 }, { dur: 0 }));
    later(t0 + 1750, () => { K.light(fig, pinId); fig.set('chip', { o: 0 }, { dur: 0 }); fig.set('chip-t', { o: 0 }, { dur: 0 });
      if (pulse) { fig.set('p-held', { sw: 5 }, { dur: 250 }); later(t0 + 2050, () => fig.set('p-held', { sw: 2.4 }, { dur: 400 })); } });
    later(down, () => K.drawer(fig, false));
  };
})();
</script>
<script>/* V6 chapters (from v5ch.js). Each: lead sentence, number tiles, short points, an optional mockup note, a
   "How this is measured" link into the approved How it works page. V6 splits "how patients reach the page"
   into WHO SEES IT and WHERE PATIENTS LAND, per topic; pediatric dentist's "who sees it" folds into one tile. */
(function () {
  const K = window.V6K;
  const { M, P, T, put, fmt, xw, yv, idx, GEO, LANES, TERM, VALS, tt, pd, pdy, W24, W12, W36, X0, Y0, Y1, TEAL, TEAL_D, ROSE_D, INK, MUTED, GREY, csR } = K;
  /* the chapter that explains (lights) each pin */
  K.ORD = { 'p-tt': 4, 'p-held': 6, level: 7, 'p-dip': 11, 'p-pub': 11, 'p-peak': 11 };
  const G = GEO.thin; const GR = GEO.grow;
  const kick = (topic, q) => `${topic} · <span class="kq">${q}</span>`;
  const chapters = [];
  const HOVER_LINE = K.idleHint('Hover the chart to read any month');

  /* ===== 01 the answer first (full band) ===== */
  chapters.push({
    key: 'open', kick: 'In short · Expedition’s year ahead, read for Washington',
    head: 'The plan: <span class="g">strengthen the frenectomy page now</span>, keep the home page, refresh by June.',
    extra: `<div class="ttiles">
      <div><div class="tn">Tongue tie</div><div class="ta"><i>Strengthen</i> the service page, now</div><div class="tf">Searches close to Rising; the page sits past Google’s first page</div></div>
      <div data-tip="81 calls or forms: what Expedition’s Google Analytics counts as key events, such as calls and form sends, on the home page, last 12 months. None site-wide May to July 2026, likely a tracking gap."><div class="tn">Pediatric dentist</div><div class="ta"><i>Keep</i> the home page, all year</div><div class="tf">81 calls or forms in a year; searches tripled in 2025 and held</div></div>
      <div><div class="tn">Pediatric dentistry</div><div class="ta"><i>Refresh</i> by June</div><div class="tf">Busiest in July or August, 4 years of 4</div></div></div>`,
    points: ['All three topics are <b>Steady</b> in Washington: moving about the same as dental searches overall.',
      'Expedition already has a page for each topic. Its frenectomy guide is its most visited page.',
      'Each pin on the year is outlined until the Story explains it, then it fills in.'],
    link: [['hiw-rising', 'How Steady is measured'], ['hiw-pages', 'How the pins are chosen']],
    mock: '<b>Mockup:</b> the pin rule, Write, Strengthen or Keep, is a proposal for the owner to confirm.',
    cap: 'Expedition’s year ahead, Nov 2026 to Oct 2027, one row per topic. Every pin is already placed; outlined pins are explained further down.',
    build(S, { first }) {
      K.band(S, GEO.open, 0, null, { first });
      LANES.forEach((k, l) => { const f = K.laneFlat(...W24, l, GEO.open); put(S, `ln-${k}`, { pts: f, o: 0 }); put(S, `cs-${k}`, { pts: f, o: 0 }); put(S, `tl-${k}`, { pts: [f[59], f[59]], o: 0 }); });
    },
    labelsAt: 500, labelsPre: () => '',
    labels: () => `${K.title('Expedition’s plan for the year ahead', 'Nov 2026 to Oct 2027 · one row per topic · searches read for Washington')}${K.bandLabels(GEO.open, 0, null)}
      <rect x="0" y="414" width="26" height="14" rx="3" fill="#fff" stroke="${K.QUIET}" stroke-dasharray="3 2"/>${T(34, 425, 'outlined: explained further down', { s: 11, c: MUTED })}
      <rect x="240" y="414" width="26" height="14" rx="3" fill="${TEAL}"/>${T(274, 425, 'filled: explained', { s: 11, c: MUTED })}
      ${K.footEnd('Steady, Rising and Fading: each topic against dental searches overall, July to September against a year earlier.')}`,
    idle: K.idleHint('Hover a pin or a row to read it'),
  });

  /* ===== tongue tie ===== */
  const near = (prev, keys) => keys.includes(prev);
  const TTK = ['tt-call', 'tt-phr', 'tt-who', 'tt-land']; const PDK = ['pd-call', 'pd-land', 'pd-step']; const PDYK = ['pdy-call', 'pdy-who', 'pdy-land', 'pdy-season'];
  const callLabels = (k, ch, l, headT, gut, foot) => `${K.title(headT, `${TERM[k][0].toUpperCase()}${TERM[k].slice(1)} in Washington, Jul to Sep this year against last year`)}${K.winLabels(k, ...W24)}
      ${K.y0100()}${K.xTicks(...W24)}${K.notOver(...W24)}${K.gutter(gut)}${K.bandLabels(G, ch, l)}${K.foot(foot)}`;
  chapters.push({
    key: 'tt-call', kick: kick('Tongue tie', 'where searches stand'),
    head: 'Tongue tie searches are <span class="g">close to Rising</span>, not there yet.',
    tiles: [['37.5', 'Jul to Sep 2026, Google’s 0 to 100'], ['33.0', 'Jul to Sep 2025'], ['14 in 100', 'ahead of dental searches overall']],
    points: ['Searches grew about 14 in every 100 on last year, in Washington.',
      'Dental searches overall held flat, so tongue tie pulled ahead of them.',
      'Rising needs more than 15 in every 100 ahead, so it stays Steady for now.',
      'Its busiest recent month, May 2026, ran about 1.3 times its usual level: lively, not a spike.'],
    table: { cols: ['Detail', ''], rows: [['Weeks with a Google score', '240 of 262'], ['Busiest week, scored 100', 'Dec 17, 2023'], ['Searches a month, US', `about ${csR('tongue tie')}`]] },
    link: [['hiw-rising']],
    cap: 'Tongue tie, Google Trends in Washington, Oct 2024 to Oct 2026. Grey: Jul to Sep 2025, last year. Teal: Jul to Sep 2026, this year. Each with its average as a level line.',
    build(S, { prev }) {
      K.grid(S); K.band(S, G, 1, 0);
      K.line(S, 'tt', ...W24, 'lead', { delay: near(prev, TTK) ? 0 : 650, rise: near(prev, TTK) ? null : 0 });
      K.windows(S, 'tt', ...W24, { delay: 1300 }); K.endDot(S, 'tt', ...W24, TEAL, 1300);
    },
    labelsAt: 700, labelsPre: () => '',
    labels: () => callLabels('tt', 1, 0, 'Steady: 14 in 100 ahead, Rising needs over 15', [{ x0: xw(59, ...W24), y: yv(tt.m[59]), t: 'tongue tie', w: 700, c: INK }], 'Rising needs more than 15 in every 100 ahead of dental searches overall.'),
    hv: K.hvLines(...W24, [K.ser('tt', 'tongue tie')]),
    idle: HOVER_LINE,
  });
  chapters.push({
    key: 'tt-phr', kick: kick('Tongue tie', 'the words patients use'),
    head: 'Most people search <span class="g">“tongue tie”</span>; ankyloglossia is too rare to read.',
    tiles: [['74 in 100', 'searches say tongue tie'], ['26 in 100', 'say ankyloglossia, the medical name'], ['3 of 262', 'weeks ankyloglossia had a Google score']],
    points: [`“tongue tie” gets about ${csR('tongue tie')} searches a month across the US; “ankyloglossia” about ${csR('ankyloglossia')}.`,
      'Mixed in, the empty phrase pulls the topic line below tongue tie: 27 against 36.5 in September.',
      'Rising, Steady or Fading follows tongue tie, so that pull changes nothing.',
      'Patients also search “frenectomy”, the name of the release. Who sees those searches comes next.'],
    link: [['hiw-phrases']],
    mock: '<b>Mockup:</b> “frenectomy” is not a phrase in this check, so Google Trends has no line for it; adding it needs a new read.',
    cap: 'Tongue tie, Washington. Dashed teal: the topic line, both phrases mixed by their searches. Dotted grey along the floor: ankyloglossia, empty in Washington.',
    build(S) {
      K.grid(S); K.band(S, G, 2, 0); K.line(S, 'tt', ...W24);
      const ttPts = K.linePts(VALS.tt, ...W24);

  /* WHO SEES IT: one picture, one scale */

    labels: () => `${K.title(o.figT, 'Showings in Google a week, Oct 2025 to Oct 2026 · one scale · Search Console')}

<script>/* V6 (from v5end.js): the season chapter (the strip rises, peak and dip drop onto it, June lights, the strip sinks)
   and the plan (the full band returns; every pin becomes a card with its reason). */
(function () {
  const K = window.V6K; const { chapters, kick } = window.V6CH;
  const { T, put, xw, yv, idx, avg, GEO, pdy, Y0, Y1, TEAL, TEAL_D, INK, MUTED, GREY, PINS } = K;
  const G = GEO.thin; const GR = GEO.grow; const PG = GEO.plan;
  const YRS = [2022, 2023, 2024, 2025];
  const yrRel = YRS.map((y) => { const i = idx(`${y}-01`); const seg = pdy.m.slice(i, i + 12); const a = avg(seg); return seg.map((v) => v / a); });
  const yrMean = yrRel[0].map((_, m) => avg(yrRel.map((a) => a[m])));
  const kToM = (k) => (k + 10) % 12;
  const yr = (r) => Y1 - ((r - 0.6) / 0.75) * (Y1 - Y0);
  const WF = [idx('2021-11'), idx('2025-12')];
  const bandOrder = (arr) => Array.from({ length: 12 }, (_, k) => arr[kToM(k)]);
  const pkVals = yrRel.map((a) => Math.max(...a)); const dcVals = yrRel.map((a) => a[11]);
  const pinC = (id, g) => { const p = PINS[id]; const c = K.cell(g, p.lane, p.k0, p.k1 ?? p.k0); return [c.x + c.width / 2, c.y + c.height / 2]; };
  const LAT = 1.8;
  const SEASON = ['p-dip', 'p-peak', 'p-pub'];
  chapters.push({
    key: 'pdy-season', kick: kick('Pediatric dentistry', 'when searches peak'),
    head: 'Pediatric dentistry peaks in <span class="g">late summer</span> and dips every December.',
    tiles: [['4 of 4', 'years busiest in July or August'], ['4 of 4', 'years quietest in December'], [`about ${yrMean[7].toFixed(1)}`, 'times an average month, in August'], ['June 2027', 'refresh by, two months ahead']],
    points: ['Busiest in August 2022, 2023 and 2024, and July 2025.',
      `The peak ran ${Math.round((Math.min(...pkVals) - 1) * 100)} to ${Math.round((Math.max(...pkVals) - 1) * 100)} in every 100 above an average month.`,
      `December was the quietest month every year, about ${avg(dcVals).toFixed(1)} times an average month.`,
      'Tongue tie and pediatric dentist have no repeating season.'],
    link: [['hiw-seasons', 'How a season is found']],
    labelsAt: LAT * 1000, labelsPre: () => `${K.title('Four years of pediatric dentistry, in Washington', 'Nov 2021 to Dec 2025, then each year laid onto the coming one')}${K.bandLabels(G, 11, 2, { lighting: SEASON })}`,
    enter(fig, later) {
      later(1000, () => ['ln-pdy', 'cs-pdy', 'tl-pdy'].forEach((id) => fig.set(id, { o: 0 })));
      later(2900, () => K.drawer(fig, true));
      const [px, py] = pinC('p-peak', GR); const [dx, dy] = pinC('p-dip', GR);
      later(3500, () => { fig.set('pk', { cx: px, cy: py, r: 2 }, { dur: 700 }); fig.set('dp', { cx: dx, cy: dy, r: 2 }, { dur: 700 }); });
      later(4200, () => { K.light(fig, 'p-peak'); K.light(fig, 'p-dip'); fig.set('pk', { o: 0 }, { dur: 0 }); fig.set('dp', { o: 0 }, { dur: 0 }); });
      later(4700, () => K.light(fig, 'p-pub'));
      later(6600, () => K.drawer(fig, false));
    },
    cap: 'Pediatric dentistry, Washington: 2022 to 2025, each calendar year against its own average month, laid onto the months of the year ahead. Bold: the 4-year average. Peak and dip drop onto its row, then the June pin lights.',
    build(S) {
      put(S, 'base', { x1: G.x0, x2: G.x1, y1: Y1, y2: Y1, o: 1 }); K.band(S, G, 11, 2, { hold: SEASON });
      K.line(S, 'pdy', ...WF, 'lead');
      YRS.forEach((y, n) => {
        const cont = Array.from({ length: 12 }, (_, k) => { const i = idx(`${y - 1}-11`) + k; return [xw(i, ...WF), yv(pdy.m[i])]; });
        put(S, `yr${n}`, { pts: bandOrder(yrRel[n]).map((r, k) => [K.bx(G, k), yr(r)]), stroke: n % 2 ? '#475569' : '#8B98A9', sw: 1.2, dash: n % 2 ? '4 3' : 'none', o: 0.85 }, { pre: { pts: cont, o: 0 }, delay: 1000 + n * 120 });
      });
      const mp = bandOrder(yrMean).map((r, k) => [K.bx(G, k), yr(r)]); const flat = mp.map(([x]) => [x, yr(1)]);
      put(S, 'yrm', { pts: mp, o: 1 }, { pre: { pts: flat, o: 0 }, delay: 1900 }); put(S, 'yrm-cs', { pts: mp, o: 1 }, { pre: { pts: flat, o: 0 }, delay: 1900 });
      put(S, 'pk', { cx: K.bx(G, 9), cy: yr(yrMean[7]), stroke: TEAL, r: 4.5, o: 1 }, { delay: 2400 });
      put(S, 'dp', { cx: K.bx(G, 1), cy: yr(yrMean[11]), r: 4.5, o: 1 }, { delay: 2400 });
    },
    labels: () => `${K.title('Busiest in late summer, 4 years running', 'Pediatric dentistry, each year against its own average month, Washington')}
      <line x1="${G.x0}" x2="${G.x1}" y1="${yr(1)}" y2="${yr(1)}" stroke="#E7E9EE"/>${T(G.x0 - 6, yr(1) + 3.5, 'average', { s: 10, c: '#9CA3AF', a: 'end' })}
      ${T(G.x0 - 6, yr(1.25) + 3.5, '1.25 times', { s: 10, c: '#9CA3AF', a: 'end' })}${T(G.x0 - 6, yr(0.75) + 3.5, '0.75 times', { s: 10, c: '#9CA3AF', a: 'end' })}
      ${K.BM.map((m, k) => T(K.bx(G, k), Y1 + 16, m, { s: 10, c: '#9CA3AF', a: 'middle' })).join('')}
      ${T(K.bx(G, 9), yr(yrMean[7]) - 12, `Aug, about ${yrMean[7].toFixed(1)} times`, { s: 11.5, w: 700, c: INK, a: 'middle' })}
      ${T(K.bx(G, 1) + 10, yr(0.66), `Dec, about ${avg(dcVals).toFixed(1)} times`, { s: 11.5, w: 700, c: INK })}
      ${K.bandLabels(G, 11, 2, { lighting: SEASON })}${K.foot('A season: the same busiest months in at least 2 of the last 3 full years.')}`,
    hit: { x: G.x0, y: Y0, width: G.x1 - G.x0, height: Y1 - Y0 },
    hv: { i0: 0, i1: 11, x: (k) => K.bx(G, k), note: 'times an average month, Washington', title: (k) => `${FL.MONF[kToM(k)]}, 2022 to 2025`, cols: 5,
      series: [{ name: 'avg', vals: bandOrder(yrMean), y: yr, kind: 'lead', key: { c: TEAL, w: 2.2 }, fmt: (v) => v.toFixed(2) }, ...YRS.map((y, n) => ({ name: String(y), vals: bandOrder(yrRel[n]), y: yr, kind: 'other', key: { c: n % 2 ? '#475569' : '#8B98A9', w: 1.2, dash: n % 2 ? '4 3' : '' }, fmt: (v) => v.toFixed(2) }))] },
    idle: K.idleHint('Hover the chart to read any month', 'times an average month, Washington'),
  });

  /* ===== the plan: the plot empties, the full band returns, every pin becomes a card ===== */
  const PLAN = [
    { pin: 'p-tt', when: 'Nov 2026', who: 'tongue tie', verb: 'Strengthen', head: 'Strengthen the frenectomy service page', why: 'Past Google’s first page, yet 144 visits and 6 calls or forms.', hv: ['144 visits, 6 calls or forms, place 23', 'Google Analytics and Search Console', `${K.HV.ke} ${K.HV.gap}`] },
    { pin: 'p-dip', when: 'Dec 2026', who: 'pediatric dentistry', verb: '', head: 'Expect a quiet December', why: 'The quietest month 4 years of 4, about 0.8 times an average month.', hv: ['December, the quiet month', 'Google Trends, Washington', 'December was the quietest month in each of 2022 to 2025, about 0.8 times an average month for pediatric dentistry.'] },
    { pin: 'p-pub', when: 'Jun 2027', who: 'pediatric dentistry', verb: 'Refresh', head: 'Refresh before the late-summer peak', why: 'Keep the home page; strengthen the benefits article, at place 17.', hv: ['Benefits article: place 17, 16 visits', 'Search Console and Google Analytics', `${K.HV.place} ${K.HV.match}`] },
    { pin: 'p-held', when: 'All year', who: 'both pediatric topics', verb: 'Keep', head: 'Keep the home page', why: '1,265 visits, 81 calls or forms; searches tripled in 2025 and held.', hv: ['Home page: 1,265 visits, 81 calls or forms', 'Google Analytics, last 12 months', `${K.HV.ke} ${K.HV.gap}`] },
  ];
  const CARD = (j) => ({ x: 0, y: 236 + j * 56, width: 640, height: 48 });
  const pinBox = (id) => { if (id === 'p-held') { const y = K.heldY(PG); return { x: PG.x0 + 8, y: y - 2, width: PG.x1 - PG.x0 - 16, height: 4 }; } const p = PINS[id]; return K.cell(PG, p.lane, p.k0, p.k1 ?? p.k0); };
  chapters.push({
    key: 'plan', kick: 'The plan · Nov 2026 to Oct 2027',
    head: 'Expedition’s year: <span class="g">strengthen in November</span>, refresh by June.',
    tiles: [['1', 'page to strengthen now'], ['1', 'page to keep all year'], ['June 2027', 'refresh before the peak']],
    points: ['Every pin comes from a written rule applied to this check, not from opinion.',
      'Pins follow the calendar, not the 1 to 10 rating: every topic rates 2 of 10 here.',
      'The next check, in January 2027, can say whether tongue tie crossed into Rising.'],
    link: [['hiw-pages', 'How the pins are chosen']],
    mock: '<b>Mockup:</b> Write, Strengthen, Keep is a proposal. No topic is Write: Expedition has a page for each.',
    cap: 'The finished year: every pin lit, each turned into a step with the page and the reason behind it, in calendar order.',
    build(S) {
      K.band(S, PG, 12, null, { delay: 250 });
      PLAN.forEach((p, j) => put(S, `card${j}`, { ...CARD(j), o: 1, fill: '#fff' }, { pre: { ...pinBox(p.pin), o: 0, fill: p.pin === 'p-dip' ? '#EEF0F3' : '#E6F4F1' }, delay: 1250 + j * 160 }));
    },
    labelsAt: 1150, labelsPre: () => '',
    labels: () => `${K.title('Expedition’s plan, Nov 2026 to Oct 2027', 'Searches read for Washington · pages from Expedition’s own data · in calendar order')}
      ${K.bandLabels(PG, 12, null)}
      ${PLAN.map((p, j) => { const c = CARD(j); return `<g ${K.fadeIn(0.75 + j * 0.16)} ${p.hv ? `data-ro-t="${FL.esc(p.hv[0])}" data-ro-n="${FL.esc(p.hv[1])}" data-ro-b="${FL.esc(p.hv[2])}"` : ''}><rect x="0" y="${c.y}" width="640" height="${c.height}" fill="transparent"/>
        ${T(16, c.y + 20, p.when, { s: 12.5, w: 800, c: TEAL_D })}${T(16, c.y + 36, p.who, { s: 10, c: GREY })}
        ${T(140, c.y + 20, p.head, { s: 13.5, w: 800, c: INK })}${T(140, c.y + 37, p.why, { s: 11, c: MUTED })}
        ${p.verb ? T(624, c.y + 20, p.verb, { s: 11, w: 700, c: p.verb === 'Keep' ? TEAL_D : INK, a: 'end' }) : ''}</g>`; }).join('')}
      ${K.footEnd('Ordered by month, not by the 1 to 10 rating: every topic rates 2 of 10 on this prospect check.')}`,
    idle: K.idleHint('Hover a pin to read it'),
  });

  window.V6 = { chapters, init: K.init, base: K.base, vh: K.VH, hit: { x: K.X0, y: Y0, width: K.X1 - K.X0, height: Y1 - Y0 } };
})();
</script>

  onChange: (t) => { const pane = document.getElementById('pane'); if (t === 'story') showStory(); else pane.innerHTML = `<div class="tabnote">The ${t === 'topics' ? 'Topics' : 'Phrases'} tab is not part of this mockup; only the Story is.</div>`; window.scrollTo({ top: 0 }); } });
